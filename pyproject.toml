[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real2scenario"
version = "0.1.0"
description = "Extract, replay, and vary driving scenarios from recorded trajectories."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
devkit = [
    "matplotlib>=3.8,<4",
    "nuscenes-devkit==1.2.0",
]

[project.scripts]
real2scenario-devkit = "real2scenario.devkit:main"
real2scenario-preflight = "real2scenario.preflight:main"
real2scenario-visualize = "real2scenario.visualization:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
real2scenario = ["templates/*.xodr"]
