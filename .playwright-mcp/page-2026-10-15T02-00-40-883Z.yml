      - generic [ref=f29e34]:
        - paragraph [ref=f29e36]: This tutorial shows how to utilize esmini as a shared (dynamically loaded) library for use in a custom application. It can be used with or without esmini embedded viewer.
        - generic [ref=f29e37]:
          - heading "Preparations" [level=3] [ref=f29e38]
          - paragraph [ref=f29e40]:
            - text: The simplest preparation is to get the demo package from
            - link "the latest relase" [ref=f29e41] [cursor=pointer]:
              - /url: https://github.com/esmini/esmini/releases/latest
            - text: and then head on to the steps below.
          - paragraph [ref=f29e43]: But, of course, if you already have checked out the esmini project from GitHub and compiled it you should already be set.
          - paragraph [ref=f29e45]:
            - text: Just make sure that the shared library is available in the
            - code [ref=f29e46]: bin
            - text: or
            - code [ref=f29e47]: lib
            - text: "folder, which should be available directly under esmini root. Exact filename depends on the platform as follows:"
