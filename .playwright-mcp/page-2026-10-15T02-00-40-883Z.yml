              - paragraph [ref=f29e361]:
                - code [ref=f29e362]: ./bin/esmini --window 60 60 800 400 --osc ./EnvironmentSimulator/Unittest/xosc/test-collision-detection.xosc --disable_controllers
              - paragraph [ref=f29e364]:
                - strong [ref=f29e365]: "Note:"
