              - paragraph [ref=f29e561]: In the first loop the driver model is just capable of driving along the specified lane. It’s totally detached from any scenario events.
              - paragraph [ref=f29e563]: The ghost concept is a solution for a driver model to perform scenario actions. Basically it will launch a fore-runner to perform the scenario actions. The trajectory, including speed, is registered into a "trail" which can then be used as reference for steering and speed target.
