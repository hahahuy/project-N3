                - link "CollisionCondition" [ref=f29e349] [cursor=pointer]:
                  - /url: https://www.asam.net/static_downloads/ASAM_OpenSCENARIO_V1.2.0_Model_Documentation/modelDocumentation/content/CollisionCondition.html
                - text: a collision can be detected and act upon. This can be useful for example if a scenario or test case should end in case of Ego vehicle gets involved in a collision.
              - paragraph [ref=f29e351]:
                - text: See example
                - link "EnvironmentSimulator/Unittest/xosc/test-collision-detection.xosc" [ref=f29e352] [cursor=pointer]:
                  - /url: https://github.com/esmini/esmini/blob/master/EnvironmentSimulator/Unittest/xosc/test-collision-detection.xosc
                - text: ". To run it from command line:"
              - paragraph [ref=f29e354]:
                - code [ref=f29e355]: ./bin/esmini --window 60 60 800 400 --osc ./EnvironmentSimulator/Unittest/xosc/test-collision-detection.xosc
              - paragraph [ref=f29e357]: Control the Ego car with keyboard arrow keys. Press "up" to accelerate, and "left" or "right" to steer. See output in console when colliding with the two other cars.
