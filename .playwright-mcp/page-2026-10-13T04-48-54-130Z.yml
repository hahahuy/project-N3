                  - generic [ref=f21e369]:
                    - heading "Introduction" [level=2] [ref=f21e370]
                    - 'link "Permalink: Introduction" [ref=f21e371] [cursor=pointer]':
                      - /url: "#introduction"
                  - paragraph [ref=f21e374]:
                    - text: "nuCarla is a large-scale, nuScenes-compatible, camera-based perception dataset developed in the CARLA simulator, featuring 9 distinct maps, 14 weather conditions, and 6 object classes. It is designed to facilitate training of effective perception representations for end-to-end autonomous driving development. The dataset contains 1,000 scenarios in total, with 700 for training, 150 for validation, and 150 for testing, matching the nuScenes split. To thoroughly validate nuCarla, we train and evaluate four state-of-the-art Bird's Eye View (BEV) perception models:"
                    - link "BEVFormer" [ref=f21e375] [cursor=pointer]:
                      - /url: https://github.com/fundamentalvision/BEVFormer
                    - text: ","
                    - link "PETR" [ref=f21e376] [cursor=pointer]:
                      - /url: https://github.com/megvii-research/PETR
                    - text: ","
                    - link "BEVDet" [ref=f21e377] [cursor=pointer]:
                      - /url: https://github.com/HuangJunJie2017/BEVDet
                    - text: ","
                    - link "FastBEV" [ref=f21e378] [cursor=pointer]:
                      - /url: https://github.com/ymlab/advanced-fastbev
                    - text: ", and demonstrate that all models achieve competitive performance using the official nuScenes detection metrics."
                  - paragraph [ref=f21e379]:
                    - strong [ref=f21e380]: Update 01/02/2026
                    - text: ": Following community requests, we have released a sample data generation pipeline under the"
                    - code [ref=f21e381]: data
                    - text: branch.
                  - generic [ref=f21e382]:
                    - heading "Key Features" [level=2] [ref=f21e383]
                    - 'link "Permalink: Key Features" [ref=f21e384] [cursor=pointer]':
                      - /url: "#key-features"
                  - paragraph [ref=f21e387]:
                    - text: 🚗 The first large-scale
                    - strong [ref=f21e388]: CARLA-based perception dataset
                    - text: with full compatibility to the nuScenes format.
                  - paragraph [ref=f21e389]:
                    - text: ⚙️
                    - strong [ref=f21e390]: MMDetection3D-1.0 fully upgraded
