    - generic [ref=f27e38]:
      - heading "Use cases" [level=2] [ref=f27e39]
      - generic [ref=f27e40]:
        - paragraph [ref=f27e42]:
          - text: Here follows basic examples showing some, but not all, features in esmini and companion tools. It should give an idea of the possibilities and limitations. For a full list of features and functions, see
          - link "Command reference" [ref=f27e43] [cursor=pointer]:
            - /url: command-reference.html#_command_reference
          - text: .
        - paragraph [ref=f27e45]: "To quickly see available launch options, simply run the corresponding application with no arguments, for example:"
        - paragraph [ref=f27e47]:
          - code [ref=f27e48]: ./bin/odrviewer
        - generic [ref=f27e49]:
          - heading "View a scenario" [level=3] [ref=f27e50]
          - generic [ref=f27e51]:
            - heading "Basic features" [level=4] [ref=f27e52]
            - paragraph [ref=f27e54]:
              - text: "Specify a window and scenario file. Example:"
              - code [ref=f27e55]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/cut-in.xosc
            - paragraph [ref=f27e57]:
              - text: "Visualize trails from moving entities:"
              - code [ref=f27e58]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/cut-in.xosc --trail_mode 3
            - paragraph [ref=f27e60]:
              - text: "Show entities as bounding boxes:"
              - code [ref=f27e61]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/cut-in.xosc --bounding_boxes
            - generic [ref=f27e62]:
              - img "cut in trail and bb" [ref=f27e64]
              - generic [ref=f27e65]: Trail and bounding box in combination
          - generic [ref=f27e66]:
            - heading "Camera control" [level=4] [ref=f27e67]
            - paragraph [ref=f27e69]:
              - text: In addition to several OSG standard camera models esmini adds a set of special purpose camera modes that follows following scenario entities in various ways. Further, the user can add custom cameras via
              - link "API" [ref=f27e70] [cursor=pointer]:
                - /url: esmini-lib-programming.html#_custom_camera_positions
              - text: or launch arguments.
            - paragraph [ref=f27e72]: Top level camera mode is selected on keys '1' to '8'. Mode 2-8 are OpenSceneGraph standard cameras. Mode 1 hands over camera control to esmini. In this mode, switch camera model by pressing 'k' which will toggle between all available esmini camera model.
            - paragraph [ref=f27e74]: The default camera model is esmini "orbit" which allows for rotating (left-mouse button), zooming (right-mouse button) and panning (scroll wheel / middle mouse button) while following the first entity.
            - paragraph [ref=f27e76]:
              - text: To follow another vehicle press
              - code [ref=f27e77]: Tab
              - text: (next vehicle) or
              - code [ref=f27e78]: Shift TAB
              - text: (previous vehicle). Also
              - code [ref=f27e79]: Backspace
              - text: is mapped to previous vehicle, since shift-TAB do not work on all platforms.
            - paragraph [ref=f27e81]:
              - text: For a complete list of cameras and functions, see
              - link "Command reference" [ref=f27e82] [cursor=pointer]:
                - /url: command-reference.html#_command_reference
              - text: .
            - paragraph [ref=f27e84]: "esmini camera mode can be selected by launch argument. Here are a few common use cases:"
            - paragraph [ref=f27e86]:
              - text: "Follow exact behind vehicle:"
              - code [ref=f27e87]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --camera_mode fixed
            - paragraph [ref=f27e89]:
              - text: "Orthogonal (no perspective) top view follow vehicle:"
              - code [ref=f27e90]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --camera_mode top
            - paragraph [ref=f27e92]:
              - text: "Follow vehicle from inside \"driver\" point of view:"
              - code [ref=f27e93]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --camera_mode driver
            - paragraph [ref=f27e95]:
              - text: "Follow vehicle with some flex and allow rotate, pan and zoom:"
              - code [ref=f27e96]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --camera_mode flex-orbit
            - paragraph [ref=f27e98]: "In addition to pre-defined camera modes, the user can add custom cameras from API or via launch argument. Custom cameras can be fixed, semi-fixed (fixed position but unconstrained orientation) or relative current vehicle. Here is a few examples:"
            - paragraph [ref=f27e100]:
              - text: "Custom camera in front of vehicle, e.g. sensor mount position:"
              - code [ref=f27e101]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --custom_camera 3,0,0.6,0,0
            - paragraph [ref=f27e103]:
              - text: "Custom camera with fixed position but dynamic orientation, always pointing at current vehicle:"
              - code [ref=f27e104]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --custom_fixed_camera 170,10,5
            - generic [ref=f27e105]: Your browser does not support the video tag.
            - paragraph [ref=f27e109]:
              - text: "Custom fixed camera:"
              - code [ref=f27e110]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --custom_fixed_camera 240,15,10,3.5,0.2
            - generic [ref=f27e111]: Your browser does not support the video tag.
            - paragraph [ref=f27e115]:
              - text: "Custom fixed top view camera:"
              - code [ref=f27e116]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --custom_fixed_top_camera 180,-1.54,2301,4.71239
            - generic [ref=f27e117]: Your browser does not support the video tag.
          - generic [ref=f27e120]:
            - heading "Some key shortcut commands" [level=4] [ref=f27e121]
            - table [ref=f27e123]:
              - rowgroup [ref=f27e124]:
                - row [ref=f27e125]:
                  - cell [ref=f27e126]:
                    - strong [ref=f27e127]: Space
                  - cell [ref=f27e128]:
                    - paragraph [ref=f27e129]: Toggle pause/play simulation
                - row [ref=f27e130]:
                  - cell [ref=f27e131]:
                    - strong [ref=f27e132]: Enter
                  - cell [ref=f27e133]:
                    - paragraph [ref=f27e134]: Step simulation one frame forward
                - row [ref=f27e135]:
                  - cell [ref=f27e136]:
                    - strong [ref=f27e137]: Tab
                  - cell [ref=f27e138]:
                    - paragraph [ref=f27e139]: Move camera to next vehicle
                - row [ref=f27e140]:
                  - cell [ref=f27e141]:
                    - strong [ref=f27e142]: Shift-Tab or Backspace
                  - cell [ref=f27e143]:
                    - paragraph [ref=f27e144]: Move camera to previous vehicle
                - row [ref=f27e145]:
                  - cell [ref=f27e146]:
                    - strong [ref=f27e147]: "'j'"
                  - cell [ref=f27e148]:
                    - paragraph [ref=f27e149]: Toggle show entity trail points and lines (press mulitpe times to switch modes)
                - row [ref=f27e150]:
                  - cell [ref=f27e151]:
                    - strong [ref=f27e152]: "','"
                  - cell [ref=f27e153]:
                    - paragraph [ref=f27e154]: Toggle bounding box modes
                - row [ref=f27e155]:
