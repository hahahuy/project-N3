          - heading "esmini in Unity" [level=3] [ref=f27e959]
          - paragraph [ref=f27e961]:
            - text: esmini shared library works also as plugin in Unity (Win, Linux, Mac). A simple example can be downloaded from
            - link "here" [ref=f27e962] [cursor=pointer]:
              - /url: https://www.dropbox.com/scl/fi/5d41set5lusce8lkw84xy/esmini-player_v3_0_0.unitypackage?rlkey=as9xfmmzfhlcrfo3brzsk34xu&st=y0n8g0yu&dl=1
            - text: ". The package contains everything needed to get going:"
          - list [ref=f27e964]:
            - listitem [ref=f27e965]:
              - paragraph [ref=f27e966]: esmini library C# wrapper
            - listitem [ref=f27e967]:
              - paragraph [ref=f27e968]: a generic scenario player script
            - listitem [ref=f27e969]:
              - paragraph [ref=f27e970]: a few example scenarios (OpenSCENARIO XML + OpenDRIVE) including 3D models
            - listitem [ref=f27e971]:
              - paragraph [ref=f27e972]: plugins for all platforms (can be updated of course)
            - listitem [ref=f27e973]:
              - paragraph [ref=f27e974]: and finally a scene connecting the player script to a game object
          - paragraph [ref=f27e976]: "Run:"
          - list [ref=f27e978]:
            - listitem [ref=f27e979]:
              - paragraph [ref=f27e980]: Import package (Import Package → Custom Package)
            - listitem [ref=f27e981]:
              - paragraph [ref=f27e982]: Load the scene (Assets/Scenes/esmini-scene)
            - listitem [ref=f27e983]:
              - paragraph [ref=f27e984]: Then just press play-button
          - paragraph [ref=f27e986]: Select (click on) esmini-player in Hierarchy to show up in Inspector, where you can specify scenario file and a few parameters. Note that scenario file and dependent OpenDRIVE and optional 3D scenegraph file must be present in StreamingAssets folder.
          - paragraph [ref=f27e988]: Plugins can be updated, but NOTE that you need to restart Unity to (re)load shared library plugins. And, of course, scenario files and other content can be added or replaced.
