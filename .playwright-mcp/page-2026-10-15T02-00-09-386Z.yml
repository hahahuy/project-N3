            - paragraph [ref=f27e161]:
              - text: See
              - link "Command reference" [ref=f27e162] [cursor=pointer]:
                - /url: command-reference.html#_command_reference
              - text: for a complete list of key shortcut commands.
          - generic [ref=f27e163]:
            - heading "Road network visualization" [level=4] [ref=f27e164]
            - paragraph [ref=f27e166]:
              - text: "Visualize OpenDRIVE road features:"
              - code [ref=f27e167]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/cut-in.xosc --road_features on
            - paragraph [ref=f27e169]:
              - text: If a 3D model representation of the road network is missing (i.e. empty or missing SceneGraphFile element of the
              - link "OpenSCENARIO RoadNetwork class" [ref=f27e170] [cursor=pointer]:
                - /url: https://www.asam.net/static_downloads/ASAM_OpenSCENARIO_V1.1.1_Model_Documentation/modelDocumentation/content/RoadNetwork.html
              - text: ), then esmini will generate a
              - emphasis [ref=f27e171]: very
              - text: simple model.
            - paragraph [ref=f27e173]:
              - text: "Example:"
              - code [ref=f27e174]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc
            - paragraph [ref=f27e176]:
              - text: "Add optional flat ground plane:"
              - code [ref=f27e177]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --ground_plane
            - paragraph [ref=f27e179]:
              - text: "The generated model can be saved:"
              - code [ref=f27e180]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --save_generated_model
              - text: Then look for
              - code [ref=f27e181]: generated_road.osgb
              - text: in the current directory.
            - paragraph [ref=f27e183]:
              - text: To exclude permanently hidden parts, use
              - code [ref=f27e184]: "--save_generated_model_visible"
              - text: . To save only the currently visible parts, press key 'v' at any time in
              - code [ref=f27e185]: esmini
              - text: or
              - code [ref=f27e186]: odrviewer
              - text: .
          - generic [ref=f27e187]:
            - heading "Background color" [level=4] [ref=f27e188]
            - paragraph [ref=f27e190]: "esmini default background color is skyish, light blue. Change by launch argument --clear-color <r,g,b>, where r, g, b are the red, green, blue components as floating numbers in the range (0:1). Some examples:"
            - paragraph [ref=f27e192]:
              - text: "Black background:"
              - code [ref=f27e193]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --clear-color 0,0,0
            - paragraph [ref=f27e195]:
              - text: "White background:"
              - code [ref=f27e196]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --clear-color 1,1,1
            - paragraph [ref=f27e198]:
              - text: "Gray background:"
              - code [ref=f27e199]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --clear-color 0.3,0.3,0.3
          - generic [ref=f27e200]:
            - heading "Anti-alias" [level=4] [ref=f27e201]
            - paragraph [ref=f27e203]:
              - text: esmini make use of OpenSceneGraph sub-sampling method for anti-alias. Default setting is 4 (samples). This can be controlled by the launch argument
              - code [ref=f27e204]: "--aa_mode <samples>"
              - text: ". To disable anti-alias:"
              - code [ref=f27e205]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --aa_mode 0
        - generic [ref=f27e206]:
          - heading "Screenshots and video clips" [level=3] [ref=f27e207]
          - paragraph [ref=f27e209]:
            - text: esmini can save screenshots in uncompressed
            - link "TGA" [ref=f27e210] [cursor=pointer]:
              - /url: https://en.wikipedia.org/wiki/Truevision_TGA
            - text: format. These images can be converted into other image formats or even video clips in a post process.
          - paragraph [ref=f27e212]:
            - text: esminiLib also supports grabbing screenshots via API, also from a pure off-screen rendering setup (requiring neither monitor nor graphics hardware). See
            - link "image-capture" [ref=f27e213] [cursor=pointer]:
              - /url: https://github.com/esmini/esmini/tree/master/EnvironmentSimulator/code-examples/image-capture
            - text: code example.
          - paragraph [ref=f27e215]: Here follows a few examples using launch arguments and runtime key commands.
          - generic [ref=f27e216]:
            - heading "Save screenshots" [level=4] [ref=f27e217]
            - paragraph [ref=f27e219]: Press 'c' at any time to store a single screenshot.
            - paragraph [ref=f27e221]: Press 'C' at any time to start storing screen shot for every frame onward. Press 'C' again to stop.
          - generic [ref=f27e222]:
            - heading "Create video clip of a scenario" [level=4] [ref=f27e223]
            - paragraph [ref=f27e225]:
              - text: "First, run the scenario and automatically save screenshots for all frames:"
              - code [ref=f27e226]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/cut-in.xosc --fixed_timestep 0.033 --capture_screen
            - paragraph [ref=f27e230]:
              - strong [ref=f27e231]: Note
              - text: We added the --fixed_timestep argument to make sure we get a smooth video with constant delta-time for a smooth and continuous video clip. If --fixed_timestep is skipped esmini will progress time between frames according to actual system time passed since last frame, which can vary over time for many reasons (e.g. due to esmini or other processes CPU load).
            - paragraph [ref=f27e233]:
              - text: "Then, create a video clip using ffmpeg:"
              - code [ref=f27e234]: ffmpeg -f image2 -framerate 30 -i screen_shot_%5d.tga -c:v libx264 -vf format=yuv420p -crf 20 out.mp4
            - paragraph [ref=f27e236]: "The above ffmpeg command will create a MPEG4 video with reasonable compression (crf 20). To create a lossless, but still compressed, video e.g. for further post processing:"
            - paragraph [ref=f27e238]:
              - code [ref=f27e239]: ffmpeg -f image2 -framerate 30 -i screen_shot_%5d.tga -c:v libx264 -qp 0 out.mp4
            - paragraph [ref=f27e241]: "To change framerate of the output video, use the fps filter. E.g. from input 30 fps to output 15 fps:"
            - paragraph [ref=f27e243]:
              - code [ref=f27e244]: ffmpeg -f image2 -framerate 30 -i screen_shot_%5d.tga -c:v libx264 -vf format=yuv420p,fps=15 -crf 20 out.mp4
            - paragraph [ref=f27e246]: "To concatenate multiple files, first create a text file listing the input files. Example:"
            - paragraph [ref=f27e248]:
              - code [ref=f27e249]: video_list.txt
              - text: ":"
            - code [ref=f27e253]: file 'no_features_10.mkv' file 'features_10.mkv'
            - paragraph [ref=f27e255]:
              - text: "Then run the ffmpeg command, like:"
              - code [ref=f27e256]: ffmpeg -f concat -i video_list.txt -c copy merged.mkv
            - paragraph [ref=f27e258]:
              - strong [ref=f27e259]: "Note:"
              - text: The input files must be same timebase and resolution to work well.
            - paragraph [ref=f27e261]:
              - text: "Get ffmpeg:"
              - link "http://ffmpeg.org/download.html" [ref=f27e262] [cursor=pointer]:
                - /url: http://ffmpeg.org/download.html
            - paragraph [ref=f27e264]:
              - text: Some details regarding H.264 encoding can be found
              - link "here" [ref=f27e265] [cursor=pointer]:
                - /url: https://trac.ffmpeg.org/wiki/Encode/H.264
              - text: .
          - generic [ref=f27e266]:
            - heading "Off-screen rendering" [level=4] [ref=f27e267]
            - paragraph [ref=f27e269]:
              - text: Whenever esmini is launched with the
              - code [ref=f27e270]: "--window <x-pos> <y-pos> <width> <height>"
              - text: argument a viewer will be created with specified window. The
              - code [ref=f27e271]: "--headless"
              - text: flag controls whether any window will be "on screen" or only off-screen. Of course,
              - code [ref=f27e272]: "--headless"
              - text: in combination with no window (no --window argument) will skip rendering altogether, which is a very performance-saving mode to use when possible.
            - paragraph [ref=f27e274]:
              - text: "Example:"
              - code [ref=f27e275]: ./bin/esmini.exe --window 60 60 4000 2000 --headless --capture_screen --osc .\resources\xosc\cut-in.xosc
              - text: "will render images into a virtual frame buffer of size 4k x 2k pixels and then store to file. Note: The size of the virtual frame buffer is not limited by size of any connected display."
            - paragraph [ref=f27e277]:
              - text: "To run esmini completely without rendering, just omit the --window argument:"
              - code [ref=f27e278]: ./bin/esmini.exe --osc .\resources\xosc\cut-in.xosc
              - text: "--fixed_timestep 0.01 --record sim.dat will run the specified scenario quickly and store a .dat file for later analysis or viewing (with replayer)."
            - paragraph [ref=f27e280]:
              - strong [ref=f27e281]: "Note:"
              - text: If --fixed_timestep is omitted esmini will adapt timesteps to actual frametime, so a 30 seconds scenario will take 30 seconds - i.e. no performance gain.
          - generic [ref=f27e282]:
            - heading "Software rendering (no gfx hw)" [level=4] [ref=f27e283]
            - paragraph [ref=f27e285]:
              - text: By default any available 3D graphics hardware will be utilized. As fallback esmini (via OSG) will utilize
              - link "Mesa3D" [ref=f27e286] [cursor=pointer]:
                - /url: https://www.mesa3d.org
              - text: which is a software implementation of the OpenGL graphics stack including parts normally hosted in the graphics hardware system. The Mesa3D approach is useful when running on cloud/cluster machines lacking graphics hardware, perhaps even lacking a window system (like slimmed and headless Ubuntu without X11 support).
            - paragraph [ref=f27e288]:
              - strong [ref=f27e289]: Mesa3D on Linux
              - text: "Mesa3D is normally installed with Linux distributions. Check OpenGL support with the following command:"
              - code [ref=f27e290]: glxinfo -B
            - paragraph [ref=f27e292]:
              - text: "If the command is not available, then Mesa3D utility package is probably missing. Install as:"
              - code [ref=f27e293]: sudo apt install mesa-utils
            - paragraph [ref=f27e295]:
              - text: To enforce software (CPU based) 3D rendering, utilize the
              - code [ref=f27e296]: LIBGL_ALWAYS_SOFTWARE
              - text: "environment variable:"
            - list [ref=f27e298]:
              - listitem [ref=f27e299]:
                - paragraph [ref=f27e300]:
                  - text: "single run example:"
                  - code [ref=f27e301]: LIBGL_ALWAYS_SOFTWARE=1 ./bin/esmini --osc ./resources/xosc/cut-in.xosc --window 50 50 800 600
              - listitem [ref=f27e302]:
                - paragraph [ref=f27e303]:
                  - text: "persistent setting:"
                  - code [ref=f27e304]: export LIBGL_ALWAYS_SOFTWARE=1
            - paragraph [ref=f27e306]: "To run headless with a virtual frame buffer:"
            - list [ref=f27e308]:
              - listitem [ref=f27e309]:
                - paragraph [ref=f27e310]:
                  - text: Activate
                  - link "xvfb" [ref=f27e311] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Xvfb
                  - text: ":"
                  - code [ref=f27e312]: Xvfb :99 -screen 0 1920x1080x24+32 & export DISPLAY=:99
              - listitem [ref=f27e313]:
                - paragraph [ref=f27e314]: Then run esmini as usual
            - paragraph [ref=f27e316]:
              - text: "For troubleshooting, the following command might give information about the graphics system:"
              - code [ref=f27e317]: lspci -vnn | grep VGA -A 12
            - paragraph [ref=f27e319]:
              - strong [ref=f27e320]: Mesa3D on Windows
            - list [ref=f27e322]:
              - listitem [ref=f27e323]:
                - paragraph [ref=f27e324]:
                  - text: Grab the Mesa3D binary from
                  - link "here" [ref=f27e325] [cursor=pointer]:
                    - /url: https://downloads.fdossena.com/geth.php?r=mesa64-latest
                  - text: .
              - listitem [ref=f27e326]:
                - paragraph [ref=f27e327]: Unpack and place opengl32.dll in the same folder as esmini executable.
              - listitem [ref=f27e328]:
                - paragraph [ref=f27e329]: Then run esmini as usual
        - generic [ref=f27e330]:
          - heading "Logging" [level=3] [ref=f27e331]
          - paragraph [ref=f27e333]: esmini can produce log files in different formats and for different purposes, explained next.
          - generic [ref=f27e334]:
            - heading "The basic text log file" [level=4] [ref=f27e335]
            - paragraph [ref=f27e337]:
              - text: By default esmini is creating a
              - code [ref=f27e338]: log.txt
              - text: in the folder from which esmini is launched. In case of esminiLib it will end up in the folder that the application linking esminiLib was launched from. The log filename can be customized.
            - paragraph [ref=f27e340]: The log file includes the same information normally seen in the terminal window (stdout).
            - paragraph [ref=f27e342]:
              - text: "To disable output to terminal:"
              - code [ref=f27e343]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --disable_stdout
            - paragraph [ref=f27e345]:
              - text: To disable creation of the logfile (
              - code [ref=f27e346]: log.txt
              - text: "):"
              - code [ref=f27e347]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --disable_log
            - paragraph [ref=f27e349]: esmini has enhanced logger from release v2.41.0 supporting log verbosity levels, log file appending, enabling/disabling meta data and filtering on module level logging.
            - generic [ref=f27e350]:
              - heading "Log verbosity" [level=5] [ref=f27e351]
              - paragraph [ref=f27e353]: "There are four log verbosity levels:"
              - list [ref=f27e355]:
                - listitem [ref=f27e356]:
                  - paragraph [ref=f27e357]: error
                - listitem [ref=f27e358]:
                  - paragraph [ref=f27e359]: warn
                - listitem [ref=f27e360]:
                  - paragraph [ref=f27e361]: info
                - listitem [ref=f27e362]:
                  - paragraph [ref=f27e363]: debug
              - paragraph [ref=f27e365]:
                - text: The log level can be set from command line argument. If not provided, then
                - code [ref=f27e366]: info
                - text: level is set by default. Log verbosity goes from
                - code [ref=f27e367]: error
                - text: (low) to
                - code [ref=f27e368]: debug
                - text: (high). Log entries will be included from
                - code [ref=f27e369]: error
                - text: up to the specified level.
              - paragraph [ref=f27e371]:
                - text: "Example 1:"
                - code [ref=f27e372]: "--log_level debug"
                - text: will include all entries (
                - code [ref=f27e373]: error
                - text: ","
                - code [ref=f27e374]: warn
                - text: ","
                - code [ref=f27e375]: info
                - text: and
                - code [ref=f27e376]: debug
                - text: ) as the highest level has been selected.
              - paragraph [ref=f27e378]:
                - text: "Example 2:"
                - code [ref=f27e379]: "--log_level warn"
                - text: will include
                - code [ref=f27e380]: error
                - text: and
                - code [ref=f27e381]: warn
                - text: entries only.
              - paragraph [ref=f27e383]:
                - text: Developers can use
                - code [ref=f27e384]: LOG_ERROR
                - text: ","
                - code [ref=f27e385]: LOG_WARN
                - text: ","
                - code [ref=f27e386]: LOG_INFO
                - text: and
                - code [ref=f27e387]: LOG_DEBUG
                - text: macros to effectively prioritize log messages.
            - generic [ref=f27e388]:
              - heading "Log metadata" [level=5] [ref=f27e389]
              - paragraph [ref=f27e391]: "Logger can add source code meta data with every logged entry, including:"
              - list [ref=f27e393]:
                - listitem [ref=f27e394]:
                  - paragraph [ref=f27e395]: file name
                - listitem [ref=f27e396]:
                  - paragraph [ref=f27e397]: function/method name
                - listitem [ref=f27e398]:
                  - paragraph [ref=f27e399]: line number
              - paragraph [ref=f27e401]: indicating the location of the log entry in the source code.
              - paragraph [ref=f27e403]:
                - code [ref=f27e404]: "--log_meta_data"
                - text: is the command line parameter for enabling meta data.
            - generic [ref=f27e405]:
              - heading "Log append" [level=5] [ref=f27e406]
              - paragraph [ref=f27e408]:
                - code [ref=f27e409]: "--log_append"
                - text: is another command line option. Instead of overwriting any existing log file, entries will be appended to the same log file. In other words, logs of multiple scenarios will be put in the same single log file.
            - generic [ref=f27e410]:
              - heading "Log filtering on modules" [level=5] [ref=f27e411]
              - paragraph [ref=f27e413]:
                - text: If there is a need to gather log entries of any particular module(s) i.e. hpp/cpp file then
                - code [ref=f27e414]: "--log_only_modules"
                - text: "option can be set from the command line. It will create a filter for the logger to pick only log entries from specified modules, ignoring all others. Example:"
              - paragraph [ref=f27e416]:
                - code [ref=f27e417]: "--log_only_modules playerbase"
              - paragraph [ref=f27e419]:
                - text: will only log from
                - code [ref=f27e420]: playerbase.hpp/cpp
                - text: files. All other log entries will be skipped.
              - paragraph [ref=f27e422]: "Opposite to log only modules, there is an option to skip specific modules. Example:"
              - paragraph [ref=f27e424]:
                - code [ref=f27e425]: "--log_skip_modules playerbase,Replay"
              - paragraph [ref=f27e427]:
                - text: will skip all log entries from
                - code [ref=f27e428]: playerbase.hpp/cpp
                - text: and
                - code [ref=f27e429]: Replay.hpp/cpp
                - text: files. Entries from all other modules will be included.
              - paragraph [ref=f27e431]:
                - text: Note that
                - code [ref=f27e432]: "--log_only_modules"
                - text: and
                - code [ref=f27e433]: "--log_skip_modules"
                - text: are mutually exclusive. If a module is listed in both options, then priority is given to
                - code [ref=f27e434]: "--log_only_modules"
                - text: . Hence logging will be enabled for specified module, ignoring its presence in
                - code [ref=f27e435]: "--log_skip_modules"
                - text: .
            - generic [ref=f27e436]:
              - heading "Log use case example" [level=5] [ref=f27e437]
              - paragraph [ref=f27e439]: "Assume you’re only interested in storyboard events, like actions and triggers. First step is to run a representative scenario to find out what modules you’re interested in. Example:"
              - paragraph [ref=f27e441]:
                - code [ref=f27e442]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/cut-in.xosc --log_meta_data
              - paragraph [ref=f27e444]:
                - text: It will show all log entries up to
                - code [ref=f27e445]: info
                - text: "level, including meta data. Look for the module names in the log entries. Then run the scenario again with module filter. Example:"
              - paragraph [ref=f27e447]:
                - code [ref=f27e448]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/cut-in.xosc --log_only_modules Storyboard,StoryboardElement,OSCCondition
              - paragraph [ref=f27e450]: "It will show only log entries relating to storyboard, including triggering. Example excerpt:"
              - code [ref=f27e454]: "... [0.001] [info] OverTakerStartSpeedEvent standbyState -> startTransition -> runningState [0.001] [info] OverTakerStartSpeedAction initState -> startTransition -> runningState [6.179] [info] Trigger /------------------------------------------------ [6.179] [info] CutInStartCondition == true, HWT: 0.40 > 0.40, edge rising [6.179] [info] Triggering entity 0: Ego [6.179] [info] Trigger ------------------------------------------------/ [6.179] [info] OverTakerStartSpeedAction runningState -> endTransition -> completeState [6.179] [info] OverTakerStartSpeedEvent complete after 1 execution [6.179] [info] OverTakerStartSpeedEvent runningState -> endTransition -> completeState [6.179] [info] Event OverTakerStartSpeedEvent ended, overwritten by event CutInEvent [6.179] [info] CutInEvent standbyState -> startTransition -> runningState [6.179] [info] CutInAction initState -> startTransition -> runningState [7.696] [info] Trigger /------------------------------------------------ [7.696] [info] BrakeCondition_HWT_0.7 == true, HWT: 0.70 > 0.70, edge rising [7.696] [info] Triggering entity 0: Ego [7.696] [info] Trigger ------------------------------------------------/ [7.696] [info] Other events ongoing, OvertakerBrakeEvent will run in parallel [7.696] [info] OvertakerBrakeEvent standbyState -> startTransition -> runningState ..."
          - generic [ref=f27e455]:
            - heading "Scenario recording (.dat)" [level=4] [ref=f27e456]
            - paragraph [ref=f27e458]:
              - text: From version 2.54.0 esmini implements a package-based
              - code [ref=f27e459]: .dat
              - text: file format. The new format comes with increased flexibility without unnecessary file size growth. It supports gradually adding/removing content in the
              - code [ref=f27e460]: .dat
              - text: files without breaking compatibility. Packages consists of header (packet ID and packet size) and the data. This file can later be used either to replay (see
              - link "Replay scenario" [ref=f27e461] [cursor=pointer]:
                - /url: "#_replay_scenario"
              - text: ) the scenario or convert it to
              - code [ref=f27e462]: .csv
              - text: for further analysis, e.g. in Excel.
            - paragraph [ref=f27e464]:
              - text: "A list of available packet IDs and packet structure etc. can be found in:"
              - link [ref=f27e465] [cursor=pointer]:
                - /url: https://github.com/esmini/esmini/blob/dev/EnvironmentSimulator/Modules/ScenarioEngine/SourceFiles/PacketHandler.hpp
                - code [ref=f27e466]: EnvironmentSimulator/Modules/ScenarioEngine/SourceFiles/PacketHandler.hpp
            - paragraph [ref=f27e468]:
              - text: "To create a recording with regular timesteps:"
              - code [ref=f27e469]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/slow-lead-vehicle.xosc --fixed_timestep 0.05 --record sim.dat
            - paragraph [ref=f27e471]:
              - text: "To convert the .dat file into .csv, do:"
              - code [ref=f27e472]: ./bin/dat2csv sim.dat
            - paragraph [ref=f27e474]:
              - text: "Only a subset of the .dat file information is extracted. To extract some more info, e.g. road coordinates, run:"
              - code [ref=f27e475]: ./bin/dat2csv sim.dat --extended
            - paragraph [ref=f27e477]: "You can create .dat files from multiple scenarios in a single command, like this on Linux (bash):"
            - code [ref=f27e481]: "for f in ./my_scenarios/*.xosc; do ./bin/esmini --headless --fixed_timestep 0.05 --osc $f --record `basename $f .xosc`.dat; done"
            - paragraph [ref=f27e483]: It also works in Git bash on Windows.
          - generic [ref=f27e484]:
            - heading "Scenario recording (.dat) versioning" [level=4] [ref=f27e485]
            - paragraph [ref=f27e487]:
              - text: The new
              - code [ref=f27e488]: .dat
              - text: "file format starts at version 3.0, succeeding version 2. The version is written to the file header. The versioning follows semantic versioning principles, where:"
            - list [ref=f27e490]:
              - listitem [ref=f27e491]:
                - paragraph [ref=f27e492]: "Major version (X.y): Incompatible changes to the file format."
              - listitem [ref=f27e493]:
                - paragraph [ref=f27e494]: "Minor version (x.Y): Backwards-compatible additions and/or bug fixes to the file format."
            - paragraph [ref=f27e496]:
              - text: Replaying a
              - code [ref=f27e497]: .dat
              - text: file created with a different minor version, both previous and future, is supported. For example, replay a
              - code [ref=f27e498]: .dat
              - text: file created with esmini version 3.7 using replayer version 3.5, and vice versa. However, due to the nature of the changes, the replay behavior can’t be guaranteed to be identical between minor versions. For example, content added via a new package in a newer minor version will not be present when replaying with an older minor version. In summary, replayer will gracefully skip unknown packages while showing all recognized ones.
            - paragraph [ref=f27e500]:
              - text: If the major version of the
              - code [ref=f27e501]: .dat
              - text: file differs from the replayer version, replay is not supported. For example, a
              - code [ref=f27e502]: .dat
              - text: file created with version 4.1 cannot be replayed using version 3.8, and vice versa. Either the
              - code [ref=f27e503]: .dat
              - text: file has to be recreated using the same major version as the replayer, or the replayer has to be updated/downgraded to match the major version of the
              - code [ref=f27e504]: .dat
              - text: file.
          - generic [ref=f27e505]:
            - heading "CSV logger" [level=4] [ref=f27e506]
            - paragraph [ref=f27e508]: "To create a more complete csv logfile, compared to the content of the .dat file, activate the CSV_Logger:"
            - paragraph [ref=f27e510]:
              - code [ref=f27e511]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/cut-in.xosc --fixed_timestep 0.05 --csv_logger full_log.csv
            - paragraph [ref=f27e513]: "full_log.csv will contain more detailed states for all scenario entities. To also include collision detection:"
            - paragraph [ref=f27e515]:
              - code [ref=f27e516]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/cut-in.xosc --fixed_timestep 0.05 --csv_logger full_log.csv --collision
            - paragraph [ref=f27e518]:
              - text: All collisions (overlap) between entity bounding boxes will be registered in the
              - code [ref=f27e519]: collision_ids
              - text: column of each entity. It will contain the IDs of any entities overlapping at given frame.
