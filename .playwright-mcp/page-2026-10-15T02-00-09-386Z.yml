              - code [ref=f27e773]: ./scripts/plot_dat.py sim.dat --param laneId --param speed
            - img "plot dat lane speed" [ref=f27e776]
            - paragraph [ref=f27e778]:
              - text: To plot trajectories, change X-axis parameter from
              - code [ref=f27e779]: time
              - text: to
              - code [ref=f27e780]: x
              - text: and plot
              - code [ref=f27e781]: "y"
              - text: "parameter (over x):"
              - code [ref=f27e782]: ./scripts/plot_dat.py sim.dat --x_axis x --param y
            - img "plot dat x y" [ref=f27e785]
            - paragraph [ref=f27e787]:
              - text: "Lock axis aspect ratio, i.e. make axis scale equal:"
              - code [ref=f27e788]: ./scripts/plot_dat.py sim.dat --x_axis x --param y --equal_axis_aspect
            - img "plot dat x y eq axis" [ref=f27e791]
            - paragraph [ref=f27e793]:
              - text: Plot merged .dat files (created as described in
              - link "Save merged .dat files" [ref=f27e794] [cursor=pointer]:
                - /url: "#_save_merged_dat_files"
              - text: )
            - paragraph [ref=f27e796]:
              - code [ref=f27e797]: ./scripts/plot_dat.py --param speed sim_merged.dat
            - img "plot merged dat files" [ref=f27e800]
            - paragraph [ref=f27e802]: "Entity IDs will get an offset multiplier of 100, corresponding to the order of which the dat files were read by replayer. The mapping between ID range and dat file is printed to the console by replayer when the merged dat file is created, as the following example of four input files:"
            - generic [ref=f27e803]: "Scenarios corresponding to IDs (0:99): sim_fsm.dat Scenarios corresponding to IDs (100:199): sim_ref.dat Scenarios corresponding to IDs (200:299): sim_reg.dat Scenarios corresponding to IDs (300:399): sim_rss.dat"
          - generic [ref=f27e806]:
            - heading "Runtime plotting" [level=4] [ref=f27e807]
            - paragraph [ref=f27e809]:
              - text: From version 2.32.0 esmini can plot some pre-configured data values during simulation. Simply add launch flag
              - code [ref=f27e810]: "--plot"
              - text: .
            - paragraph [ref=f27e812]: "Features so far:"
            - list [ref=f27e814]:
              - listitem [ref=f27e815]:
                - paragraph [ref=f27e816]: One or multiple entities can be selected by checkboxes on top
              - listitem [ref=f27e817]:
                - paragraph [ref=f27e818]: Selection of variables can be reduced by checkboxes to the right
            - generic [ref=f27e819]:
              - img "implot" [ref=f27e821]
              - generic [ref=f27e822]: Screenshot of a cut-in scenario with line plotting feature enabled
            - paragraph [ref=f27e824]: "By default the plotting is executing in a separate thread, having minimal impact on esmini performance. It is also possible to execute in synchronous mode, where plotting is part of esmini main thread and stepping is done in synch. The mode can be specified explicitly. Examples:"
            - paragraph [ref=f27e826]: "Simply enable plotting, default mode:"
            - paragraph [ref=f27e828]:
              - code [ref=f27e829]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/cut-in.xosc --fixed_timestep 0.05 --plot
            - paragraph [ref=f27e831]: "Enforce synchronous mode:"
            - paragraph [ref=f27e833]:
              - code [ref=f27e834]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/cut-in.xosc --fixed_timestep 0.05 --plot synchronous
            - paragraph [ref=f27e836]: "Asynchronous mode can be specified as well, although it’s default hence not needed:"
            - paragraph [ref=f27e838]:
              - code [ref=f27e839]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/cut-in.xosc --fixed_timestep 0.05 --plot asynchronous
            - paragraph [ref=f27e841]:
              - strong [ref=f27e842]: "Note:"
              - text: On macos OpenGL window must be part of main thread. Hence synchronous mode is enforced on macos.
        - generic [ref=f27e843]:
          - heading "Save OSI data" [level=3] [ref=f27e844]
          - paragraph [ref=f27e846]: "esmini can provide OSI groundtruth data in three ways:"
          - list [ref=f27e848]:
            - listitem [ref=f27e849]:
              - paragraph [ref=f27e850]: Send over UDP
            - listitem [ref=f27e851]:
              - paragraph [ref=f27e852]: API to fetch via function call from a custom application
            - listitem [ref=f27e853]:
              - paragraph [ref=f27e854]: Save to OSI trace file
          - paragraph [ref=f27e856]:
            - text: Only trace file way is described here. To save OSI data, add argument
            - code [ref=f27e857]: "--osi_file [filename]"
            - text: . The filename is optional. If omitted it will be named
            - code [ref=f27e858]: ground_truth.osi
            - text: ". Example:"
          - paragraph [ref=f27e860]:
            - code [ref=f27e861]: ./bin/esmini --window 60 60 800 400 --osc ./resources/xosc/cut-in.xosc --osi_file
          - paragraph [ref=f27e863]:
            - text: will create
            - code [ref=f27e864]: ground_truth.osi
            - text: in the current folder. The format is according to the OSI standard "Binary trace file", see OSI documentation
            - link "2.2.6 OSI trace files" [ref=f27e865] [cursor=pointer]:
              - /url: https://opensimulationinterface.github.io/osi-antora-generator/asamosi/V3.5.0/interface/architecture/trace_file_formats.html
            - text: .
          - paragraph [ref=f27e867]: "esmini provides a script, osi2csv.py, that converts an OSI trace file into .csv format. The script can also serve as example how to parse and extract data from an OSI trace file:"
          - paragraph [ref=f27e869]:
            - code [ref=f27e870]: ./scripts/osi2csv.py ground_truth.osi
          - paragraph [ref=f27e872]:
            - text: "will create ground_truth.csv. (if file type association is not setup, try:"
            - code [ref=f27e873]: python ./scripts/osi2csv.py ground_truth.osi
            - text: )
          - paragraph [ref=f27e875]:
            - text: However the .csv file created with osi2csv will not contain all OSI information. To get a readable text file including the complete content of a OSI trace file you can make use of the Python script
            - link "format/osi2read.py" [ref=f27e876] [cursor=pointer]:
              - /url: https://github.com/OpenSimulationInterface/open-simulation-interface/blob/v3.5.0/format/osi2read.py
            - text: in the OSI project.
          - paragraph [ref=f27e878]: "Use as following example:"
          - paragraph [ref=f27e880]:
            - code [ref=f27e881]: ../open-simulation-interface/format/osi2read.py --data ./ground_truth.osi --output ground_truth --type GroundTruth
          - paragraph [ref=f27e883]:
            - text: it should create
            - code [ref=f27e884]: ground_truth.txth
            - text: which is readable in a text editor.
          - generic [ref=f27e886]:
            - paragraph [ref=f27e888]:
              - strong [ref=f27e889]: Note
              - text: ":"
            - paragraph [ref=f27e891]:
              - text: See
              - link "OSI for Python on Windows" [ref=f27e892] [cursor=pointer]:
