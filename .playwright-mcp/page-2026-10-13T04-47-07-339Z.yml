            - separator [ref=f11e192]
            - heading "What is the Traffic Manager?" [level=2] [ref=f11e193]
            - paragraph [ref=f11e194]: The Traffic Manager (TM) is the module that controls vehicles in autopilot mode in a simulation. Its goal is to populate a simulation with realistic urban traffic conditions. Users can customize some behaviors, for example, to set specific learning circumstances.
            - heading "Structured design" [level=3] [ref=f11e195]
            - paragraph [ref=f11e196]:
              - text: TM is built on CARLA's client-side. The execution flow is divided into
              - strong [ref=f11e197]: stages
              - text: ", each with independent operations and goals. This facilitates the development of phase-related functionalities and data structures while improving computational efficiency. Each stage runs on a different thread. Communication with other stages is managed through synchronous messaging. Information flows in one direction."
            - heading "User customization" [level=3] [ref=f11e198]
            - paragraph [ref=f11e199]: Users have some control over the traffic flow by setting parameters that allow, force, or encourage specific behaviors. Users can change the traffic behavior as they prefer, both online and offline. For example, cars can be allowed to ignore the speed limits or force a lane change. Being able to play around with behaviors is indispensable when trying to simulate reality. Driving systems need to be trained under specific and atypical circumstances.
            - separator [ref=f11e200]
            - heading "Architecture" [level=2] [ref=f11e201]
            - heading "Overview" [level=3] [ref=f11e202]
            - paragraph [ref=f11e203]:
              - img "Architecture" [ref=f11e204]
            - paragraph [ref=f11e205]:
              - text: The above diagram is a representation of the internal architecture of the TM. The C++ code for each component can be found in
              - code [ref=f11e206]: LibCarla/source/carla/trafficmanager
              - text: ". Each component is explained in detail in the following sections. A simplified overview of the logic is as follows:"
            - paragraph [ref=f11e207]:
              - strong [ref=f11e208]: 1. Store and update the current state of the simulation.
            - list [ref=f11e209]:
              - listitem [ref=f11e210]:
                - text: The
                - link "Agent Lifecycle & State Management" [ref=f11e211] [cursor=pointer]:
                  - /url: "#alsm"
                - text: (ALSM) scans the world to keep track of all the vehicles and walkers present and to clean up entries for those that no longer exist. All the data is retrieved from the server and is passed through several
                - link "stages" [ref=f11e212] [cursor=pointer]:
                  - /url: "#stages-of-the-control-loop"
                - text: . The ALSM is the only component that makes calls to the server.
              - listitem [ref=f11e213]:
                - text: The
                - link "vehicle registry" [ref=f11e214] [cursor=pointer]:
                  - /url: "#vehicle-registry"
                - text: contains an array of vehicles on autopilot (controlled by the TM) and a list of pedestrians and vehicles not on autopilot (not controlled by the TM).
              - listitem [ref=f11e215]:
                - text: The
                - link "simulation state" [ref=f11e216] [cursor=pointer]:
                  - /url: "#simulation-state"
                - text: is a cache store of the position, velocity, and additional information of all the vehicles and pedestrians in the simulation.
            - paragraph [ref=f11e217]:
              - strong [ref=f11e218]: 2. Calculate the movement of every autopilot vehicle.
            - paragraph [ref=f11e219]:
              - text: The TM generates viable commands for all vehicles in the
              - link "vehicle registry" [ref=f11e220] [cursor=pointer]:
                - /url: "#vehicle-registry"
              - text: according to the
              - link "simulation state" [ref=f11e221] [cursor=pointer]:
                - /url: "#simulation-state"
              - text: . Calculations for each vehicle are done separately. These calculations are divided into different
              - link "stages" [ref=f11e222] [cursor=pointer]:
                - /url: "#stages-of-the-control-loop"
              - text: . The
              - link "control loop" [ref=f11e223] [cursor=pointer]:
                - /url: "#control-loop"
              - text: makes sure that all calculations are consistent by creating
              - strong [ref=f11e224]: synchronization barriers
              - text: "between stages. No vehicle moves to the next stage before calculations are finished for all vehicles in the current stage. Each vehicle goes through the following stages:"
            - blockquote [ref=f11e225]:
              - paragraph [ref=f11e226]:
                - strong [ref=f11e227]:
                  - text: 2.1 -
                  - link "Localization Stage" [ref=f11e228] [cursor=pointer]:
                    - /url: "#stage-1-localization-stage"
                  - text: .
              - paragraph [ref=f11e229]:
                - text: Paths are created dynamically using a list of nearby waypoints collected from the
                - link "In-Memory Map" [ref=f11e230] [cursor=pointer]:
                  - /url: "#in-memory-map"
                - text: ", a simplification of the simulation map as a grid of waypoints. Directions at junctions are chosen randomly. Each vehicle's path is stored and maintained by the"
                - link "Path Buffers & Vehicle Tracking" [ref=f11e231] [cursor=pointer]:
                  - /url: "#pbvt"
                - text: (PBVT) component for easy access and modification in future stages.
              - paragraph [ref=f11e232]:
                - strong [ref=f11e233]:
                  - text: 2.2 -
                  - link "Collision Stage" [ref=f11e234] [cursor=pointer]:
                    - /url: "#stage-2-collision-stage"
                  - text: .
              - paragraph [ref=f11e235]: Bounding boxes are extended over each vehicle's path to identify and navigate potential collision hazards.
              - paragraph [ref=f11e236]:
                - strong [ref=f11e237]:
                  - text: 2.3 -
                  - link "Traffic Light Stage" [ref=f11e238] [cursor=pointer]:
                    - /url: "#stage-3-traffic-light-stage"
                  - text: .
              - paragraph [ref=f11e239]: Similar to the Collision Stage, potential hazards that affect each vehicle's path due to traffic light influence, stop signs, and junction priority are identified.
              - paragraph [ref=f11e240]:
                - strong [ref=f11e241]:
                  - text: 2.4 -
                  - link "Motion Planner Stage" [ref=f11e242] [cursor=pointer]:
                    - /url: "#stage-4-motion-planner-stage"
                  - text: .
              - paragraph [ref=f11e243]:
                - text: Vehicle movement is computed based on the defined path. A
                - link "PID controller" [ref=f11e244] [cursor=pointer]:
                  - /url: "#pid-controller"
                - text: determines how to reach the target waypoints. This is then translated into a CARLA command for application in the next step.
              - paragraph [ref=f11e245]:
                - strong [ref=f11e246]:
                  - text: 2.5 -
                  - link "Vehicle Lights Stage" [ref=f11e247] [cursor=pointer]:
                    - /url: "#stage-5-vehicle-lights-stage"
                  - text: .
              - paragraph [ref=f11e248]: The vehicle lights switch on/off dynamically based on environmental factors (e.g. sunlight and the presence of fog or rain) and vehicle behavior (e.g. turning on direction indicators if the vehicle will turn left/right at the next junction, or turn on the stop lights if braking).
            - paragraph [ref=f11e249]:
              - strong [ref=f11e250]: 3. Apply the commands in the simulation.
            - paragraph [ref=f11e251]:
              - text: Commands generated in the previous step are collected into the
              - link "command array" [ref=f11e252] [cursor=pointer]:
                - /url: "#command-array"
              - text: and sent to the CARLA server in a batch to be applied in the same frame.
            - paragraph [ref=f11e253]: The following sections will explain each component and stage in the TM logic described above in more detail.
            - heading "ALSM" [level=3] [ref=f11e254]
            - paragraph [ref=f11e255]:
              - text: ALSM stands for
              - strong [ref=f11e256]: Agent Lifecycle and State Management
              - text: . It is the first step in the TM logic cycle and provides context of the simulation's current state.
            - paragraph [ref=f11e257]: "The ALSM component:"
            - list [ref=f11e258]:
              - listitem [ref=f11e259]:
                - text: Scans the world to keep track of all vehicles and pedestrians, their positions and velocities. If physics are enabled, the velocity is retrieved by
                - link "Vehicle.get_velocity()" [ref=f11e260] [cursor=pointer]:
                  - /url: ../python_api/#carla.Vehicle
                - text: . Otherwise, the velocity is calculated using the history of position updates over time.
              - listitem [ref=f11e261]:
                - text: Stores the position, velocity, and additional information (traffic light influence, bounding boxes, etc) of every vehicle and pedestrian in the
                - link "simulation state" [ref=f11e262] [cursor=pointer]:
                  - /url: "#simulation-state"
                - text: component.
              - listitem [ref=f11e263]:
                - text: Updates the list of TM-controlled vehicles in the
                - link "vehicle registry" [ref=f11e264] [cursor=pointer]:
                  - /url: "#vehicle-registry"
                - text: .
              - listitem [ref=f11e265]:
                - text: Updates entries in the
                - link "control loop" [ref=f11e266] [cursor=pointer]:
                  - /url: "#control-loop"
                - text: and
                - link "PBVT" [ref=f11e267] [cursor=pointer]:
                  - /url: "#pbvt"
                - text: components to match the vehicle registry.
            - paragraph [ref=f11e268]:
              - strong [ref=f11e269]: "Related .cpp files:"
              - code [ref=f11e270]: ALSM.h
              - text: ","
              - code [ref=f11e271]: ALSM.cpp
              - text: .
            - heading "Vehicle registry" [level=3] [ref=f11e272]
            - paragraph [ref=f11e273]: The vehicle registry keeps track of all vehicles and pedestrians in the simulation.
            - paragraph [ref=f11e274]: "The vehicle registry:"
            - list [ref=f11e275]:
              - listitem [ref=f11e276]:
                - text: Is passed an updated list of vehicles and pedestrians from the
                - link "ALSM" [ref=f11e277] [cursor=pointer]:
                  - /url: "#alsm"
                - text: .
              - listitem [ref=f11e278]:
                - text: Stores vehicles registered to the TM in a separate array for iteration during the
                - link "control loop" [ref=f11e279] [cursor=pointer]:
                  - /url: "#control-loop"
                - text: .
            - paragraph [ref=f11e280]:
              - strong [ref=f11e281]: "Related .cpp files:"
              - code [ref=f11e282]: MotionPlannerStage.cpp
              - text: .
            - heading "Simulation state" [level=3] [ref=f11e283]
            - paragraph [ref=f11e284]: The simulation state stores information about all vehicles in the simulation for easy access and modification in later stages.
            - paragraph [ref=f11e285]: "The simulation state:"
            - list [ref=f11e286]:
              - listitem [ref=f11e287]:
                - text: Receives data from the
                - link "ALSM" [ref=f11e288] [cursor=pointer]:
                  - /url: "#alsm"
                - text: including current actor position, velocity, traffic light influence, traffic light state, etc.
              - listitem [ref=f11e289]:
                - text: Stores all information in cache, avoiding subsequent calls to the server during the
                - link "control loop" [ref=f11e290] [cursor=pointer]:
                  - /url: "#control-loop"
                - text: .
            - paragraph [ref=f11e291]:
              - strong [ref=f11e292]: "Related .cpp files:"
              - code [ref=f11e293]: SimulationState.cpp
              - text: ","
              - code [ref=f11e294]: SimulationState.h
              - text: .
            - heading "Control loop" [level=3] [ref=f11e295]
            - paragraph [ref=f11e296]:
              - text: The control loop manages the calculations of the next command for all autopilot vehicles so they are performed synchronously. The control loop consists of five different
              - link "stages" [ref=f11e297] [cursor=pointer]:
                - /url: "#stages-of-the-control-loop"
              - text: ; localization, collision, traffic light, motion planner and vehicle lights.
            - paragraph [ref=f11e298]: "The control loop:"
            - list [ref=f11e299]:
              - listitem [ref=f11e300]:
                - text: Receives an array of TM-controlled vehicles from the
                - link "vehicle registry" [ref=f11e301] [cursor=pointer]:
                  - /url: "#vehicle-registry"
                - text: .
              - listitem [ref=f11e302]: Performs calculations for each vehicle separately by looping over the array.
              - listitem [ref=f11e303]:
                - text: Divides calculations into a series of
                - link "stages" [ref=f11e304] [cursor=pointer]:
                  - /url: "#stages-of-the-control-loop"
                - text: .
              - listitem [ref=f11e305]: Creates synchronization barriers between stages to guarantee consistency. Calculations for all vehicles are finished before any of them move to the next stage, ensuring all vehicles are updated in the same frame.
              - listitem [ref=f11e306]:
                - text: Coordinates the transition between
                - link "stages" [ref=f11e307] [cursor=pointer]:
                  - /url: "#stages-of-the-control-loop"
                - text: so all calculations are done in sync.
              - listitem [ref=f11e308]:
                - text: Sends the
                - link "command array" [ref=f11e309] [cursor=pointer]:
                  - /url: "#command-array"
                - text: to the server when the last stages (
                - link "Motion Planner Stage" [ref=f11e310] [cursor=pointer]:
                  - /url: "#stage-4-motion-planner-stage"
                - text: and
                - link "Vehicle Lights Stage" [ref=f11e311] [cursor=pointer]:
                  - /url: "#stage-5-vehicle-lights-stage"
                - text: ) finishes so there are no frame delays between the command calculations and the command application.
            - paragraph [ref=f11e312]:
              - strong [ref=f11e313]: "Related .cpp files:"
              - code [ref=f11e314]: TrafficManagerLocal.cpp
              - text: .
            - heading "In-Memory Map" [level=3] [ref=f11e315]
            - paragraph [ref=f11e316]:
              - text: The In-Memory Map is a helper module contained within the
              - link "PBVT" [ref=f11e317] [cursor=pointer]:
                - /url: "#pbvt"
              - text: and is used during the
              - link "Localization Stage" [ref=f11e318] [cursor=pointer]:
                - /url: "#stage-1-localization-stage"
              - text: .
            - paragraph [ref=f11e319]: "The In-Memory Map:"
            - list [ref=f11e320]:
              - listitem [ref=f11e321]: Converts the map into a grid of discrete waypoints.
              - listitem [ref=f11e322]: Includes waypoints in a specific data structure with more information to connect waypoints and identify roads, junctions, etc.
              - listitem [ref=f11e323]: Identifies these structures with an ID used to locate vehicles in nearby areas quickly.
            - paragraph [ref=f11e324]:
              - strong [ref=f11e325]: "Related .cpp files:"
              - code [ref=f11e326]: InMemoryMap.cpp
              - text: and
              - code [ref=f11e327]: SimpleWaypoint.cpp
              - text: .
            - heading "PBVT" [level=3] [ref=f11e328]
            - paragraph [ref=f11e329]:
              - text: PBVT stands for
              - strong [ref=f11e330]: Path Buffer and Vehicle Tracking
              - text: . The PBVT is a data structure that contains the expected path for every vehicle and allows easy access to data during the
              - link "control loop" [ref=f11e331] [cursor=pointer]:
                - /url: "#control-loop"
              - text: .
            - paragraph [ref=f11e332]: "The PBVT:"
            - list [ref=f11e333]:
              - listitem [ref=f11e334]: Contains a map of deque objects with one entry per vehicle.
              - listitem [ref=f11e335]: Contains a set of waypoints for each vehicle describing its current location and near-future path.
              - listitem [ref=f11e336]:
                - text: Contains the
                - link "In-Memory Map" [ref=f11e337] [cursor=pointer]:
                  - /url: "#in-memory-map"
                - text: used by the
                - link "Localization Stage" [ref=f11e338] [cursor=pointer]:
                  - /url: "#stage-1-localization-stage"
                - text: to relate every vehicle to the nearest waypoint and possible overlapping paths.
            - heading "PID controller" [level=3] [ref=f11e339]
            - paragraph [ref=f11e340]:
              - text: The PID controller is a helper module that performs calculations during the
              - link "Motion Planner Stage" [ref=f11e341] [cursor=pointer]:
                - /url: "#stage-4-motion-planner-stage"
              - text: .
            - paragraph [ref=f11e342]: "The PID controller:"
            - list [ref=f11e343]:
              - listitem [ref=f11e344]:
                - text: Estimates the throttle, brake, and steering input needed to reach a target value using the information gathered by the
                - link "Motion Planner Stage" [ref=f11e345] [cursor=pointer]:
                  - /url: "#stage-4-motion-planner-stage"
                - text: .
              - listitem [ref=f11e346]:
                - text: Makes adjustments depending on the specific parameterization of the controller. Parameters can be modified if desired. Read more about
                - link "PID controllers" [ref=f11e347] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PID_controller
                - text: to learn how to make modifications.
            - paragraph [ref=f11e348]:
              - strong [ref=f11e349]: "Related .cpp files:"
              - code [ref=f11e350]: PIDController.cpp
              - text: .
            - heading "Command Array" [level=3] [ref=f11e351]
            - paragraph [ref=f11e352]: The Command Array represents the last step in the TM logic cycle. It receives commands for all the registered vehicles and applies them.
            - paragraph [ref=f11e353]: "The Command Array:"
            - list [ref=f11e354]:
              - listitem [ref=f11e355]:
                - text: Receives a series of
                - link "carla.VehicleControl" [ref=f11e356] [cursor=pointer]:
                  - /url: ../python_api/#carla.VehicleControl
                - text: "'s from the"
                - link "Motion Planner Stage" [ref=f11e357] [cursor=pointer]:
                  - /url: "#stage-4-motion-planner-stage"
                - text: .
              - listitem [ref=f11e358]: Batches all commands to be applied during the same frame.
              - listitem [ref=f11e359]:
                - text: Sends the batch to the CARLA server calling either
                - strong [ref=f11e360]: apply_batch()
                - text: or
                - strong [ref=f11e361]: apply_batch_synch()
                - text: in
                - link "carla.Client" [ref=f11e362] [cursor=pointer]:
                  - /url: ../python_api/#carla.Client
                - text: depending on whether the simulation is running in asynchronous or synchronous mode, respectively.
            - paragraph [ref=f11e363]:
              - strong [ref=f11e364]: "Related .cpp files:"
              - code [ref=f11e365]: TrafficManagerLocal.cpp
              - text: .
            - heading "Stages of the Control Loop" [level=3] [ref=f11e366]
            - heading "Stage 1- Localization Stage" [level=5] [ref=f11e367]
            - paragraph [ref=f11e368]: The Localization Stage defines a near-future path for vehicles controlled by the TM.
            - paragraph [ref=f11e369]: "The Localization Stage:"
            - list [ref=f11e370]:
              - listitem [ref=f11e371]:
                - text: Obtains the position and velocity of all vehicles from the
                - link "simulation state" [ref=f11e372] [cursor=pointer]:
                  - /url: "#simulation-state"
                - text: .
              - listitem [ref=f11e373]:
                - text: Uses the
                - link "In-Memory Map" [ref=f11e374] [cursor=pointer]:
                  - /url: "#in-memory-map"
                - text: to relate every vehicle with a list of waypoints that describes its current location and near-future path according to its trajectory. The faster the vehicle goes, the longer the list will be.
              - listitem [ref=f11e375]: Updates the path according to planning decisions such as lane changes, speed limit, distance to leading vehicle parameterization, etc.
              - listitem [ref=f11e376]:
                - text: Stores the path for all vehicles in the
                - link "PBVT" [ref=f11e377] [cursor=pointer]:
                  - /url: "#pbvt"
                - text: module.
              - listitem [ref=f11e378]: Compares paths with each other to estimate possible collision situations. Results are passed to the Collision Stage.
            - paragraph [ref=f11e379]:
              - strong [ref=f11e380]: "Related .cpp files:"
              - code [ref=f11e381]: LocalizationStage.cpp
              - text: and
              - code [ref=f11e382]: LocalizationUtils.cpp
              - text: .
            - heading "Stage 2- Collision Stage" [level=5] [ref=f11e383]
            - paragraph [ref=f11e384]: The Collision Stage triggers collision hazards.
            - paragraph [ref=f11e385]: "The Collision Stage:"
            - list [ref=f11e386]:
              - listitem [ref=f11e387]:
                - text: Receives from the
                - link "Localization Stage" [ref=f11e388] [cursor=pointer]:
                  - /url: "#stage-1-localization-stage"
                - text: a list of vehicle pairs whose paths could potentially overlap.
              - listitem [ref=f11e389]: Extends bounding boxes along the path ahead (geodesic boundaries) for each vehicle pair to check if they actually overlap and determine whether the risk of collision is real.
              - listitem [ref=f11e390]:
                - text: Sends hazards for all possible collisions to the
                - link "Motion Planner Stage" [ref=f11e391] [cursor=pointer]:
                  - /url: "#stage-4-motion-planner-stage"
                - text: to modify the path accordingly.
            - paragraph [ref=f11e392]:
              - strong [ref=f11e393]: "Related .cpp files:"
              - code [ref=f11e394]: CollisionStage.cpp
              - text: .
            - heading "Stage 3- Traffic Light Stage" [level=5] [ref=f11e395]
            - paragraph [ref=f11e396]: The Traffic Light stage triggers hazards due to traffic regulators such as traffic lights, stop signs, and priority at junctions.
            - paragraph [ref=f11e397]: "The Traffic Light stage:"
            - list [ref=f11e398]:
              - listitem [ref=f11e399]: Sets a traffic hazard if a vehicle is under the influence of a yellow or red traffic light or a stop sign.
              - listitem [ref=f11e400]: Extends a bounding box along a vehicle's path if it is in an unsignaled junction. Vehicles with overlapping paths follow a "First-In-First-Out" order to move. Wait times are set to a fixed value.
            - paragraph [ref=f11e401]:
              - strong [ref=f11e402]: "Related .cpp files:"
              - code [ref=f11e403]: TrafficLightStage.cpp
              - text: .
            - heading "Stage 4- Motion Planner Stage" [level=5] [ref=f11e404]
            - paragraph [ref=f11e405]: The Motion Planner Stage generates the CARLA commands to be applied to vehicles.
            - paragraph [ref=f11e406]: "The Motion Planner Stage:"
            - list [ref=f11e407]:
              - listitem [ref=f11e408]:
                - text: Gathers a vehicle's position and velocity (
                - link "simulation state" [ref=f11e409] [cursor=pointer]:
                  - /url: "#simulation-state"
                - text: ), path (
                - link "PBVT" [ref=f11e410] [cursor=pointer]:
                  - /url: "#pbvt"
                - text: ), and hazards (
                - link "Collision Stage" [ref=f11e411] [cursor=pointer]:
                  - /url: "#stage-2-collision-stage"
                - text: and
                - link "Traffic Light Stage" [ref=f11e412] [cursor=pointer]:
                  - /url: "#stage-3-traffic-light-stage"
                - text: ).
              - listitem [ref=f11e413]:
                - text: Makes high-level decisions about how a vehicle should move, for example, computing the brake needed to prevent a collision hazard. A
                - link "PID controller" [ref=f11e414] [cursor=pointer]:
                  - /url: "#pid-controller"
                - text: is used to estimate behaviors according to target values.
              - listitem [ref=f11e415]:
                - text: Translates the desired movement to a
                - link "carla.VehicleControl" [ref=f11e416] [cursor=pointer]:
                  - /url: ../python_api/#carla.VehicleControl
                - text: for application to the vehicle.
              - listitem [ref=f11e417]:
                - text: Sends the resulting CARLA commands to the
                - link "Command Array" [ref=f11e418] [cursor=pointer]:
                  - /url: "#command-array"
                - text: .
            - paragraph [ref=f11e419]:
              - strong [ref=f11e420]: "Related .cpp files:"
              - code [ref=f11e421]: MotionPlannerStage.cpp
              - text: .
            - heading "Stage 5- Vehicle Lights Stage" [level=5] [ref=f11e422]
            - paragraph [ref=f11e423]: The Vehicle Lights Stage activates the lights based on the condition of the vehicle and the surrounding environment.
            - paragraph [ref=f11e424]: "The Vehicle Lights Stage:"
            - list [ref=f11e425]:
              - listitem [ref=f11e426]:
                - paragraph [ref=f11e427]: Retrieves the planned waypoints for the vehicle, information about vehicle lights (eg. light state and the planned command to be applied) and the weather conditions.
              - listitem [ref=f11e428]:
                - paragraph [ref=f11e429]: "Determines the new state of the vehicle lights:"
                - list [ref=f11e430]:
                  - listitem [ref=f11e431]: Turns on the blinkers if the vehicle is planning to turn left/right at the next junction.
                  - listitem [ref=f11e432]: Turns on the stop lights if the applied command is asking the vehicle to brake.
                  - listitem [ref=f11e433]: Turns on the low beams and the position lights from sunset to dawn, or under heavy rain.
                  - listitem [ref=f11e434]: Turns on the fog lights under heavy fog conditions.
              - listitem [ref=f11e435]:
                - paragraph [ref=f11e436]: Update the vehicle lights state if it has changed.
            - paragraph [ref=f11e437]:
              - strong [ref=f11e438]: "Related .cpp files:"
              - code [ref=f11e439]: VehicleLightStage.cpp
              - text: .
            - separator [ref=f11e440]
            - heading "Using the Traffic Manager" [level=2] [ref=f11e441]
            - heading "Vehicle behavior considerations" [level=3] [ref=f11e442]
            - paragraph [ref=f11e443]: "The TM implements general behavior patterns that must be taken into consideration when you set vehicles to autopilot:"
            - list [ref=f11e444]:
              - listitem [ref=f11e445]:
                - strong [ref=f11e446]: Vehicles are not goal-oriented,
                - text: they follow a dynamically produced trajectory and choose a path randomly when approaching a junction. Their path is endless.
              - listitem [ref=f11e447]:
                - strong [ref=f11e448]: Vehicles' target speed is 70% of their current speed limit
                - text: unless any other value is set.
              - listitem [ref=f11e449]:
                - strong [ref=f11e450]: Junction priority does not follow traffic regulations.
                - text: The TM uses its own priority system at junctions. The resolution of this restriction is a work in progress. In the meantime, some issues may arise, for example, vehicles inside a roundabout yielding to a vehicle trying to get in.
            - paragraph [ref=f11e451]:
              - text: TM behavior can be adjusted through the Python API. For specific methods, see the TM section of the Python API
              - link "documentation" [ref=f11e452] [cursor=pointer]:
                - /url: ../python_api/#carla.TrafficManager
              - text: ". Below is a general summary of what is possible through the API:"
            - table [ref=f11e454]:
              - rowgroup [ref=f11e455]:
                - row [ref=f11e456]:
                  - columnheader "Topic" [ref=f11e457]
                  - columnheader "Description" [ref=f11e458]
              - rowgroup [ref=f11e459]:
                - row [ref=f11e460]:
                  - cell [ref=f11e461]:
                    - strong [ref=f11e462]: "General:"
                  - cell "- Create a TM instance connected to a port. - Retrieve the port where a TM is connected." [ref=f11e463]
                - row [ref=f11e464]:
                  - cell [ref=f11e465]:
                    - strong [ref=f11e466]: "Safety conditions:"
                  - cell "- Set a minimum distance between stopped vehicles (for a single vehicle or for all vehicles). This will affect the minimum moving distance. - Set the desired speed as a percentage of the current speed limit (for a single vehicle or for all vehicles). - Reset traffic lights." [ref=f11e467]
                - row [ref=f11e468]:
                  - cell [ref=f11e469]:
                    - strong [ref=f11e470]: "Collision managing:"
                  - cell "- Enable/Disable collisions between a vehicle and a specific actor. - Make a vehicle ignore all other vehicles. - Make a vehicle ignore all walkers. - Make a vehicle ignore all traffic lights." [ref=f11e471]
                - row [ref=f11e472]:
                  - cell [ref=f11e473]:
                    - strong [ref=f11e474]: "Lane changes:"
                  - cell "- Force a lane change, ignoring possible collisions. - Enable/Disable lane changes for a vehicle." [ref=f11e475]
                - row [ref=f11e476]:
                  - cell [ref=f11e477]:
                    - strong [ref=f11e478]: "Hybrid physics mode:"
                  - cell "- Enable/Disable hybrid physics mode. - Change the radius in which physics is enabled." [ref=f11e479]
            - heading "Creating a Traffic Manager" [level=3] [ref=f11e480]
            - generic [ref=f11e481]:
              - paragraph [ref=f11e482]:  Note
              - paragraph [ref=f11e483]:
                - text: TM is designed to work in synchronous mode. Using TM in asynchronous mode can lead to unexpected and undesirable results. Read more in the section
                - link [ref=f11e484] [cursor=pointer]:
                  - /url: "#synchronous-mode"
                  - strong [ref=f11e485]: Synchronous mode
                - text: .
            - paragraph [ref=f11e486]:
              - text: A TM instance is created by a
              - link [ref=f11e487] [cursor=pointer]:
                - /url: ../python_api/#carla.Client
                - code [ref=f11e488]: carla.Client
              - text: ", passing the port to be used. The default port is"
              - code [ref=f11e489]: "8000"
              - text: .
            - paragraph [ref=f11e490]: "To create a TM instance:"
            - code [ref=f11e492]: tm = client.get_trafficmanager(port)
            - paragraph [ref=f11e493]:
              - text: To enable autopilot for a set of vehicles, retrieve the port of the TM instance and set
              - code [ref=f11e494]: set_autopilot
              - text: to
              - code [ref=f11e495]: "True"
              - text: ", passing the TM port at the same time. If no port is provided, it will try to connect to a TM in the default port ("
              - code [ref=f11e496]: "8000"
              - text: "). If the TM does not exist, it will create one:"
            - code [ref=f11e498]: "tm_port = tm.get_port() for v in vehicles_list: v.set_autopilot(True,tm_port)"
            - generic [ref=f11e499]:
              - paragraph [ref=f11e500]:  Note
              - paragraph [ref=f11e501]:
                - text: Creating or connecting to a TM in multi-client situations is different from the above example. Learn more in the section
                - link [ref=f11e502] [cursor=pointer]:
                  - /url: "#running-multiple-traffic-managers"
                  - strong [ref=f11e503]: Running multiple Traffic Managers
                - text: .
            - paragraph [ref=f11e504]:
              - text: The
              - code [ref=f11e505]: generate_traffic.py
              - text: script in
              - code [ref=f11e506]: /PythonAPI/examples
              - text: provides an example of how to create a TM instance using a port passed as a script argument and register every vehicle spawned to it by setting the autopilot to
              - code [ref=f11e507]: "True"
              - text: "in a batch:"
            - code [ref=f11e509]: traffic_manager = client.get_trafficmanager(args.tm-port) tm_port = traffic_manager.get_port() ... batch.append(SpawnActor(blueprint, transform).then(SetAutopilot(FutureActor, True,tm_port))) ... traffic_manager.global_percentage_speed_difference(30.0)
            - heading "Configuring autopilot behavior" [level=3] [ref=f11e510]
            - paragraph [ref=f11e511]: "The following example creates a TM instance and configures dangerous behavior for a specific vehicle so it will ignore all traffic lights, leave no safety distance from other vehicles, and drive 20% faster than the current speed limit:"
            - code [ref=f11e513]: "tm = client.get_trafficmanager(port) tm_port = tm.get_port() for v in my_vehicles: v.set_autopilot(True,tm_port) danger_car = my_vehicles[0] tm.ignore_lights_percentage(danger_car,100) tm.distance_to_leading_vehicle(danger_car,0) tm.vehicle_percentage_speed_difference(danger_car,-20)"
            - paragraph [ref=f11e514]: "The example below sets the same list of vehicles to autopilot but instead configures them with moderate driving behavior. The vehicles drive 80% slower than the current speed limit, leaving at least 5 meters between themselves and other vehicles, and never perform lane changes:"
            - code [ref=f11e516]: "tm = client.get_trafficmanager(port) tm_port = tm.get_port() for v in my_vehicles: v.set_autopilot(True,tm_port) danger_car = my_vehicles[0] tm.global_distance_to_leading_vehicle(5) tm.global_percentage_speed_difference(80) for v in my_vehicles: tm.auto_lane_change(v,False)"
            - heading "Delegating the Traffic Manager to automatically update vehicle lights" [level=4] [ref=f11e517]
            - paragraph [ref=f11e518]: "By default, vehicle lights (brake, turn indicators, etc...) of the vehicles managed by the TM are never updated. It is possible to delegate the TM to update the vehicle lights of a given vehicle actor:"
            - code [ref=f11e520]: "tm = client.get_trafficmanager(port) for actor in my_vehicles: tm.update_vehicle_lights(actor, True)"
            - paragraph [ref=f11e521]: Vehicle lights management has to be specified on a per-vehicle basis, and there could be at any given time both vehicles with and without the automatic light management.
            - heading "Stopping a Traffic Manager" [level=3] [ref=f11e522]
            - paragraph [ref=f11e523]:
              - text: The TM is not an actor that needs to be destroyed; it will stop when the client that created it stops. This is automatically managed by the API, the user does not have to do anything. However, when shutting down a TM, the user must destroy the vehicles controlled by it, otherwise they will remain immobile on the map. The script
              - code [ref=f11e524]: generate_traffic.py
              - text: "does this automatically:"
            - code [ref=f11e526]: client.apply_batch([carla.command.DestroyActor(x) for x in vehicles_list])
            - generic [ref=f11e527]:
              - paragraph [ref=f11e528]:  Warning
              - paragraph [ref=f11e529]:
                - text: Shutting down a
                - strong [ref=f11e530]: TM-Server
                - text: will shut down the
                - strong [ref=f11e531]: TM-Clients
                - text: connecting to it. To learn the difference between a
                - strong [ref=f11e532]: TM-Server
                - text: and a
                - strong [ref=f11e533]: TM-Client
                - text: ", read about"
                - link [ref=f11e534] [cursor=pointer]:
                  - /url: "#running-multiple-traffic-managers"
                  - strong [ref=f11e535]: Running multiple Traffic Managers
                - text: .
            - separator [ref=f11e536]
            - heading "Deterministic mode" [level=2] [ref=f11e537]
            - paragraph [ref=f11e538]: In deterministic mode, the TM will produce the same results and behaviors under the same conditions. Do not mistake determinism with the recorder. While the recorder allows you to store the log of a simulation to play it back, determinism ensures that the TM will always have the same output over different executions of a script as long as the same conditions are maintained.
            - paragraph [ref=f11e539]:
              - text: Deterministic mode is available
              - strong [ref=f11e540]: in synchronous mode only
              - text: . In asynchronous mode, there is less control over the simulation and determinism cannot be achieved. Read more in the section
              - link [ref=f11e541] [cursor=pointer]:
                - /url: "#synchronous-mode"
                - strong [ref=f11e542]: "\"Synchronous mode\""
              - text: before starting.
            - paragraph [ref=f11e543]: "To enable deterministic mode, use the following method:"
            - code [ref=f11e545]: my_tm.set_random_device_seed(seed_value)
            - paragraph [ref=f11e546]:
              - code [ref=f11e547]: seed_value
              - text: is an
              - code [ref=f11e548]: int
              - text: number from which random numbers will be generated. The value itself is not relevant, but the same value will always result in the same output. Two simulations, with the same conditions, that use the same seed value, will be deterministic.
            - paragraph [ref=f11e549]:
              - text: To maintain determinism over multiple simulation runs,
              - strong [ref=f11e550]: the seed must be set for every simulation
              - text: . For example, each time the world is
              - link "reloaded" [ref=f11e551] [cursor=pointer]:
                - /url: ../python_api/#carla.Client.reload_world
              - text: ", the seed must be set again:"
            - code [ref=f11e553]: client.reload_world() my_tm.set_random_device_seed(seed_value)
            - paragraph [ref=f11e554]:
              - text: Deterministic mode can be tested in the
              - code [ref=f11e555]: generate_traffic.py
              - text: example script by passing a seed value as an argument. The following example populates a map with 50 autopilot actors in synchronous mode and sets the seed to an arbitrary value of
              - code [ref=f11e556]: "9"
              - text: ":"
            - code [ref=f11e558]: cd PythonAPI/examples python3 generate_traffic.py -n 50 --seed 9
            - generic [ref=f11e559]:
              - paragraph [ref=f11e560]:  Warning
              - paragraph [ref=f11e561]:
                - text: The CARLA server and the TM must be in synchronous mode before enabling deterministic mode. Read more
                - link "here" [ref=f11e562] [cursor=pointer]:
                  - /url: "#synchronous-mode"
                - text: about synchronous mode in TM.
            - separator [ref=f11e563]
            - heading "Hybrid physics mode" [level=2] [ref=f11e564]
            - paragraph [ref=f11e565]:
              - text: Hybrid mode allows users to disable most physics calculations for all autopilot vehicles, or for autopilot vehicles outside of a certain radius of a vehicle tagged with
              - code [ref=f11e566]: hero
              - text: . This removes the vehicle physics bottleneck from a simulation. Vehicles whose physics are disabled will move by teleportation. Basic calculations for linear acceleration are maintained to ensure position updates and vehicle speed remain realistic and the toggling of physics calculations on vehicles is fluid.
            - paragraph [ref=f11e567]:
              - text: Hybrid mode uses the
              - link [ref=f11e568] [cursor=pointer]:
                - /url: https://carla.readthedocs.io/en/latest/python_api/#carla.Actor.set_simulate_physics
                - code [ref=f11e569]: Actor.set_simulate_physics()
              - text: "method to toggle physics calculations. It is disabled by default. There are two options to enable it:"
            - list [ref=f11e570]:
              - listitem [ref=f11e571]:
                - link [ref=f11e572] [cursor=pointer]:
                  - /url: https://carla.readthedocs.io/en/latest/python_api/#carla.TrafficManager.set_hybrid_physics_mode
                  - strong [ref=f11e573]:
                    - code [ref=f11e574]: TrafficManager.set_hybrid_physics_mode(True)
                - text: — This method enables hybrid mode for the TM object calling it.
              - listitem [ref=f11e575]:
                - strong [ref=f11e576]:
                  - text: Running
                  - code [ref=f11e577]: generate_traffic.py
                  - text: with the flag
                  - code [ref=f11e578]: "--hybrid"
                - text: — This example script creates a TM and spawns vehicles in autopilot. It then sets these vehicles to hybrid mode when the
                - code [ref=f11e579]: "--hybrid"
                - text: flag is passed as a script argument.
            - paragraph [ref=f11e580]: "To modify the behavior of hybrid mode, use the following two parameters:"
            - list [ref=f11e581]:
              - listitem [ref=f11e582]:
                - strong [ref=f11e583]: Radius
                - emphasis [ref=f11e584]: (default = 50 meters)
                - text: — The radius is relative to vehicles tagged with
                - code [ref=f11e585]: hero
                - text: . All vehicles inside this radius will have physics enabled; vehicles outside of the radius will have physics disabled. The size of the radius is modified using
                - link [ref=f11e586] [cursor=pointer]:
                  - /url: ../python_api/#carla.TrafficManager.set_hybrid_physics_radius
                  - code [ref=f11e587]: traffic_manager.set_hybrid_physics_radius(r)
                - text: .
              - listitem [ref=f11e588]:
                - strong [ref=f11e589]: Hero vehicle
                - text: — A vehicle tagged with
                - code [ref=f11e590]: role_name='hero'
                - text: that acts as the center of the radius.
                - list [ref=f11e591]:
                  - listitem [ref=f11e592]:
                    - strong [ref=f11e593]: If there is no hero vehicle,
                    - text: all vehicles' physics will be disabled.
                  - listitem [ref=f11e594]:
                    - strong [ref=f11e595]: If there is more than one hero vehicle,
                    - text: the radius will be considered for them all, creating different areas of influence with physics enabled.
            - paragraph [ref=f11e596]:
              - text: The clip below shows how physics is enabled and disabled when hybrid mode is active. The
              - strong [ref=f11e597]: hero vehicle
              - text: is tagged with a
              - strong [ref=f11e598]: red square
              - text: . Vehicles with
              - strong [ref=f11e599]: physics disabled
              - text: are tagged with a
              - strong [ref=f11e600]: blue square
              - text: . When inside the hero vehicle's radius of influence,
              - strong [ref=f11e601]: physics are enabled and the tag becomes green
              - text: .
            - paragraph [ref=f11e602]:
              - img "Welcome to CARLA" [ref=f11e603]
            - separator [ref=f11e604]
            - heading "Running multiple Traffic Managers" [level=2] [ref=f11e605]
            - heading "Traffic Manager servers and clients" [level=3] [ref=f11e606]
            - paragraph [ref=f11e607]:
              - text: A CARLA client creates a TM by specifying to the server which port to use. If a port is not specified, the default
              - code [ref=f11e608]: "8000"
              - text: will be used. If further TMs are created on the same port, they will become
              - strong [ref=f11e609]: TM-Clients
              - text: and the original TM will become a
              - strong [ref=f11e610]: TM-Server
              - text: . These titles define how a TM behaves within a simulation.
            - heading "TM-Server" [level=6] [ref=f11e611]
            - paragraph [ref=f11e612]:
              - text: A TM-Server is created if it was the first TM to connect to a free port and then other TMs (TM-Clients) connected to the same port it was running on.
              - strong [ref=f11e613]: The TM-Server will dictate the behavior of all the TM-Clients
              - text: ", e.g., if the TM-Server is stopped, all TM-Clients will stop."
            - paragraph [ref=f11e614]: "The following code creates two TM-Servers. Each one connects to a different, unused port:"
            - code [ref=f11e616]: "tm01 = client01.get_trafficmanager() # tm01 --> tm01 (p=8000)"
            - code [ref=f11e618]: "tm02 = client02.get_trafficmanager(5000) # tm02(p=5000) --> tm02 (p=5000)"
            - heading "TM-Client" [level=6] [ref=f11e619]
            - paragraph [ref=f11e620]: A TM-Client is created when a TM connects to a port occupied by another TM (TM-Server). The TM-Client behavior will be dictated by the TM-Server.
            - paragraph [ref=f11e621]: The following code creates two TM-Clients, each one connecting with the TM-Servers created in the section above.
            - code [ref=f11e623]: "tm03 = client03.get_trafficmanager() # tm03 --> tm01 (p=8000)."
            - code [ref=f11e625]: "tm04 = client04.get_trafficmanager(5000) # tm04(p=5000) --> tm02 (p=5000)"
            - paragraph [ref=f11e626]:
              - text: The CARLA server keeps a register of all TM instances by storing the port and the client IP (hidden to the user) that link to them. There is currently no way to check the TM instances that have been created so far. A connection will always be attempted when trying to create an instance and it will either create a new
              - strong [ref=f11e627]: TM-Server
              - text: or a
              - strong [ref=f11e628]: TM-Client
              - text: .
            - heading "Multi-client simulations" [level=3] [ref=f11e629]
            - paragraph [ref=f11e630]: "In a multi-client simulation, multiple TMs are created on the same port. The first TM will be a TM-Server and the rest will be TM-Clients connecting to it. The TM-Server will dictate the behavior of all the TM instances:"
            - code [ref=f11e632]: "terminal 1: ./CarlaUE4.sh -carla-rpc-port=4000 terminal 2: python3 generate_traffic.py --port 4000 --tm-port 4050 # TM-Server terminal 3: python3 generate_traffic.py --port 4000 --tm-port 4050 # TM-Client"
            - heading "Multi-TM simulations" [level=3] [ref=f11e633]
            - paragraph [ref=f11e634]: "In a multi-TM simulation, multiple TM instances are created on distinct ports. Each TM instance will control its own behavior:"
            - code [ref=f11e636]: "terminal 1: ./CarlaUE4.sh -carla-rpc-port=4000 terminal 2: python3 generate_traffic.py --port 4000 --tm-port 4050 # TM-Server A terminal 3: python3 generate_traffic.py --port 4000 --tm-port 4550 # TM-Server B"
            - heading "Multi-simulation" [level=3] [ref=f11e637]
            - paragraph [ref=f11e638]: "Multi-simulation is when more than one CARLA server is running at the same time. The TM needs to connect to the relevant CARLA server port. As long as the computational power allows for it, the TM can run multiple simulations at a time without any problems:"
            - code [ref=f11e640]: "terminal 1: ./CarlaUE4.sh -carla-rpc-port=4000 # simulation A terminal 2: ./CarlaUE4.sh -carla-rpc-port=5000 # simulation B terminal 3: python3 generate_traffic.py --port 4000 --tm-port 4050 # TM-Server A connected to simulation A terminal 4: python3 generate_traffic.py --port 5000 --tm-port 5050 # TM-Server B connected to simulation B"
            - paragraph [ref=f11e641]: The concept of multi-simulation is independent of the TM itself. The example above runs two CARLA simulations in parallel, A and B. In each of them, a TM-Server is created independently from the other. Simulation A could run a multi-client TM while simulation B is running a multi-TM or no TM at all.
            - paragraph [ref=f11e642]: The most likely issue arising from the above set-up is a client trying to connect to an already existing TM that is not running on the selected simulation. If this happens, an error message will appear and the connection will be aborted to prevent interferences between simulations.
            - separator [ref=f11e643]
            - heading "Synchronous mode" [level=2] [ref=f11e644]
            - paragraph [ref=f11e645]:
              - text: TM is designed to work in synchronous mode. Both the CARLA server and TM should be set to synchronous in order to function properly.
              - strong [ref=f11e646]: Using TM in asynchronous mode can lead to unexpected and undesirable results,
              - text: however, if asynchronous mode is required, the simulation should run at 20-30 fps at least.
            - paragraph [ref=f11e647]: "The script below demonstrates how to set both the server and TM to synchronous mode:"
            - code [ref=f11e649]: "... # Set the simulation to sync mode init_settings = world.get_settings() settings = world.get_settings() settings.synchronous_mode = True # After that, set the TM to sync mode my_tm.set_synchronous_mode(True) ... # Tick the world in the same client world.apply_settings(init_settings) world.tick() ... # Always disable sync mode before the script ends to prevent the server blocking whilst waiting for a tick settings.synchronous_mode = False my_tm.set_synchronous_mode(False)"
            - paragraph [ref=f11e650]:
              - text: The
              - code [ref=f11e651]: generate_traffic.py
              - text: "example script starts a TM and populates the map with vehicles and pedestrians. It automatically sets the TM and the CARLA server to synchronous mode:"
            - code [ref=f11e653]: cd PythonAPI/examples python3 generate_traffic.py -n 50
            - paragraph [ref=f11e654]:
              - text: If asynchronous mode is required, use the
              - code [ref=f11e655]: "--async"
              - text: flag when running the above command.
            - paragraph [ref=f11e656]: "If more than one TM is set to synchronous mode, synchrony will fail. Follow these guidelines to avoid issues:"
            - list [ref=f11e657]:
              - listitem [ref=f11e658]:
                - text: In a
                - strong [ref=f11e659]:
                  - link "multiclient" [ref=f11e660] [cursor=pointer]:
                    - /url: "#multiclient"
                - text: situation, only the
                - strong [ref=f11e661]: TM-Server
                - text: should be set to synchronous mode.
              - listitem [ref=f11e662]:
                - text: In a
                - strong [ref=f11e663]:
                  - link "multiTM" [ref=f11e664] [cursor=pointer]:
                    - /url: "#multitm"
                - text: situation, only
                - strong [ref=f11e665]: one TM-Server
                - text: should be set to synchronous mode.
              - listitem [ref=f11e666]:
                - text: The
                - strong [ref=f11e667]:
                  - link "ScenarioRunner module" [ref=f11e668] [cursor=pointer]:
                    - /url: https://carla-scenariorunner.readthedocs.io/en/latest/
                - text: runs a TM automatically. The TM inside ScenarioRunner will automatically be the one set to sync mode.
            - generic [ref=f11e669]:
              - paragraph [ref=f11e670]:  Warning
              - paragraph [ref=f11e671]: Disable synchronous mode (for both the world and TM) in your script managing ticks before it finishes to prevent the server blocking, waiting forever for a tick.
            - separator [ref=f11e672]
            - heading "Traffic manager in large maps" [level=2] [ref=f11e673]
            - paragraph [ref=f11e674]:
              - text: To understand how the TM works on large maps, make sure to first familiarise yourself with how large maps work by reading the documentation
              - link "here" [ref=f11e675] [cursor=pointer]:
                - /url: ../large_map_overview/
              - text: .
            - paragraph [ref=f11e676]: "The behavior of autopilot vehicles in large maps depends on whether or not there is a hero vehicle present:"
            - paragraph [ref=f11e677]:
              - strong [ref=f11e678]: Hero vehicle not present
            - paragraph [ref=f11e679]: All autopilot vehicles will be considered dormant actors. The dormant autopilot actors will be moved around the map as in hybrid mode. The vehicles will not be rendered since there is no hero vehicle to trigger map tile streaming.
            - paragraph [ref=f11e680]:
              - strong [ref=f11e681]: Hero vehicle present
            - paragraph [ref=f11e682]:
              - text: Autopilot vehicles will become dormant when they exceed the value defined by
              - code [ref=f11e683]: actor_active_distance
              - text: ". To set this value, use the Python API:"
            - code [ref=f11e685]: "settings = world.get_settings() # Actors will become dormant 2km away from the ego vehicle settings.actor_active_distance = 2000 world.apply_settings(settings)"
            - paragraph [ref=f11e686]:
              - text: In the TM, dormant actors can be configured to continually respawn around the hero vehicle instead of remaining dormant on other parts of the map. This option can be configured using the
              - code [ref=f11e687]: set_respawn_dormant_vehicles
              - text: method in the Python API. Vehicles will be respawned within a user-definable distance of the hero vehicle. The upper and lower boundaries of the respawnable distance can be set using the
              - code [ref=f11e688]: set_boundaries_respawn_dormant_vehicles
              - text: method. Note that the upper distance will not be bigger than the tile streaming distance of the large map and the minimum lower distance is 20m.
            - paragraph [ref=f11e689]: "To enable respawning of dormant vehicles within 25 and 700 meters of the hero vehicle:"
            - code [ref=f11e691]: my_tm.set_respawn_dormant_vehicles(True) my_tm.set_boundaries_respawn_dormant_vehicles(25,700)
            - paragraph [ref=f11e692]: If collisions prevent a dormant actor from being respawned, the TM will retry on the next simulation step.
            - paragraph [ref=f11e693]: If dormant vehicles are not respawned, their behavior will depend on whether hybrid mode is enabled. If hybrid mode has been enabled, then the dormant actors will be teleported around the map. If hybrid mode is not enabled, then dormant actor's physics will not be computed and they will stay in place until they are no longer dormant.
            - separator [ref=f11e694]
            - paragraph [ref=f11e695]:
              - text: If you have any questions about the TM, then you can ask in the
              - link "forum" [ref=f11e696] [cursor=pointer]:
                - /url: https://github.com/carla-simulator/carla/discussions
              - text: .
            - paragraph [ref=f11e698]:
              - link "CARLA forum" [ref=f11e699] [cursor=pointer]:
                - /url: https://github.com/carla-simulator/carla/discussions
