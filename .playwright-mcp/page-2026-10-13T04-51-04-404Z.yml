            - heading "carla.LidarDetection" [level=2] [ref=f32e4028]
            - paragraph [ref=f32e4029]:
              - text: Data contained inside a
              - link "carla.LidarMeasurement" [ref=f32e4030] [cursor=pointer]:
                - /url: "#carla.LidarMeasurement"
              - text: . Each of these represents one of the points in the cloud with its location and its associated intensity.
            - heading "Instance Variables" [level=3] [ref=f32e4031]
            - list [ref=f32e4032]:
              - listitem [ref=f32e4033]:
                - strong [ref=f32e4034]: point
                - text: (
                - emphasis [ref=f32e4035]:
                  - link "carla.Location" [ref=f32e4036] [cursor=pointer]:
                    - /url: "#carla.Location"
                  - text: "- meters"
                - text: ) Point in xyz coordinates.
              - listitem [ref=f32e4037]:
                - strong [ref=f32e4038]: intensity
                - text: (
                - emphasis [ref=f32e4039]: float
                - text: ) Computed intensity for this point as a scalar value between [0.0 , 1.0].
