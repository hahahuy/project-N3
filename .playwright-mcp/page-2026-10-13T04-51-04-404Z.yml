            - heading "carla.Actor" [level=2] [ref=f32e604]
            - paragraph [ref=f32e605]:
              - text: "CARLA defines actors as anything that plays a role in the simulation or can be moved around. That includes: pedestrians, vehicles, sensors and traffic signs (considering traffic lights as part of these). Actors are spawned in the simulation by"
              - link "carla.World" [ref=f32e606] [cursor=pointer]:
                - /url: "#carla.World"
              - text: and they need for a
              - link "carla.ActorBlueprint" [ref=f32e607] [cursor=pointer]:
                - /url: "#carla.ActorBlueprint"
              - text: to be created. These blueprints belong into a library provided by CARLA, find more about them
              - link "here" [ref=f32e608] [cursor=pointer]:
                - /url: ../bp_library/
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e609]
            - list [ref=f32e610]:
              - listitem [ref=f32e611]:
                - strong [ref=f32e612]: attributes
                - text: (
                - emphasis [ref=f32e613]: dict
                - text: ) A dictionary containing the attributes of the blueprint this actor was based on.
              - listitem [ref=f32e614]:
                - strong [ref=f32e615]: id
                - text: (
                - emphasis [ref=f32e616]: int
                - text: ) Identifier for this actor. Unique during a given episode.
              - listitem [ref=f32e617]:
                - strong [ref=f32e618]: type_id
                - text: (
                - emphasis [ref=f32e619]: str
                - text: ) The identifier of the blueprint this actor was based on, e.g.
                - code [ref=f32e620]: vehicle.ford.mustang
                - text: .
              - listitem [ref=f32e621]:
                - strong [ref=f32e622]: is_alive
                - text: (
                - emphasis [ref=f32e623]: bool
                - text: ) Returns whether this object was destroyed using this actor handle.
              - listitem [ref=f32e624]:
                - strong [ref=f32e625]: is_active
                - text: (
                - emphasis [ref=f32e626]: bool
                - text: ) Returns whether this actor is active (True) or not (False).
              - listitem [ref=f32e627]:
                - strong [ref=f32e628]: is_dormant
                - text: (
                - emphasis [ref=f32e629]: bool
                - text: ) Returns whether this actor is dormant (True) or not (False) - the opposite of is_active.
              - listitem [ref=f32e630]:
                - strong [ref=f32e631]: parent
                - text: (
                - emphasis [ref=f32e632]:
                  - link "carla.Actor" [ref=f32e633] [cursor=pointer]:
                    - /url: "#carla.Actor"
                - text: ) Actors may be attached to a parent actor that they will follow around. This is said actor.
              - listitem [ref=f32e634]:
                - strong [ref=f32e635]: semantic_tags
                - text: (
                - emphasis [ref=f32e636]: list(int)
                - text: ) A list of semantic tags provided by the blueprint listing components for this actor. E.g. a traffic light could be tagged with
                - code [ref=f32e637]: Pole
                - text: and
                - code [ref=f32e638]: TrafficLight
                - text: . These tags are used by the semantic segmentation sensor. Find more about this and other sensors
                - link "here" [ref=f32e639] [cursor=pointer]:
                  - /url: ../ref_sensors/#semantic-segmentation-camera
                - text: .
              - listitem [ref=f32e640]:
                - strong [ref=f32e641]: actor_state
                - text: (
                - emphasis [ref=f32e642]:
                  - link "carla.ActorState" [ref=f32e643] [cursor=pointer]:
                    - /url: "#carla.ActorState"
                - text: ) Returns the
                - link "carla.ActorState" [ref=f32e644] [cursor=pointer]:
                  - /url: "#carla.ActorState"
                - text: ", which can identify if the actor is Active, Dormant or Invalid."
              - listitem [ref=f32e645]:
                - strong [ref=f32e646]: bounding_box
                - text: (
                - emphasis [ref=f32e647]:
                  - link "carla.BoundingBox" [ref=f32e648] [cursor=pointer]:
                    - /url: "#carla.BoundingBox"
                - text: ) Bounding box containing the geometry of the actor. Its location and rotation are relative to the actor it is attached to.
            - heading "Methods" [level=3] [ref=f32e649]
            - list [ref=f32e650]:
              - listitem [ref=f32e651]:
                - strong [ref=f32e652]: add_angular_impulse
                - text: (
                - strong [ref=f32e654]: self
                - text: ","
                - strong [ref=f32e656]: angular_impulse
                - text: ) Applies an angular impulse at the center of mass of the actor. This method should be used for instantaneous torques, usually applied once. Use
                - strong [ref=f32e657]: add_torque()
                - text: to apply rotation forces over a period of time.
                - list [ref=f32e658]:
                  - listitem [ref=f32e659]:
                    - strong [ref=f32e660]: "Parameters:"
                    - list [ref=f32e661]:
                      - listitem [ref=f32e662]:
                        - code [ref=f32e663]: angular_impulse
                        - text: (
                        - emphasis [ref=f32e664]:
                          - link "carla.Vector3D" [ref=f32e665] [cursor=pointer]:
                            - /url: "#carla.Vector3D"
                          - text: "- degrees*s"
                        - text: ) - Angular impulse vector in global coordinates.
              - listitem [ref=f32e666]:
                - strong [ref=f32e667]: add_force
                - text: (
                - strong [ref=f32e669]: self
                - text: ","
                - strong [ref=f32e671]: force
                - text: ) Applies a force at the center of mass of the actor. This method should be used for forces that are applied over a certain period of time. Use
                - strong [ref=f32e672]: add_impulse()
                - text: to apply an impulse that only lasts an instant.
                - list [ref=f32e673]:
                  - listitem [ref=f32e674]:
                    - strong [ref=f32e675]: "Parameters:"
                    - list [ref=f32e676]:
                      - listitem [ref=f32e677]:
                        - code [ref=f32e678]: force
                        - text: (
                        - emphasis [ref=f32e679]:
                          - link "carla.Vector3D" [ref=f32e680] [cursor=pointer]:
                            - /url: "#carla.Vector3D"
                          - text: "- N"
                        - text: ) - Force vector in global coordinates.
              - listitem [ref=f32e681]:
                - strong [ref=f32e682]: add_force_at_location
                - text: (
                - strong [ref=f32e684]: self
                - text: ","
                - strong [ref=f32e686]: force
                - text: ","
                - strong [ref=f32e688]: location
                - text: ) Applies a force at the location provided. This method should be used for forces that are applied over a certain period of time. Use
                - strong [ref=f32e689]: add_impulse()
                - text: to apply an impulse that only lasts an instant.
                - list [ref=f32e690]:
                  - listitem [ref=f32e691]:
                    - strong [ref=f32e692]: "Parameters:"
                    - list [ref=f32e693]:
                      - listitem [ref=f32e694]:
                        - code [ref=f32e695]: force
                        - text: (
                        - emphasis [ref=f32e696]:
                          - link "carla.Vector3D" [ref=f32e697] [cursor=pointer]:
                            - /url: "#carla.Vector3D"
                          - text: "- N"
                        - text: ) - Force vector in global coordinates.
                      - listitem [ref=f32e698]:
                        - code [ref=f32e699]: location
                        - text: (
                        - emphasis [ref=f32e700]:
                          - link "carla.Location" [ref=f32e701] [cursor=pointer]:
                            - /url: "#carla.Location"
                          - text: "- meters"
                        - text: ) - Application center of the given force in global coordinates.
              - listitem [ref=f32e702]:
                - strong [ref=f32e703]: add_impulse
                - text: (
                - strong [ref=f32e705]: self
                - text: ","
                - strong [ref=f32e707]: impulse
                - text: ) Applies an impulse at the center of mass of the actor. This method should be used for instantaneous forces, usually applied once. Use
                - strong [ref=f32e708]: add_force()
                - text: to apply forces over a period of time.
                - list [ref=f32e709]:
                  - listitem [ref=f32e710]:
                    - strong [ref=f32e711]: "Parameters:"
                    - list [ref=f32e712]:
                      - listitem [ref=f32e713]:
                        - code [ref=f32e714]: impulse
                        - text: (
                        - emphasis [ref=f32e715]:
                          - link "carla.Vector3D" [ref=f32e716] [cursor=pointer]:
                            - /url: "#carla.Vector3D"
                          - text: "- N*s"
                        - text: ) - Impulse vector in global coordinates.
              - listitem [ref=f32e717]:
                - strong [ref=f32e718]: add_impulse_at_location
                - text: (
                - strong [ref=f32e720]: self
                - text: ","
                - strong [ref=f32e722]: impulse
                - text: ","
                - strong [ref=f32e724]: impulse
                - text: ) Applies an impulse at the center of mass of the actor. This method should be used for instantaneous forces, usually applied once. Use
                - strong [ref=f32e725]: add_force()
                - text: to apply forces over a period of time.
                - list [ref=f32e726]:
                  - listitem [ref=f32e727]:
                    - strong [ref=f32e728]: "Parameters:"
                    - list [ref=f32e729]:
                      - listitem [ref=f32e730]:
                        - code [ref=f32e731]: impulse
                        - text: (
                        - emphasis [ref=f32e732]:
                          - link "carla.Vector3D" [ref=f32e733] [cursor=pointer]:
                            - /url: "#carla.Vector3D"
                          - text: "- N*s"
                        - text: ) - Impulse vector in global coordinates.
                      - listitem [ref=f32e734]:
                        - code [ref=f32e735]: impulse
                        - text: (
                        - emphasis [ref=f32e736]:
                          - link "carla.Location" [ref=f32e737] [cursor=pointer]:
                            - /url: "#carla.Location"
                          - text: "- N*s"
                        - text: ) - Application location of the given impulse in global coordinates.
              - listitem [ref=f32e738]:
                - strong [ref=f32e739]: add_torque
                - text: (
                - strong [ref=f32e741]: self
                - text: ","
                - strong [ref=f32e743]: torque
                - text: ) Applies a torque at the center of mass of the actor. This method should be used for torques that are applied over a certain period of time. Use
                - strong [ref=f32e744]: add_angular_impulse()
                - text: to apply a torque that only lasts an instant.
                - list [ref=f32e745]:
                  - listitem [ref=f32e746]:
                    - strong [ref=f32e747]: "Parameters:"
                    - list [ref=f32e748]:
                      - listitem [ref=f32e749]:
                        - code [ref=f32e750]: torque
                        - text: (
                        - emphasis [ref=f32e751]:
                          - link "carla.Vector3D" [ref=f32e752] [cursor=pointer]:
                            - /url: "#carla.Vector3D"
                          - text: "- degrees"
                        - text: ) - Torque vector in global coordinates.
              - listitem [ref=f32e753]:
                - strong [ref=f32e754]: destroy
                - text: (
                - strong [ref=f32e756]: self
                - text: ) Tells the simulator to destroy this actor and returns True if it was successful. It has no effect if it was already destroyed.
                - list [ref=f32e757]:
                  - listitem [ref=f32e758]:
                    - strong [ref=f32e759]: "Return:"
                    - emphasis [ref=f32e760]: bool
                  - listitem [ref=f32e761]:
                    - strong [ref=f32e762]: "Warning:"
                    - emphasis [ref=f32e764]: This method blocks the script until the destruction is completed by the simulator.
              - listitem [ref=f32e765]:
                - strong [ref=f32e766]: disable_constant_velocity
                - text: (
                - strong [ref=f32e768]: self
                - text: ) Disables any constant velocity previously set for a
                - link "carla.Vehicle" [ref=f32e769] [cursor=pointer]:
                  - /url: "#carla.Vehicle"
                - text: actor.
              - listitem [ref=f32e770]:
                - strong [ref=f32e771]: disable_for_ros
                - text: (
                - strong [ref=f32e773]: self
                - text: ) Commands the actor to stop publishing via ROS2.
              - listitem [ref=f32e774]:
                - strong [ref=f32e775]: enable_constant_velocity
                - text: (
                - strong [ref=f32e777]: self
                - text: ","
                - strong [ref=f32e779]: velocity
                - text: ) Sets a vehicle's velocity vector to a constant value over time. The resulting velocity will be approximately the
                - code [ref=f32e780]: velocity
                - text: being set, as with
                - strong [ref=f32e781]: set_target_velocity()
                - text: .
                - list [ref=f32e782]:
                  - listitem [ref=f32e783]:
                    - strong [ref=f32e784]: "Parameters:"
                    - list [ref=f32e785]:
                      - listitem [ref=f32e786]:
                        - code [ref=f32e787]: velocity
                        - text: (
                        - emphasis [ref=f32e788]:
                          - link "carla.Vector3D" [ref=f32e789] [cursor=pointer]:
                            - /url: "#carla.Vector3D"
                          - text: "- m/s"
                        - text: ) - Velocity vector in local space.
                  - listitem [ref=f32e790]:
                    - strong [ref=f32e791]: "Note:"
                    - emphasis [ref=f32e793]:
                      - text: Only
                      - link "carla.Vehicle" [ref=f32e794] [cursor=pointer]:
                        - /url: "#carla.Vehicle"
                      - text: actors can use this method.
                  - listitem [ref=f32e795]:
                    - strong [ref=f32e796]: "Warning:"
                    - emphasis [ref=f32e798]:
                      - text: Enabling a constant velocity for a vehicle managed by the
                      - link "Traffic Manager" [ref=f32e799] [cursor=pointer]:
                        - /url: ../adv_traffic_manager/
                      - text: may cause conflicts. This method overrides any changes in velocity by the TM.
              - listitem [ref=f32e800]:
                - strong [ref=f32e801]: enable_for_ros
                - text: (
                - strong [ref=f32e803]: self
                - text: ) Commands the actor to publish their content via ROS2.
              - listitem [ref=f32e804]:
                - strong [ref=f32e805]: is_enabled_for_ros
                - text: (
                - strong [ref=f32e807]: self
                - text: ) Returns if the actor is enabled or not to publish via ROS2.
                - list [ref=f32e808]:
                  - listitem [ref=f32e809]:
                    - strong [ref=f32e810]: "Return:"
                    - emphasis [ref=f32e811]: bool
