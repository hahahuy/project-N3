                - text: ) The RSS dynamics to be applied for the actor.
            - heading "Methods" [level=3] [ref=f32e5735]
            - heading "Dunder methods" [level=5] [ref=f32e5736]
            - list [ref=f32e5737]:
              - listitem [ref=f32e5738]:
                - strong [ref=f32e5739]: __str__
                - text: (
                - strong [ref=f32e5741]: self
                - text: )
            - separator [ref=f32e5742]
            - heading "carla.RssEgoDynamicsOnRoute" [level=2] [ref=f32e5743]
            - paragraph [ref=f32e5744]:
              - text: Part of the data contained inside a
              - link "carla.RssResponse" [ref=f32e5745] [cursor=pointer]:
                - /url: "#carla.RssResponse"
              - text: describing the state of the vehicle. The parameters include its current dynamics, and how it is heading regarding the target route.
            - heading "Instance Variables" [level=3] [ref=f32e5746]
            - list [ref=f32e5747]:
              - listitem [ref=f32e5748]:
                - strong [ref=f32e5749]: ego_speed
                - text: (
                - emphasis [ref=f32e5750]:
                  - link "ad.physics.Speed" [ref=f32e5751] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_physics/apidoc/html/classad_1_1physics_1_1Speed.html
                - text: ) The ego vehicle's speed.
              - listitem [ref=f32e5752]:
                - strong [ref=f32e5753]: min_stopping_distance
                - text: (
                - emphasis [ref=f32e5754]:
                  - link "ad.physics.Distance" [ref=f32e5755] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_physics/apidoc/html/classad_1_1physics_1_1Distance.html
                - text: ) The current minimum stopping distance.
              - listitem [ref=f32e5756]:
                - strong [ref=f32e5757]: ego_center
                - text: (
                - emphasis [ref=f32e5758]:
                  - link "ad.map.point.ENUPoint" [ref=f32e5759] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_map_access/apidoc/html/structad_1_1map_1_1point_1_1ENUPoint.html
                - text: ) The considered enu position of the ego vehicle.
              - listitem [ref=f32e5760]:
                - strong [ref=f32e5761]: ego_heading
                - text: (
                - emphasis [ref=f32e5762]:
                  - link "ad.map.point.ENUHeading" [ref=f32e5763] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_map_access/apidoc/html/classad_1_1map_1_1point_1_1ENUHeading.html
                - text: ) The considered heading of the ego vehicle.
              - listitem [ref=f32e5764]:
                - strong [ref=f32e5765]: ego_center_within_route
                - text: (
                - emphasis [ref=f32e5766]: bool
                - text: ) States if the ego vehicle's center is within the route.
              - listitem [ref=f32e5767]:
                - strong [ref=f32e5768]: crossing_border
                - text: (
                - emphasis [ref=f32e5769]: bool
                - text: ) States if the vehicle is already crossing one of the lane borders.
              - listitem [ref=f32e5770]:
                - strong [ref=f32e5771]: route_heading
                - text: (
                - emphasis [ref=f32e5772]:
                  - link "ad.map.point.ENUHeading" [ref=f32e5773] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_map_access/apidoc/html/classad_1_1map_1_1point_1_1ENUHeading.html
                - text: ) The considered heading of the route.
              - listitem [ref=f32e5774]:
                - strong [ref=f32e5775]: route_nominal_center
                - text: (
                - emphasis [ref=f32e5776]:
                  - link "ad.map.point.ENUPoint" [ref=f32e5777] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_map_access/apidoc/html/structad_1_1map_1_1point_1_1ENUPoint.html
                - text: ) The considered nominal center of the current route.
              - listitem [ref=f32e5778]:
                - strong [ref=f32e5779]: heading_diff
                - text: (
                - emphasis [ref=f32e5780]:
                  - link "ad.map.point.ENUHeading" [ref=f32e5781] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_map_access/apidoc/html/classad_1_1map_1_1point_1_1ENUHeading.html
                - text: ) The considered heading diff towards the route.
              - listitem [ref=f32e5782]:
                - strong [ref=f32e5783]: route_speed_lat
                - text: (
                - emphasis [ref=f32e5784]:
                  - link "ad.physics.Speed" [ref=f32e5785] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_physics/apidoc/html/classad_1_1physics_1_1Speed.html
                - text: ) The ego vehicle's speed component
                - emphasis [ref=f32e5786]: lat
                - text: regarding the route.
              - listitem [ref=f32e5787]:
                - strong [ref=f32e5788]: route_speed_lon
                - text: (
                - emphasis [ref=f32e5789]:
                  - link "ad.physics.Speed" [ref=f32e5790] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_physics/apidoc/html/classad_1_1physics_1_1Speed.html
                - text: ) The ego vehicle's speed component
                - emphasis [ref=f32e5791]: lon
                - text: regarding the route.
              - listitem [ref=f32e5792]:
                - strong [ref=f32e5793]: route_accel_lat
                - text: (
                - emphasis [ref=f32e5794]:
                  - link "ad.physics.Acceleration" [ref=f32e5795] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_physics/apidoc/html/classad_1_1physics_1_1Acceleration.html
                - text: ) The ego vehicle's acceleration component
                - emphasis [ref=f32e5796]: lat
                - text: regarding the route.
              - listitem [ref=f32e5797]:
                - strong [ref=f32e5798]: route_accel_lon
                - text: (
                - emphasis [ref=f32e5799]:
                  - link "ad.physics.Acceleration" [ref=f32e5800] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_physics/apidoc/html/classad_1_1physics_1_1Acceleration.html
                - text: ) The ego vehicle's acceleration component
                - emphasis [ref=f32e5801]: lon
                - text: regarding the route.
              - listitem [ref=f32e5802]:
                - strong [ref=f32e5803]: avg_route_accel_lat
                - text: (
                - emphasis [ref=f32e5804]:
                  - link "ad.physics.Acceleration" [ref=f32e5805] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_physics/apidoc/html/classad_1_1physics_1_1Acceleration.html
                - text: ) The ego vehicle's acceleration component
                - emphasis [ref=f32e5806]: lat
                - text: regarding the route smoothened by an average filter.
              - listitem [ref=f32e5807]:
                - strong [ref=f32e5808]: avg_route_accel_lon
                - text: (
                - emphasis [ref=f32e5809]:
                  - link "ad.physics.Acceleration" [ref=f32e5810] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_physics/apidoc/html/classad_1_1physics_1_1Acceleration.html
                - text: ) The ego acceleration component
                - emphasis [ref=f32e5811]: lon
                - text: regarding the route smoothened by an average filter.
            - heading "Methods" [level=3] [ref=f32e5812]
            - heading "Dunder methods" [level=5] [ref=f32e5813]
            - list [ref=f32e5814]:
              - listitem [ref=f32e5815]:
                - strong [ref=f32e5816]: __str__
                - text: (
                - strong [ref=f32e5818]: self
                - text: )
            - separator [ref=f32e5819]
            - heading "carla.RssLogLevel" [level=2] [ref=f32e5820]
            - paragraph [ref=f32e5821]:
              - text: Enum declaration used in
              - link "carla.RssSensor" [ref=f32e5822] [cursor=pointer]:
                - /url: "#carla.RssSensor"
              - text: to set the log level.
            - heading "Instance Variables" [level=3] [ref=f32e5823]
            - list [ref=f32e5824]:
              - listitem [ref=f32e5825]:
                - strong [ref=f32e5826]: trace
              - listitem [ref=f32e5827]:
                - strong [ref=f32e5828]: debug
              - listitem [ref=f32e5829]:
                - strong [ref=f32e5830]: info
              - listitem [ref=f32e5831]:
                - strong [ref=f32e5832]: warn
              - listitem [ref=f32e5833]:
                - strong [ref=f32e5834]: err
              - listitem [ref=f32e5835]:
                - strong [ref=f32e5836]: critical
              - listitem [ref=f32e5837]:
                - strong [ref=f32e5838]: "off"
            - separator [ref=f32e5839]
            - heading "carla.RssResponse" [level=2] [ref=f32e5840]
            - paragraph [ref=f32e5841]:
              - generic [ref=f32e5842]:
                - text: Inherited from
                - emphasis [ref=f32e5843]:
                  - link "carla.SensorData" [ref=f32e5844] [cursor=pointer]:
                    - /url: "#carla.SensorData"
              - text: Class that contains the output of a
              - link "carla.RssSensor" [ref=f32e5845] [cursor=pointer]:
                - /url: "#carla.RssSensor"
              - text: . This is the result of the RSS calculations performed for the parent vehicle of the sensor.
            - paragraph [ref=f32e5846]:
              - text: A
              - link "carla.RssRestrictor" [ref=f32e5847] [cursor=pointer]:
                - /url: "#carla.RssRestrictor"
              - text: will use the data to modify the
              - link "carla.VehicleControl" [ref=f32e5848] [cursor=pointer]:
                - /url: "#carla.VehicleControl"
              - text: of the vehicle.
            - heading "Instance Variables" [level=3] [ref=f32e5849]
            - list [ref=f32e5850]:
              - listitem [ref=f32e5851]:
                - strong [ref=f32e5852]: response_valid
                - text: (
                - emphasis [ref=f32e5853]: bool
                - text: ) States if the response is valid. It is
                - strong [ref=f32e5854]: "False"
                - text: if calculations failed or an exception occured.
              - listitem [ref=f32e5855]:
                - strong [ref=f32e5856]: proper_response
                - text: (
                - emphasis [ref=f32e5857]:
                  - link "ad.rss.state.ProperResponse" [ref=f32e5858] [cursor=pointer]:
                    - /url: https://intel.github.io/ad-rss-lib/doxygen/ad_rss/structad_1_1rss_1_1state_1_1ProperResponse.html
                - text: ) The proper response that the RSS calculated for the vehicle.
              - listitem [ref=f32e5859]:
                - strong [ref=f32e5860]: rss_state_snapshot
                - text: (
                - emphasis [ref=f32e5861]:
                  - link "ad.rss.state.RssStateSnapshot" [ref=f32e5862] [cursor=pointer]:
                    - /url: https://intel.github.io/ad-rss-lib/doxygen/ad_rss/structad_1_1rss_1_1state_1_1RssStateSnapshot.html
                - text: ) Detailed RSS states at the current moment in time.
              - listitem [ref=f32e5863]:
                - strong [ref=f32e5864]: ego_dynamics_on_route
                - text: (
                - emphasis [ref=f32e5865]:
                  - link "carla.RssEgoDynamicsOnRoute" [ref=f32e5866] [cursor=pointer]:
                    - /url: "#carla.RssEgoDynamicsOnRoute"
                - text: ) Current ego vehicle dynamics regarding the route.
              - listitem [ref=f32e5867]:
                - strong [ref=f32e5868]: world_model
                - text: (
                - emphasis [ref=f32e5869]:
                  - link "ad.rss.world.WorldModel" [ref=f32e5870] [cursor=pointer]:
                    - /url: https://intel.github.io/ad-rss-lib/doxygen/ad_rss/structad_1_1rss_1_1world_1_1WorldModel.html
                - text: ) World model used for calculations.
              - listitem [ref=f32e5871]:
                - strong [ref=f32e5872]: situation_snapshot
                - text: (
                - emphasis [ref=f32e5873]:
                  - link "ad.rss.situation.SituationSnapshot" [ref=f32e5874] [cursor=pointer]:
                    - /url: https://intel.github.io/ad-rss-lib/doxygen/ad_rss/structad_1_1rss_1_1situation_1_1SituationSnapshot.html
                - text: ) Detailed RSS situations extracted from the world model.
            - heading "Methods" [level=3] [ref=f32e5875]
            - heading "Dunder methods" [level=5] [ref=f32e5876]
            - list [ref=f32e5877]:
              - listitem [ref=f32e5878]:
                - strong [ref=f32e5879]: __str__
                - text: (
                - strong [ref=f32e5881]: self
                - text: )
            - separator [ref=f32e5882]
            - heading "carla.RssRestrictor" [level=2] [ref=f32e5883]
            - paragraph [ref=f32e5884]:
              - text: These objects apply restrictions to a
              - link "carla.VehicleControl" [ref=f32e5885] [cursor=pointer]:
                - /url: "#carla.VehicleControl"
              - text: . It is part of the CARLA implementation of the
              - link "C++ Library for Responsibility Sensitive Safety" [ref=f32e5886] [cursor=pointer]:
                - /url: https://github.com/intel/ad-rss-lib
              - text: . This class works hand in hand with a
              - link "rss sensor" [ref=f32e5887] [cursor=pointer]:
                - /url: ../ref_sensors/#rss-sensor
              - text: ", which provides the data of the restrictions to be applied."
            - heading "Methods" [level=3] [ref=f32e5888]
            - list [ref=f32e5889]:
              - listitem [ref=f32e5890]:
                - strong [ref=f32e5891]: restrict_vehicle_control
                - text: (
                - strong [ref=f32e5893]: self
                - text: ","
                - strong [ref=f32e5895]: vehicle_control
                - text: ","
                - strong [ref=f32e5897]: proper_response
                - text: ","
                - strong [ref=f32e5899]: ego_dynamics_on_route
                - text: ","
                - strong [ref=f32e5901]: vehicle_physics
                - text: ) Applies the safety restrictions given by a
                - link "carla.RssSensor" [ref=f32e5902] [cursor=pointer]:
                  - /url: "#carla.RssSensor"
                - text: to a
                - link "carla.VehicleControl" [ref=f32e5903] [cursor=pointer]:
                  - /url: "#carla.VehicleControl"
                - text: .
                - list [ref=f32e5904]:
                  - listitem [ref=f32e5905]:
                    - strong [ref=f32e5906]: "Parameters:"
                    - list [ref=f32e5907]:
                      - listitem [ref=f32e5908]:
                        - code [ref=f32e5909]: vehicle_control
                        - text: (
                        - emphasis [ref=f32e5910]:
                          - link "carla.VehicleControl" [ref=f32e5911] [cursor=pointer]:
                            - /url: "#carla.VehicleControl"
                        - text: ) - The input vehicle control to be restricted.
                      - listitem [ref=f32e5912]:
                        - code [ref=f32e5913]: proper_response
                        - text: (
                        - emphasis [ref=f32e5914]:
                          - link "ad.rss.state.ProperResponse" [ref=f32e5915] [cursor=pointer]:
                            - /url: https://intel.github.io/ad-rss-lib/doxygen/ad_rss/structad_1_1rss_1_1state_1_1ProperResponse.html
                        - text: ) - Part of the response generated by the sensor. Contains restrictions to be applied to the acceleration of the vehicle.
                      - listitem [ref=f32e5916]:
                        - code [ref=f32e5917]: ego_dynamics_on_route
                        - text: (
                        - emphasis [ref=f32e5918]:
                          - link "carla.RssEgoDynamicsOnRoute" [ref=f32e5919] [cursor=pointer]:
                            - /url: "#carla.RssEgoDynamicsOnRoute"
                        - text: ) - Part of the response generated by the sensor. Contains dynamics and heading of the vehicle regarding its route.
                      - listitem [ref=f32e5920]:
                        - code [ref=f32e5921]: vehicle_physics
                        - text: (
                        - emphasis [ref=f32e5922]:
                          - link "carla.VehiclePhysicsControl" [ref=f32e5923] [cursor=pointer]:
                            - /url: "#carla.VehiclePhysicsControl"
                        - text: ) - The current physics of the vehicle. Used to apply the restrictions properly.
                  - listitem [ref=f32e5924]:
                    - strong [ref=f32e5925]: "Return:"
                    - emphasis [ref=f32e5926]:
                      - link "carla.VehicleControl" [ref=f32e5927] [cursor=pointer]:
                        - /url: "#carla.VehicleControl"
            - heading "Setters" [level=5] [ref=f32e5928]
            - list [ref=f32e5929]:
              - listitem [ref=f32e5930]:
                - strong [ref=f32e5931]: set_log_level
                - text: (
                - strong [ref=f32e5933]: self
                - text: ","
                - strong [ref=f32e5935]: log_level
                - text: ) Sets the log level.
                - list [ref=f32e5936]:
                  - listitem [ref=f32e5937]:
                    - strong [ref=f32e5938]: "Parameters:"
                    - list [ref=f32e5939]:
                      - listitem [ref=f32e5940]:
                        - code [ref=f32e5941]: log_level
                        - text: (
                        - emphasis [ref=f32e5942]:
                          - link "carla.RssLogLevel" [ref=f32e5943] [cursor=pointer]:
                            - /url: "#carla.RssLogLevel"
                        - text: ) - New log level.
            - separator [ref=f32e5944]
            - heading "carla.RssRoadBoundariesMode" [level=2] [ref=f32e5945]
            - paragraph [ref=f32e5946]:
              - text: Enum declaration used in
              - link "carla.RssSensor" [ref=f32e5947] [cursor=pointer]:
                - /url: "#carla.RssSensor"
              - text: to enable or disable the
              - link "stay on road" [ref=f32e5948] [cursor=pointer]:
                - /url: https://intel.github.io/ad-rss-lib/ad_rss_map_integration/HandleRoadBoundaries/
              - text: feature. In summary, this feature considers the road boundaries as virtual objects. The minimum safety distance check is applied to these virtual walls, in order to make sure the vehicle does not drive off the road.
            - heading "Instance Variables" [level=3] [ref=f32e5949]
            - list [ref=f32e5950]:
              - listitem [ref=f32e5951]:
                - strong [ref=f32e5952]: "On"
                - text: Enables the
                - emphasis [ref=f32e5953]: stay on road
                - text: feature.
              - listitem [ref=f32e5954]:
                - strong [ref=f32e5955]: "Off"
                - text: Disables the
                - emphasis [ref=f32e5956]: stay on road
                - text: feature.
            - separator [ref=f32e5957]
            - heading "carla.RssSensor" [level=2] [ref=f32e5958]
            - paragraph [ref=f32e5959]:
              - generic [ref=f32e5960]:
                - text: Inherited from
                - emphasis [ref=f32e5961]:
                  - link "carla.Sensor" [ref=f32e5962] [cursor=pointer]:
                    - /url: "#carla.Sensor"
              - text: This sensor works a bit differently than the rest. Take look at the
              - link "specific documentation" [ref=f32e5963] [cursor=pointer]:
                - /url: ../adv_rss/
              - text: ", and the"
              - link "rss sensor reference" [ref=f32e5964] [cursor=pointer]:
                - /url: ../ref_sensors/#rss-sensor
              - text: to gain full understanding of it.
            - paragraph [ref=f32e5965]:
              - text: The RSS sensor uses world information, and a
              - link "RSS library" [ref=f32e5966] [cursor=pointer]:
                - /url: https://github.com/intel/ad-rss-lib
              - text: to make safety checks on a vehicle. The output retrieved by the sensor is a
              - link "carla.RssResponse" [ref=f32e5967] [cursor=pointer]:
                - /url: "#carla.RssResponse"
              - text: . This will be used by a
              - link "carla.RssRestrictor" [ref=f32e5968] [cursor=pointer]:
                - /url: "#carla.RssRestrictor"
              - text: to modify a
              - link "carla.VehicleControl" [ref=f32e5969] [cursor=pointer]:
                - /url: "#carla.VehicleControl"
              - text: before applying it to a vehicle.
            - heading "Instance Variables" [level=3] [ref=f32e5970]
            - list [ref=f32e5971]:
              - listitem [ref=f32e5972]:
                - strong [ref=f32e5973]: ego_vehicle_dynamics
                - text: (
                - emphasis [ref=f32e5974]:
                  - link "ad.rss.world.RssDynamics" [ref=f32e5975] [cursor=pointer]:
                    - /url: https://intel.github.io/ad-rss-lib/doxygen/ad_rss/structad_1_1rss_1_1world_1_1RssDynamics.html
                - text: ) States the
                - link "RSS parameters" [ref=f32e5976] [cursor=pointer]:
                  - /url: https://intel.github.io/ad-rss-lib/ad_rss/Appendix-ParameterDiscussion/
                - text: that the sensor will consider for the ego vehicle if no actor constellation callback is registered.
              - listitem [ref=f32e5977]:
                - strong [ref=f32e5978]: other_vehicle_dynamics
                - text: (
                - emphasis [ref=f32e5979]:
                  - link "ad.rss.world.RssDynamics" [ref=f32e5980] [cursor=pointer]:
                    - /url: https://intel.github.io/ad-rss-lib/doxygen/ad_rss/structad_1_1rss_1_1world_1_1RssDynamics.html
                - text: ) States the
                - link "RSS parameters" [ref=f32e5981] [cursor=pointer]:
                  - /url: https://intel.github.io/ad-rss-lib/ad_rss/Appendix-ParameterDiscussion/
                - text: that the sensor will consider for the rest of vehicles if no actor constellation callback is registered.
              - listitem [ref=f32e5982]:
                - strong [ref=f32e5983]: pedestrian_dynamics
                - text: (
                - emphasis [ref=f32e5984]:
                  - link "ad.rss.world.RssDynamics" [ref=f32e5985] [cursor=pointer]:
                    - /url: https://intel.github.io/ad-rss-lib/doxygen/ad_rss/structad_1_1rss_1_1world_1_1RssDynamics.html
                - text: ) States the
                - link "RSS parameters" [ref=f32e5986] [cursor=pointer]:
                  - /url: https://intel.github.io/ad-rss-lib/ad_rss/Appendix-ParameterDiscussion/
                - text: that the sensor will consider for pedestrians if no actor constellation callback is registered.
              - listitem [ref=f32e5987]:
                - strong [ref=f32e5988]: road_boundaries_mode
                - text: (
                - emphasis [ref=f32e5989]:
                  - link "carla.RssRoadBoundariesMode" [ref=f32e5990] [cursor=pointer]:
                    - /url: "#carla.RssRoadBoundariesMode"
                - text: ) Switches the
                - link "stay on road" [ref=f32e5991] [cursor=pointer]:
                  - /url: https://intel.github.io/ad-rss-lib/ad_rss_map_integration/HandleRoadBoundaries/
                - text: feature. By default is
                - strong [ref=f32e5992]: "Off"
                - text: .
              - listitem [ref=f32e5993]:
                - strong [ref=f32e5994]: routing_targets
                - text: (
                - emphasis [ref=f32e5995]:
                  - text: vector<
                  - link "carla.Transform" [ref=f32e5996] [cursor=pointer]:
                    - /url: "#carla.Transform"
                  - text: ">"
                - text: ) The current list of targets considered to route the vehicle. If no routing targets are defined, a route is generated at random.
            - heading "Methods" [level=3] [ref=f32e5997]
            - list [ref=f32e5998]:
              - listitem [ref=f32e5999]:
                - strong [ref=f32e6000]: append_routing_target
                - text: (
                - strong [ref=f32e6002]: self
                - text: ","
                - strong [ref=f32e6004]: routing_target
                - text: ) Appends a new target position to the current route of the vehicle.
                - list [ref=f32e6005]:
                  - listitem [ref=f32e6006]:
                    - strong [ref=f32e6007]: "Parameters:"
                    - list [ref=f32e6008]:
                      - listitem [ref=f32e6009]:
                        - code [ref=f32e6010]: routing_target
                        - text: (
                        - emphasis [ref=f32e6011]:
                          - link "carla.Transform" [ref=f32e6012] [cursor=pointer]:
                            - /url: "#carla.Transform"
                        - text: ) - New target point for the route. Choose these after the intersections to force the route to take the desired turn.
              - listitem [ref=f32e6013]:
                - strong [ref=f32e6014]: drop_route
                - text: (
                - strong [ref=f32e6016]: self
                - text: ) Discards the current route. If there are targets remaining in
                - strong [ref=f32e6017]: routing_targets
                - text: ", creates a new route using those. Otherwise, a new route is created at random."
              - listitem [ref=f32e6018]:
                - strong [ref=f32e6019]: register_actor_constellation_callback
                - text: (
                - strong [ref=f32e6021]: self
                - text: ","
                - strong [ref=f32e6023]: callback
                - text: ) Register a callback to customize a
                - link "carla.RssActorConstellationResult" [ref=f32e6024] [cursor=pointer]:
                  - /url: "#carla.RssActorConstellationResult"
                - text: . By this callback the settings of RSS parameters are done per actor constellation and the settings (ego_vehicle_dynamics, other_vehicle_dynamics and pedestrian_dynamics) have no effect.
                - list [ref=f32e6025]:
                  - listitem [ref=f32e6026]:
                    - strong [ref=f32e6027]: "Parameters:"
                    - list [ref=f32e6028]:
                      - listitem [ref=f32e6029]:
                        - code [ref=f32e6030]: callback
                        - text: "- The function to be called whenever a RSS situation is about to be calculated."
              - listitem [ref=f32e6031]:
