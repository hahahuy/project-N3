                        - emphasis [ref=f32e9716]:
                          - link "carla.WorldSettings" [ref=f32e9717] [cursor=pointer]:
                            - /url: "#carla.WorldSettings"
                        - text: )
                  - listitem [ref=f32e9718]:
                    - strong [ref=f32e9719]: "Return:"
                    - emphasis [ref=f32e9720]: int
                  - listitem [ref=f32e9721]:
                    - strong [ref=f32e9722]: "Warning:"
                    - emphasis [ref=f32e9724]:
                      - text: If synchronous mode is enabled, and there is a Traffic Manager running, this must be set to sync mode too. Read
                      - link "this" [ref=f32e9725] [cursor=pointer]:
                        - /url: ../adv_traffic_manager/#synchronous-mode
                      - text: to learn how to do it.
              - listitem [ref=f32e9726]:
                - strong [ref=f32e9727]: apply_textures_to_object
