                  - strong [ref=f32e6154]: pos
                  - text: =int
                - text: )
              - listitem [ref=f32e6155]:
                - strong [ref=f32e6156]: __iter__
                - text: (
                - strong [ref=f32e6158]: self
                - text: ) Iterate over the
                - link "carla.SemanticLidarDetection" [ref=f32e6159] [cursor=pointer]:
                  - /url: "#carla.SemanticLidarDetection"
                - text: retrieved as data.
              - listitem [ref=f32e6160]:
