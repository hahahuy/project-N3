                - emphasis [ref=f32e3556]:
                  - link "carla.SensorData" [ref=f32e3557] [cursor=pointer]:
                    - /url: "#carla.SensorData"
              - text: Class that defines an image of 32-bit BGRA colors that will be used as initial data retrieved by camera sensors. There are different camera sensors (currently three, RGB, depth and semantic segmentation) and each of these makes different use for the images. Learn more about them
