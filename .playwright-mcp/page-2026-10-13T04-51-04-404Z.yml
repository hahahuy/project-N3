                - emphasis [ref=f32e1097]: str
                - text: ) The identifier of said blueprint inside the library. E.g.
                - code [ref=f32e1098]: walker.pedestrian.0001
                - text: .
              - listitem [ref=f32e1099]:
                - strong [ref=f32e1100]: tags
                - text: (
                - emphasis [ref=f32e1101]: list(str)
                - text: ) A list of tags each blueprint has that helps describing them. E.g.
                - code [ref=f32e1102]: "['0001', 'pedestrian', 'walker']"
                - text: .
