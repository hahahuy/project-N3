            - heading "carla.DVSEvent" [level=2] [ref=f32e2530]
            - paragraph [ref=f32e2531]:
              - text: Class that defines a DVS event. An event is a quadruple, so a tuple of 4 elements, with
              - code [ref=f32e2532]: x
              - text: ","
              - code [ref=f32e2533]: "y"
              - text: pixel coordinate location, timestamp
              - code [ref=f32e2534]: t
              - text: and polarity
              - code [ref=f32e2535]: pol
              - text: of the event. Learn more about them
              - link "here" [ref=f32e2536] [cursor=pointer]:
                - /url: ../ref_sensors/
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e2537]
            - list [ref=f32e2538]:
              - listitem [ref=f32e2539]:
                - strong [ref=f32e2540]: x
                - text: (
                - emphasis [ref=f32e2541]: int
                - text: ) X pixel coordinate.
              - listitem [ref=f32e2542]:
                - strong [ref=f32e2543]: "y"
                - text: (
                - emphasis [ref=f32e2544]: int
                - text: ) Y pixel coordinate.
              - listitem [ref=f32e2545]:
                - strong [ref=f32e2546]: t
                - text: (
                - emphasis [ref=f32e2547]: int
                - text: ) Timestamp of the moment the event happened.
              - listitem [ref=f32e2548]:
                - strong [ref=f32e2549]: pol
                - text: (
                - emphasis [ref=f32e2550]: bool
                - text: ) Polarity of the event.
                - strong [ref=f32e2551]: "True"
                - text: for positive and
                - strong [ref=f32e2552]: "False"
                - text: for negative.
            - heading "Methods" [level=3] [ref=f32e2553]
