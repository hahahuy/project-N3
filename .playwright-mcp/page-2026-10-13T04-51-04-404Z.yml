            - heading "carla.ColorConverter" [level=2] [ref=f32e2344]
            - paragraph [ref=f32e2345]:
              - text: Class that defines conversion patterns that can be applied to a
              - link "carla.Image" [ref=f32e2346] [cursor=pointer]:
                - /url: "#carla.Image"
              - text: in order to show information provided by
              - link "carla.Sensor" [ref=f32e2347] [cursor=pointer]:
                - /url: "#carla.Sensor"
              - text: . Depth conversions cause a loss of accuracy, as sensors detect depth as float that is then converted to a grayscale value between 0 and 255. Take a look at the snipet in
              - link "carla.Sensor.listen" [ref=f32e2348] [cursor=pointer]:
                - /url: "#carla.Sensor.listen"
              - text: to see an example of how to create and save image data for sensor.camera.semantic_segmentation.
            - heading "Instance Variables" [level=3] [ref=f32e2349]
            - list [ref=f32e2350]:
              - listitem [ref=f32e2351]:
                - strong [ref=f32e2352]: CityScapesPalette
                - text: Converts the image to a segmented map using tags provided by the blueprint library. Used by the
                - link "semantic segmentation camera" [ref=f32e2353] [cursor=pointer]:
                  - /url: ../ref_sensors/#semantic-segmentation-camera
                - text: .
              - listitem [ref=f32e2354]:
                - strong [ref=f32e2355]: Depth
                - text: Converts the image to a linear depth map. Used by the
                - link "depth camera" [ref=f32e2356] [cursor=pointer]:
                  - /url: ../ref_sensors/#depth-camera
                - text: .
              - listitem [ref=f32e2357]:
                - strong [ref=f32e2358]: LogarithmicDepth
                - text: Converts the image to a depth map using a logarithmic scale, leading to better precision for small distances at the expense of losing it when further away.
              - listitem [ref=f32e2359]:
                - strong [ref=f32e2360]: Raw
                - text: No changes applied to the image. Used by the
                - link "RGB camera" [ref=f32e2361] [cursor=pointer]:
                  - /url: ../ref_sensors/#rgb-camera
                - text: .
            - separator [ref=f32e2362]
            - heading "carla.CustomV2XBytes" [level=2] [ref=f32e2363]
            - paragraph [ref=f32e2364]:
              - text: This is the data type defining the bytes of a custom V2X message. Sent by the method
              - code [ref=f32e2365]: "[carla.Sensor.send](#carla.Sensor.send)"
              - text: and received as part of a
              - link "CustomV2XEvent" [ref=f32e2366] [cursor=pointer]:
                - /url: "#carlacustomv2xevent"
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e2367]
            - list [ref=f32e2368]:
              - listitem [ref=f32e2369]:
                - strong [ref=f32e2370]: data_size
                - text: (
                - emphasis [ref=f32e2371]: int
                - text: ) The actual number of bytes of the message.
            - heading "Methods" [level=3] [ref=f32e2372]
            - list [ref=f32e2373]:
              - listitem [ref=f32e2374]:
                - strong [ref=f32e2375]: get
                - text: (
                - strong [ref=f32e2377]: self
                - text: ") Get the custom bytes. Returns a nested dictionary containing the message. It has three primary keys: -"
                - code [ref=f32e2378]: DataSize
                - text: ": int -"
                - code [ref=f32e2379]: MaxDataSize
                - text: ": int -"
                - code [ref=f32e2380]: Bytes
                - text: ": memory view containing the bytes."
                - list [ref=f32e2381]:
                  - listitem [ref=f32e2382]:
                    - strong [ref=f32e2383]: "Return:"
                    - emphasis [ref=f32e2384]: dict
              - listitem [ref=f32e2385]:
                - strong [ref=f32e2386]: max_data_size
                - text: (
                - strong [ref=f32e2388]: self
                - text: ) Get the maximum data size that a single message is able to transport.
                - list [ref=f32e2389]:
                  - listitem [ref=f32e2390]:
                    - strong [ref=f32e2391]: "Return:"
                    - emphasis [ref=f32e2392]: int
            - heading "Getters" [level=5] [ref=f32e2393]
            - list [ref=f32e2394]:
              - listitem [ref=f32e2395]:
                - strong [ref=f32e2396]: get_bytes
                - text: (
                - strong [ref=f32e2398]: self
                - text: ) Get the custom bytes.
                - list [ref=f32e2399]:
                  - listitem [ref=f32e2400]:
                    - strong [ref=f32e2401]: "Return:"
                    - emphasis [ref=f32e2402]: bytes
                  - listitem [ref=f32e2403]:
                    - strong [ref=f32e2404]: "Setter:"
                    - emphasis [ref=f32e2405]:
                      - link "carla.CustomV2XBytes.set_bytes" [ref=f32e2406] [cursor=pointer]:
                        - /url: "#carla.CustomV2XBytes.set_bytes"
              - listitem [ref=f32e2407]:
                - strong [ref=f32e2408]: get_string
                - text: (
                - strong [ref=f32e2410]: self
                - text: ") Get the custom bytes as string. Be aware: this is a convenience method for quick tests, no coding/decoding is performed."
                - list [ref=f32e2411]:
                  - listitem [ref=f32e2412]:
                    - strong [ref=f32e2413]: "Return:"
                    - emphasis [ref=f32e2414]: str
                  - listitem [ref=f32e2415]:
                    - strong [ref=f32e2416]: "Setter:"
                    - emphasis [ref=f32e2417]:
                      - link "carla.CustomV2XBytes.set_string" [ref=f32e2418] [cursor=pointer]:
                        - /url: "#carla.CustomV2XBytes.set_string"
            - heading "Setters" [level=5] [ref=f32e2419]
            - list [ref=f32e2420]:
              - listitem [ref=f32e2421]:
                - strong [ref=f32e2422]: set_bytes
                - text: (
                - strong [ref=f32e2424]: self
                - text: ","
                - strong [ref=f32e2426]: bytes
                - text: ) Set the custom bytes from a bytearray. Be aware that only up to
                - code [ref=f32e2427]: MaxDataSize
                - text: bytes are considered. If you have larger data, you need to split it manually.
                - list [ref=f32e2428]:
                  - listitem [ref=f32e2429]:
                    - strong [ref=f32e2430]: "Parameters:"
                    - list [ref=f32e2431]:
                      - listitem [ref=f32e2432]:
                        - code [ref=f32e2433]: bytes
                        - text: (
                        - emphasis [ref=f32e2434]: bytes
                        - text: )
                  - listitem [ref=f32e2435]:
                    - strong [ref=f32e2436]: "Getter:"
                    - emphasis [ref=f32e2437]:
                      - link "carla.CustomV2XBytes.get_bytes" [ref=f32e2438] [cursor=pointer]:
                        - /url: "#carla.CustomV2XBytes.get_bytes"
              - listitem [ref=f32e2439]:
                - strong [ref=f32e2440]: set_string
                - text: (
                - strong [ref=f32e2442]: self
                - text: ","
                - strong [ref=f32e2444]: string
                - text: ) Set the custom bytes directly from a string. The null termination is not transmitted. Be aware that only up to
                - code [ref=f32e2445]: MaxDataSize
                - text: "bytes are considered. If you have larger data, you need to split it manually. Be aware: this is a convenience method for quick tests, no coding/decoding is performed."
                - list [ref=f32e2446]:
                  - listitem [ref=f32e2447]:
                    - strong [ref=f32e2448]: "Parameters:"
                    - list [ref=f32e2449]:
                      - listitem [ref=f32e2450]:
