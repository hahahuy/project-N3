            - heading "carla.World" [level=2] [ref=f32e9582]
            - paragraph [ref=f32e9583]:
              - text: World objects are created by the client to have a place for the simulation to happen. The world contains the map we can see, meaning the asset, not the navigation map. Navigation maps are part of the
              - link "carla.Map" [ref=f32e9584] [cursor=pointer]:
                - /url: "#carla.Map"
              - text: class. It also manages the weather and actors present in it. There can only be one world per simulation, but it can be changed anytime.
            - heading "Instance Variables" [level=3] [ref=f32e9585]
            - list [ref=f32e9586]:
              - listitem [ref=f32e9587]:
                - strong [ref=f32e9588]: id
                - text: (
                - emphasis [ref=f32e9589]: int
                - text: ) The ID of the episode associated with this world. Episodes are different sessions of a simulation. These change everytime a world is disabled or reloaded. Keeping track is useful to avoid possible issues.
              - listitem [ref=f32e9590]:
                - strong [ref=f32e9591]: debug
                - text: (
                - emphasis [ref=f32e9592]:
                  - link "carla.DebugHelper" [ref=f32e9593] [cursor=pointer]:
                    - /url: "#carla.DebugHelper"
                - text: ) Responsible for creating different shapes for debugging. Take a look at its class to learn more about it.
