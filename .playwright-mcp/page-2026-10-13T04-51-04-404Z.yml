                  - text: =
                  - link "carla.SemanticLidarDetection" [ref=f32e6172] [cursor=pointer]:
                    - /url: "#carla.SemanticLidarDetection"
                - text: )
              - listitem [ref=f32e6173]:
                - strong [ref=f32e6174]: __str__
                - text: (
