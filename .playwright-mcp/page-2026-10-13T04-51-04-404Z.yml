            - heading "Dunder methods" [level=5] [ref=f32e6838]
            - list [ref=f32e6839]:
              - listitem [ref=f32e6840]:
                - strong [ref=f32e6841]: __str__
                - text: (
                - strong [ref=f32e6843]: self
                - text: )
            - separator [ref=f32e6844]
            - heading "carla.TrafficLightState" [level=2] [ref=f32e6845]
            - paragraph [ref=f32e6846]:
              - text: All possible states for traffic lights. These can either change at a specific time step or be changed manually. The snipet in
              - link "carla.TrafficLight.set_state" [ref=f32e6847] [cursor=pointer]:
                - /url: "#carla.TrafficLight.set_state"
              - text: changes the state of a traffic light on the fly.
            - heading "Instance Variables" [level=3] [ref=f32e6848]
            - list [ref=f32e6849]:
              - listitem [ref=f32e6850]:
                - strong [ref=f32e6851]: Red
              - listitem [ref=f32e6852]:
                - strong [ref=f32e6853]: Yellow
              - listitem [ref=f32e6854]:
                - strong [ref=f32e6855]: Green
              - listitem [ref=f32e6856]:
                - strong [ref=f32e6857]: "Off"
              - listitem [ref=f32e6858]:
                - strong [ref=f32e6859]: Unknown
            - separator [ref=f32e6860]
            - heading "carla.TrafficManager" [level=2] [ref=f32e6861]
            - paragraph [ref=f32e6862]:
              - text: The traffic manager is a module built on top of the CARLA API in C++. It handles any group of vehicles set to autopilot mode to populate the simulation with realistic urban traffic conditions and give the chance to user to customize some behaviours. The architecture of the traffic manager is divided in five different goal-oriented stages and a PID controller where the information flows until eventually, a
              - link "carla.VehicleControl" [ref=f32e6863] [cursor=pointer]:
                - /url: "#carla.VehicleControl"
              - text: is applied to every vehicle registered in a traffic manager. In order to learn more, visit the
              - link "documentation" [ref=f32e6864] [cursor=pointer]:
                - /url: ../adv_traffic_manager/
              - text: regarding this module.
            - heading "Methods" [level=3] [ref=f32e6865]
            - list [ref=f32e6866]:
              - listitem [ref=f32e6867]:
                - strong [ref=f32e6868]: auto_lane_change
                - text: (
                - strong [ref=f32e6870]: self
                - text: ","
                - strong [ref=f32e6872]: actor
                - text: ","
                - strong [ref=f32e6874]: enable
                - text: ) Turns on or off lane changing behaviour for a vehicle.
                - list [ref=f32e6875]:
                  - listitem [ref=f32e6876]:
                    - strong [ref=f32e6877]: "Parameters:"
                    - list [ref=f32e6878]:
                      - listitem [ref=f32e6879]:
                        - code [ref=f32e6880]: actor
                        - text: (
                        - emphasis [ref=f32e6881]:
                          - link "carla.Actor" [ref=f32e6882] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - The vehicle whose settings are changed.
                      - listitem [ref=f32e6883]:
                        - code [ref=f32e6884]: enable
                        - text: (
                        - emphasis [ref=f32e6885]: bool
                        - text: ) -
                        - strong [ref=f32e6886]: "True"
                        - text: is default and enables lane changes.
                        - strong [ref=f32e6887]: "False"
                        - text: will disable them.
              - listitem [ref=f32e6888]:
                - strong [ref=f32e6889]: collision_detection
                - text: (
                - strong [ref=f32e6891]: self
                - text: ","
                - strong [ref=f32e6893]: reference_actor
                - text: ","
                - strong [ref=f32e6895]: other_actor
                - text: ","
                - strong [ref=f32e6897]: detect_collision
                - text: ) Tunes on/off collisions between a vehicle and another specific actor. In order to ignore all other vehicles, traffic lights or walkers, use the specific
                - strong [ref=f32e6898]: ignore
                - text: methods described in this same section.
                - list [ref=f32e6899]:
                  - listitem [ref=f32e6900]:
                    - strong [ref=f32e6901]: "Parameters:"
                    - list [ref=f32e6902]:
                      - listitem [ref=f32e6903]:
                        - code [ref=f32e6904]: reference_actor
                        - text: (
                        - emphasis [ref=f32e6905]:
                          - link "carla.Actor" [ref=f32e6906] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - Vehicle that is going to ignore collisions.
                      - listitem [ref=f32e6907]:
                        - code [ref=f32e6908]: other_actor
                        - text: (
                        - emphasis [ref=f32e6909]:
                          - link "carla.Actor" [ref=f32e6910] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - The actor that
                        - code [ref=f32e6911]: reference_actor
                        - text: is going to ignore collisions with.
                      - listitem [ref=f32e6912]:
                        - code [ref=f32e6913]: detect_collision
                        - text: (
                        - emphasis [ref=f32e6914]: bool
                        - text: ) -
                        - strong [ref=f32e6915]: "True"
                        - text: is default and enables collisions.
                        - strong [ref=f32e6916]: "False"
                        - text: will disable them.
              - listitem [ref=f32e6917]:
                - strong [ref=f32e6918]: distance_to_leading_vehicle
                - text: (
                - strong [ref=f32e6920]: self
                - text: ","
                - strong [ref=f32e6922]: actor
                - text: ","
                - strong [ref=f32e6924]: distance
                - text: ) Sets the minimum distance in meters that a vehicle has to keep with the others. The distance is in meters and will affect the minimum moving distance. It is computed from front to back of the vehicle objects.
                - list [ref=f32e6925]:
                  - listitem [ref=f32e6926]:
                    - strong [ref=f32e6927]: "Parameters:"
                    - list [ref=f32e6928]:
                      - listitem [ref=f32e6929]:
                        - code [ref=f32e6930]: actor
                        - text: (
                        - emphasis [ref=f32e6931]:
                          - link "carla.Actor" [ref=f32e6932] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - Vehicle whose minimum distance is being changed.
                      - listitem [ref=f32e6933]:
                        - code [ref=f32e6934]: distance
                        - text: (
                        - emphasis [ref=f32e6935]: float - meters
                        - text: ) - Meters between both vehicles.
              - listitem [ref=f32e6936]:
                - strong [ref=f32e6937]: force_lane_change
                - text: (
                - strong [ref=f32e6939]: self
                - text: ","
                - strong [ref=f32e6941]: actor
                - text: ","
                - strong [ref=f32e6943]: direction
                - text: ) Forces a vehicle to change either to the lane on its left or right, if existing, as indicated in
                - code [ref=f32e6944]: direction
                - text: . This method applies the lane change no matter what, disregarding possible collisions.
                - list [ref=f32e6945]:
                  - listitem [ref=f32e6946]:
                    - strong [ref=f32e6947]: "Parameters:"
                    - list [ref=f32e6948]:
                      - listitem [ref=f32e6949]:
                        - code [ref=f32e6950]: actor
                        - text: (
                        - emphasis [ref=f32e6951]:
                          - link "carla.Actor" [ref=f32e6952] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - Vehicle being forced to change lanes.
                      - listitem [ref=f32e6953]:
                        - code [ref=f32e6954]: direction
                        - text: (
                        - emphasis [ref=f32e6955]: bool
                        - text: ) - Destination lane.
                        - strong [ref=f32e6956]: "True"
                        - text: is the one on the right and
                        - strong [ref=f32e6957]: "False"
                        - text: is the left one.
              - listitem [ref=f32e6958]:
                - strong [ref=f32e6959]: global_lane_offset
                - text: (
                - strong [ref=f32e6961]: self
                - text: ","
                - strong [ref=f32e6963]: offset
                - text: ) Sets a global lane offset displacement from the center line. Positive values imply a right offset while negative ones mean a left one. Default is 0. Numbers high enough to cause the vehicle to drive through other lanes might break the controller.
                - list [ref=f32e6964]:
                  - listitem [ref=f32e6965]:
                    - strong [ref=f32e6966]: "Parameters:"
                    - list [ref=f32e6967]:
                      - listitem [ref=f32e6968]:
                        - code [ref=f32e6969]: offset
                        - text: (
                        - emphasis [ref=f32e6970]: float
                        - text: ) - Lane offset displacement from the center line.
              - listitem [ref=f32e6971]:
                - strong [ref=f32e6972]: global_percentage_speed_difference
                - text: (
                - strong [ref=f32e6974]: self
                - text: ","
                - strong [ref=f32e6976]: percentage
                - text: ) Sets the difference the vehicle's intended speed and its current speed limit. Speed limits can be exceeded by setting the
                - code [ref=f32e6977]: perc
                - text: to a negative value. Default is 30. Exceeding a speed limit can be done using negative percentages.
                - list [ref=f32e6978]:
                  - listitem [ref=f32e6979]:
                    - strong [ref=f32e6980]: "Parameters:"
                    - list [ref=f32e6981]:
                      - listitem [ref=f32e6982]:
                        - code [ref=f32e6983]: percentage
                        - text: (
                        - emphasis [ref=f32e6984]: float
                        - text: ) - Percentage difference between intended speed and the current limit.
              - listitem [ref=f32e6985]:
                - strong [ref=f32e6986]: ignore_lights_percentage
                - text: (
                - strong [ref=f32e6988]: self
                - text: ","
                - strong [ref=f32e6990]: actor
                - text: ","
                - strong [ref=f32e6992]: perc
                - text: ) During the traffic light stage, which runs every frame, this method sets the percent chance that traffic lights will be ignored for a vehicle.
                - list [ref=f32e6993]:
                  - listitem [ref=f32e6994]:
                    - strong [ref=f32e6995]: "Parameters:"
                    - list [ref=f32e6996]:
                      - listitem [ref=f32e6997]:
                        - code [ref=f32e6998]: actor
                        - text: (
                        - emphasis [ref=f32e6999]:
                          - link "carla.Actor" [ref=f32e7000] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - The actor that is going to ignore traffic lights.
                      - listitem [ref=f32e7001]:
                        - code [ref=f32e7002]: perc
                        - text: (
                        - emphasis [ref=f32e7003]: float
                        - text: ) - Between 0 and 100. Amount of times traffic lights will be ignored.
              - listitem [ref=f32e7004]:
                - strong [ref=f32e7005]: ignore_signs_percentage
                - text: (
                - strong [ref=f32e7007]: self
                - text: ","
                - strong [ref=f32e7009]: actor
                - text: ","
                - strong [ref=f32e7011]: perc
                - text: ) During the traffic light stage, which runs every frame, this method sets the percent chance that stop signs will be ignored for a vehicle.
                - list [ref=f32e7012]:
                  - listitem [ref=f32e7013]:
                    - strong [ref=f32e7014]: "Parameters:"
                    - list [ref=f32e7015]:
                      - listitem [ref=f32e7016]:
                        - code [ref=f32e7017]: actor
                        - text: (
                        - emphasis [ref=f32e7018]:
                          - link "carla.Actor" [ref=f32e7019] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - The actor that is going to ignore stop signs.
                      - listitem [ref=f32e7020]:
                        - code [ref=f32e7021]: perc
                        - text: (
                        - emphasis [ref=f32e7022]: float
                        - text: ) - Between 0 and 100. Amount of times stop signs will be ignored.
              - listitem [ref=f32e7023]:
                - strong [ref=f32e7024]: ignore_vehicles_percentage
                - text: (
                - strong [ref=f32e7026]: self
                - text: ","
                - strong [ref=f32e7028]: actor
                - text: ","
                - strong [ref=f32e7030]: perc
                - text: ) During the collision detection stage, which runs every frame, this method sets a percent chance that collisions with another vehicle will be ignored for a vehicle.
                - list [ref=f32e7031]:
                  - listitem [ref=f32e7032]:
                    - strong [ref=f32e7033]: "Parameters:"
                    - list [ref=f32e7034]:
                      - listitem [ref=f32e7035]:
                        - code [ref=f32e7036]: actor
                        - text: (
                        - emphasis [ref=f32e7037]:
                          - link "carla.Actor" [ref=f32e7038] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - The vehicle that is going to ignore other vehicles.
                      - listitem [ref=f32e7039]:
                        - code [ref=f32e7040]: perc
                        - text: (
                        - emphasis [ref=f32e7041]: float
                        - text: ) - Between 0 and 100. Amount of times collisions will be ignored.
              - listitem [ref=f32e7042]:
                - strong [ref=f32e7043]: ignore_walkers_percentage
                - text: (
                - strong [ref=f32e7045]: self
                - text: ","
                - strong [ref=f32e7047]: actor
                - text: ","
                - strong [ref=f32e7049]: perc
                - text: ) During the collision detection stage, which runs every frame, this method sets a percent chance that collisions with walkers will be ignored for a vehicle.
                - list [ref=f32e7050]:
                  - listitem [ref=f32e7051]:
                    - strong [ref=f32e7052]: "Parameters:"
                    - list [ref=f32e7053]:
                      - listitem [ref=f32e7054]:
                        - code [ref=f32e7055]: actor
                        - text: (
                        - emphasis [ref=f32e7056]:
                          - link "carla.Actor" [ref=f32e7057] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - The vehicle that is going to ignore walkers on scene.
                      - listitem [ref=f32e7058]:
                        - code [ref=f32e7059]: perc
                        - text: (
                        - emphasis [ref=f32e7060]: float
                        - text: ) - Between 0 and 100. Amount of times collisions will be ignored.
              - listitem [ref=f32e7061]:
                - strong [ref=f32e7062]: keep_slow_lane_rule_percentage
                - text: (
                - strong [ref=f32e7064]: self
                - text: ","
                - strong [ref=f32e7066]: actor
                - text: ","
                - strong [ref=f32e7068]: perc
                - text: ) During the localization stage, this method sets a percent chance that vehicle will follow the
                - emphasis [ref=f32e7069]: keep slow lane
                - text: rule, and stay in the slowest lane. For right-handed traffic, vehicles will move to the righmost lane while left-handed traffic will make vehicles move to the left.
                - list [ref=f32e7070]:
                  - listitem [ref=f32e7071]:
                    - strong [ref=f32e7072]: "Parameters:"
                    - list [ref=f32e7073]:
                      - listitem [ref=f32e7074]:
                        - code [ref=f32e7075]: actor
                        - text: (
                        - emphasis [ref=f32e7076]:
                          - link "carla.Actor" [ref=f32e7077] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - Vehicle whose behaviour is being changed.
                      - listitem [ref=f32e7078]:
                        - code [ref=f32e7079]: perc
                        - text: (
                        - emphasis [ref=f32e7080]: float
                        - text: ) - Between 0 and 100. Amount of times the vehicle will follow the keep slow lane rule.
              - listitem [ref=f32e7081]:
                - strong [ref=f32e7082]: random_left_lanechange_percentage
                - text: (
                - strong [ref=f32e7084]: self
                - text: ","
                - strong [ref=f32e7086]: actor
                - text: ","
                - strong [ref=f32e7088]: percentage
                - text: ) Adjust probability that in each timestep the actor will perform a left lane change, dependent on lane change availability.
                - list [ref=f32e7089]:
                  - listitem [ref=f32e7090]:
                    - strong [ref=f32e7091]: "Parameters:"
                    - list [ref=f32e7092]:
                      - listitem [ref=f32e7093]:
                        - code [ref=f32e7094]: actor
                        - text: (
                        - emphasis [ref=f32e7095]:
                          - link "carla.Actor" [ref=f32e7096] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - The actor that you wish to query.
                      - listitem [ref=f32e7097]:
                        - code [ref=f32e7098]: percentage
                        - text: (
                        - emphasis [ref=f32e7099]: float
                        - text: ) - The probability of lane change in percentage units (between 0 and 100).
              - listitem [ref=f32e7100]:
                - strong [ref=f32e7101]: random_right_lanechange_percentage
                - text: (
                - strong [ref=f32e7103]: self
                - text: ","
                - strong [ref=f32e7105]: actor
                - text: ","
                - strong [ref=f32e7107]: percentage
                - text: ) Adjust probability that in each timestep the actor will perform a right lane change, dependent on lane change availability.
                - list [ref=f32e7108]:
                  - listitem [ref=f32e7109]:
                    - strong [ref=f32e7110]: "Parameters:"
                    - list [ref=f32e7111]:
                      - listitem [ref=f32e7112]:
                        - code [ref=f32e7113]: actor
                        - text: (
                        - emphasis [ref=f32e7114]:
                          - link "carla.Actor" [ref=f32e7115] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - The actor that you wish to query.
                      - listitem [ref=f32e7116]:
                        - code [ref=f32e7117]: percentage
                        - text: (
                        - emphasis [ref=f32e7118]: float
                        - text: ) - The probability of lane change in percentage units (between 0 and 100).
              - listitem [ref=f32e7119]:
                - strong [ref=f32e7120]: shut_down
                - text: (
                - strong [ref=f32e7122]: self
                - text: ) Shuts down the traffic manager.
              - listitem [ref=f32e7123]:
                - strong [ref=f32e7124]: update_vehicle_lights
                - text: (
                - strong [ref=f32e7126]: self
                - text: ","
                - strong [ref=f32e7128]: actor
                - text: ","
                - strong [ref=f32e7130]: do_update
                - text: ) Sets if the Traffic Manager is responsible of updating the vehicle lights, or not. Default is
                - strong [ref=f32e7131]: "False"
                - text: . The traffic manager will not change the vehicle light status of a vehicle, unless its auto_update_status is st to
                - strong [ref=f32e7132]: "True"
                - text: .
                - list [ref=f32e7133]:
                  - listitem [ref=f32e7134]:
                    - strong [ref=f32e7135]: "Parameters:"
                    - list [ref=f32e7136]:
                      - listitem [ref=f32e7137]:
                        - code [ref=f32e7138]: actor
                        - text: (
                        - emphasis [ref=f32e7139]:
                          - link "carla.Actor" [ref=f32e7140] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - Vehicle whose lights status is being changed.
                      - listitem [ref=f32e7141]:
                        - code [ref=f32e7142]: do_update
                        - text: (
                        - emphasis [ref=f32e7143]: bool
                        - text: ) - If
                        - strong [ref=f32e7144]: "True"
                        - text: the traffic manager will manage the vehicle lights for the specified vehicle.
              - listitem [ref=f32e7145]:
                - strong [ref=f32e7146]: vehicle_lane_offset
                - text: (
                - strong [ref=f32e7148]: self
                - text: ","
                - strong [ref=f32e7150]: actor
                - text: ","
                - strong [ref=f32e7152]: offset
                - text: ) Sets a lane offset displacement from the center line. Positive values imply a right offset while negative ones mean a left one. Default is 0. Numbers high enough to cause the vehicle to drive through other lanes might break the controller.
                - list [ref=f32e7153]:
                  - listitem [ref=f32e7154]:
                    - strong [ref=f32e7155]: "Parameters:"
                    - list [ref=f32e7156]:
                      - listitem [ref=f32e7157]:
                        - code [ref=f32e7158]: actor
                        - text: (
                        - emphasis [ref=f32e7159]:
                          - link "carla.Actor" [ref=f32e7160] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - Vehicle whose lane offset behaviour is being changed.
                      - listitem [ref=f32e7161]:
                        - code [ref=f32e7162]: offset
                        - text: (
                        - emphasis [ref=f32e7163]: float
                        - text: ) - Lane offset displacement from the center line.
              - listitem [ref=f32e7164]:
                - strong [ref=f32e7165]: vehicle_percentage_speed_difference
                - text: (
                - strong [ref=f32e7167]: self
                - text: ","
                - strong [ref=f32e7169]: actor
                - text: ","
                - strong [ref=f32e7171]: percentage
                - text: ) Sets the difference the vehicle's intended speed and its current speed limit. Speed limits can be exceeded by setting the
                - code [ref=f32e7172]: perc
                - text: to a negative value. Default is 30. Exceeding a speed limit can be done using negative percentages.
                - list [ref=f32e7173]:
                  - listitem [ref=f32e7174]:
                    - strong [ref=f32e7175]: "Parameters:"
                    - list [ref=f32e7176]:
                      - listitem [ref=f32e7177]:
                        - code [ref=f32e7178]: actor
                        - text: (
                        - emphasis [ref=f32e7179]:
                          - link "carla.Actor" [ref=f32e7180] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - Vehicle whose speed behaviour is being changed.
                      - listitem [ref=f32e7181]:
                        - code [ref=f32e7182]: percentage
                        - text: (
                        - emphasis [ref=f32e7183]: float
                        - text: ) - Percentage difference between intended speed and the current limit.
            - heading "Getters" [level=5] [ref=f32e7184]
            - list [ref=f32e7185]:
              - listitem [ref=f32e7186]:
                - strong [ref=f32e7187]: get_all_actions
                - text: (
                - strong [ref=f32e7189]: self
                - text: ","
                - strong [ref=f32e7191]: actor
                - text: ) Returns all known actions (i.e. road options and waypoints) that an actor controlled by the Traffic Manager will perform in its next steps.
                - list [ref=f32e7192]:
                  - listitem [ref=f32e7193]:
                    - strong [ref=f32e7194]: "Parameters:"
                    - list [ref=f32e7195]:
                      - listitem [ref=f32e7196]:
                        - code [ref=f32e7197]: actor
                        - text: (
                        - emphasis [ref=f32e7198]:
                          - link "carla.Actor" [ref=f32e7199] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - The actor that you wish to query.
                  - listitem [ref=f32e7200]:
                    - strong [ref=f32e7201]: "Return:"
                    - emphasis [ref=f32e7202]:
                      - text: list of lists with each element as follows - [Road option (string e.g. 'Left', 'Right', 'Straight'), Next waypoint (
                      - link "carla.Waypoint" [ref=f32e7203] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
                      - text: )]
              - listitem [ref=f32e7204]:
                - strong [ref=f32e7205]: get_next_action
                - text: (
                - strong [ref=f32e7207]: self
                - text: ","
                - strong [ref=f32e7209]: actor
                - text: ) Returns the next known road option and waypoint that an actor controlled by the Traffic Manager will follow.
                - list [ref=f32e7210]:
                  - listitem [ref=f32e7211]:
                    - strong [ref=f32e7212]: "Parameters:"
                    - list [ref=f32e7213]:
                      - listitem [ref=f32e7214]:
                        - code [ref=f32e7215]: actor
                        - text: (
                        - emphasis [ref=f32e7216]:
                          - link "carla.Actor" [ref=f32e7217] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - The actor that you wish to query.
                  - listitem [ref=f32e7218]:
                    - strong [ref=f32e7219]: "Return:"
                    - emphasis [ref=f32e7220]:
                      - text: list of two elements - [Road option (string e.g. 'Left', 'Right', 'Straight'), Next waypoint (
                      - link "carla.Waypoint" [ref=f32e7221] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
                      - text: )]
              - listitem [ref=f32e7222]:
                - strong [ref=f32e7223]: get_port
                - text: (
                - strong [ref=f32e7225]: self
                - text: ) Returns the port where the Traffic Manager is connected. If the object is a TM-Client, it will return the port of its TM-Server. Read the
                - link "documentation" [ref=f32e7226] [cursor=pointer]:
                  - /url: "#adv_traffic_manager.md#multiclient-and-multitm-management"
                - text: to learn the difference.
                - list [ref=f32e7227]:
                  - listitem [ref=f32e7228]:
                    - strong [ref=f32e7229]: "Return:"
                    - emphasis [ref=f32e7230]: uint16
            - heading "Setters" [level=5] [ref=f32e7231]
            - list [ref=f32e7232]:
              - listitem [ref=f32e7233]:
                - strong [ref=f32e7234]: set_boundaries_respawn_dormant_vehicles
                - text: (
                - strong [ref=f32e7236]: self
                - text: ","
                - generic [ref=f32e7237]:
                  - strong [ref=f32e7238]: lower_bound
                  - text: =25.0
                - text: ","
                - generic [ref=f32e7239]:
                  - strong [ref=f32e7240]: upper_bound
                  - text: =actor_active_distance
                - text: ) Sets the upper and lower boundaries for dormant actors to be respawned near the hero vehicle.
                - list [ref=f32e7241]:
                  - listitem [ref=f32e7242]:
                    - strong [ref=f32e7243]: "Parameters:"
                    - list [ref=f32e7244]:
                      - listitem [ref=f32e7245]:
                        - code [ref=f32e7246]: lower_bound
                        - text: (
                        - emphasis [ref=f32e7247]: float
                        - text: ) - The minimum distance in meters from the hero vehicle that a dormant actor will be respawned.
                      - listitem [ref=f32e7248]:
                        - code [ref=f32e7249]: upper_bound
                        - text: (
                        - emphasis [ref=f32e7250]: float
                        - text: ) - The maximum distance in meters from the hero vehicle that a dormant actor will be respawned.
                  - listitem [ref=f32e7251]:
                    - strong [ref=f32e7252]: "Warning:"
                    - emphasis [ref=f32e7254]:
                      - text: The
                      - code [ref=f32e7255]: upper_bound
                      - text: cannot be higher than the
                      - code [ref=f32e7256]: actor_active_distance
                      - text: . The
                      - code [ref=f32e7257]: lower_bound
                      - text: cannot be less than 25.
              - listitem [ref=f32e7258]:
                - strong [ref=f32e7259]: set_desired_speed
                - text: (
                - strong [ref=f32e7261]: self
                - text: ","
                - strong [ref=f32e7263]: actor
                - text: ","
                - strong [ref=f32e7265]: speed
                - text: ) Sets the speed of a vehicle to the specified value.
                - list [ref=f32e7266]:
                  - listitem [ref=f32e7267]:
                    - strong [ref=f32e7268]: "Parameters:"
                    - list [ref=f32e7269]:
                      - listitem [ref=f32e7270]:
                        - code [ref=f32e7271]: actor
                        - text: (
                        - emphasis [ref=f32e7272]:
                          - link "carla.Actor" [ref=f32e7273] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - Vehicle whose speed is being changed.
                      - listitem [ref=f32e7274]:
                        - code [ref=f32e7275]: speed
                        - text: (
                        - emphasis [ref=f32e7276]: float
                        - text: ) - Desired speed at which the vehicle will move.
              - listitem [ref=f32e7277]:
                - strong [ref=f32e7278]: set_global_distance_to_leading_vehicle
                - text: (
                - strong [ref=f32e7280]: self
                - text: ","
                - strong [ref=f32e7282]: distance
                - text: ) Sets the minimum distance in meters that vehicles have to keep with the rest. The distance is in meters and will affect the minimum moving distance. It is computed from center to center of the vehicle objects.
                - list [ref=f32e7283]:
                  - listitem [ref=f32e7284]:
                    - strong [ref=f32e7285]: "Parameters:"
                    - list [ref=f32e7286]:
                      - listitem [ref=f32e7287]:
                        - code [ref=f32e7288]: distance
                        - text: (
                        - emphasis [ref=f32e7289]: float - meters
                        - text: ) - Meters between vehicles.
              - listitem [ref=f32e7290]:
                - strong [ref=f32e7291]: set_hybrid_physics_mode
                - text: (
                - strong [ref=f32e7293]: self
                - text: ","
                - generic [ref=f32e7294]:
                  - strong [ref=f32e7295]: enabled
                  - text: =False
                - text: ) Enables or disables the hybrid physics mode. In this mode, vehicle's farther than a certain radius from the ego vehicle will have their physics disabled. Computation cost will be reduced by not calculating vehicle dynamics. Vehicles will be teleported.
                - list [ref=f32e7296]:
                  - listitem [ref=f32e7297]:
                    - strong [ref=f32e7298]: "Parameters:"
                    - list [ref=f32e7299]:
                      - listitem [ref=f32e7300]:
                        - code [ref=f32e7301]: enabled
                        - text: (
                        - emphasis [ref=f32e7302]: bool
                        - text: ) - If
                        - strong [ref=f32e7303]: "True"
                        - text: ", enables the hybrid physics."
              - listitem [ref=f32e7304]:
                - strong [ref=f32e7305]: set_hybrid_physics_radius
                - text: (
                - strong [ref=f32e7307]: self
                - text: ","
                - generic [ref=f32e7308]:
                  - strong [ref=f32e7309]: r
                  - text: =50.0
                - text: ) With hybrid physics on, changes the radius of the area of influence where physics are enabled.
                - list [ref=f32e7310]:
                  - listitem [ref=f32e7311]:
                    - strong [ref=f32e7312]: "Parameters:"
                    - list [ref=f32e7313]:
                      - listitem [ref=f32e7314]:
                        - code [ref=f32e7315]: r
                        - text: (
                        - emphasis [ref=f32e7316]: float - meters
                        - text: ) - New radius where physics are enabled.
              - listitem [ref=f32e7317]:
                - strong [ref=f32e7318]: set_osm_mode
                - text: (
                - strong [ref=f32e7320]: self
                - text: ","
                - generic [ref=f32e7321]:
                  - strong [ref=f32e7322]: mode_switch
                  - text: =True
                - text: ) Enables or disables the OSM mode. This mode allows the user to run TM in a map created with the
                - link "OSM feature" [ref=f32e7323] [cursor=pointer]:
                  - /url: ../tuto_G_openstreetmap/
                - text: . These maps allow having dead-end streets. Normally, if vehicles cannot find the next waypoint, TM crashes. If OSM mode is enabled, it will show a warning, and destroy vehicles when necessary.
                - list [ref=f32e7324]:
                  - listitem [ref=f32e7325]:
                    - strong [ref=f32e7326]: "Parameters:"
                    - list [ref=f32e7327]:
                      - listitem [ref=f32e7328]:
                        - code [ref=f32e7329]: mode_switch
                        - text: (
                        - emphasis [ref=f32e7330]: bool
                        - text: ) - If
                        - strong [ref=f32e7331]: "True"
                        - text: ", the OSM mode is enabled."
              - listitem [ref=f32e7332]:
                - strong [ref=f32e7333]: set_path
                - text: (
                - strong [ref=f32e7335]: self
                - text: ","
                - strong [ref=f32e7337]: actor
                - text: ","
                - strong [ref=f32e7339]: path
                - text: ) Sets a list of locations for a vehicle to follow while controlled by the Traffic Manager.
                - list [ref=f32e7340]:
                  - listitem [ref=f32e7341]:
                    - strong [ref=f32e7342]: "Parameters:"
                    - list [ref=f32e7343]:
                      - listitem [ref=f32e7344]:
                        - code [ref=f32e7345]: actor
                        - text: (
                        - emphasis [ref=f32e7346]:
                          - link "carla.Actor" [ref=f32e7347] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - The actor that must follow the given path.
                      - listitem [ref=f32e7348]:
                        - code [ref=f32e7349]: path
                        - text: (
                        - emphasis [ref=f32e7350]: list
                        - text: ) - The list of
                        - link "carla.Locations" [ref=f32e7351] [cursor=pointer]:
                          - /url: "#carla.Locations"
                        - text: for the actor to follow.
                  - listitem [ref=f32e7352]:
                    - strong [ref=f32e7353]: "Warning:"
                    - emphasis [ref=f32e7355]: Ensure that the road topology doesn't impede the given path.
              - listitem [ref=f32e7356]:
                - strong [ref=f32e7357]: set_random_device_seed
                - text: (
                - strong [ref=f32e7359]: self
                - text: ","
                - strong [ref=f32e7361]: value
                - text: ) Sets a specific random seed for the Traffic Manager, thereby setting it to be deterministic.
                - list [ref=f32e7362]:
                  - listitem [ref=f32e7363]:
                    - strong [ref=f32e7364]: "Parameters:"
                    - list [ref=f32e7365]:
                      - listitem [ref=f32e7366]:
                        - code [ref=f32e7367]: value
                        - text: (
                        - emphasis [ref=f32e7368]: int
                        - text: ) - Seed value for the random number generation of the Traffic Manager.
              - listitem [ref=f32e7369]:
                - strong [ref=f32e7370]: set_respawn_dormant_vehicles
                - text: (
                - strong [ref=f32e7372]: self
                - text: ","
                - generic [ref=f32e7373]:
                  - strong [ref=f32e7374]: mode_switch
                  - text: =False
                - text: ) If
                - strong [ref=f32e7375]: "True"
                - text: ", vehicles in large maps will respawn near the hero vehicle when they become dormant. Otherwise, they will stay dormant until they are within"
                - code [ref=f32e7376]: actor_active_distance
                - text: of the hero vehicle again.
                - list [ref=f32e7377]:
                  - listitem [ref=f32e7378]:
                    - strong [ref=f32e7379]: "Parameters:"
                    - list [ref=f32e7380]:
                      - listitem [ref=f32e7381]:
                        - code [ref=f32e7382]: mode_switch
                        - text: (
                        - emphasis [ref=f32e7383]: bool
                        - text: )
              - listitem [ref=f32e7384]:
                - strong [ref=f32e7385]: set_route
                - text: (
                - strong [ref=f32e7387]: self
                - text: ","
                - strong [ref=f32e7389]: actor
                - text: ","
                - strong [ref=f32e7391]: path
                - text: ) Sets a list of route instructions for a vehicle to follow while controlled by the Traffic Manager. The possible route instructions are 'Left', 'Right', 'Straight'.
                - list [ref=f32e7392]:
                  - listitem [ref=f32e7393]:
                    - strong [ref=f32e7394]: "Parameters:"
                    - list [ref=f32e7395]:
                      - listitem [ref=f32e7396]:
                        - code [ref=f32e7397]: actor
                        - text: (
                        - emphasis [ref=f32e7398]:
                          - link "carla.Actor" [ref=f32e7399] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - The actor that must follow the given route instructions.
                      - listitem [ref=f32e7400]:
                        - code [ref=f32e7401]: path
                        - text: (
                        - emphasis [ref=f32e7402]: list
                        - text: ) - The list of route instructions (string) for the vehicle to follow.
                  - listitem [ref=f32e7403]:
                    - strong [ref=f32e7404]: "Warning:"
                    - emphasis [ref=f32e7406]: Ensure that the lane topology doesn't impede the given route.
              - listitem [ref=f32e7407]:
                - strong [ref=f32e7408]: set_synchronous_mode
                - text: (
                - strong [ref=f32e7410]: self
                - text: ","
                - generic [ref=f32e7411]:
                  - strong [ref=f32e7412]: mode_switch
                  - text: =True
                - text: ) Sets the Traffic Manager to
                - link "synchronous mode" [ref=f32e7413] [cursor=pointer]:
                  - /url: ../adv_traffic_manager/#synchronous-mode
                - text: . In a
                - link "multiclient situation" [ref=f32e7414] [cursor=pointer]:
                  - /url: ../adv_traffic_manager/#multiclient
                - text: ", only the TM-Server can tick. Similarly, in a"
                - link "multiTM situation" [ref=f32e7415] [cursor=pointer]:
                  - /url: ../adv_traffic_manager/#multitm
                - text: ", only one TM-Server must tick. Use this method in the client that does the world tick, and right after setting the world to synchronous mode, to set which TM will be the master while in sync."
                - list [ref=f32e7416]:
                  - listitem [ref=f32e7417]:
                    - strong [ref=f32e7418]: "Parameters:"
                    - list [ref=f32e7419]:
                      - listitem [ref=f32e7420]:
                        - code [ref=f32e7421]: mode_switch
                        - text: (
                        - emphasis [ref=f32e7422]: bool
                        - text: ) - If
                        - strong [ref=f32e7423]: "True"
                        - text: ", the TM synchronous mode is enabled."
                  - listitem [ref=f32e7424]:
                    - strong [ref=f32e7425]: "Warning:"
                    - emphasis [ref=f32e7427]: If the server is set to synchronous mode, the TM must be set to synchronous mode too in the same client that does the tick.
            - separator [ref=f32e7428]
            - heading "carla.TrafficSign" [level=2] [ref=f32e7429]
            - paragraph [ref=f32e7430]:
              - generic [ref=f32e7431]:
                - text: Inherited from
                - emphasis [ref=f32e7432]:
                  - link "carla.Actor" [ref=f32e7433] [cursor=pointer]:
                    - /url: "#carla.Actor"
              - text: Traffic signs appearing in the simulation except for traffic lights. These have their own class inherited from this in
              - link "carla.TrafficLight" [ref=f32e7434] [cursor=pointer]:
                - /url: "#carla.TrafficLight"
              - text: . Right now, speed signs, stops and yields are mainly the ones implemented, but many others are borne in mind.
            - heading "Instance Variables" [level=3] [ref=f32e7435]
            - list [ref=f32e7436]:
              - listitem [ref=f32e7437]:
                - strong [ref=f32e7438]: trigger_volume
                - text: A
                - link "carla.BoundingBox" [ref=f32e7439] [cursor=pointer]:
                  - /url: "#carla.BoundingBox"
                - text: situated near a traffic sign where the
                - link "carla.Actor" [ref=f32e7440] [cursor=pointer]:
                  - /url: "#carla.Actor"
                - text: who is inside can know about it.
            - separator [ref=f32e7441]
            - heading "carla.Transform" [level=2] [ref=f32e7442]
            - paragraph [ref=f32e7443]: Class that defines a transformation, a combination of location and rotation, without scaling.
            - heading "Instance Variables" [level=3] [ref=f32e7444]
            - list [ref=f32e7445]:
              - listitem [ref=f32e7446]:
                - strong [ref=f32e7447]: location
                - text: (
                - emphasis [ref=f32e7448]:
                  - link "carla.Location" [ref=f32e7449] [cursor=pointer]:
                    - /url: "#carla.Location"
                - text: ) Describes a point in the coordinate system.
              - listitem [ref=f32e7450]:
                - strong [ref=f32e7451]: rotation
                - text: (
                - emphasis [ref=f32e7452]:
                  - link "carla.Rotation" [ref=f32e7453] [cursor=pointer]:
                    - /url: "#carla.Rotation"
                  - text: "- degrees (pitch, yaw, roll)"
                - text: ) Describes a rotation for an object according to Unreal Engine's axis system.
            - heading "Methods" [level=3] [ref=f32e7454]
            - list [ref=f32e7455]:
              - listitem [ref=f32e7456]:
                - strong [ref=f32e7457]: __init__
                - text: (
                - strong [ref=f32e7459]: self
                - text: ","
                - strong [ref=f32e7461]: location
                - text: ","
                - strong [ref=f32e7463]: rotation
                - text: )
                - list [ref=f32e7464]:
                  - listitem [ref=f32e7465]:
                    - strong [ref=f32e7466]: "Parameters:"
                    - list [ref=f32e7467]:
                      - listitem [ref=f32e7468]:
                        - code [ref=f32e7469]: location
                        - text: (
                        - emphasis [ref=f32e7470]:
                          - link "carla.Location" [ref=f32e7471] [cursor=pointer]:
                            - /url: "#carla.Location"
                        - text: )
                      - listitem [ref=f32e7472]:
                        - code [ref=f32e7473]: rotation
                        - text: (
                        - emphasis [ref=f32e7474]:
                          - link "carla.Rotation" [ref=f32e7475] [cursor=pointer]:
                            - /url: "#carla.Rotation"
                          - text: "- degrees (pitch, yaw, roll)"
                        - text: )
              - listitem [ref=f32e7476]:
                - strong [ref=f32e7477]: inverse_transform
                - text: (
                - strong [ref=f32e7479]: self
                - text: ","
                - strong [ref=f32e7481]: in_point
                - text: ) Translates a 3D point from global to local coordinates using the current transformation as frame of reference.
                - list [ref=f32e7482]:
                  - listitem [ref=f32e7483]:
                    - strong [ref=f32e7484]: "Parameters:"
                    - list [ref=f32e7485]:
                      - listitem [ref=f32e7486]:
                        - code [ref=f32e7487]: in_point
                        - text: (
                        - emphasis [ref=f32e7488]:
                          - link "carla.Location" [ref=f32e7489] [cursor=pointer]:
                            - /url: "#carla.Location"
                        - text: ) - Location in global to which the inverse transformation will be applied.
              - listitem [ref=f32e7490]:
                - strong [ref=f32e7491]: transform
                - text: (
                - strong [ref=f32e7493]: self
                - text: ","
                - strong [ref=f32e7495]: in_point
                - text: ) Translates a 3D point from local to global coordinates using the current transformation as frame of reference.
                - list [ref=f32e7496]:
                  - listitem [ref=f32e7497]:
                    - strong [ref=f32e7498]: "Parameters:"
                    - list [ref=f32e7499]:
                      - listitem [ref=f32e7500]:
                        - code [ref=f32e7501]: in_point
                        - text: (
                        - emphasis [ref=f32e7502]:
                          - link "carla.Location" [ref=f32e7503] [cursor=pointer]:
                            - /url: "#carla.Location"
                        - text: ) - Location in the space to which the transformation will be applied.
              - listitem [ref=f32e7504]:
                - strong [ref=f32e7505]: transform_vector
                - text: (
                - strong [ref=f32e7507]: self
                - text: ","
                - strong [ref=f32e7509]: in_vector
                - text: ) Rotates a vector using the current transformation as frame of reference, without applying translation. Use this to transform, for example, a velocity.
                - list [ref=f32e7510]:
                  - listitem [ref=f32e7511]:
                    - strong [ref=f32e7512]: "Parameters:"
                    - list [ref=f32e7513]:
                      - listitem [ref=f32e7514]:
                        - code [ref=f32e7515]: in_vector
                        - text: (
                        - emphasis [ref=f32e7516]:
                          - link "carla.Vector3D" [ref=f32e7517] [cursor=pointer]:
                            - /url: "#carla.Vector3D"
                        - text: ) - Vector to which the transformation will be applied.
            - heading "Getters" [level=5] [ref=f32e7518]
            - list [ref=f32e7519]:
              - listitem [ref=f32e7520]:
                - strong [ref=f32e7521]: get_forward_vector
                - text: (
                - strong [ref=f32e7523]: self
                - text: ) Computes a forward vector using the rotation of the object.
                - list [ref=f32e7524]:
                  - listitem [ref=f32e7525]:
                    - strong [ref=f32e7526]: "Return:"
                    - emphasis [ref=f32e7527]:
                      - link "carla.Vector3D" [ref=f32e7528] [cursor=pointer]:
                        - /url: "#carla.Vector3D"
              - listitem [ref=f32e7529]:
                - strong [ref=f32e7530]: get_inverse_matrix
                - text: (
                - strong [ref=f32e7532]: self
                - text: ) Computes the 4-matrix representation of the inverse transformation.
                - list [ref=f32e7533]:
                  - listitem [ref=f32e7534]:
                    - strong [ref=f32e7535]: "Return:"
                    - emphasis [ref=f32e7536]: list(list(float))
              - listitem [ref=f32e7537]:
                - strong [ref=f32e7538]: get_matrix
                - text: (
                - strong [ref=f32e7540]: self
                - text: ) Computes the 4-matrix representation of the transformation.
                - list [ref=f32e7541]:
                  - listitem [ref=f32e7542]:
                    - strong [ref=f32e7543]: "Return:"
                    - emphasis [ref=f32e7544]: list(list(float))
              - listitem [ref=f32e7545]:
                - strong [ref=f32e7546]: get_right_vector
                - text: (
                - strong [ref=f32e7548]: self
                - text: ) Computes a right vector using the rotation of the object.
                - list [ref=f32e7549]:
                  - listitem [ref=f32e7550]:
                    - strong [ref=f32e7551]: "Return:"
                    - emphasis [ref=f32e7552]:
                      - link "carla.Vector3D" [ref=f32e7553] [cursor=pointer]:
                        - /url: "#carla.Vector3D"
              - listitem [ref=f32e7554]:
                - strong [ref=f32e7555]: get_up_vector
                - text: (
                - strong [ref=f32e7557]: self
                - text: ) Computes an up vector using the rotation of the object.
                - list [ref=f32e7558]:
