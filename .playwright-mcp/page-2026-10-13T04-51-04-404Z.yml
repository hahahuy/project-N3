                  - strong [ref=f32e8714]: wheels
                  - text: =list()
                - text: ","
                - generic [ref=f32e8715]:
                  - strong [ref=f32e8716]: use_sweep_wheel_collision
                  - text: =False
                - text: ","
                - generic [ref=f32e8717]:
                  - strong [ref=f32e8718]: mass
                  - text: =1000.0
                - text: ) VehiclePhysicsControl constructor.
                - list [ref=f32e8719]:
                  - listitem [ref=f32e8720]:
                    - strong [ref=f32e8721]: "Parameters:"
                    - list [ref=f32e8722]:
                      - listitem [ref=f32e8723]:
                        - code [ref=f32e8724]: torque_curve
                        - text: (
                        - emphasis [ref=f32e8725]:
                          - text: list(
                          - link "carla.Vector2D" [ref=f32e8726] [cursor=pointer]:
                            - /url: "#carla.Vector2D"
                          - text: )
                        - text: )
                      - listitem [ref=f32e8727]:
