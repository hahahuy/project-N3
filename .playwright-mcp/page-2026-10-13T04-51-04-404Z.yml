            - heading "carla.VehicleWheelLocation" [level=2] [ref=f32e8804]
            - paragraph [ref=f32e8805]:
              - code [ref=f32e8806]: enum
              - text: representing the position of each wheel on a vehicle. Used to identify the target wheel when setting an angle in
              - link "carla.Vehicle.set_wheel_steer_direction" [ref=f32e8807] [cursor=pointer]:
                - /url: "#carla.Vehicle.set_wheel_steer_direction"
              - text: or
              - link "carla.Vehicle.get_wheel_steer_angle" [ref=f32e8808] [cursor=pointer]:
                - /url: "#carla.Vehicle.get_wheel_steer_angle"
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e8809]
            - list [ref=f32e8810]:
              - listitem [ref=f32e8811]:
                - strong [ref=f32e8812]: FL_Wheel
                - text: Front left wheel of a 4 wheeled vehicle.
              - listitem [ref=f32e8813]:
                - strong [ref=f32e8814]: FR_Wheel
                - text: Front right wheel of a 4 wheeled vehicle.
              - listitem [ref=f32e8815]:
                - strong [ref=f32e8816]: BL_Wheel
                - text: Back left wheel of a 4 wheeled vehicle.
              - listitem [ref=f32e8817]:
                - strong [ref=f32e8818]: BR_Wheel
                - text: Back right wheel of a 4 wheeled vehicle.
              - listitem [ref=f32e8819]:
                - strong [ref=f32e8820]: Front_Wheel
                - text: Front wheel of a 2 wheeled vehicle.
              - listitem [ref=f32e8821]:
                - strong [ref=f32e8822]: Back_Wheel
                - text: Back wheel of a 2 wheeled vehicle.
            - separator [ref=f32e8823]
            - heading "carla.Walker" [level=2] [ref=f32e8824]
            - paragraph [ref=f32e8825]:
              - generic [ref=f32e8826]:
                - text: Inherited from
                - emphasis [ref=f32e8827]:
                  - link "carla.Actor" [ref=f32e8828] [cursor=pointer]:
                    - /url: "#carla.Actor"
              - text: This class inherits from the
              - link "carla.Actor" [ref=f32e8829] [cursor=pointer]:
                - /url: "#carla.Actor"
              - text: and defines pedestrians in the simulation. Walkers are a special type of actor that can be controlled either by an AI (
              - link "carla.WalkerAIController" [ref=f32e8830] [cursor=pointer]:
                - /url: "#carla.WalkerAIController"
              - text: ) or manually via script, using a series of
              - link "carla.WalkerControl" [ref=f32e8831] [cursor=pointer]:
                - /url: "#carla.WalkerControl"
              - text: to move these and their skeletons.
            - heading "Methods" [level=3] [ref=f32e8832]
            - list [ref=f32e8833]:
              - listitem [ref=f32e8834]:
                - strong [ref=f32e8835]: apply_control
                - text: (
                - strong [ref=f32e8837]: self
                - text: ","
                - strong [ref=f32e8839]: control
                - text: ) On the next tick, the control will move the walker in a certain direction with a certain speed. Jumps can be commanded too.
                - list [ref=f32e8840]:
                  - listitem [ref=f32e8841]:
                    - strong [ref=f32e8842]: "Parameters:"
                    - list [ref=f32e8843]:
                      - listitem [ref=f32e8844]:
                        - code [ref=f32e8845]: control
                        - text: (
                        - emphasis [ref=f32e8846]:
                          - link "carla.WalkerControl" [ref=f32e8847] [cursor=pointer]:
                            - /url: "#carla.WalkerControl"
                        - text: )
              - listitem [ref=f32e8848]:
                - strong [ref=f32e8849]: blend_pose
                - text: (
                - strong [ref=f32e8851]: self
                - text: ","
                - strong [ref=f32e8853]: blend_value
                - text: ") Set the blending value of the custom pose with the animation. The values can be:"
              - listitem [ref=f32e8854]: "0: will show only the animation"
              - listitem [ref=f32e8855]: "1: will show only the custom pose (set by the user with set_bones())"
              - listitem [ref=f32e8856]:
                - text: "any other: will interpolate all the bone positions between animation and the custom pose."
                - list [ref=f32e8857]:
                  - listitem [ref=f32e8858]:
                    - strong [ref=f32e8859]: "Parameters:"
                    - list [ref=f32e8860]:
                      - listitem [ref=f32e8861]:
                        - code [ref=f32e8862]: blend_value
                        - text: (
                        - emphasis [ref=f32e8863]: float - value from 0 to 1 with the blend percentage
                        - text: )
              - listitem [ref=f32e8864]:
                - strong [ref=f32e8865]: hide_pose
                - text: (
                - strong [ref=f32e8867]: self
                - text: ) Hide the custom pose and show the animation (same as calling blend_pose(0)).
              - listitem [ref=f32e8868]:
                - strong [ref=f32e8869]: show_pose
                - text: (
                - strong [ref=f32e8871]: self
                - text: ) Show the custom pose and hide the animation (same as calling blend_pose(1)).
            - heading "Getters" [level=5] [ref=f32e8872]
            - list [ref=f32e8873]:
              - listitem [ref=f32e8874]:
                - strong [ref=f32e8875]: get_bones
                - text: (
                - strong [ref=f32e8877]: self
                - text: ") Return the structure with all the bone transformations from the actor. For each bone, we get the name and its transform in three different spaces:"
              - listitem [ref=f32e8878]: "name: bone name"
              - listitem [ref=f32e8879]: "world: transform in world coordinates"
              - listitem [ref=f32e8880]: "component: transform based on the pivot of the actor"
              - listitem [ref=f32e8881]:
                - text: "relative: transform based on the bone parent."
                - list [ref=f32e8882]:
                  - listitem [ref=f32e8883]:
                    - strong [ref=f32e8884]: "Return:"
                    - emphasis [ref=f32e8885]:
                      - link "carla.WalkerBoneControlOut" [ref=f32e8886] [cursor=pointer]:
                        - /url: "#carla.WalkerBoneControlOut"
                  - listitem [ref=f32e8887]:
                    - strong [ref=f32e8888]: "Setter:"
                    - emphasis [ref=f32e8889]:
                      - link "carla.Walker.set_bones" [ref=f32e8890] [cursor=pointer]:
                        - /url: "#carla.Walker.set_bones"
              - listitem [ref=f32e8891]:
                - strong [ref=f32e8892]: get_control
                - text: (
                - strong [ref=f32e8894]: self
                - text: ) The client returns the control applied to this walker during last tick. The method does not call the simulator.
                - list [ref=f32e8895]:
                  - listitem [ref=f32e8896]:
                    - strong [ref=f32e8897]: "Return:"
                    - emphasis [ref=f32e8898]:
                      - link "carla.WalkerControl" [ref=f32e8899] [cursor=pointer]:
                        - /url: "#carla.WalkerControl"
              - listitem [ref=f32e8900]:
                - strong [ref=f32e8901]: get_pose_from_animation
                - text: (
                - strong [ref=f32e8903]: self
                - text: ) Make a copy of the current animation frame as the custom pose. Initially the custom pose is the neutral pedestrian pose.
            - heading "Setters" [level=5] [ref=f32e8904]
            - list [ref=f32e8905]:
              - listitem [ref=f32e8906]:
                - strong [ref=f32e8907]: set_bones
                - text: (
                - strong [ref=f32e8909]: self
                - text: ","
                - strong [ref=f32e8911]: bones
                - text: ") Set the bones of the actor. For each bone we want to set we use a relative transform. Only the bones in this list will be set. For each bone you need to setup this info:"
              - listitem [ref=f32e8912]: "name: bone name"
              - listitem [ref=f32e8913]:
                - text: "relative: transform based on the bone parent."
                - list [ref=f32e8914]:
                  - listitem [ref=f32e8915]:
                    - strong [ref=f32e8916]: "Parameters:"
                    - list [ref=f32e8917]:
                      - listitem [ref=f32e8918]:
                        - code [ref=f32e8919]: bones
                        - text: (
                        - emphasis [ref=f32e8920]:
                          - link "carla.WalkerBoneControlIn" [ref=f32e8921] [cursor=pointer]:
                            - /url: "#carla.WalkerBoneControlIn"
                          - text: "- list of pairs (bone_name, transform) for the bones that we want to set"
                        - text: )
                  - listitem [ref=f32e8922]:
                    - strong [ref=f32e8923]: "Getter:"
                    - emphasis [ref=f32e8924]:
                      - link "carla.Walker.get_bones" [ref=f32e8925] [cursor=pointer]:
                        - /url: "#carla.Walker.get_bones"
            - heading "Dunder methods" [level=5] [ref=f32e8926]
            - list [ref=f32e8927]:
              - listitem [ref=f32e8928]:
                - strong [ref=f32e8929]: __str__
                - text: (
                - strong [ref=f32e8931]: self
                - text: )
            - separator [ref=f32e8932]
            - heading "carla.WalkerAIController" [level=2] [ref=f32e8933]
            - paragraph [ref=f32e8934]:
              - generic [ref=f32e8935]:
                - text: Inherited from
                - emphasis [ref=f32e8936]:
                  - link "carla.Actor" [ref=f32e8937] [cursor=pointer]:
                    - /url: "#carla.Actor"
              - text: Class that conducts AI control for a walker. The controllers are defined as actors, but they are quite different from the rest. They need to be attached to a parent actor during their creation, which is the walker they will be controlling (take a look at
              - link "carla.World" [ref=f32e8938] [cursor=pointer]:
                - /url: "#carla.World"
              - text: if you are yet to learn on how to spawn actors). They also need for a special blueprint (already defined in
              - link "carla.BlueprintLibrary" [ref=f32e8939] [cursor=pointer]:
                - /url: "#carla.BlueprintLibrary"
              - text: as "controller.ai.walker"). This is an empty blueprint, as the AI controller will be invisible in the simulation but will follow its parent around to dictate every step of the way.
            - heading "Methods" [level=3] [ref=f32e8940]
            - list [ref=f32e8941]:
              - listitem [ref=f32e8942]:
                - strong [ref=f32e8943]: go_to_location
                - text: (
                - strong [ref=f32e8945]: self
                - text: ","
                - strong [ref=f32e8947]: destination
                - text: ) Sets the destination that the pedestrian will reach.
                - list [ref=f32e8948]:
                  - listitem [ref=f32e8949]:
                    - strong [ref=f32e8950]: "Parameters:"
                    - list [ref=f32e8951]:
                      - listitem [ref=f32e8952]:
                        - code [ref=f32e8953]: destination
                        - text: (
                        - emphasis [ref=f32e8954]:
                          - link "carla.Location" [ref=f32e8955] [cursor=pointer]:
                            - /url: "#carla.Location"
                          - text: "- meters"
                        - text: )
              - listitem [ref=f32e8956]:
                - strong [ref=f32e8957]: start
                - text: (
                - strong [ref=f32e8959]: self
                - text: ) Enables AI control for its parent walker.
              - listitem [ref=f32e8960]:
                - strong [ref=f32e8961]: stop
                - text: (
                - strong [ref=f32e8963]: self
                - text: )
                - button "snippet →" [ref=f32e8964] [cursor=pointer]
                - text: Disables AI control for its parent walker.
            - heading "Setters" [level=5] [ref=f32e8965]
            - list [ref=f32e8966]:
              - listitem [ref=f32e8967]:
                - strong [ref=f32e8968]: set_max_speed
                - text: (
                - strong [ref=f32e8970]: self
                - text: ","
                - generic [ref=f32e8971]:
                  - strong [ref=f32e8972]: speed
                  - text: =1.4
                - text: ) Sets a speed for the walker in meters per second.
                - list [ref=f32e8973]:
                  - listitem [ref=f32e8974]:
                    - strong [ref=f32e8975]: "Parameters:"
                    - list [ref=f32e8976]:
                      - listitem [ref=f32e8977]:
                        - code [ref=f32e8978]: speed
                        - text: (
                        - emphasis [ref=f32e8979]: float - m/s
                        - text: ) - An easy walking speed is set by default.
            - heading "Dunder methods" [level=5] [ref=f32e8980]
            - list [ref=f32e8981]:
              - listitem [ref=f32e8982]:
                - strong [ref=f32e8983]: __str__
                - text: (
                - strong [ref=f32e8985]: self
                - text: )
            - separator [ref=f32e8986]
            - heading "carla.WalkerBoneControlIn" [level=2] [ref=f32e8987]
            - paragraph [ref=f32e8988]:
              - text: This class grants bone specific manipulation for walker. The skeletons of walkers have been unified for clarity and the transform applied to each bone are always relative to its parent. Take a look
              - link "here" [ref=f32e8989] [cursor=pointer]:
                - /url: ../tuto_G_control_walker_skeletons/
              - text: to learn more on how to create a walker and define its movement.
            - heading "Instance Variables" [level=3] [ref=f32e8990]
            - list [ref=f32e8991]:
              - listitem [ref=f32e8992]:
                - strong [ref=f32e8993]: bone_transforms
                - text: (
                - emphasis [ref=f32e8994]: list([name,transform])
                - text: ") List with the data for each bone we want to set:"
              - listitem [ref=f32e8995]: "name: bone name"
              - listitem [ref=f32e8996]: "relative: transform based on the bone parent."
            - heading "Methods" [level=3] [ref=f32e8997]
            - list [ref=f32e8998]:
              - listitem [ref=f32e8999]:
                - strong [ref=f32e9000]: __init__
                - text: (
                - strong [ref=f32e9002]: self
                - text: ","
                - strong [ref=f32e9004]: list(name,transform)
                - text: ) Initializes an object containing moves to be applied on tick. These are listed with the name of the bone and the transform that will be applied to it.
                - list [ref=f32e9005]:
                  - listitem [ref=f32e9006]:
                    - strong [ref=f32e9007]: "Parameters:"
                    - list [ref=f32e9008]:
                      - listitem [ref=f32e9009]:
                        - code [ref=f32e9010]: list(name,transform)
                        - text: (
                        - emphasis [ref=f32e9011]: tuple
                        - text: )
            - heading "Dunder methods" [level=5] [ref=f32e9012]
            - list [ref=f32e9013]:
              - listitem [ref=f32e9014]:
                - strong [ref=f32e9015]: __str__
                - text: (
                - strong [ref=f32e9017]: self
                - text: )
            - separator [ref=f32e9018]
            - heading "carla.WalkerBoneControlOut" [level=2] [ref=f32e9019]
            - paragraph [ref=f32e9020]:
              - text: This class is used to return all bone positions of a pedestrian. For each bone we get its
              - emphasis [ref=f32e9021]: name
              - text: and its transform in three different spaces (world, actor and relative).
            - heading "Instance Variables" [level=3] [ref=f32e9022]
            - list [ref=f32e9023]:
              - listitem [ref=f32e9024]:
                - strong [ref=f32e9025]: bone_transforms
                - text: (
                - emphasis [ref=f32e9026]: list([name,world, actor, relative])
                - text: ") List of one entry per bone with this information:"
              - listitem [ref=f32e9027]: "name: bone name"
              - listitem [ref=f32e9028]: "world: transform in world coordinates"
              - listitem [ref=f32e9029]: "component: transform based on the pivot of the actor"
              - listitem [ref=f32e9030]: "relative: transform based on the bone parent."
            - heading "Methods" [level=3] [ref=f32e9031]
            - heading "Dunder methods" [level=5] [ref=f32e9032]
            - list [ref=f32e9033]:
              - listitem [ref=f32e9034]:
                - strong [ref=f32e9035]: __str__
                - text: (
                - strong [ref=f32e9037]: self
                - text: )
            - separator [ref=f32e9038]
            - heading "carla.WalkerControl" [level=2] [ref=f32e9039]
            - paragraph [ref=f32e9040]:
              - text: This class defines specific directions that can be commanded to a
              - link "carla.Walker" [ref=f32e9041] [cursor=pointer]:
                - /url: "#carla.Walker"
              - text: to control it via script.
            - paragraph [ref=f32e9042]:
              - text: AI control can be settled for walkers, but the control used to do so is
              - link "carla.WalkerAIController" [ref=f32e9043] [cursor=pointer]:
                - /url: "#carla.WalkerAIController"
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e9044]
            - list [ref=f32e9045]:
              - listitem [ref=f32e9046]:
                - strong [ref=f32e9047]: direction
                - text: (
                - emphasis [ref=f32e9048]:
                  - link "carla.Vector3D" [ref=f32e9049] [cursor=pointer]:
                    - /url: "#carla.Vector3D"
                - text: ) Vector using global coordinates that will correspond to the direction of the walker.
              - listitem [ref=f32e9050]:
                - strong [ref=f32e9051]: speed
                - text: (
                - emphasis [ref=f32e9052]: float - m/s
                - text: ) A scalar value to control the walker's speed.
              - listitem [ref=f32e9053]:
                - strong [ref=f32e9054]: jump
                - text: (
                - emphasis [ref=f32e9055]: bool
                - text: ) If True, the walker will perform a jump.
              - listitem [ref=f32e9056]:
                - strong [ref=f32e9057]: timestamp
                - text: (
                - emphasis [ref=f32e9058]: float
                - text: ) The timestamp of this control value.
            - heading "Methods" [level=3] [ref=f32e9059]
            - list [ref=f32e9060]:
              - listitem [ref=f32e9061]:
                - strong [ref=f32e9062]: __init__
                - text: (
                - strong [ref=f32e9064]: self
                - text: ","
                - generic [ref=f32e9065]:
                  - strong [ref=f32e9066]: direction
                  - text: =[1.0, 0.0, 0.0]
                - text: ","
                - generic [ref=f32e9067]:
                  - strong [ref=f32e9068]: speed
                  - text: =0.0
                - text: ","
                - generic [ref=f32e9069]:
                  - strong [ref=f32e9070]: jump
                  - text: =False
                - text: )
                - list [ref=f32e9071]:
                  - listitem [ref=f32e9072]:
                    - strong [ref=f32e9073]: "Parameters:"
                    - list [ref=f32e9074]:
                      - listitem [ref=f32e9075]:
                        - code [ref=f32e9076]: direction
                        - text: (
                        - emphasis [ref=f32e9077]:
                          - link "carla.Vector3D" [ref=f32e9078] [cursor=pointer]:
                            - /url: "#carla.Vector3D"
                        - text: )
                      - listitem [ref=f32e9079]:
                        - code [ref=f32e9080]: speed
                        - text: (
                        - emphasis [ref=f32e9081]: float - m/s
                        - text: )
                      - listitem [ref=f32e9082]:
                        - code [ref=f32e9083]: jump
                        - text: (
                        - emphasis [ref=f32e9084]: bool
                        - text: )
            - heading "Dunder methods" [level=5] [ref=f32e9085]
            - list [ref=f32e9086]:
              - listitem [ref=f32e9087]:
                - strong [ref=f32e9088]: __eq__
                - text: (
                - strong [ref=f32e9090]: self
                - text: ","
                - generic [ref=f32e9091]:
                  - strong [ref=f32e9092]: other
                  - text: =
                  - link "carla.WalkerControl" [ref=f32e9093] [cursor=pointer]:
                    - /url: "#carla.WalkerControl"
                - text: ) Compares every variable with
                - code [ref=f32e9094]: other
                - text: and returns True if these are all the same.
              - listitem [ref=f32e9095]:
                - strong [ref=f32e9096]: __ne__
                - text: (
                - strong [ref=f32e9098]: self
                - text: ","
                - generic [ref=f32e9099]:
                  - strong [ref=f32e9100]: other
                  - text: =
                  - link "carla.WalkerControl" [ref=f32e9101] [cursor=pointer]:
                    - /url: "#carla.WalkerControl"
                - text: ) Compares every variable with
                - code [ref=f32e9102]: other
                - text: and returns True if any of these differ.
              - listitem [ref=f32e9103]:
                - strong [ref=f32e9104]: __str__
                - text: (
                - strong [ref=f32e9106]: self
                - text: )
            - separator [ref=f32e9107]
            - heading "carla.Waypoint" [level=2] [ref=f32e9108]
            - paragraph [ref=f32e9109]:
              - text: Waypoints in CARLA are described as 3D directed points. They have a
              - link "carla.Transform" [ref=f32e9110] [cursor=pointer]:
                - /url: "#carla.Transform"
              - text: which locates the waypoint in a road and orientates it according to the lane. They also store the road information belonging to said point regarding its lane and lane markings. All the information regarding waypoints and the
              - link "waypoint API" [ref=f32e9111] [cursor=pointer]:
                - /url: ../../core_map/#navigation-in-carla
              - text: is retrieved as provided by the OpenDRIVE file. Once the client asks for the map object to the server, no longer communication will be needed.
            - heading "Instance Variables" [level=3] [ref=f32e9112]
            - list [ref=f32e9113]:
              - listitem [ref=f32e9114]:
                - strong [ref=f32e9115]: id
                - text: (
                - emphasis [ref=f32e9116]: int
                - text: ) The identifier is generated using a hash combination of the road, section, lane and s values that correspond to said point in the OpenDRIVE geometry. The s precision is set to 2 centimeters, so 2 waypoints closer than 2 centimeters in the same road, section and lane, will have the same identificator.
              - listitem [ref=f32e9117]:
                - strong [ref=f32e9118]: transform
                - text: (
                - emphasis [ref=f32e9119]:
                  - link "carla.Transform" [ref=f32e9120] [cursor=pointer]:
                    - /url: "#carla.Transform"
                - text: ) Position and orientation of the waypoint according to the current lane information. This data is computed the first time it is accessed. It is not created right away in order to ease computing costs when lots of waypoints are created but their specific transform is not needed.
              - listitem [ref=f32e9121]:
                - strong [ref=f32e9122]: road_id
                - text: (
                - emphasis [ref=f32e9123]: int
                - text: ) OpenDRIVE road's id.
              - listitem [ref=f32e9124]:
                - strong [ref=f32e9125]: section_id
                - text: (
                - emphasis [ref=f32e9126]: int
                - text: ) OpenDRIVE section's id, based on the order that they are originally defined.
              - listitem [ref=f32e9127]:
                - strong [ref=f32e9128]: is_junction
                - text: (
                - emphasis [ref=f32e9129]: bool
                - text: ) True if the current Waypoint is on a junction as defined by OpenDRIVE.
              - listitem [ref=f32e9130]:
                - strong [ref=f32e9131]: junction_id
                - text: (
                - emphasis [ref=f32e9132]: int
                - text: ) OpenDRIVE junction's id. For more information refer to OpenDRIVE
                - link "documentation" [ref=f32e9133] [cursor=pointer]:
                  - /url: http://www.opendrive.org/docs/OpenDRIVEFormatSpecRev1.4H.pdf#page=20
                - text: .
              - listitem [ref=f32e9134]:
                - strong [ref=f32e9135]: lane_id
                - text: (
                - emphasis [ref=f32e9136]: int
                - text: ) OpenDRIVE lane's id, this value can be positive or negative which represents the direction of the current lane with respect to the road. For more information refer to OpenDRIVE
                - link "documentation" [ref=f32e9137] [cursor=pointer]:
                  - /url: http://www.opendrive.org/docs/OpenDRIVEFormatSpecRev1.4H.pdf#page=20
                - text: .
              - listitem [ref=f32e9138]:
                - strong [ref=f32e9139]: s
                - text: (
                - emphasis [ref=f32e9140]: float
                - text: ) OpenDRIVE s value of the current position.
              - listitem [ref=f32e9141]:
                - strong [ref=f32e9142]: lane_width
                - text: (
                - emphasis [ref=f32e9143]: float
                - text: ) Horizontal size of the road at current s.
              - listitem [ref=f32e9144]:
                - strong [ref=f32e9145]: lane_change
                - text: (
                - emphasis [ref=f32e9146]:
                  - link "carla.LaneChange" [ref=f32e9147] [cursor=pointer]:
                    - /url: "#carla.LaneChange"
                - text: ) Lane change definition of the current Waypoint's location, based on the traffic rules defined in the OpenDRIVE file. It states if a lane change can be done and in which direction.
              - listitem [ref=f32e9148]:
                - strong [ref=f32e9149]: lane_type
                - text: (
                - emphasis [ref=f32e9150]:
                  - link "carla.LaneType" [ref=f32e9151] [cursor=pointer]:
                    - /url: "#carla.LaneType"
                - text: ) The lane type of the current Waypoint, based on OpenDRIVE 1.4 standard.
              - listitem [ref=f32e9152]:
                - strong [ref=f32e9153]: right_lane_marking
                - text: (
                - emphasis [ref=f32e9154]:
                  - link "carla.LaneMarking" [ref=f32e9155] [cursor=pointer]:
                    - /url: "#carla.LaneMarking"
                - text: ) The right lane marking information based on the direction of the Waypoint.
              - listitem [ref=f32e9156]:
                - strong [ref=f32e9157]: left_lane_marking
                - text: (
                - emphasis [ref=f32e9158]:
                  - link "carla.LaneMarking" [ref=f32e9159] [cursor=pointer]:
                    - /url: "#carla.LaneMarking"
                - text: ) The left lane marking information based on the direction of the Waypoint.
              - listitem [ref=f32e9160]:
                - strong [ref=f32e9161]: is_rht
                - text: (
                - emphasis [ref=f32e9162]: bool
                - text: ) Flag indicating whether the waypoint is part of a right-handed traffic road.
            - heading "Methods" [level=3] [ref=f32e9163]
            - list [ref=f32e9164]:
              - listitem [ref=f32e9165]:
                - strong [ref=f32e9166]: next
                - text: (
                - strong [ref=f32e9168]: self
                - text: ","
                - strong [ref=f32e9170]: distance
                - text: ) Returns a list of waypoints at a certain approximate
                - code [ref=f32e9171]: distance
                - text: from the current one. It takes into account the road and its possible deviations without performing any lane change and returns one waypoint per option. The list may be empty if the lane is not connected to any other at the specified distance.
                - list [ref=f32e9172]:
                  - listitem [ref=f32e9173]:
                    - strong [ref=f32e9174]: "Parameters:"
                    - list [ref=f32e9175]:
                      - listitem [ref=f32e9176]:
                        - code [ref=f32e9177]: distance
                        - text: (
                        - emphasis [ref=f32e9178]: float - meters
                        - text: ) - The approximate distance where to get the next waypoints.
                  - listitem [ref=f32e9179]:
                    - strong [ref=f32e9180]: "Return:"
                    - emphasis [ref=f32e9181]:
                      - text: list(
                      - link "carla.Waypoint" [ref=f32e9182] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
                      - text: )
              - listitem [ref=f32e9183]:
                - strong [ref=f32e9184]: next_until_lane_end
                - text: (
                - strong [ref=f32e9186]: self
                - text: ","
                - strong [ref=f32e9188]: distance
                - text: ) Returns a list of waypoints from this to the end of the lane separated by a certain
                - code [ref=f32e9189]: distance
                - text: .
                - list [ref=f32e9190]:
                  - listitem [ref=f32e9191]:
                    - strong [ref=f32e9192]: "Parameters:"
                    - list [ref=f32e9193]:
                      - listitem [ref=f32e9194]:
                        - code [ref=f32e9195]: distance
                        - text: (
                        - emphasis [ref=f32e9196]: float - meters
                        - text: ) - The approximate distance between waypoints.
                  - listitem [ref=f32e9197]:
                    - strong [ref=f32e9198]: "Return:"
                    - emphasis [ref=f32e9199]:
                      - text: list(
                      - link "carla.Waypoint" [ref=f32e9200] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
                      - text: )
              - listitem [ref=f32e9201]:
                - strong [ref=f32e9202]: previous
                - text: (
                - strong [ref=f32e9204]: self
                - text: ","
                - strong [ref=f32e9206]: distance
                - text: ) This method does not return the waypoint previously visited by an actor, but a list of waypoints at an approximate
                - code [ref=f32e9207]: distance
                - text: but in the opposite direction of the lane. Similarly to
                - strong [ref=f32e9208]: next()
                - text: ", it takes into account the road and its possible deviations without performing any lane change and returns one waypoint per option. The list may be empty if the lane is not connected to any other at the specified distance."
                - list [ref=f32e9209]:
                  - listitem [ref=f32e9210]:
                    - strong [ref=f32e9211]: "Parameters:"
                    - list [ref=f32e9212]:
                      - listitem [ref=f32e9213]:
                        - code [ref=f32e9214]: distance
                        - text: (
                        - emphasis [ref=f32e9215]: float - meters
                        - text: ) - The approximate distance where to get the previous waypoints.
                  - listitem [ref=f32e9216]:
                    - strong [ref=f32e9217]: "Return:"
                    - emphasis [ref=f32e9218]:
                      - text: list(
                      - link "carla.Waypoint" [ref=f32e9219] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
                      - text: )
              - listitem [ref=f32e9220]:
                - strong [ref=f32e9221]: previous_until_lane_start
                - text: (
                - strong [ref=f32e9223]: self
                - text: ","
                - strong [ref=f32e9225]: distance
                - text: ) Returns a list of waypoints from this to the start of the lane separated by a certain
                - code [ref=f32e9226]: distance
                - text: .
                - list [ref=f32e9227]:
                  - listitem [ref=f32e9228]:
                    - strong [ref=f32e9229]: "Parameters:"
                    - list [ref=f32e9230]:
                      - listitem [ref=f32e9231]:
                        - code [ref=f32e9232]: distance
                        - text: (
                        - emphasis [ref=f32e9233]: float - meters
                        - text: ) - The approximate distance between waypoints.
                  - listitem [ref=f32e9234]:
                    - strong [ref=f32e9235]: "Return:"
                    - emphasis [ref=f32e9236]:
                      - text: list(
                      - link "carla.Waypoint" [ref=f32e9237] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
                      - text: )
            - heading "Getters" [level=5] [ref=f32e9238]
            - list [ref=f32e9239]:
              - listitem [ref=f32e9240]:
                - strong [ref=f32e9241]: get_junction
                - text: (
                - strong [ref=f32e9243]: self
                - text: ) If the waypoint belongs to a junction this method returns the associated junction object. Otherwise returns null.
                - list [ref=f32e9244]:
                  - listitem [ref=f32e9245]:
                    - strong [ref=f32e9246]: "Return:"
                    - emphasis [ref=f32e9247]:
                      - link "carla.Junction" [ref=f32e9248] [cursor=pointer]:
                        - /url: "#carla.Junction"
              - listitem [ref=f32e9249]:
                - strong [ref=f32e9250]: get_landmarks
                - text: (
                - strong [ref=f32e9252]: self
                - text: ","
                - strong [ref=f32e9254]: distance
                - text: ","
                - generic [ref=f32e9255]:
                  - strong [ref=f32e9256]: stop_at_junction
                  - text: =False
                - text: ) Returns a list of landmarks in the road from the current waypoint until the specified distance.
                - list [ref=f32e9257]:
                  - listitem [ref=f32e9258]:
                    - strong [ref=f32e9259]: "Parameters:"
                    - list [ref=f32e9260]:
                      - listitem [ref=f32e9261]:
                        - code [ref=f32e9262]: distance
                        - text: (
                        - emphasis [ref=f32e9263]: float - meters
                        - text: ) - The maximum distance to search for landmarks from the current waypoint.
                      - listitem [ref=f32e9264]:
                        - code [ref=f32e9265]: stop_at_junction
                        - text: (
                        - emphasis [ref=f32e9266]: bool
                        - text: ) - Enables or disables the landmark search through junctions.
                  - listitem [ref=f32e9267]:
                    - strong [ref=f32e9268]: "Return:"
                    - emphasis [ref=f32e9269]:
                      - text: list(
                      - link "carla.Landmark" [ref=f32e9270] [cursor=pointer]:
                        - /url: "#carla.Landmark"
                      - text: )
              - listitem [ref=f32e9271]:
                - strong [ref=f32e9272]: get_landmarks_of_type
                - text: (
                - strong [ref=f32e9274]: self
                - text: ","
                - strong [ref=f32e9276]: distance
                - text: ","
                - strong [ref=f32e9278]: type
                - text: ","
                - generic [ref=f32e9279]:
                  - strong [ref=f32e9280]: stop_at_junction
                  - text: =False
                - text: ) Returns a list of landmarks in the road of a specified type from the current waypoint until the specified distance.
                - list [ref=f32e9281]:
                  - listitem [ref=f32e9282]:
                    - strong [ref=f32e9283]: "Parameters:"
                    - list [ref=f32e9284]:
                      - listitem [ref=f32e9285]:
                        - code [ref=f32e9286]: distance
                        - text: (
                        - emphasis [ref=f32e9287]: float - meters
                        - text: ) - The maximum distance to search for landmarks from the current waypoint.
                      - listitem [ref=f32e9288]:
                        - code [ref=f32e9289]: type
                        - text: (
                        - emphasis [ref=f32e9290]: str
                        - text: ) - The type of landmarks to search.
                      - listitem [ref=f32e9291]:
                        - code [ref=f32e9292]: stop_at_junction
                        - text: (
                        - emphasis [ref=f32e9293]: bool
                        - text: ) - Enables or disables the landmark search through junctions.
                  - listitem [ref=f32e9294]:
                    - strong [ref=f32e9295]: "Return:"
                    - emphasis [ref=f32e9296]:
                      - text: list(
                      - link "carla.Landmark" [ref=f32e9297] [cursor=pointer]:
                        - /url: "#carla.Landmark"
                      - text: )
              - listitem [ref=f32e9298]:
                - strong [ref=f32e9299]: get_left_lane
                - text: (
                - strong [ref=f32e9301]: self
                - text: ) Generates a Waypoint at the center of the left lane based on the direction of the current Waypoint, taking into account if the lane change is allowed in this location. Will return None if the lane does not exist.
                - list [ref=f32e9302]:
                  - listitem [ref=f32e9303]:
                    - strong [ref=f32e9304]: "Return:"
                    - emphasis [ref=f32e9305]:
                      - link "carla.Waypoint" [ref=f32e9306] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
              - listitem [ref=f32e9307]:
                - strong [ref=f32e9308]: get_right_lane
                - text: (
                - strong [ref=f32e9310]: self
                - text: ) Generates a waypoint at the center of the right lane based on the direction of the current waypoint, taking into account if the lane change is allowed in this location. Will return None if the lane does not exist.
                - list [ref=f32e9311]:
                  - listitem [ref=f32e9312]:
                    - strong [ref=f32e9313]: "Return:"
                    - emphasis [ref=f32e9314]:
                      - link "carla.Waypoint" [ref=f32e9315] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
            - heading "Dunder methods" [level=5] [ref=f32e9316]
            - list [ref=f32e9317]:
              - listitem [ref=f32e9318]:
                - strong [ref=f32e9319]: __str__
                - text: (
                - strong [ref=f32e9321]: self
                - text: )
            - separator [ref=f32e9322]
            - heading "carla.WeatherParameters" [level=2] [ref=f32e9323]
            - paragraph [ref=f32e9324]:
              - text: This class defines objects containing lighting and weather specifications that can later be applied in
              - link "carla.World" [ref=f32e9325] [cursor=pointer]:
                - /url: "#carla.World"
              - text: . So far, these conditions only intervene with
              - link "sensor.camera.rgb" [ref=f32e9326] [cursor=pointer]:
                - /url: ../ref_sensors/#rgb-camera
              - text: . They neither affect the actor's physics nor other sensors. Each of these parameters acts indepently from the rest. Increasing the rainfall will not automatically create puddles nor change the road's humidity. That makes for a better customization but means that realistic conditions need to be scripted. However an example of dynamic weather conditions working realistically can be found
              - link "here" [ref=f32e9327] [cursor=pointer]:
                - /url: https://github.com/carla-simulator/carla/blob/master/PythonAPI/examples/dynamic_weather.py
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e9328]
            - list [ref=f32e9329]:
              - listitem [ref=f32e9330]:
                - strong [ref=f32e9331]: cloudiness
                - text: (
                - emphasis [ref=f32e9332]: float
                - text: ) Values range from 0 to 100, being 0 a clear sky and 100 one completely covered with clouds.
              - listitem [ref=f32e9333]:
                - strong [ref=f32e9334]: precipitation
                - text: (
                - emphasis [ref=f32e9335]: float
                - text: ) Rain intensity values range from 0 to 100, being 0 none at all and 100 a heavy rain.
              - listitem [ref=f32e9336]:
                - strong [ref=f32e9337]: precipitation_deposits
                - text: (
                - emphasis [ref=f32e9338]: float
                - text: ) Determines the creation of puddles. Values range from 0 to 100, being 0 none at all and 100 a road completely capped with water. Puddles are created with static noise, meaning that they will always appear at the same locations.
              - listitem [ref=f32e9339]:
                - strong [ref=f32e9340]: wind_intensity
                - text: (
                - emphasis [ref=f32e9341]: float
                - text: ) Controls the strenght of the wind with values from 0, no wind at all, to 100, a strong wind. The wind does affect rain direction and leaves from trees, so this value is restricted to avoid animation issues.
              - listitem [ref=f32e9342]:
                - strong [ref=f32e9343]: sun_azimuth_angle
                - text: (
                - emphasis [ref=f32e9344]: float - degrees
                - text: ) The azimuth angle of the sun. Values range from 0 to 360. Zero is an origin point in a sphere determined by Unreal Engine.
              - listitem [ref=f32e9345]:
                - strong [ref=f32e9346]: sun_altitude_angle
                - text: (
                - emphasis [ref=f32e9347]: float - degrees
                - text: ) Altitude angle of the sun. Values range from -90 to 90 corresponding to midnight and midday each.
              - listitem [ref=f32e9348]:
                - strong [ref=f32e9349]: fog_density
                - text: (
                - emphasis [ref=f32e9350]: float
                - text: ) Fog concentration or thickness. It only affects the RGB camera sensor. Values range from 0 to 100.
              - listitem [ref=f32e9351]:
                - strong [ref=f32e9352]: fog_distance
                - text: (
                - emphasis [ref=f32e9353]: float - meters
                - text: ) Fog start distance. Values range from 0 to infinite.
              - listitem [ref=f32e9354]:
                - strong [ref=f32e9355]: wetness
                - text: (
                - emphasis [ref=f32e9356]: float
                - text: ) Wetness intensity. It only affects the RGB camera sensor. Values range from 0 to 100.
              - listitem [ref=f32e9357]:
                - strong [ref=f32e9358]: fog_falloff
                - text: (
                - emphasis [ref=f32e9359]: float
                - text: ) Density of the fog (as in specific mass) from 0 to infinity. The bigger the value, the more dense and heavy it will be, and the fog will reach smaller heights. Corresponds to
                - link "Fog Height Falloff" [ref=f32e9360] [cursor=pointer]:
                  - /url: https://docs.unrealengine.com/en-US/Engine/Actors/FogEffects/HeightFog/index.html#:~:text=Using%20Exponential%20Height%20Fog%20Features,-The%20sections%20below&text=Add%20a%20second%20fog%20layer,height%20falloff%2C%20and%20height%20offset
                - text: in the UE docs. If the value is 0, the fog will be lighter than air, and will cover the whole scene. A value of 1 is approximately as dense as the air, and reaches normal-sized buildings. For values greater than 5, the air will be so dense that it will be compressed on ground level.
              - listitem [ref=f32e9361]:
                - strong [ref=f32e9362]: scattering_intensity
                - text: (
                - emphasis [ref=f32e9363]: float
                - text: ) Controls how much the light will contribute to volumetric fog. When set to 0, there is no contribution.
              - listitem [ref=f32e9364]:
                - strong [ref=f32e9365]: mie_scattering_scale
                - text: (
                - emphasis [ref=f32e9366]: float
                - text: ) Controls interaction of light with large particles like pollen or air pollution resulting in a hazy sky with halos around the light sources. When set to 0, there is no contribution.
              - listitem [ref=f32e9367]:
                - strong [ref=f32e9368]: rayleigh_scattering_scale
                - text: (
                - emphasis [ref=f32e9369]: float
                - text: ) Controls interaction of light with small particles like air molecules. Dependent on light wavelength, resulting in a blue sky in the day or red sky in the evening.
              - listitem [ref=f32e9370]:
                - strong [ref=f32e9371]: dust_storm
                - text: (
                - emphasis [ref=f32e9372]: float
                - text: ) Determines the strength of the dust storm weather. Values range from 0 to 100.
            - heading "Methods" [level=3] [ref=f32e9373]
            - list [ref=f32e9374]:
              - listitem [ref=f32e9375]:
                - strong [ref=f32e9376]: __init__
                - text: (
                - strong [ref=f32e9378]: self
                - text: ","
                - generic [ref=f32e9379]:
                  - strong [ref=f32e9380]: cloudiness
                  - text: =0.0
                - text: ","
                - generic [ref=f32e9381]:
                  - strong [ref=f32e9382]: precipitation
                  - text: =0.0
                - text: ","
                - generic [ref=f32e9383]:
                  - strong [ref=f32e9384]: precipitation_deposits
                  - text: =0.0
                - text: ","
                - generic [ref=f32e9385]:
                  - strong [ref=f32e9386]: wind_intensity
                  - text: =0.0
                - text: ","
                - generic [ref=f32e9387]:
                  - strong [ref=f32e9388]: sun_azimuth_angle
                  - text: =0.0
                - text: ","
                - generic [ref=f32e9389]:
                  - strong [ref=f32e9390]: sun_altitude_angle
                  - text: =0.0
                - text: ","
                - generic [ref=f32e9391]:
                  - strong [ref=f32e9392]: fog_density
                  - text: =0.0
                - text: ","
                - generic [ref=f32e9393]:
                  - strong [ref=f32e9394]: fog_distance
                  - text: =0.0
                - text: ","
                - generic [ref=f32e9395]:
                  - strong [ref=f32e9396]: wetness
                  - text: =0.0
                - text: ","
                - generic [ref=f32e9397]:
                  - strong [ref=f32e9398]: fog_falloff
                  - text: =0.0
                - text: ","
                - generic [ref=f32e9399]:
                  - strong [ref=f32e9400]: scattering_intensity
                  - text: =0.0
                - text: ","
                - generic [ref=f32e9401]:
                  - strong [ref=f32e9402]: mie_scattering_scale
                  - text: =0.0
                - text: ","
                - generic [ref=f32e9403]:
                  - strong [ref=f32e9404]: rayleigh_scattering_scale
                  - text: =0.0331
                - text: ) Method to initialize an object defining weather conditions. This class has some presets for different noon and sunset conditions listed in a note below.
                - list [ref=f32e9405]:
                  - listitem [ref=f32e9406]:
                    - strong [ref=f32e9407]: "Parameters:"
                    - list [ref=f32e9408]:
                      - listitem [ref=f32e9409]:
                        - code [ref=f32e9410]: cloudiness
                        - text: (
                        - emphasis [ref=f32e9411]: float
                        - text: ) - 0 is a clear sky, 100 complete overcast.
                      - listitem [ref=f32e9412]:
                        - code [ref=f32e9413]: precipitation
                        - text: (
                        - emphasis [ref=f32e9414]: float
                        - text: ) - 0 is no rain at all, 100 a heavy rain.
                      - listitem [ref=f32e9415]:
                        - code [ref=f32e9416]: precipitation_deposits
                        - text: (
                        - emphasis [ref=f32e9417]: float
                        - text: ) - 0 means no puddles on the road, 100 means roads completely capped by rain.
                      - listitem [ref=f32e9418]:
                        - code [ref=f32e9419]: wind_intensity
                        - text: (
                        - emphasis [ref=f32e9420]: float
                        - text: ) - 0 is calm, 100 a strong wind.
                      - listitem [ref=f32e9421]:
                        - code [ref=f32e9422]: sun_azimuth_angle
                        - text: (
                        - emphasis [ref=f32e9423]: float - degrees
                        - text: ) - 0 is an arbitrary North, 180 its corresponding South.
                      - listitem [ref=f32e9424]:
                        - code [ref=f32e9425]: sun_altitude_angle
                        - text: (
                        - emphasis [ref=f32e9426]: float - degrees
                        - text: ) - 90 is midday, -90 is midnight.
                      - listitem [ref=f32e9427]:
                        - code [ref=f32e9428]: fog_density
                        - text: (
                        - emphasis [ref=f32e9429]: float
                        - text: ) - Concentration or thickness of the fog, from 0 to 100.
                      - listitem [ref=f32e9430]:
                        - code [ref=f32e9431]: fog_distance
                        - text: (
                        - emphasis [ref=f32e9432]: float - meters
                        - text: ) - Distance where the fog starts in meters.
                      - listitem [ref=f32e9433]:
                        - code [ref=f32e9434]: wetness
                        - text: (
                        - emphasis [ref=f32e9435]: float
                        - text: ) - Humidity percentages of the road, from 0 to 100.
                      - listitem [ref=f32e9436]:
                        - code [ref=f32e9437]: fog_falloff
                        - text: (
                        - emphasis [ref=f32e9438]: float
                        - text: ) - Density (specific mass) of the fog, from 0 to infinity.
                      - listitem [ref=f32e9439]:
                        - code [ref=f32e9440]: scattering_intensity
                        - text: (
                        - emphasis [ref=f32e9441]: float
                        - text: ) - Controls how much the light will contribute to volumetric fog. When set to 0, there is no contribution.
                      - listitem [ref=f32e9442]:
                        - code [ref=f32e9443]: mie_scattering_scale
                        - text: (
                        - emphasis [ref=f32e9444]: float
                        - text: ) - Controls interaction of light with large particles like pollen or air pollution resulting in a hazy sky with halos around the light sources. When set to 0, there is no contribution.
                      - listitem [ref=f32e9445]:
                        - code [ref=f32e9446]: rayleigh_scattering_scale
                        - text: (
                        - emphasis [ref=f32e9447]: float
                        - text: ) - Controls interaction of light with small particles like air molecules. Dependent on light wavelength, resulting in a blue sky in the day or red sky in the evening.
                  - listitem [ref=f32e9448]:
                    - strong [ref=f32e9449]: "Note:"
                    - emphasis [ref=f32e9451]: ClearNoon, CloudyNoon, WetNoon, WetCloudyNoon, SoftRainNoon, MidRainyNoon, HardRainNoon, ClearSunset, CloudySunset, WetSunset, WetCloudySunset, SoftRainSunset, MidRainSunset, HardRainSunset.
