              - text: This class handles the lights in the scene. Its main use is to get and set the state of groups or lists of lights in one call. An instance of this class can be retrieved by the
              - link "carla.World.get_lightmanager" [ref=f32e4253] [cursor=pointer]:
                - /url: "#carla.World.get_lightmanager"
              - text: ().
            - paragraph [ref=f32e4254]:
              - strong [ref=f32e4255]: Note.
              - text: So far, though there is a
              - code [ref=f32e4256]: vehicle
              - text: group, vehicle lights are not available as
              - link "carla.Light" [ref=f32e4257] [cursor=pointer]:
                - /url: "#carla.Light"
              - text: objects. These have to be managed using
              - link "carla.Vehicle" [ref=f32e4258] [cursor=pointer]:
                - /url: "#carla.Vehicle"
              - text: and
              - link "carla.VehicleLightState" [ref=f32e4259] [cursor=pointer]:
