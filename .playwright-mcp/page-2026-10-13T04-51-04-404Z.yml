            - heading "carla.Timestamp" [level=2] [ref=f32e6538]
            - paragraph [ref=f32e6539]:
              - text: Class that contains time information for simulated data. This information is automatically retrieved as part of the
              - link "carla.WorldSnapshot" [ref=f32e6540] [cursor=pointer]:
                - /url: "#carla.WorldSnapshot"
              - text: the client gets on every frame, but might also be used in many other situations such as a
              - link "carla.Sensor" [ref=f32e6541] [cursor=pointer]:
                - /url: "#carla.Sensor"
              - text: retrieveing data.
            - heading "Instance Variables" [level=3] [ref=f32e6542]
            - list [ref=f32e6543]:
              - listitem [ref=f32e6544]:
                - strong [ref=f32e6545]: frame
                - text: (
                - emphasis [ref=f32e6546]: int
                - text: ) The number of frames elapsed since the simulator was launched.
              - listitem [ref=f32e6547]:
                - strong [ref=f32e6548]: elapsed_seconds
                - text: (
                - emphasis [ref=f32e6549]: float - seconds
                - text: ) Simulated seconds elapsed since the beginning of the current episode.
              - listitem [ref=f32e6550]:
                - strong [ref=f32e6551]: delta_seconds
                - text: (
                - emphasis [ref=f32e6552]: float - seconds
                - text: ) Simulated seconds elapsed since the previous frame.
              - listitem [ref=f32e6553]:
                - strong [ref=f32e6554]: platform_timestamp
                - text: (
                - emphasis [ref=f32e6555]: float - seconds
                - text: ) Time register of the frame at which this measurement was taken given by the OS in seconds.
