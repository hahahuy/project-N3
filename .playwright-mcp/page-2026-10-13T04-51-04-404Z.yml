            - heading "carla.OpendriveGenerationParameters" [level=2] [ref=f32e5229]
            - paragraph [ref=f32e5230]: This class defines the parameters used when generating a world using an ASAM OpenDRIVE file.
            - heading "Instance Variables" [level=3] [ref=f32e5231]
            - list [ref=f32e5232]:
              - listitem [ref=f32e5233]:
                - strong [ref=f32e5234]: vertex_distance
                - text: (
                - emphasis [ref=f32e5235]: float
                - text: ) Distance between vertices of the mesh generated.
                - strong [ref=f32e5236]:
                  - text: Default is
                  - code [ref=f32e5237]: "2.0"
                - text: .
              - listitem [ref=f32e5238]:
                - strong [ref=f32e5239]: max_road_length
                - text: (
                - emphasis [ref=f32e5240]: float
                - text: ) Max road length for a single mesh portion. The mesh of the map is divided into portions, in order to avoid propagating issues.
                - strong [ref=f32e5241]:
                  - text: Default is
                  - code [ref=f32e5242]: "50.0"
                - text: .
              - listitem [ref=f32e5243]:
                - strong [ref=f32e5244]: wall_height
                - text: (
                - emphasis [ref=f32e5245]: float
                - text: ) Height of walls created on the boundaries of the road. These prevent vehicles from falling off the road.
                - strong [ref=f32e5246]:
                  - text: Default is
                  - code [ref=f32e5247]: "1.0"
                - text: .
              - listitem [ref=f32e5248]:
                - strong [ref=f32e5249]: additional_width
                - text: (
                - emphasis [ref=f32e5250]: float
                - text: ) Additional with applied junction lanes. Complex situations tend to occur at junctions, and a little increase can prevent vehicles from falling off the road.
                - strong [ref=f32e5251]:
                  - text: Default is
                  - code [ref=f32e5252]: "0.6"
                - text: .
              - listitem [ref=f32e5253]:
                - strong [ref=f32e5254]: smooth_junctions
                - text: (
                - emphasis [ref=f32e5255]: bool
                - text: ) If
                - strong [ref=f32e5256]: "True"
                - text: ", the mesh at junctions will be smoothed to prevent issues where roads blocked other roads."
                - strong [ref=f32e5257]:
                  - text: Default is
                  - code [ref=f32e5258]: "True"
                - text: .
              - listitem [ref=f32e5259]:
                - strong [ref=f32e5260]: enable_mesh_visibility
                - text: (
                - emphasis [ref=f32e5261]: bool
                - text: ) If
                - strong [ref=f32e5262]: "True"
                - text: ", the road mesh will be rendered. Setting this to"
                - strong [ref=f32e5263]: "False"
                - text: should reduce the rendering overhead.
                - strong [ref=f32e5264]:
                  - text: Default is
                  - code [ref=f32e5265]: "True"
                - text: .
              - listitem [ref=f32e5266]:
                - strong [ref=f32e5267]: enable_pedestrian_navigation
                - text: (
                - emphasis [ref=f32e5268]: bool
                - text: ) If
                - strong [ref=f32e5269]: "True"
                - text: ", Pedestrian navigation will be enabled using Recast tool. For very large maps it is recomended to disable this option."
                - strong [ref=f32e5270]:
                  - text: Default is
                  - code [ref=f32e5271]: "True"
                - text: .
            - separator [ref=f32e5272]
            - heading "carla.OpticalFlowImage" [level=2] [ref=f32e5273]
            - paragraph [ref=f32e5274]:
              - generic [ref=f32e5275]:
                - text: Inherited from
                - emphasis [ref=f32e5276]:
                  - link "carla.SensorData" [ref=f32e5277] [cursor=pointer]:
                    - /url: "#carla.SensorData"
              - text: Class that defines an optical flow image of 2-Dimension float (32-bit) vectors representing the optical flow detected in the field of view. The components of the vector represents the displacement of an object in the image plane. Each component outputs values in the normalized range [-2,2] which scales to [-2 size, 2 size] with size being the total resolution in the corresponding component.
            - heading "Instance Variables" [level=3] [ref=f32e5278]
            - list [ref=f32e5279]:
              - listitem [ref=f32e5280]:
                - strong [ref=f32e5281]: fov
                - text: (
                - emphasis [ref=f32e5282]: float - degrees
                - text: ) Horizontal field of view of the image.
              - listitem [ref=f32e5283]:
                - strong [ref=f32e5284]: height
                - text: (
                - emphasis [ref=f32e5285]: int
                - text: ) Image height in pixels.
              - listitem [ref=f32e5286]:
                - strong [ref=f32e5287]: width
                - text: (
                - emphasis [ref=f32e5288]: int
                - text: ) Image width in pixels.
              - listitem [ref=f32e5289]:
                - strong [ref=f32e5290]: raw_data
                - text: (
                - emphasis [ref=f32e5291]: bytes
                - text: ) Flattened array of pixel data, use reshape to create an image array.
            - heading "Methods" [level=3] [ref=f32e5292]
            - heading "Getters" [level=5] [ref=f32e5293]
            - list [ref=f32e5294]:
              - listitem [ref=f32e5295]:
