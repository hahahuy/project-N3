            - heading "carla.VehicleControl" [level=2] [ref=f32e8456]
            - paragraph [ref=f32e8457]: Manages the basic movement of a vehicle using typical driving controls.
            - heading "Instance Variables" [level=3] [ref=f32e8458]
            - list [ref=f32e8459]:
              - listitem [ref=f32e8460]:
                - strong [ref=f32e8461]: throttle
                - text: (
                - emphasis [ref=f32e8462]: float
                - text: ) A scalar value to control the vehicle throttle [0.0, 1.0]. Default is 0.0.
              - listitem [ref=f32e8463]:
                - strong [ref=f32e8464]: steer
                - text: (
                - emphasis [ref=f32e8465]: float
                - text: ) A scalar value to control the vehicle steering [-1.0, 1.0]. Default is 0.0.
              - listitem [ref=f32e8466]:
                - strong [ref=f32e8467]: brake
                - text: (
                - emphasis [ref=f32e8468]: float
                - text: ) A scalar value to control the vehicle brake [0.0, 1.0]. Default is 0.0.
              - listitem [ref=f32e8469]:
                - strong [ref=f32e8470]: hand_brake
                - text: (
                - emphasis [ref=f32e8471]: bool
                - text: ) Determines whether hand brake will be used. Default is False.
              - listitem [ref=f32e8472]:
                - strong [ref=f32e8473]: reverse
                - text: (
                - emphasis [ref=f32e8474]: bool
                - text: ) Determines whether the vehicle will move backwards. Default is False.
              - listitem [ref=f32e8475]:
                - strong [ref=f32e8476]: manual_gear_shift
                - text: (
                - emphasis [ref=f32e8477]: bool
                - text: ) Determines whether the vehicle will be controlled by changing gears manually. Default is False.
              - listitem [ref=f32e8478]:
                - strong [ref=f32e8479]: gear
                - text: (
                - emphasis [ref=f32e8480]: int
                - text: ) States which gear is the vehicle running on.
              - listitem [ref=f32e8481]:
                - strong [ref=f32e8482]: timestamp
                - text: (
                - emphasis [ref=f32e8483]: float
                - text: ) The timestamp of this control value.
