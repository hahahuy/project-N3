                  - link "carla.LightGroup" [ref=f32e4702] [cursor=pointer]:
                    - /url: "#carla.LightGroup"
                - text: ) Group a light belongs to.
              - listitem [ref=f32e4703]:
                - strong [ref=f32e4704]: active
                - text: (
                - emphasis [ref=f32e4705]: bool
                - text: ) Switch of a light. It is
                - strong [ref=f32e4706]: "True"
                - text: when the light is on.
            - heading "Methods" [level=3] [ref=f32e4707]
            - list [ref=f32e4708]:
              - listitem [ref=f32e4709]:
                - strong [ref=f32e4710]: __init__
                - text: (
                - strong [ref=f32e4712]: self
                - text: ","
                - generic [ref=f32e4713]:
                  - strong [ref=f32e4714]: intensity
                  - text: =0.0
                - text: ","
                - generic [ref=f32e4715]:
                  - strong [ref=f32e4716]: color
                  - text: =
                  - link "carla.Color" [ref=f32e4717] [cursor=pointer]:
                    - /url: "#carla.Color"
                  - text: ()
                - text: ","
                - generic [ref=f32e4718]:
                  - strong [ref=f32e4719]: group
                  - text: =
                  - link "carla.LightGroup.None" [ref=f32e4720] [cursor=pointer]:
                    - /url: "#carla.LightGroup.None"
                - text: ","
                - generic [ref=f32e4721]:
                  - strong [ref=f32e4722]: active
                  - text: =False
                - text: )
                - list [ref=f32e4723]:
                  - listitem [ref=f32e4724]:
                    - strong [ref=f32e4725]: "Parameters:"
                    - list [ref=f32e4726]:
                      - listitem [ref=f32e4727]:
                        - code [ref=f32e4728]: intensity
                        - text: (
                        - emphasis [ref=f32e4729]: float - lumens
                        - text: ) - Intensity of the light. Default is
                        - code [ref=f32e4730]: "0.0"
                        - text: .
                      - listitem [ref=f32e4731]:
                        - code [ref=f32e4732]: color
                        - text: (
                        - emphasis [ref=f32e4733]:
                          - link "carla.Color" [ref=f32e4734] [cursor=pointer]:
                            - /url: "#carla.Color"
                        - text: ) - Color of the light. Default is black.
                      - listitem [ref=f32e4735]:
                        - code [ref=f32e4736]: group
                        - text: (
                        - emphasis [ref=f32e4737]:
                          - link "carla.LightGroup" [ref=f32e4738] [cursor=pointer]:
                            - /url: "#carla.LightGroup"
                        - text: ) - Group the light belongs to. Default is the generic group
                        - code [ref=f32e4739]: None
                        - text: .
                      - listitem [ref=f32e4740]:
                        - code [ref=f32e4741]: active
                        - text: (
                        - emphasis [ref=f32e4742]: bool
                        - text: ) - Swith of the light. Default is
                        - code [ref=f32e4743]: "False"
                        - text: ", light is off."
            - separator [ref=f32e4744]
            - heading "carla.Location" [level=2] [ref=f32e4745]
            - paragraph [ref=f32e4746]:
              - generic [ref=f32e4747]:
                - text: Inherited from
                - emphasis [ref=f32e4748]:
                  - link "carla.Vector3D" [ref=f32e4749] [cursor=pointer]:
                    - /url: "#carla.Vector3D"
              - text: Represents a spot in the world.
            - heading "Instance Variables" [level=3] [ref=f32e4750]
            - list [ref=f32e4751]:
              - listitem [ref=f32e4752]:
                - strong [ref=f32e4753]: x
                - text: (
                - emphasis [ref=f32e4754]: float - meters
                - text: ) Distance from origin to spot on X axis.
              - listitem [ref=f32e4755]:
                - strong [ref=f32e4756]: "y"
                - text: (
                - emphasis [ref=f32e4757]: float - meters
                - text: ) Distance from origin to spot on Y axis.
              - listitem [ref=f32e4758]:
                - strong [ref=f32e4759]: z
                - text: (
                - emphasis [ref=f32e4760]: float - meters
                - text: ) Distance from origin to spot on Z axis.
            - heading "Methods" [level=3] [ref=f32e4761]
            - list [ref=f32e4762]:
              - listitem [ref=f32e4763]:
                - strong [ref=f32e4764]: __init__
                - text: (
                - strong [ref=f32e4766]: self
                - text: ","
                - generic [ref=f32e4767]:
                  - strong [ref=f32e4768]: x
                  - text: =0.0
                - text: ","
                - generic [ref=f32e4769]:
                  - strong [ref=f32e4770]: "y"
                  - text: =0.0
                - text: ","
                - generic [ref=f32e4771]:
                  - strong [ref=f32e4772]: z
                  - text: =0.0
                - text: )
                - list [ref=f32e4773]:
                  - listitem [ref=f32e4774]:
                    - strong [ref=f32e4775]: "Parameters:"
                    - list [ref=f32e4776]:
                      - listitem [ref=f32e4777]:
                        - code [ref=f32e4778]: x
                        - text: (
                        - emphasis [ref=f32e4779]: float
                        - text: )
                      - listitem [ref=f32e4780]:
                        - code [ref=f32e4781]: "y"
                        - text: (
                        - emphasis [ref=f32e4782]: float
                        - text: )
                      - listitem [ref=f32e4783]:
                        - code [ref=f32e4784]: z
                        - text: (
                        - emphasis [ref=f32e4785]: float
                        - text: )
              - listitem [ref=f32e4786]:
                - strong [ref=f32e4787]: distance
                - text: (
                - strong [ref=f32e4789]: self
                - text: ","
                - strong [ref=f32e4791]: location
                - text: ) Returns Euclidean distance from this location to another one.
                - list [ref=f32e4792]:
                  - listitem [ref=f32e4793]:
                    - strong [ref=f32e4794]: "Parameters:"
                    - list [ref=f32e4795]:
                      - listitem [ref=f32e4796]:
                        - code [ref=f32e4797]: location
                        - text: (
                        - emphasis [ref=f32e4798]:
                          - link "carla.Location" [ref=f32e4799] [cursor=pointer]:
                            - /url: "#carla.Location"
                        - text: ) - The other point to compute the distance with.
                  - listitem [ref=f32e4800]:
                    - strong [ref=f32e4801]: "Return:"
                    - emphasis [ref=f32e4802]: float - meters
            - heading "Dunder methods" [level=5] [ref=f32e4803]
            - list [ref=f32e4804]:
              - listitem [ref=f32e4805]:
                - strong [ref=f32e4806]: __abs__
                - text: (
                - strong [ref=f32e4808]: self
                - text: ) Returns a Location with the absolute value of the components x, y and z.
                - list [ref=f32e4809]:
                  - listitem [ref=f32e4810]:
                    - strong [ref=f32e4811]: "Return:"
                    - emphasis [ref=f32e4812]:
                      - link "carla.Location" [ref=f32e4813] [cursor=pointer]:
                        - /url: "#carla.Location"
              - listitem [ref=f32e4814]:
                - strong [ref=f32e4815]: __eq__
                - text: (
                - strong [ref=f32e4817]: self
                - text: ","
                - generic [ref=f32e4818]:
                  - strong [ref=f32e4819]: other
                  - text: =
                  - link "carla.Location" [ref=f32e4820] [cursor=pointer]:
                    - /url: "#carla.Location"
                - text: ) Returns
                - strong [ref=f32e4821]: "True"
                - text: if both locations are the same point in space.
                - list [ref=f32e4822]:
                  - listitem [ref=f32e4823]:
                    - strong [ref=f32e4824]: "Return:"
                    - emphasis [ref=f32e4825]: bool
              - listitem [ref=f32e4826]:
                - strong [ref=f32e4827]: __ne__
                - text: (
                - strong [ref=f32e4829]: self
                - text: ","
                - generic [ref=f32e4830]:
                  - strong [ref=f32e4831]: other
                  - text: =
                  - link "carla.Location" [ref=f32e4832] [cursor=pointer]:
                    - /url: "#carla.Location"
                - text: ) Returns
                - strong [ref=f32e4833]: "True"
                - text: if both locations are different points in space.
                - list [ref=f32e4834]:
                  - listitem [ref=f32e4835]:
                    - strong [ref=f32e4836]: "Return:"
                    - emphasis [ref=f32e4837]: bool
              - listitem [ref=f32e4838]:
                - strong [ref=f32e4839]: __str__
                - text: (
                - strong [ref=f32e4841]: self
                - text: ) Parses the axis' values to string.
                - list [ref=f32e4842]:
                  - listitem [ref=f32e4843]:
                    - strong [ref=f32e4844]: "Return:"
                    - emphasis [ref=f32e4845]: str
            - separator [ref=f32e4846]
            - heading "carla.Map" [level=2] [ref=f32e4847]
            - paragraph [ref=f32e4848]:
              - text: Class containing the road information and waypoint managing. Data is retrieved from an OpenDRIVE file that describes the road. A query system is defined which works hand in hand with
              - link "carla.Waypoint" [ref=f32e4849] [cursor=pointer]:
                - /url: "#carla.Waypoint"
              - text: to translate geometrical information from the .xodr to natural world points. CARLA is currently working with
              - link "OpenDRIVE 1.4 standard" [ref=f32e4850] [cursor=pointer]:
                - /url: http://www.opendrive.org/docs/OpenDRIVEFormatSpecRev1.4H.pdf
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e4851]
            - list [ref=f32e4852]:
              - listitem [ref=f32e4853]:
                - strong [ref=f32e4854]: name
                - text: (
                - emphasis [ref=f32e4855]: str
                - text: ) The name of the map. It corresponds to the .umap from Unreal Engine that is loaded from a CARLA server, which then references to the .xodr road description.
            - heading "Methods" [level=3] [ref=f32e4856]
            - list [ref=f32e4857]:
              - listitem [ref=f32e4858]:
                - strong [ref=f32e4859]: __init__
                - text: (
                - strong [ref=f32e4861]: self
                - text: ","
                - strong [ref=f32e4863]: name
                - text: ","
                - strong [ref=f32e4865]: xodr_content
                - text: ) Constructor for this class. Though a map is automatically generated when initializing the world, using this method in no-rendering mode facilitates working with an .xodr without any CARLA server running.
                - list [ref=f32e4866]:
                  - listitem [ref=f32e4867]:
                    - strong [ref=f32e4868]: "Parameters:"
                    - list [ref=f32e4869]:
                      - listitem [ref=f32e4870]:
                        - code [ref=f32e4871]: name
                        - text: (
                        - emphasis [ref=f32e4872]: str
                        - text: ) - Name of the current map.
                      - listitem [ref=f32e4873]:
                        - code [ref=f32e4874]: xodr_content
                        - text: (
                        - emphasis [ref=f32e4875]: str
                        - text: ) - .xodr content in string format.
                  - listitem [ref=f32e4876]:
                    - strong [ref=f32e4877]: "Return:"
                    - emphasis [ref=f32e4878]:
                      - text: list(
                      - link "carla.Transform" [ref=f32e4879] [cursor=pointer]:
                        - /url: "#carla.Transform"
                      - text: )
              - listitem [ref=f32e4880]:
                - strong [ref=f32e4881]: cook_in_memory_map
                - text: (
                - strong [ref=f32e4883]: self
                - text: ","
                - strong [ref=f32e4885]: path
                - text: ) Generates a binary file from the CARLA map containing information used by the Traffic Manager. This method is only used during the import process for maps.
                - list [ref=f32e4886]:
                  - listitem [ref=f32e4887]:
                    - strong [ref=f32e4888]: "Parameters:"
                    - list [ref=f32e4889]:
                      - listitem [ref=f32e4890]:
                        - code [ref=f32e4891]: path
                        - text: (
                        - emphasis [ref=f32e4892]: str
                        - text: ) - Path to the intended location of the stored binary map file.
              - listitem [ref=f32e4893]:
                - strong [ref=f32e4894]: generate_waypoints
                - text: (
                - strong [ref=f32e4896]: self
                - text: ","
                - strong [ref=f32e4898]: distance
                - text: ) Returns a list of waypoints with a certain distance between them for every lane and centered inside of it. Waypoints are not listed in any particular order. Remember that waypoints closer than 2cm within the same road, section and lane will have the same identificator.
                - list [ref=f32e4899]:
                  - listitem [ref=f32e4900]:
                    - strong [ref=f32e4901]: "Parameters:"
                    - list [ref=f32e4902]:
                      - listitem [ref=f32e4903]:
                        - code [ref=f32e4904]: distance
                        - text: (
                        - emphasis [ref=f32e4905]: float - meters
                        - text: ) - Approximate distance between waypoints.
                  - listitem [ref=f32e4906]:
                    - strong [ref=f32e4907]: "Return:"
                    - emphasis [ref=f32e4908]:
                      - text: list(
                      - link "carla.Waypoint" [ref=f32e4909] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
                      - text: )
              - listitem [ref=f32e4910]:
                - strong [ref=f32e4911]: geolocation_to_transform
                - text: (
                - strong [ref=f32e4913]: self
                - text: ","
                - strong [ref=f32e4915]: geo_location
                - text: ) Converts a given
                - code [ref=f32e4916]: geo_location
                - text: ", a point given in geocoordinates, to a"
                - link "carla.Location" [ref=f32e4917] [cursor=pointer]:
                  - /url: "#carla.Location"
                - text: ", which represents a location in the simulation. The geographical location of the map is defined inside OpenDRIVE within the tag ."
                - list [ref=f32e4918]:
                  - listitem [ref=f32e4919]:
                    - strong [ref=f32e4920]: "Parameters:"
                    - list [ref=f32e4921]:
                      - listitem [ref=f32e4922]:
                        - code [ref=f32e4923]: geo_location
                        - text: (
                        - emphasis [ref=f32e4924]:
                          - link "carla.GeoLocation" [ref=f32e4925] [cursor=pointer]:
                            - /url: "#carla.GeoLocation"
                        - text: )
                  - listitem [ref=f32e4926]:
                    - strong [ref=f32e4927]: "Return:"
                    - emphasis [ref=f32e4928]:
                      - link "carla.Location" [ref=f32e4929] [cursor=pointer]:
                        - /url: "#carla.Location"
              - listitem [ref=f32e4930]:
                - strong [ref=f32e4931]: save_to_disk
                - text: (
                - strong [ref=f32e4933]: self
                - text: ","
                - strong [ref=f32e4935]: path
                - text: ) Saves the .xodr OpenDRIVE file of the current map to disk.
                - list [ref=f32e4936]:
                  - listitem [ref=f32e4937]:
                    - strong [ref=f32e4938]: "Parameters:"
                    - list [ref=f32e4939]:
                      - listitem [ref=f32e4940]:
                        - code [ref=f32e4941]: path
                        - text: "- Path where the file will be saved."
              - listitem [ref=f32e4942]:
                - strong [ref=f32e4943]: to_opendrive
                - text: (
                - strong [ref=f32e4945]: self
                - text: ) Returns the .xodr OpenDRIVe file of the current map as string.
                - list [ref=f32e4946]:
                  - listitem [ref=f32e4947]:
                    - strong [ref=f32e4948]: "Return:"
                    - emphasis [ref=f32e4949]: str
              - listitem [ref=f32e4950]:
                - strong [ref=f32e4951]: transform_to_geolocation
                - text: (
                - strong [ref=f32e4953]: self
                - text: ","
                - strong [ref=f32e4955]: location
                - text: ) Converts a given
                - code [ref=f32e4956]: location
                - text: ", a point in the simulation, to a"
                - link "carla.GeoLocation" [ref=f32e4957] [cursor=pointer]:
                  - /url: "#carla.GeoLocation"
                - text: ", which represents world coordinates. The geographical location of the map is defined inside OpenDRIVE within the tag ."
                - list [ref=f32e4958]:
                  - listitem [ref=f32e4959]:
                    - strong [ref=f32e4960]: "Parameters:"
                    - list [ref=f32e4961]:
                      - listitem [ref=f32e4962]:
                        - code [ref=f32e4963]: location
                        - text: (
                        - emphasis [ref=f32e4964]:
                          - link "carla.Location" [ref=f32e4965] [cursor=pointer]:
                            - /url: "#carla.Location"
                        - text: )
                  - listitem [ref=f32e4966]:
                    - strong [ref=f32e4967]: "Return:"
                    - emphasis [ref=f32e4968]:
                      - link "carla.GeoLocation" [ref=f32e4969] [cursor=pointer]:
                        - /url: "#carla.GeoLocation"
            - heading "Getters" [level=5] [ref=f32e4970]
            - list [ref=f32e4971]:
              - listitem [ref=f32e4972]:
                - strong [ref=f32e4973]: get_all_landmarks
                - text: (
                - strong [ref=f32e4975]: self
                - text: ) Returns all the landmarks in the map. Landmarks retrieved using this method have a
                - strong [ref=f32e4976]: "null"
                - text: waypoint.
                - list [ref=f32e4977]:
                  - listitem [ref=f32e4978]:
                    - strong [ref=f32e4979]: "Return:"
                    - emphasis [ref=f32e4980]:
                      - text: list(
                      - link "carla.Landmark" [ref=f32e4981] [cursor=pointer]:
                        - /url: "#carla.Landmark"
                      - text: )
              - listitem [ref=f32e4982]:
                - strong [ref=f32e4983]: get_all_landmarks_from_id
                - text: (
                - strong [ref=f32e4985]: self
                - text: ","
                - strong [ref=f32e4987]: opendrive_id
                - text: ) Returns the landmarks with a certain OpenDRIVE ID. Landmarks retrieved using this method have a
                - strong [ref=f32e4988]: "null"
                - text: waypoint.
                - list [ref=f32e4989]:
                  - listitem [ref=f32e4990]:
                    - strong [ref=f32e4991]: "Parameters:"
                    - list [ref=f32e4992]:
                      - listitem [ref=f32e4993]:
                        - code [ref=f32e4994]: opendrive_id
                        - text: (
                        - emphasis [ref=f32e4995]: string
                        - text: ) - The OpenDRIVE ID of the landmarks.
                  - listitem [ref=f32e4996]:
                    - strong [ref=f32e4997]: "Return:"
                    - emphasis [ref=f32e4998]:
                      - text: list(
                      - link "carla.Landmark" [ref=f32e4999] [cursor=pointer]:
                        - /url: "#carla.Landmark"
                      - text: )
              - listitem [ref=f32e5000]:
                - strong [ref=f32e5001]: get_all_landmarks_of_type
                - text: (
                - strong [ref=f32e5003]: self
                - text: ","
                - strong [ref=f32e5005]: type
                - text: ) Returns the landmarks of a specific type. Landmarks retrieved using this method have a
                - strong [ref=f32e5006]: "null"
                - text: waypoint.
                - list [ref=f32e5007]:
                  - listitem [ref=f32e5008]:
                    - strong [ref=f32e5009]: "Parameters:"
                    - list [ref=f32e5010]:
                      - listitem [ref=f32e5011]:
                        - code [ref=f32e5012]: type
                        - text: (
                        - emphasis [ref=f32e5013]: string
                        - text: ) - The type of the landmarks.
                  - listitem [ref=f32e5014]:
                    - strong [ref=f32e5015]: "Return:"
                    - emphasis [ref=f32e5016]:
                      - text: list(
                      - link "carla.Landmark" [ref=f32e5017] [cursor=pointer]:
                        - /url: "#carla.Landmark"
                      - text: )
              - listitem [ref=f32e5018]:
                - strong [ref=f32e5019]: get_crosswalks
                - text: (
                - strong [ref=f32e5021]: self
                - text: ) Returns a list of locations with all crosswalk zones in the form of closed polygons. The first point is repeated, symbolizing where the polygon begins and ends.
                - list [ref=f32e5022]:
                  - listitem [ref=f32e5023]:
                    - strong [ref=f32e5024]: "Return:"
                    - emphasis [ref=f32e5025]:
                      - text: list(
                      - link "carla.Location" [ref=f32e5026] [cursor=pointer]:
                        - /url: "#carla.Location"
                      - text: )
              - listitem [ref=f32e5027]:
                - strong [ref=f32e5028]: get_geoprojection
                - text: (
                - strong [ref=f32e5030]: self
                - text: ) Returns the geoprojection defined for the map through the OpenDRIVE metadata.
                - list [ref=f32e5031]:
                  - listitem [ref=f32e5032]:
                    - strong [ref=f32e5033]: "Return:"
                    - emphasis [ref=f32e5034]:
                      - text: one of
                      - link "carla.GeoProjectionLCC2SP" [ref=f32e5035] [cursor=pointer]:
                        - /url: "#carla.GeoProjectionLCC2SP"
                      - text: ","
                      - link "carla.GeoProjectionTM" [ref=f32e5036] [cursor=pointer]:
                        - /url: "#carla.GeoProjectionTM"
                      - text: ","
                      - link "carla.GeoProjectionUTM" [ref=f32e5037] [cursor=pointer]:
                        - /url: "#carla.GeoProjectionUTM"
                      - text: ","
                      - link "carla.GeoProjectionWebMerc" [ref=f32e5038] [cursor=pointer]:
                        - /url: "#carla.GeoProjectionWebMerc"
              - listitem [ref=f32e5039]:
                - strong [ref=f32e5040]: get_georeference
                - text: (
                - strong [ref=f32e5042]: self
                - text: ) Returns the
                - link "carla.GeoLocation" [ref=f32e5043] [cursor=pointer]:
                  - /url: "#carla.GeoLocation"
                - text: of the center of the map.
                - list [ref=f32e5044]:
                  - listitem [ref=f32e5045]:
                    - strong [ref=f32e5046]: "Return:"
                    - emphasis [ref=f32e5047]:
                      - link "carla.GeoLocation" [ref=f32e5048] [cursor=pointer]:
                        - /url: "#carla.GeoLocation"
              - listitem [ref=f32e5049]:
                - strong [ref=f32e5050]: get_landmark_group
                - text: (
                - strong [ref=f32e5052]: self
                - text: ","
                - strong [ref=f32e5054]: landmark
                - text: ) Returns the landmarks in the same group as the specified landmark (including itself). Returns an empty list if the landmark does not belong to any group.
                - list [ref=f32e5055]:
                  - listitem [ref=f32e5056]:
                    - strong [ref=f32e5057]: "Parameters:"
                    - list [ref=f32e5058]:
                      - listitem [ref=f32e5059]:
                        - code [ref=f32e5060]: landmark
                        - text: (
                        - emphasis [ref=f32e5061]:
                          - link "carla.Landmark" [ref=f32e5062] [cursor=pointer]:
                            - /url: "#carla.Landmark"
                        - text: ) - A landmark that belongs to the group.
                  - listitem [ref=f32e5063]:
                    - strong [ref=f32e5064]: "Return:"
                    - emphasis [ref=f32e5065]:
                      - text: list(
                      - link "carla.Landmark" [ref=f32e5066] [cursor=pointer]:
                        - /url: "#carla.Landmark"
                      - text: )
              - listitem [ref=f32e5067]:
                - strong [ref=f32e5068]: get_spawn_points
                - text: (
                - strong [ref=f32e5070]: self
                - text: ) Returns a list of recommendations made by the creators of the map to be used as spawning points for the vehicles. The list includes
                - link "carla.Transform" [ref=f32e5071] [cursor=pointer]:
                  - /url: "#carla.Transform"
                - text: objects with certain location and orientation. Said locations are slightly on-air in order to avoid Z-collisions, so vehicles fall for a bit before starting their way.
                - list [ref=f32e5072]:
                  - listitem [ref=f32e5073]:
                    - strong [ref=f32e5074]: "Return:"
                    - emphasis [ref=f32e5075]:
                      - text: list(
                      - link "carla.Transform" [ref=f32e5076] [cursor=pointer]:
                        - /url: "#carla.Transform"
                      - text: )
              - listitem [ref=f32e5077]:
                - strong [ref=f32e5078]: get_topology
                - text: (
                - strong [ref=f32e5080]: self
                - text: ) Returns a list of tuples describing a minimal graph of the topology of the OpenDRIVE file. The tuples contain pairs of waypoints located either at the point a road begins or ends. The first one is the origin and the second one represents another road end that can be reached. This graph can be loaded into
                - link "NetworkX" [ref=f32e5081] [cursor=pointer]:
                  - /url: https://networkx.github.io/
                - text: "to work with. Output could look like this: [(w0, w1), (w0, w2), (w1, w3), (w2, w3), (w0, w4)]."
                - list [ref=f32e5082]:
                  - listitem [ref=f32e5083]:
                    - strong [ref=f32e5084]: "Return:"
                    - emphasis [ref=f32e5085]:
                      - text: list(tuple(
                      - link "carla.Waypoint" [ref=f32e5086] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
                      - text: ","
                      - link "carla.Waypoint" [ref=f32e5087] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
                      - text: ))
              - listitem [ref=f32e5088]:
                - strong [ref=f32e5089]: get_waypoint
                - text: (
                - strong [ref=f32e5091]: self
                - text: ","
                - strong [ref=f32e5093]: location
                - text: ","
                - generic [ref=f32e5094]:
                  - strong [ref=f32e5095]: project_to_road
                  - text: =True
                - text: ","
                - generic [ref=f32e5096]:
                  - strong [ref=f32e5097]: lane_type
                  - text: =
                  - link "carla.LaneType.Driving" [ref=f32e5098] [cursor=pointer]:
                    - /url: "#carla.LaneType.Driving"
                - text: )
                - button "snippet →" [ref=f32e5099] [cursor=pointer]
                - text: Returns a waypoint that can be located in an exact location or translated to the center of the nearest lane. Said lane type can be defined using flags such as
                - code [ref=f32e5100]: LaneType.Driving & LaneType.Shoulder
                - text: . The method will return None if the waypoint is not found, which may happen only when trying to retrieve a waypoint for an exact location. That eases checking if a point is inside a certain road, as otherwise, it will return the corresponding waypoint.
                - list [ref=f32e5101]:
                  - listitem [ref=f32e5102]:
                    - strong [ref=f32e5103]: "Parameters:"
                    - list [ref=f32e5104]:
                      - listitem [ref=f32e5105]:
                        - code [ref=f32e5106]: location
                        - text: (
                        - emphasis [ref=f32e5107]:
                          - link "carla.Location" [ref=f32e5108] [cursor=pointer]:
                            - /url: "#carla.Location"
                          - text: "- meters"
                        - text: ) - Location used as reference for the
                        - link "carla.Waypoint" [ref=f32e5109] [cursor=pointer]:
                          - /url: "#carla.Waypoint"
                        - text: .
                      - listitem [ref=f32e5110]:
                        - code [ref=f32e5111]: project_to_road
                        - text: (
                        - emphasis [ref=f32e5112]: bool
                        - text: ) - If
                        - strong [ref=f32e5113]: "True"
                        - text: ", the waypoint will be at the center of the closest lane. This is the default setting. If"
                        - strong [ref=f32e5114]: "False"
                        - text: ", the waypoint will be exactly in"
                        - code [ref=f32e5115]: location
                        - text: . None means said location does not belong to a road.
                      - listitem [ref=f32e5116]:
                        - code [ref=f32e5117]: lane_type
                        - text: (
                        - emphasis [ref=f32e5118]:
                          - link "carla.LaneType" [ref=f32e5119] [cursor=pointer]:
                            - /url: "#carla.LaneType"
                        - text: ) - Limits the search for nearest lane to one or various lane types that can be flagged.
                  - listitem [ref=f32e5120]:
                    - strong [ref=f32e5121]: "Return:"
                    - emphasis [ref=f32e5122]:
                      - link "carla.Waypoint" [ref=f32e5123] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
              - listitem [ref=f32e5124]:
                - strong [ref=f32e5125]: get_waypoint_xodr
                - text: (
                - strong [ref=f32e5127]: self
                - text: ","
                - strong [ref=f32e5129]: road_id
                - text: ","
                - strong [ref=f32e5131]: lane_id
                - text: ","
                - strong [ref=f32e5133]: s
                - text: ) Returns a waypoint if all the parameters passed are correct. Otherwise, returns
                - strong [ref=f32e5134]: None
                - text: .
                - list [ref=f32e5135]:
                  - listitem [ref=f32e5136]:
                    - strong [ref=f32e5137]: "Parameters:"
                    - list [ref=f32e5138]:
                      - listitem [ref=f32e5139]:
                        - code [ref=f32e5140]: road_id
                        - text: (
                        - emphasis [ref=f32e5141]: int
                        - text: ) - ID of the road to get the waypoint.
                      - listitem [ref=f32e5142]:
                        - code [ref=f32e5143]: lane_id
                        - text: (
                        - emphasis [ref=f32e5144]: int
                        - text: ) - ID of the lane to get the waypoint.
                      - listitem [ref=f32e5145]:
                        - code [ref=f32e5146]: s
                        - text: (
                        - emphasis [ref=f32e5147]: float - meters
                        - text: ) - Specify the length from the road start.
                  - listitem [ref=f32e5148]:
                    - strong [ref=f32e5149]: "Return:"
                    - emphasis [ref=f32e5150]:
                      - link "carla.Waypoint" [ref=f32e5151] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
