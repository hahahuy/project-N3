            - separator [ref=f32e1302]
            - heading "carla.ActorSnapshot" [level=2] [ref=f32e1303]
            - paragraph [ref=f32e1304]:
              - text: A class that comprises all the information for an actor at a certain moment in time. These objects are contained in a
              - link "carla.WorldSnapshot" [ref=f32e1305] [cursor=pointer]:
                - /url: "#carla.WorldSnapshot"
              - text: and sent to the client once every tick.
            - heading "Instance Variables" [level=3] [ref=f32e1306]
            - list [ref=f32e1307]:
              - listitem [ref=f32e1308]:
                - strong [ref=f32e1309]: id
                - text: (
                - emphasis [ref=f32e1310]: int
                - text: ) An identifier for the snapshot itself.
            - heading "Methods" [level=3] [ref=f32e1311]
            - heading "Getters" [level=5] [ref=f32e1312]
            - list [ref=f32e1313]:
              - listitem [ref=f32e1314]:
                - strong [ref=f32e1315]: get_acceleration
                - text: (
                - strong [ref=f32e1317]: self
                - text: ) Returns the acceleration vector registered for an actor in that tick.
                - list [ref=f32e1318]:
                  - listitem [ref=f32e1319]:
                    - strong [ref=f32e1320]: "Return:"
                    - emphasis [ref=f32e1321]:
                      - link "carla.Vector3D" [ref=f32e1322] [cursor=pointer]:
                        - /url: "#carla.Vector3D"
                      - generic [ref=f32e1323]:
                        - text: "- m/s"
                        - superscript [ref=f32e1324]: "2"
              - listitem [ref=f32e1325]:
                - strong [ref=f32e1326]: get_angular_velocity
                - text: (
                - strong [ref=f32e1328]: self
                - text: ) Returns the angular velocity vector registered for an actor in that tick.
                - list [ref=f32e1329]:
                  - listitem [ref=f32e1330]:
                    - strong [ref=f32e1331]: "Return:"
                    - emphasis [ref=f32e1332]:
                      - link "carla.Vector3D" [ref=f32e1333] [cursor=pointer]:
                        - /url: "#carla.Vector3D"
                      - text: "- rad/s"
              - listitem [ref=f32e1334]:
                - strong [ref=f32e1335]: get_transform
                - text: (
                - strong [ref=f32e1337]: self
                - text: ) Returns the actor's transform (location and rotation) for an actor in that tick.
                - list [ref=f32e1338]:
                  - listitem [ref=f32e1339]:
                    - strong [ref=f32e1340]: "Return:"
                    - emphasis [ref=f32e1341]:
                      - link "carla.Transform" [ref=f32e1342] [cursor=pointer]:
                        - /url: "#carla.Transform"
              - listitem [ref=f32e1343]:
                - strong [ref=f32e1344]: get_velocity
                - text: (
                - strong [ref=f32e1346]: self
                - text: ) Returns the velocity vector registered for an actor in that tick.
                - list [ref=f32e1347]:
                  - listitem [ref=f32e1348]:
                    - strong [ref=f32e1349]: "Return:"
                    - emphasis [ref=f32e1350]:
                      - link "carla.Vector3D" [ref=f32e1351] [cursor=pointer]:
                        - /url: "#carla.Vector3D"
                      - text: "- m/s"
            - separator [ref=f32e1352]
            - heading "carla.ActorState" [level=2] [ref=f32e1353]
            - paragraph [ref=f32e1354]: Class that defines the state of an actor.
            - heading "Instance Variables" [level=3] [ref=f32e1355]
            - list [ref=f32e1356]:
              - listitem [ref=f32e1357]:
                - strong [ref=f32e1358]: Invalid
                - text: An actor is Invalid if a problem has occurred.
              - listitem [ref=f32e1359]:
                - strong [ref=f32e1360]: Active
                - text: An actor is Active when it visualized and can affect other actors.
              - listitem [ref=f32e1361]:
                - strong [ref=f32e1362]: Dormant
                - text: An actor is Dormant when it is not visualized and will not affect other actors through physics. For example, actors are dormant if they are on an unloaded tile in a large map.
            - separator [ref=f32e1363]
            - heading "carla.AttachmentType" [level=2] [ref=f32e1364]
            - paragraph [ref=f32e1365]:
              - text: Class that defines attachment options between an actor and its parent. When spawning actors, these can be attached to another actor so their position changes accordingly. This is specially useful for sensors. The snipet in
              - link "carla.World.spawn_actor" [ref=f32e1366] [cursor=pointer]:
                - /url: "#carla.World.spawn_actor"
              - text: shows some sensors being attached to a car when spawned. Note that the attachment type is declared as an enum within the class.
            - heading "Instance Variables" [level=3] [ref=f32e1367]
            - list [ref=f32e1368]:
              - listitem [ref=f32e1369]:
                - strong [ref=f32e1370]: Rigid
                - text: With this fixed attachment the object follow its parent position strictly. This is the recommended attachment to retrieve precise data from the simulation.
              - listitem [ref=f32e1371]:
                - strong [ref=f32e1372]: SpringArm
                - text: An attachment that expands or retracts the position of the actor, depending on its parent. This attachment is only recommended to record videos from the simulation where a smooth movement is needed. SpringArms are an Unreal Engine component so
                - link "check the UE docs" [ref=f32e1373] [cursor=pointer]:
                  - /url: https://docs.unrealengine.com/en-US/Gameplay/HowTo/UsingCameras/SpringArmComponents/index.html
                - text: "to learn more about them. Warning: The SpringArm attachment presents weird behaviors when an actor is spawned with a relative translation in the Z-axis (e.g."
                - code [ref=f32e1374]: child_location = Location(0,0,2)
                - text: ).
              - listitem [ref=f32e1375]:
                - strong [ref=f32e1376]: SpringArmGhost
                - text: An attachment like the previous one but that does not make the collision test, and that means that it does not expands or retracts the position of the actor. The term
                - strong [ref=f32e1377]: ghost
                - text: is because then the camera can cross walls and other geometries. This attachment is only recommended to record videos from the simulation where a smooth movement is needed. SpringArms are an Unreal Engine component so
                - link "check the UE docs" [ref=f32e1378] [cursor=pointer]:
                  - /url: https://docs.unrealengine.com/en-US/Gameplay/HowTo/UsingCameras/SpringArmComponents/index.html
                - text: "to learn more about them. Warning: The SpringArm attachment presents weird behaviors when an actor is spawned with a relative translation in the Z-axis (e.g."
                - code [ref=f32e1379]: child_location = Location(0,0,2)
                - text: ).
            - separator [ref=f32e1380]
            - heading "carla.BlueprintLibrary" [level=2] [ref=f32e1381]
            - paragraph [ref=f32e1382]:
              - text: A class that contains the blueprints provided for actor spawning. Its main application is to return
              - link "carla.ActorBlueprint" [ref=f32e1383] [cursor=pointer]:
                - /url: "#carla.ActorBlueprint"
              - text: objects needed to spawn actors. Each blueprint has an identifier and attributes that may or may not be modifiable. The library is automatically created by the server and can be accessed through
              - link "carla.World" [ref=f32e1384] [cursor=pointer]:
                - /url: "#carla.World"
              - text: .
            - paragraph [ref=f32e1385]:
              - link "Here" [ref=f32e1386] [cursor=pointer]:
                - /url: ../bp_library/
              - text: is a reference containing every available blueprint and its specifics.
            - heading "Methods" [level=3] [ref=f32e1387]
            - list [ref=f32e1388]:
              - listitem [ref=f32e1389]:
                - strong [ref=f32e1390]: filter
                - text: (
                - strong [ref=f32e1392]: self
                - text: ","
                - strong [ref=f32e1394]: wildcard_pattern
                - text: ) Filters a list of blueprints matching the
                - code [ref=f32e1395]: wildcard_pattern
                - text: against the id and tags of every blueprint contained in this library and returns the result as a new one. Matching follows
                - link "fnmatch" [ref=f32e1396] [cursor=pointer]:
                  - /url: https://docs.python.org/2/library/fnmatch.html
                - text: standard.
                - list [ref=f32e1397]:
                  - listitem [ref=f32e1398]:
                    - strong [ref=f32e1399]: "Parameters:"
                    - list [ref=f32e1400]:
                      - listitem [ref=f32e1401]:
                        - code [ref=f32e1402]: wildcard_pattern
                        - text: (
                        - emphasis [ref=f32e1403]: str
                        - text: )
                  - listitem [ref=f32e1404]:
                    - strong [ref=f32e1405]: "Return:"
