            - heading "carla.Junction" [level=2] [ref=f32e3641]
            - paragraph [ref=f32e3642]: Class that embodies the intersections on the road described in the OpenDRIVE file according to OpenDRIVE 1.4 standards.
            - heading "Instance Variables" [level=3] [ref=f32e3643]
            - list [ref=f32e3644]:
              - listitem [ref=f32e3645]:
                - strong [ref=f32e3646]: id
                - text: (
                - emphasis [ref=f32e3647]: int
                - text: ) Identifier found in the OpenDRIVE file.
              - listitem [ref=f32e3648]:
                - strong [ref=f32e3649]: bounding_box
                - text: (
                - emphasis [ref=f32e3650]:
                  - link "carla.BoundingBox" [ref=f32e3651] [cursor=pointer]:
                    - /url: "#carla.BoundingBox"
                - text: ) Bounding box encapsulating the junction lanes.
            - heading "Methods" [level=3] [ref=f32e3652]
            - heading "Getters" [level=5] [ref=f32e3653]
            - list [ref=f32e3654]:
              - listitem [ref=f32e3655]:
                - strong [ref=f32e3656]: get_waypoints
                - text: (
                - strong [ref=f32e3658]: self
                - text: ","
                - strong [ref=f32e3660]: lane_type
                - text: ) Returns a list of pairs of waypoints. Every tuple on the list contains first an initial and then a final waypoint within the intersection boundaries that describe the beginning and the end of said lane along the junction. Lanes follow their OpenDRIVE definitions so there may be many different tuples with the same starting waypoint due to possible deviations, as this are considered different lanes.
                - list [ref=f32e3661]:
                  - listitem [ref=f32e3662]:
                    - strong [ref=f32e3663]: "Parameters:"
                    - list [ref=f32e3664]:
                      - listitem [ref=f32e3665]:
                        - code [ref=f32e3666]: lane_type
                        - text: (
                        - emphasis [ref=f32e3667]:
                          - link "carla.LaneType" [ref=f32e3668] [cursor=pointer]:
                            - /url: "#carla.LaneType"
                        - text: ) - Type of lanes to get the waypoints.
                  - listitem [ref=f32e3669]:
                    - strong [ref=f32e3670]: "Return:"
                    - emphasis [ref=f32e3671]:
                      - text: list(tuple(
                      - link "carla.Waypoint" [ref=f32e3672] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
                      - text: ))
            - separator [ref=f32e3673]
            - heading "carla.LabelledPoint" [level=2] [ref=f32e3674]
            - paragraph [ref=f32e3675]: Class that represent a position in space with a semantic label.
            - heading "Instance Variables" [level=3] [ref=f32e3676]
            - list [ref=f32e3677]:
              - listitem [ref=f32e3678]:
                - strong [ref=f32e3679]: location
                - text: Position in 3D space.
              - listitem [ref=f32e3680]:
                - strong [ref=f32e3681]: label
                - text: Semantic tag of the point.
            - separator [ref=f32e3682]
            - heading "carla.Landmark" [level=2] [ref=f32e3683]
            - paragraph [ref=f32e3684]:
              - text: Class that defines any type of traffic landmark or sign affecting a road. These class mediates between the
              - link "OpenDRIVE 1.4 standard" [ref=f32e3685] [cursor=pointer]:
                - /url: http://www.opendrive.org/docs/OpenDRIVEFormatSpecRev1.4H.pdf
              - text: definition of the landmarks and their representation in the simulation. This class retrieves all the information defining a landmark in OpenDRIVE and facilitates information about which lanes does it affect and when. Landmarks will be accessed by
              - link "carla.Waypoint" [ref=f32e3686] [cursor=pointer]:
                - /url: "#carla.Waypoint"
              - text: objects trying to retrieve the regulation of their lane. Therefore some attributes depend on the waypoint that is consulting the landmark and so, creating the object.
            - heading "Instance Variables" [level=3] [ref=f32e3687]
            - list [ref=f32e3688]:
              - listitem [ref=f32e3689]:
                - strong [ref=f32e3690]: road_id
                - text: (
                - emphasis [ref=f32e3691]: int
                - text: ") The OpenDRIVE ID of the road where this landmark is defined. Due to OpenDRIVE road definitions, this road may be different from the road the landmark is currently affecting. It is mostly the case in junctions where the road diverges in different routes. Example: a traffic light is defined in one of the divergent roads in a junction, but it affects all the possible routes."
              - listitem [ref=f32e3692]:
                - strong [ref=f32e3693]: distance
                - text: (
                - emphasis [ref=f32e3694]: float - meters
                - text: ) Distance between the landmark and the waypoint creating the object (querying
                - code [ref=f32e3695]: get_landmarks
                - text: or
                - code [ref=f32e3696]: get_landmarks_of_type
                - text: ).
              - listitem [ref=f32e3697]:
                - strong [ref=f32e3698]: s
                - text: (
                - emphasis [ref=f32e3699]: float - meters
                - text: ) Distance where the landmark is positioned along the geometry of the road
                - code [ref=f32e3700]: road_id
                - text: .
              - listitem [ref=f32e3701]:
                - strong [ref=f32e3702]: t
                - text: (
                - emphasis [ref=f32e3703]: float - meters
                - text: ) Lateral distance where the landmark is positioned from the edge of the road
                - code [ref=f32e3704]: road_id
                - text: .
              - listitem [ref=f32e3705]:
                - strong [ref=f32e3706]: id
                - text: (
                - emphasis [ref=f32e3707]: str
                - text: ) Unique ID of the landmark in the OpenDRIVE file.
              - listitem [ref=f32e3708]:
                - strong [ref=f32e3709]: name
                - text: (
                - emphasis [ref=f32e3710]: str
                - text: ) Name of the landmark in the in the OpenDRIVE file.
              - listitem [ref=f32e3711]:
                - strong [ref=f32e3712]: is_dynamic
                - text: (
                - emphasis [ref=f32e3713]: bool
                - text: ) Indicates if the landmark has state changes over time such as traffic lights.
              - listitem [ref=f32e3714]:
                - strong [ref=f32e3715]: orientation
                - text: (
                - emphasis [ref=f32e3716]:
                  - link "carla.LandmarkOrientation" [ref=f32e3717] [cursor=pointer]:
                    - /url: "#carla.LandmarkOrientation"
                  - text: "- degrees"
                - text: ) Indicates which lanes the landmark is facing towards to.
              - listitem [ref=f32e3718]:
                - strong [ref=f32e3719]: z_offset
                - text: (
                - emphasis [ref=f32e3720]: float - meters
                - text: ) Height where the landmark is placed.
              - listitem [ref=f32e3721]:
                - strong [ref=f32e3722]: country
                - text: (
                - emphasis [ref=f32e3723]: str
                - text: ) Country code where the landmark is defined (default to OpenDRIVE is Germany 2017).
              - listitem [ref=f32e3724]:
                - strong [ref=f32e3725]: type
                - text: (
                - emphasis [ref=f32e3726]: str
                - text: ) Type identifier of the landmark according to the country code.
              - listitem [ref=f32e3727]:
                - strong [ref=f32e3728]: sub_type
                - text: (
                - emphasis [ref=f32e3729]: str
                - text: ) Subtype identifier of the landmark according to the country code.
              - listitem [ref=f32e3730]:
                - strong [ref=f32e3731]: value
                - text: (
                - emphasis [ref=f32e3732]: float
                - text: ) Value printed in the signal (e.g. speed limit, maximum weight, etc).
              - listitem [ref=f32e3733]:
                - strong [ref=f32e3734]: unit
                - text: (
                - emphasis [ref=f32e3735]: str
                - text: ) Units of measurement for the attribute
                - code [ref=f32e3736]: value
                - text: .
              - listitem [ref=f32e3737]:
                - strong [ref=f32e3738]: height
                - text: (
                - emphasis [ref=f32e3739]: float - meters
                - text: ) Total height of the signal.
              - listitem [ref=f32e3740]:
                - strong [ref=f32e3741]: width
                - text: (
                - emphasis [ref=f32e3742]: float - meters
                - text: ) Total width of the signal.
              - listitem [ref=f32e3743]:
                - strong [ref=f32e3744]: text
                - text: (
                - emphasis [ref=f32e3745]: str
                - text: ) Additional text in the signal.
              - listitem [ref=f32e3746]:
                - strong [ref=f32e3747]: h_offset
                - text: (
                - emphasis [ref=f32e3748]: float - meters
                - text: ) Orientation offset of the signal relative to the the definition of
                - code [ref=f32e3749]: road_id
                - text: at
                - code [ref=f32e3750]: s
                - text: in OpenDRIVE.
              - listitem [ref=f32e3751]:
                - strong [ref=f32e3752]: pitch
                - text: (
                - emphasis [ref=f32e3753]: float - meters
                - text: ) Pitch rotation of the signal (Y-axis in
                - link "UE coordinates system" [ref=f32e3754] [cursor=pointer]:
                  - /url: ./#carlarotation
                - text: ).
              - listitem [ref=f32e3755]:
                - strong [ref=f32e3756]: roll
                - text: (
                - emphasis [ref=f32e3757]: float
                - text: ) Roll rotation of the signal (X-axis in
                - link "UE coordinates system" [ref=f32e3758] [cursor=pointer]:
                  - /url: ./#carlarotation
                - text: ).
              - listitem [ref=f32e3759]:
                - strong [ref=f32e3760]: waypoint
                - text: (
                - emphasis [ref=f32e3761]:
                  - link "carla.Waypoint" [ref=f32e3762] [cursor=pointer]:
                    - /url: "#carla.Waypoint"
                - text: ) A waypoint placed in the lane of the one that made the query and at the
                - code [ref=f32e3763]: s
                - text: of the landmark. It is the first waypoint for which the landmark will be effective.
              - listitem [ref=f32e3764]:
                - strong [ref=f32e3765]: transform
                - text: (
                - emphasis [ref=f32e3766]:
                  - link "carla.Transform" [ref=f32e3767] [cursor=pointer]:
                    - /url: "#carla.Transform"
                - text: ) The location and orientation of the landmark in the simulation.
            - heading "Methods" [level=3] [ref=f32e3768]
            - heading "Getters" [level=5] [ref=f32e3769]
            - list [ref=f32e3770]:
              - listitem [ref=f32e3771]:
                - strong [ref=f32e3772]: get_lane_validities
                - text: (
                - strong [ref=f32e3774]: self
                - text: ) Returns which lanes the landmark is affecting to. As there may be specific lanes where the landmark is not effective, the return is a list of pairs containing ranges of the
                - strong [ref=f32e3775]: lane_id
                - text: "affected: Example: In a road with 5 lanes, being 3 not affected: [(from_lane1,to_lane2),(from_lane4,to_lane5)]."
                - list [ref=f32e3776]:
                  - listitem [ref=f32e3777]:
                    - strong [ref=f32e3778]: "Return:"
                    - emphasis [ref=f32e3779]: list(tuple(int))
            - separator [ref=f32e3780]
            - heading "carla.LandmarkOrientation" [level=2] [ref=f32e3781]
            - paragraph [ref=f32e3782]: Helper class to define the orientation of a landmark in the road. The definition is not directly translated from OpenDRIVE but converted for the sake of understanding.
            - heading "Instance Variables" [level=3] [ref=f32e3783]
            - list [ref=f32e3784]:
              - listitem [ref=f32e3785]:
                - strong [ref=f32e3786]: Positive
                - text: The landmark faces towards vehicles going on the same direction as the road's geometry definition (lanes 0 and negative in OpenDRIVE).
              - listitem [ref=f32e3787]:
                - strong [ref=f32e3788]: Negative
                - text: The landmark faces towards vehicles going on the opposite direction to the road's geometry definition (positive lanes in OpenDRIVE).
              - listitem [ref=f32e3789]:
                - strong [ref=f32e3790]: Both
                - text: Affects vehicles going in both directions of the road.
            - separator [ref=f32e3791]
            - heading "carla.LandmarkType" [level=2] [ref=f32e3792]
            - paragraph [ref=f32e3793]:
              - text: Helper class containing a set of commonly used landmark types as defined by the default country code in the
              - link "OpenDRIVE standard" [ref=f32e3794] [cursor=pointer]:
                - /url: http://opendrive.org/docs/OpenDRIVEFormatSpecRev1.5M.pdf
              - text: (Germany 2017).
              - strong [ref=f32e3795]:
                - link "carla.Landmark" [ref=f32e3796] [cursor=pointer]:
                  - /url: "#carla.Landmark"
                - text: does not reference this class
              - text: . The landmark type is a string that varies greatly depending on the country code being used. This class only makes it easier to manage some of the most commonly used in the default set by describing them as an enum.
            - heading "Instance Variables" [level=3] [ref=f32e3797]
