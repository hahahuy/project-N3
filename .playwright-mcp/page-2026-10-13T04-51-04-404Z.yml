            - heading "carla.Client" [level=2] [ref=f32e1748]
            - paragraph [ref=f32e1749]: The Client connects CARLA to the server which runs the simulation. Both server and client contain a CARLA library (libcarla) with some differences that allow communication between them. Many clients can be created and each of these will connect to the RPC server inside the simulation to send commands. The simulation runs server-side. Once the connection is established, the client will only receive data retrieved from the simulation. Walkers are the exception. The client is in charge of managing pedestrians so, if you are running a simulation with multiple clients, some issues may arise. For example, if you spawn walkers through different clients, collisions may happen, as each client is only aware of the ones it is in charge of.
            - paragraph [ref=f32e1750]:
              - text: The client also has a recording feature that saves all the information of a simulation while running it. This allows the server to replay it at will to obtain information and experiment with it.
              - link "Here" [ref=f32e1751] [cursor=pointer]:
                - /url: ../adv_recorder/
              - text: is some information about how to use this recorder.
            - heading "Methods" [level=3] [ref=f32e1752]
            - list [ref=f32e1753]:
              - listitem [ref=f32e1754]:
                - strong [ref=f32e1755]: __init__
                - text: (
                - strong [ref=f32e1757]: self
                - text: ","
                - generic [ref=f32e1758]:
                  - strong [ref=f32e1759]: host
                  - text: =127.0.0.1
                - text: ","
                - generic [ref=f32e1760]:
                  - strong [ref=f32e1761]: port
                  - text: =2000
                - text: ","
                - generic [ref=f32e1762]:
                  - strong [ref=f32e1763]: worker_threads
                  - text: =0
                - text: )
                - button "snippet →" [ref=f32e1764] [cursor=pointer]
                - text: Client constructor.
                - list [ref=f32e1765]:
                  - listitem [ref=f32e1766]:
                    - strong [ref=f32e1767]: "Parameters:"
                    - list [ref=f32e1768]:
                      - listitem [ref=f32e1769]:
                        - code [ref=f32e1770]: host
                        - text: (
                        - emphasis [ref=f32e1771]: str
                        - text: ) - IP address where a CARLA Simulator instance is running. Default is localhost (127.0.0.1).
                      - listitem [ref=f32e1772]:
                        - code [ref=f32e1773]: port
                        - text: (
                        - emphasis [ref=f32e1774]: int
                        - text: ) - TCP port where the CARLA Simulator instance is running. Default are 2000 and the subsequent 2001.
                      - listitem [ref=f32e1775]:
                        - code [ref=f32e1776]: worker_threads
                        - text: (
                        - emphasis [ref=f32e1777]: int
                        - text: ) - Number of working threads used for background updates. If 0, use all available concurrency.
              - listitem [ref=f32e1778]:
                - strong [ref=f32e1779]: apply_batch
                - text: (
                - strong [ref=f32e1781]: self
                - text: ","
                - strong [ref=f32e1783]: commands
                - text: ) Executes a list of commands on a single simulation step and retrieves no information. If you need information about the response of each command, use the
                - strong [ref=f32e1784]: apply_batch_sync()
                - text: method.
                - link "Here" [ref=f32e1785] [cursor=pointer]:
                  - /url: https://github.com/carla-simulator/carla/blob/master/PythonAPI/examples/generate_traffic.py
                - text: is an example on how to delete the actors that appear in
                - link "carla.ActorList" [ref=f32e1786] [cursor=pointer]:
                  - /url: "#carla.ActorList"
                - text: all at once.
                - list [ref=f32e1787]:
                  - listitem [ref=f32e1788]:
                    - strong [ref=f32e1789]: "Parameters:"
                    - list [ref=f32e1790]:
                      - listitem [ref=f32e1791]:
                        - code [ref=f32e1792]: commands
                        - text: (
                        - emphasis [ref=f32e1793]: list
                        - text: ) - A list of commands to execute in batch. Each command is different and has its own parameters. They appear listed at the bottom of this page.
              - listitem [ref=f32e1794]:
                - strong [ref=f32e1795]: apply_batch_sync
                - text: (
                - strong [ref=f32e1797]: self
                - text: ","
                - strong [ref=f32e1799]: commands
                - text: ","
                - generic [ref=f32e1800]:
                  - strong [ref=f32e1801]: due_tick_cue
                  - text: =False
                - text: )
                - button "snippet →" [ref=f32e1802] [cursor=pointer]
                - text: Executes a list of commands on a single simulation step, blocks until the commands are linked, and returns a list of command.Response that can be used to determine whether a single command succeeded or not.
                - link "Here" [ref=f32e1803] [cursor=pointer]:
                  - /url: https://github.com/carla-simulator/carla/blob/master/PythonAPI/examples/generate_traffic.py
                - text: is an example of it being used to spawn actors.
                - list [ref=f32e1804]:
                  - listitem [ref=f32e1805]:
                    - strong [ref=f32e1806]: "Parameters:"
                    - list [ref=f32e1807]:
                      - listitem [ref=f32e1808]:
                        - code [ref=f32e1809]: commands
                        - text: (
                        - emphasis [ref=f32e1810]: list
                        - text: ) - A list of commands to execute in batch. The commands available are listed right above, in the method
                        - strong [ref=f32e1811]: apply_batch()
                        - text: .
                      - listitem [ref=f32e1812]:
                        - code [ref=f32e1813]: due_tick_cue
                        - text: (
                        - emphasis [ref=f32e1814]: bool
                        - text: ) - A boolean parameter to specify whether or not to perform a
                        - link "carla.World.tick" [ref=f32e1815] [cursor=pointer]:
                          - /url: "#carla.World.tick"
                        - text: after applying the batch in
                        - emphasis [ref=f32e1816]: synchronous mode
                        - text: . It is
                        - strong [ref=f32e1817]: "False"
                        - text: by default.
                  - listitem [ref=f32e1818]:
                    - strong [ref=f32e1819]: "Return:"
                    - emphasis [ref=f32e1820]: list(command.Response)
              - listitem [ref=f32e1821]:
                - strong [ref=f32e1822]: generate_opendrive_world
                - text: (
                - strong [ref=f32e1824]: self
                - text: ","
                - strong [ref=f32e1826]: opendrive
                - text: ","
                - generic [ref=f32e1827]:
                  - strong [ref=f32e1828]: parameters
                  - text: =(2.0, 50.0, 1.0, 0.6, true, true)
                - text: ","
                - generic [ref=f32e1829]:
                  - strong [ref=f32e1830]: reset_settings
                  - text: =True
                - text: ) Loads a new world with a basic 3D topology generated from the content of an OpenDRIVE file. This content is passed as a
                - code [ref=f32e1831]: string
                - text: parameter. It is similar to
                - code [ref=f32e1832]: client.load_world(map_name)
                - text: but allows for custom OpenDRIVE maps in server side. Cars can drive around the map, but there are no graphics besides the road and sidewalks.
                - list [ref=f32e1833]:
                  - listitem [ref=f32e1834]:
                    - strong [ref=f32e1835]: "Parameters:"
                    - list [ref=f32e1836]:
                      - listitem [ref=f32e1837]:
                        - code [ref=f32e1838]: opendrive
                        - text: (
                        - emphasis [ref=f32e1839]: str
                        - text: ) - Content of an ASAM OpenDRIVE file as
                        - code [ref=f32e1840]: string
                        - text: ","
                        - strong [ref=f32e1841]:
                          - text: not the path to the
                          - code [ref=f32e1842]: .xodr
                        - text: .
                      - listitem [ref=f32e1843]:
                        - code [ref=f32e1844]: parameters
                        - text: (
                        - emphasis [ref=f32e1845]:
                          - link "carla.OpendriveGenerationParameters" [ref=f32e1846] [cursor=pointer]:
                            - /url: "#carla.OpendriveGenerationParameters"
                        - text: ) - Additional settings for the mesh generation. If none are provided, default values will be used.
                      - listitem [ref=f32e1847]:
                        - code [ref=f32e1848]: reset_settings
                        - text: (
                        - emphasis [ref=f32e1849]: bool
                        - text: ) - Option to reset the episode setting to default values, set to false to keep the current settings. This is useful to keep sync mode when changing map and to keep deterministic scenarios.
              - listitem [ref=f32e1850]:
                - strong [ref=f32e1851]: load_world
                - text: (
                - strong [ref=f32e1853]: self
                - text: ","
                - strong [ref=f32e1855]: map_name
                - text: ","
                - generic [ref=f32e1856]:
                  - strong [ref=f32e1857]: reset_settings
                  - text: =True
                - text: ","
                - generic [ref=f32e1858]:
                  - strong [ref=f32e1859]: map_layers
                  - text: =
                  - link "carla.MapLayer.All" [ref=f32e1860] [cursor=pointer]:
                    - /url: "#carla.MapLayer.All"
                - text: ) Creates a new world with default settings using
                - code [ref=f32e1861]: map_name
                - text: map. All actors in the current world will be destroyed.
                - list [ref=f32e1862]:
                  - listitem [ref=f32e1863]:
                    - strong [ref=f32e1864]: "Parameters:"
                    - list [ref=f32e1865]:
                      - listitem [ref=f32e1866]:
                        - code [ref=f32e1867]: map_name
                        - text: (
                        - emphasis [ref=f32e1868]: str
                        - text: ) - Name of the map to be used in this world. Accepts both full paths and map names, e.g. '/Game/Carla/Maps/Town01' or 'Town01'. Remember that these paths are dynamic.
                      - listitem [ref=f32e1869]:
                        - code [ref=f32e1870]: reset_settings
                        - text: (
                        - emphasis [ref=f32e1871]: bool
                        - text: ) - Option to reset the episode setting to default values, set to false to keep the current settings. This is useful to keep sync mode when changing map and to keep deterministic scenarios.
                      - listitem [ref=f32e1872]:
                        - code [ref=f32e1873]: map_layers
                        - text: (
                        - emphasis [ref=f32e1874]:
                          - link "carla.MapLayer" [ref=f32e1875] [cursor=pointer]:
                            - /url: "#carla.MapLayer"
                        - text: ) - Layers of the map that will be loaded. By default all layers are loaded. This parameter works like a flag mask.
                  - listitem [ref=f32e1876]:
                    - strong [ref=f32e1877]: "Return:"
                    - emphasis [ref=f32e1878]:
                      - link "carla.World" [ref=f32e1879] [cursor=pointer]:
                        - /url: "#carla.World"
                  - listitem [ref=f32e1880]:
                    - strong [ref=f32e1881]: "Warning:"
                    - emphasis [ref=f32e1883]:
                      - code [ref=f32e1884]: map_layers
                      - text: are only available for "Opt" maps
              - listitem [ref=f32e1885]:
                - strong [ref=f32e1886]: load_world_if_different
                - text: (
                - strong [ref=f32e1888]: self
                - text: ","
                - strong [ref=f32e1890]: map_name
                - text: ","
                - generic [ref=f32e1891]:
                  - strong [ref=f32e1892]: reset_settings
                  - text: =True
                - text: ","
                - generic [ref=f32e1893]:
                  - strong [ref=f32e1894]: map_layers
                  - text: =
                  - link "carla.MapLayer.All" [ref=f32e1895] [cursor=pointer]:
                    - /url: "#carla.MapLayer.All"
                - text: ) Creates a new world with default settings using
                - code [ref=f32e1896]: map_name
                - text: map only if it is a different map from the currently loaded map. Otherwise this function returns
                - code [ref=f32e1897]: None
                - text: . All actors in the current world will be destroyed.
                - list [ref=f32e1898]:
                  - listitem [ref=f32e1899]:
                    - strong [ref=f32e1900]: "Parameters:"
                    - list [ref=f32e1901]:
                      - listitem [ref=f32e1902]:
                        - code [ref=f32e1903]: map_name
                        - text: (
                        - emphasis [ref=f32e1904]: str
                        - text: ) - Name of the map to be used in this world. Accepts both full paths and map names, e.g. '/Game/Carla/Maps/Town01' or 'Town01'. Remember that these paths are dynamic.
                      - listitem [ref=f32e1905]:
                        - code [ref=f32e1906]: reset_settings
                        - text: (
                        - emphasis [ref=f32e1907]: bool
                        - text: ) - Option to reset the episode setting to default values, set to false to keep the current settings. This is useful to keep sync mode when changing map and to keep deterministic scenarios.
                      - listitem [ref=f32e1908]:
                        - code [ref=f32e1909]: map_layers
                        - text: (
                        - emphasis [ref=f32e1910]:
                          - link "carla.MapLayer" [ref=f32e1911] [cursor=pointer]:
                            - /url: "#carla.MapLayer"
                        - text: ) - Layers of the map that will be loaded. By default all layers are loaded. This parameter works like a flag mask.
                  - listitem [ref=f32e1912]:
                    - strong [ref=f32e1913]: "Return:"
                    - emphasis [ref=f32e1914]:
                      - link "carla.World" [ref=f32e1915] [cursor=pointer]:
                        - /url: "#carla.World"
                  - listitem [ref=f32e1916]:
                    - strong [ref=f32e1917]: "Warning:"
                    - emphasis [ref=f32e1919]:
                      - code [ref=f32e1920]: map_layers
                      - text: are only available for "Opt" maps
              - listitem [ref=f32e1921]:
                - strong [ref=f32e1922]: reload_world
                - text: (
                - strong [ref=f32e1924]: self
                - text: ","
                - generic [ref=f32e1925]:
                  - strong [ref=f32e1926]: reset_settings
                  - text: =True
                - text: ) Reload the current world, note that a new world is created with default settings using the same map. All actors present in the world will be destroyed,
                - strong [ref=f32e1927]: but
                - text: traffic manager instances will stay alive.
                - list [ref=f32e1928]:
                  - listitem [ref=f32e1929]:
                    - strong [ref=f32e1930]: "Parameters:"
                    - list [ref=f32e1931]:
                      - listitem [ref=f32e1932]:
                        - code [ref=f32e1933]: reset_settings
                        - text: (
                        - emphasis [ref=f32e1934]: bool
                        - text: ) - Option to reset the episode setting to default values, set to false to keep the current settings. This is useful to keep sync mode when changing map and to keep deterministic scenarios.
                  - listitem [ref=f32e1935]:
                    - strong [ref=f32e1936]: "Return:"
                    - emphasis [ref=f32e1937]:
                      - link "carla.World" [ref=f32e1938] [cursor=pointer]:
                        - /url: "#carla.World"
                  - listitem [ref=f32e1939]:
                    - strong [ref=f32e1940]: "Raises:"
                    - text: RuntimeError when corresponding.
              - listitem [ref=f32e1941]:
                - strong [ref=f32e1942]: replay_file
                - text: (
                - strong [ref=f32e1944]: self
                - text: ","
                - strong [ref=f32e1946]: name
                - text: ","
                - strong [ref=f32e1948]: start
                - text: ","
                - strong [ref=f32e1950]: duration
                - text: ","
                - strong [ref=f32e1952]: follow_id
                - text: ","
                - strong [ref=f32e1954]: replay_sensors
                - text: ) Load a new world with default settings using
                - code [ref=f32e1955]: map_name
                - text: map. All actors present in the current world will be destroyed,
                - strong [ref=f32e1956]: but
                - text: traffic manager instances will stay alive.
                - list [ref=f32e1957]:
                  - listitem [ref=f32e1958]:
                    - strong [ref=f32e1959]: "Parameters:"
                    - list [ref=f32e1960]:
                      - listitem [ref=f32e1961]:
                        - code [ref=f32e1962]: name
                        - text: (
                        - emphasis [ref=f32e1963]: str
                        - text: ) - Name of the file containing the information of the simulation.
                      - listitem [ref=f32e1964]:
                        - code [ref=f32e1965]: start
                        - text: (
                        - emphasis [ref=f32e1966]: float - seconds
                        - text: ) - Time where to start playing the simulation. Negative is read as beginning from the end, being -10 just 10 seconds before the recording finished.
                      - listitem [ref=f32e1967]:
                        - code [ref=f32e1968]: duration
                        - text: (
                        - emphasis [ref=f32e1969]: float - seconds
                        - text: ) - Time that will be reenacted using the information
                        - code [ref=f32e1970]: name
                        - text: file. If the end is reached, the simulation will continue.
                      - listitem [ref=f32e1971]:
                        - code [ref=f32e1972]: follow_id
                        - text: (
                        - emphasis [ref=f32e1973]: int
                        - text: ) - ID of the actor to follow. If this is 0 then camera is disabled.
                      - listitem [ref=f32e1974]:
                        - code [ref=f32e1975]: replay_sensors
                        - text: (
                        - emphasis [ref=f32e1976]: bool
                        - text: ) - Flag to enable or disable the spawn of sensors during playback.
              - listitem [ref=f32e1977]:
                - strong [ref=f32e1978]: request_file
                - text: (
                - strong [ref=f32e1980]: self
                - text: ","
                - strong [ref=f32e1982]: name
                - text: ) Requests one of the required files returned by
                - link "carla.Client.get_required_files" [ref=f32e1983] [cursor=pointer]:
                  - /url: "#carla.Client.get_required_files"
                - text: .
                - list [ref=f32e1984]:
                  - listitem [ref=f32e1985]:
                    - strong [ref=f32e1986]: "Parameters:"
                    - list [ref=f32e1987]:
                      - listitem [ref=f32e1988]:
                        - code [ref=f32e1989]: name
                        - text: (
                        - emphasis [ref=f32e1990]: str
                        - text: ) - Name of the file you are requesting.
              - listitem [ref=f32e1991]:
                - strong [ref=f32e1992]: show_recorder_actors_blocked
                - text: (
                - strong [ref=f32e1994]: self
                - text: ","
                - strong [ref=f32e1996]: filename
                - text: ","
                - strong [ref=f32e1998]: min_time
                - text: ","
                - strong [ref=f32e2000]: min_distance
                - text: ) The terminal will show the information registered for actors considered blocked. An actor is considered blocked when it does not move a minimum distance in a period of time, being these
                - code [ref=f32e2001]: min_distance
                - text: and
                - code [ref=f32e2002]: min_time
                - text: .
                - list [ref=f32e2003]:
                  - listitem [ref=f32e2004]:
                    - strong [ref=f32e2005]: "Parameters:"
                    - list [ref=f32e2006]:
                      - listitem [ref=f32e2007]:
                        - code [ref=f32e2008]: filename
                        - text: (
                        - emphasis [ref=f32e2009]: str
                        - text: ) - Name of the recorded file to load.
                      - listitem [ref=f32e2010]:
                        - code [ref=f32e2011]: min_time
                        - text: (
                        - emphasis [ref=f32e2012]: float - seconds
                        - text: ) - Minimum time the actor has to move a minimum distance before being considered blocked. Default is 60 seconds.
                      - listitem [ref=f32e2013]:
                        - code [ref=f32e2014]: min_distance
                        - text: (
                        - emphasis [ref=f32e2015]: float - centimeters
                        - text: ) - Minimum distance the actor has to move to not be considered blocked. Default is 100 centimeters.
                  - listitem [ref=f32e2016]:
                    - strong [ref=f32e2017]: "Return:"
                    - emphasis [ref=f32e2018]: string
              - listitem [ref=f32e2019]:
                - strong [ref=f32e2020]: show_recorder_collisions
                - text: (
                - strong [ref=f32e2022]: self
                - text: ","
                - strong [ref=f32e2024]: filename
                - text: ","
                - strong [ref=f32e2026]: category1
                - text: ","
                - strong [ref=f32e2028]: category2
                - text: ) The terminal will show the collisions registered by the recorder. These can be filtered by specifying the type of actor involved. The categories will be specified in
                - code [ref=f32e2029]: category1
                - text: and
                - code [ref=f32e2030]: category2
                - text: "as follows: 'h' = Hero, the one vehicle that can be controlled manually or managed by the user. 'v' = Vehicle 'w' = Walker 't' = Traffic light 'o' = Other 'a' = Any If you want to see only collisions between a vehicles and a walkers, use for"
                - code [ref=f32e2031]: category1
                - text: as 'v' and
                - code [ref=f32e2032]: category2
                - text: as 'w' or vice versa. If you want to see all the collisions (filter off) you can use 'a' for both parameters.
                - list [ref=f32e2033]:
                  - listitem [ref=f32e2034]:
                    - strong [ref=f32e2035]: "Parameters:"
                    - list [ref=f32e2036]:
                      - listitem [ref=f32e2037]:
                        - code [ref=f32e2038]: filename
                        - text: (
                        - emphasis [ref=f32e2039]: str
                        - text: ) - Name or absolute path of the file recorded, depending on your previous choice.
                      - listitem [ref=f32e2040]:
                        - code [ref=f32e2041]: category1
                        - text: (
                        - emphasis [ref=f32e2042]: single char
                        - text: ) - Character variable specifying a first type of actor involved in the collision.
                      - listitem [ref=f32e2043]:
                        - code [ref=f32e2044]: category2
                        - text: (
                        - emphasis [ref=f32e2045]: single char
                        - text: ) - Character variable specifying the second type of actor involved in the collision.
                  - listitem [ref=f32e2046]:
                    - strong [ref=f32e2047]: "Return:"
                    - emphasis [ref=f32e2048]: string
              - listitem [ref=f32e2049]:
                - strong [ref=f32e2050]: show_recorder_file_info
                - text: (
                - strong [ref=f32e2052]: self
                - text: ","
                - strong [ref=f32e2054]: filename
                - text: ","
                - strong [ref=f32e2056]: show_all
                - text: ) The information saved by the recorder will be parsed and shown in your terminal as text (frames, times, events, state, positions...). The information shown can be specified by using the
                - code [ref=f32e2057]: show_all
                - text: parameter.
                - link "Here" [ref=f32e2058] [cursor=pointer]:
                  - /url: ../ref_recorder_binary_file_format/
                - text: is some more information about how to read the recorder file.
                - list [ref=f32e2059]:
                  - listitem [ref=f32e2060]:
                    - strong [ref=f32e2061]: "Parameters:"
                    - list [ref=f32e2062]:
                      - listitem [ref=f32e2063]:
                        - code [ref=f32e2064]: filename
                        - text: (
                        - emphasis [ref=f32e2065]: str
                        - text: ) - Name or absolute path of the file recorded, depending on your previous choice.
                      - listitem [ref=f32e2066]:
                        - code [ref=f32e2067]: show_all
                        - text: (
                        - emphasis [ref=f32e2068]: bool
                        - text: ) - If
                        - strong [ref=f32e2069]: "True"
                        - text: ", returns all the information stored for every frame (traffic light states, positions of all actors, orientation and animation data...). If"
                        - strong [ref=f32e2070]: "False"
                        - text: ", returns a summary of key events and frames."
                  - listitem [ref=f32e2071]:
                    - strong [ref=f32e2072]: "Return:"
                    - emphasis [ref=f32e2073]: string
              - listitem [ref=f32e2074]:
                - strong [ref=f32e2075]: start_recorder
                - text: (
                - strong [ref=f32e2077]: self
                - text: ","
                - strong [ref=f32e2079]: filename
                - text: ","
                - generic [ref=f32e2080]:
                  - strong [ref=f32e2081]: additional_data
                  - text: =False
                - text: ) Enables the recording feature, which will start saving every information possible needed by the server to replay the simulation.
                - list [ref=f32e2082]:
                  - listitem [ref=f32e2083]:
                    - strong [ref=f32e2084]: "Parameters:"
                    - list [ref=f32e2085]:
                      - listitem [ref=f32e2086]:
                        - code [ref=f32e2087]: filename
                        - text: (
                        - emphasis [ref=f32e2088]: str
                        - text: ") - Name of the file to write the recorded data. An absolute path will be considered if some folder appears in the name. Otherwise, the chosen path will be one of the following:"
                        - strong [ref=f32e2089]: Build from source
                        - text: "-"
                        - code [ref=f32e2090]: <CARLA_ROOT>/Unreal/CarlaUE4/Saved
                        - text: ","
                        - strong [ref=f32e2091]: Windows package
                        - text: "-"
                        - code [ref=f32e2092]: C:\Users\<user>\AppData\Local\CarlaUE4\Saved
                        - text: ","
                        - strong [ref=f32e2093]: Linux package
                        - text: "-"
                        - code [ref=f32e2094]: /home/<user>/.config/Epic/CarlaUE4/Saved/
                        - text: .
                      - listitem [ref=f32e2095]:
                        - code [ref=f32e2096]: additional_data
                        - text: (
                        - emphasis [ref=f32e2097]: bool
                        - text: ) - Enables or disable recording non-essential data for reproducing the simulation (bounding box location, physics control parameters, etc).
              - listitem [ref=f32e2098]:
                - strong [ref=f32e2099]: stop_recorder
                - text: (
                - strong [ref=f32e2101]: self
                - text: ) Stops the recording in progress. If you specified a path in
                - code [ref=f32e2102]: filename
                - text: ", the recording will be there. If not, look inside"
                - code [ref=f32e2103]: CarlaUE4/Saved/
                - text: .
              - listitem [ref=f32e2104]:
                - strong [ref=f32e2105]: stop_replayer
                - text: (
                - strong [ref=f32e2107]: self
                - text: ","
                - strong [ref=f32e2109]: keep_actors
                - text: ) Stop current replayer.
                - list [ref=f32e2110]:
                  - listitem [ref=f32e2111]:
                    - strong [ref=f32e2112]: "Parameters:"
                    - list [ref=f32e2113]:
                      - listitem [ref=f32e2114]:
                        - code [ref=f32e2115]: keep_actors
                        - text: (
                        - emphasis [ref=f32e2116]: bool
                        - text: ) - True if you want autoremove all actors from the replayer, or False to keep them.
            - heading "Getters" [level=5] [ref=f32e2117]
            - list [ref=f32e2118]:
              - listitem [ref=f32e2119]:
                - strong [ref=f32e2120]: get_available_maps
                - text: (
                - strong [ref=f32e2122]: self
                - text: ") Returns a list of strings containing the paths of the maps available on server. These paths are dynamic, they will be created during the simulation and so you will not find them when looking up in your files. One of the possible returns for this method would be: ['/Game/Carla/Maps/Town01', '/Game/Carla/Maps/Town02', '/Game/Carla/Maps/Town03', '/Game/Carla/Maps/Town04', '/Game/Carla/Maps/Town05', '/Game/Carla/Maps/Town06', '/Game/Carla/Maps/Town07']."
                - list [ref=f32e2123]:
                  - listitem [ref=f32e2124]:
                    - strong [ref=f32e2125]: "Return:"
                    - emphasis [ref=f32e2126]: list(str)
              - listitem [ref=f32e2127]:
                - strong [ref=f32e2128]: get_client_version
                - text: (
                - strong [ref=f32e2130]: self
                - text: ) Returns the client libcarla version by consulting it in the "Version.h" file. Both client and server can use different libcarla versions but some issues may arise regarding unexpected incompatibilities.
                - list [ref=f32e2131]:
                  - listitem [ref=f32e2132]:
                    - strong [ref=f32e2133]: "Return:"
                    - emphasis [ref=f32e2134]: str
              - listitem [ref=f32e2135]:
                - strong [ref=f32e2136]: get_required_files
                - text: (
                - strong [ref=f32e2138]: self
                - text: ","
                - strong [ref=f32e2140]: folder
                - text: ","
                - generic [ref=f32e2141]:
                  - strong [ref=f32e2142]: download
                  - text: =True
                - text: ) Asks the server which files are required by the client to use the current map. Option to download files automatically if they are not already in the cache.
                - list [ref=f32e2143]:
                  - listitem [ref=f32e2144]:
                    - strong [ref=f32e2145]: "Parameters:"
                    - list [ref=f32e2146]:
                      - listitem [ref=f32e2147]:
                        - code [ref=f32e2148]: folder
                        - text: (
                        - emphasis [ref=f32e2149]: str
                        - text: ) - Specifies a folder to look through on the server maps. Leaving this blank will search recursively through all map folders in the server, which is recommended if you're unfamiliar with the server map folder structure.
                      - listitem [ref=f32e2150]:
                        - code [ref=f32e2151]: download
                        - text: (
                        - emphasis [ref=f32e2152]: bool
                        - text: ) - If True, downloads files that are not already in cache. The cache can be found at "HOME\carlaCache" or "USERPROFILE\carlaCache", depending on OS.
              - listitem [ref=f32e2153]:
                - strong [ref=f32e2154]: get_server_version
                - text: (
                - strong [ref=f32e2156]: self
                - text: ) Returns the server libcarla version by consulting it in the "Version.h" file. Both client and server should use the same libcarla version.
                - list [ref=f32e2157]:
                  - listitem [ref=f32e2158]:
                    - strong [ref=f32e2159]: "Return:"
                    - emphasis [ref=f32e2160]: str
              - listitem [ref=f32e2161]:
                - strong [ref=f32e2162]: get_trafficmanager
                - text: (
                - strong [ref=f32e2164]: self
                - text: ","
                - generic [ref=f32e2165]:
                  - strong [ref=f32e2166]: client_connection
                  - text: =8000
                - text: ) Returns an instance of the traffic manager related to the specified port. If it does not exist, this will be created.
                - list [ref=f32e2167]:
                  - listitem [ref=f32e2168]:
                    - strong [ref=f32e2169]: "Parameters:"
                    - list [ref=f32e2170]:
                      - listitem [ref=f32e2171]:
                        - code [ref=f32e2172]: client_connection
                        - text: (
                        - emphasis [ref=f32e2173]: int
                        - text: ) - Port that will be used by the traffic manager. Default is
                        - code [ref=f32e2174]: "8000"
                        - text: .
                  - listitem [ref=f32e2175]:
                    - strong [ref=f32e2176]: "Return:"
                    - emphasis [ref=f32e2177]:
                      - link "carla.TrafficManager" [ref=f32e2178] [cursor=pointer]:
                        - /url: "#carla.TrafficManager"
              - listitem [ref=f32e2179]:
                - strong [ref=f32e2180]: get_world
                - text: (
                - strong [ref=f32e2182]: self
                - text: ) Returns the world object currently active in the simulation. This world will be later used for example to load maps.
                - list [ref=f32e2183]:
                  - listitem [ref=f32e2184]:
                    - strong [ref=f32e2185]: "Return:"
                    - emphasis [ref=f32e2186]:
                      - link "carla.World" [ref=f32e2187] [cursor=pointer]:
                        - /url: "#carla.World"
            - heading "Setters" [level=5] [ref=f32e2188]
            - list [ref=f32e2189]:
              - listitem [ref=f32e2190]:
                - strong [ref=f32e2191]: set_files_base_folder
                - text: (
                - strong [ref=f32e2193]: self
                - text: ","
                - strong [ref=f32e2195]: path
                - text: )
                - list [ref=f32e2196]:
                  - listitem [ref=f32e2197]:
                    - strong [ref=f32e2198]: "Parameters:"
                    - list [ref=f32e2199]:
                      - listitem [ref=f32e2200]:
                        - code [ref=f32e2201]: path
                        - text: (
                        - emphasis [ref=f32e2202]: str
                        - text: ) - Specifies the base folder where the local cache for required files will be placed.
              - listitem [ref=f32e2203]:
                - strong [ref=f32e2204]: set_replayer_ignore_hero
                - text: (
                - strong [ref=f32e2206]: self
                - text: ","
                - strong [ref=f32e2208]: ignore_hero
                - text: )
                - list [ref=f32e2209]:
                  - listitem [ref=f32e2210]:
                    - strong [ref=f32e2211]: "Parameters:"
                    - list [ref=f32e2212]:
                      - listitem [ref=f32e2213]:
                        - code [ref=f32e2214]: ignore_hero
                        - text: (
                        - emphasis [ref=f32e2215]: bool
                        - text: ) - Enables or disables playback of the hero vehicle during a playback of a recorded simulation.
              - listitem [ref=f32e2216]:
                - strong [ref=f32e2217]: set_replayer_ignore_spectator
                - text: (
                - strong [ref=f32e2219]: self
                - text: ","
                - strong [ref=f32e2221]: ignore_spectator
                - text: )
                - list [ref=f32e2222]:
                  - listitem [ref=f32e2223]:
                    - strong [ref=f32e2224]: "Parameters:"
                    - list [ref=f32e2225]:
                      - listitem [ref=f32e2226]:
                        - code [ref=f32e2227]: ignore_spectator
                        - text: (
                        - emphasis [ref=f32e2228]: bool
                        - text: ) - Determines whether the recorded spectator movements will be replicated by the replayer.
              - listitem [ref=f32e2229]:
                - strong [ref=f32e2230]: set_replayer_time_factor
                - text: (
                - strong [ref=f32e2232]: self
                - text: ","
                - generic [ref=f32e2233]:
                  - strong [ref=f32e2234]: time_factor
                  - text: =1.0
                - text: ) When used, the time speed of the reenacted simulation is modified at will. It can be used several times while a playback is in curse.
                - list [ref=f32e2235]:
                  - listitem [ref=f32e2236]:
                    - strong [ref=f32e2237]: "Parameters:"
                    - list [ref=f32e2238]:
                      - listitem [ref=f32e2239]:
                        - code [ref=f32e2240]: time_factor
                        - text: (
                        - emphasis [ref=f32e2241]: float
                        - text: ) - 1.0 means normal time speed. Greater than 1.0 means fast motion (2.0 would be double speed) and lesser means slow motion (0.5 would be half speed).
              - listitem [ref=f32e2242]:
                - strong [ref=f32e2243]: set_timeout
                - text: (
                - strong [ref=f32e2245]: self
                - text: ","
                - strong [ref=f32e2247]: seconds
                - text: ) Sets the maximum time a network call is allowed before blocking it and raising a timeout exceeded error.
                - list [ref=f32e2248]:
                  - listitem [ref=f32e2249]:
                    - strong [ref=f32e2250]: "Parameters:"
                    - list [ref=f32e2251]:
                      - listitem [ref=f32e2252]:
                        - code [ref=f32e2253]: seconds
                        - text: (
                        - emphasis [ref=f32e2254]: float - seconds
                        - text: ) - New timeout value. Default is 5 seconds.
            - separator [ref=f32e2255]
            - heading "carla.CollisionEvent" [level=2] [ref=f32e2256]
            - paragraph [ref=f32e2257]:
              - generic [ref=f32e2258]:
                - text: Inherited from
                - emphasis [ref=f32e2259]:
                  - link "carla.SensorData" [ref=f32e2260] [cursor=pointer]:
                    - /url: "#carla.SensorData"
              - text: Class that defines a collision data for sensor.other.collision. The sensor creates one of these for every collision detected. Each collision sensor produces one collision event per collision per frame. Multiple collision events may be produced in a single frame by collisions with multiple other actors. Learn more about this
              - link "here" [ref=f32e2261] [cursor=pointer]:
                - /url: ../ref_sensors/#collision-detector
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e2262]
            - list [ref=f32e2263]:
              - listitem [ref=f32e2264]:
                - strong [ref=f32e2265]: actor
                - text: (
                - emphasis [ref=f32e2266]:
                  - link "carla.Actor" [ref=f32e2267] [cursor=pointer]:
                    - /url: "#carla.Actor"
                - text: ) The actor the sensor is attached to, the one that measured the collision.
              - listitem [ref=f32e2268]:
                - strong [ref=f32e2269]: other_actor
                - text: (
                - emphasis [ref=f32e2270]:
                  - link "carla.Actor" [ref=f32e2271] [cursor=pointer]:
                    - /url: "#carla.Actor"
                - text: ) The second actor involved in the collision.
              - listitem [ref=f32e2272]:
                - strong [ref=f32e2273]: normal_impulse
                - text: (
                - emphasis [ref=f32e2274]:
                  - link "carla.Vector3D" [ref=f32e2275] [cursor=pointer]:
                    - /url: "#carla.Vector3D"
                  - text: "- N*s"
                - text: ) Normal impulse resulting of the collision.
            - separator [ref=f32e2276]
