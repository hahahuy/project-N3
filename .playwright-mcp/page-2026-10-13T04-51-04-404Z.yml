            - heading "carla.Osm2Odr" [level=2] [ref=f32e5386]
            - paragraph [ref=f32e5387]:
              - text: Class that converts an OpenStreetMap map to OpenDRIVE format, so that it can be loaded in CARLA. Find out more about this feature in the
              - link "docs" [ref=f32e5388] [cursor=pointer]:
                - /url: ../tuto_G_openstreetmap/
              - text: .
            - heading "Methods" [level=3] [ref=f32e5389]
            - list [ref=f32e5390]:
              - listitem [ref=f32e5391]:
                - strong [ref=f32e5392]: convert
                - text: (
                - strong [ref=f32e5394]: osm_file
                - text: ","
                - strong [ref=f32e5396]: settings
                - text: ) Takes the content of an
                - code [ref=f32e5397]: .osm
                - text: file (OpenStreetMap format) and returns the content of the
                - code [ref=f32e5398]: .xodr
                - text: (OpenDRIVE format) describing said map. Some parameterization is passed to do the conversion.
                - list [ref=f32e5399]:
                  - listitem [ref=f32e5400]:
                    - strong [ref=f32e5401]: "Parameters:"
                    - list [ref=f32e5402]:
                      - listitem [ref=f32e5403]:
                        - code [ref=f32e5404]: osm_file
                        - text: (
                        - emphasis [ref=f32e5405]: str
                        - text: ) - The content of the input OpenStreetMap file parsed as string.
                      - listitem [ref=f32e5406]:
                        - code [ref=f32e5407]: settings
                        - text: (
                        - emphasis [ref=f32e5408]:
                          - link "carla.OSM2ODRSettings" [ref=f32e5409] [cursor=pointer]:
                            - /url: "#carla.OSM2ODRSettings"
                        - text: ) - Parameterization for the conversion.
                  - listitem [ref=f32e5410]:
                    - strong [ref=f32e5411]: "Return:"
                    - emphasis [ref=f32e5412]: str
            - separator [ref=f32e5413]
            - heading "carla.Osm2OdrSettings" [level=2] [ref=f32e5414]
            - paragraph [ref=f32e5415]:
              - text: Helper class that contains the parameterization that will be used by
              - link "carla.Osm2Odr" [ref=f32e5416] [cursor=pointer]:
                - /url: "#carla.Osm2Odr"
              - text: to convert an OpenStreetMap map to OpenDRIVE format. Find out more about this feature in the
              - link "docs" [ref=f32e5417] [cursor=pointer]:
                - /url: ../tuto_G_openstreetmap/
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e5418]
            - list [ref=f32e5419]:
              - listitem [ref=f32e5420]:
                - strong [ref=f32e5421]: use_offsets
                - text: (
                - emphasis [ref=f32e5422]: bool
                - text: ) Enables the use of offset for the conversion. The offset will move the origin position of the map. Default value is
                - strong [ref=f32e5423]: "False"
                - text: .
              - listitem [ref=f32e5424]:
                - strong [ref=f32e5425]: offset_x
                - text: (
                - emphasis [ref=f32e5426]: float - meters
                - text: ) Offset in the X axis. Default value is
                - strong [ref=f32e5427]: "0.0"
                - text: .
              - listitem [ref=f32e5428]:
                - strong [ref=f32e5429]: offset_y
                - text: (
                - emphasis [ref=f32e5430]: float - meters
                - text: ) Offset in the Y axis. Default value is
                - strong [ref=f32e5431]: "0.0"
                - text: .
              - listitem [ref=f32e5432]:
                - strong [ref=f32e5433]: default_lane_width
                - text: (
                - emphasis [ref=f32e5434]: float - meters
                - text: ) Width of the lanes described in the resulting XODR map. Default value is
                - strong [ref=f32e5435]: "4.0"
                - text: .
              - listitem [ref=f32e5436]:
                - strong [ref=f32e5437]: elevation_layer_height
                - text: (
                - emphasis [ref=f32e5438]: float - meters
                - text: ) Defines the height separating two different
                - link "OpenStreetMap layers" [ref=f32e5439] [cursor=pointer]:
                  - /url: https://wiki.openstreetmap.org/wiki/Key:layer
                - text: . Default value is
                - strong [ref=f32e5440]: "0.0"
                - text: .
              - listitem [ref=f32e5441]:
                - strong [ref=f32e5442]: center_map
                - text: (
                - emphasis [ref=f32e5443]: bool
                - text: ) When this option is enabled, the geometry of the map will be displaced so that the origin of coordinates matches the center of the bounding box of the entire road map.
              - listitem [ref=f32e5444]:
                - strong [ref=f32e5445]: proj_string
                - text: (
                - emphasis [ref=f32e5446]: str
                - text: ) Defines the
                - link "proj4" [ref=f32e5447] [cursor=pointer]:
                  - /url: https://github.com/OSGeo/proj.4
                - text: string that will be used to compute the projection from geocoordinates to cartesian coordinates. This string will be written in the resulting OpenDRIVE unless the options
                - code [ref=f32e5448]: use_offsets
                - text: or
                - code [ref=f32e5449]: center_map
                - text: are enabled as these options override some of the definitions in the string.
              - listitem [ref=f32e5450]:
                - strong [ref=f32e5451]: generate_traffic_lights
                - text: (
                - emphasis [ref=f32e5452]: bool
                - text: ) Indicates wether to generate traffic light data in the OpenDRIVE. Road types defined by
                - code [ref=f32e5453]: set_traffic_light_excluded_way_types(way_types)
                - text: will not generate traffic lights.
              - listitem [ref=f32e5454]:
                - strong [ref=f32e5455]: all_junctions_with_traffic_lights
                - text: (
                - emphasis [ref=f32e5456]: bool
                - text: ) When disabled, the converter will generate traffic light data from the OpenStreetMaps data only. When enabled, all junctions will generate traffic lights.
            - heading "Methods" [level=3] [ref=f32e5457]
            - heading "Setters" [level=5] [ref=f32e5458]
            - list [ref=f32e5459]:
              - listitem [ref=f32e5460]:
                - strong [ref=f32e5461]: set_osm_way_types
                - text: (
                - strong [ref=f32e5463]: self
                - text: ","
                - strong [ref=f32e5465]: way_types
                - text: ) Defines the OpenStreetMaps road types that will be imported to OpenDRIVE. By default the road types imported are
                - code [ref=f32e5466]: motorway, motorway_link, trunk, trunk_link, primary, primary_link, secondary, secondary_link, tertiary, tertiary_link, unclassified, residential
                - text: . For a full list of road types check
                - link "here" [ref=f32e5467] [cursor=pointer]:
                  - /url: https://wiki.openstreetmap.org/wiki/Main_Page
                - text: .
                - list [ref=f32e5468]:
                  - listitem [ref=f32e5469]:
                    - strong [ref=f32e5470]: "Parameters:"
                    - list [ref=f32e5471]:
                      - listitem [ref=f32e5472]:
                        - code [ref=f32e5473]: way_types
                        - text: (
                        - emphasis [ref=f32e5474]: list(str)
                        - text: ) - The list of road types.
              - listitem [ref=f32e5475]:
                - strong [ref=f32e5476]: set_traffic_light_excluded_way_types
                - text: (
                - strong [ref=f32e5478]: self
                - text: ","
                - strong [ref=f32e5480]: way_types
                - text: ) Defines the OpenStreetMaps road types that will not generate traffic lights even if
                - code [ref=f32e5481]: generate_traffic_lights
                - text: is enabled. By default the road types excluded are
                - code [ref=f32e5482]: motorway_link, primary_link, secondary_link, tertiary_link
                - text: .
                - list [ref=f32e5483]:
                  - listitem [ref=f32e5484]:
                    - strong [ref=f32e5485]: "Parameters:"
                    - list [ref=f32e5486]:
                      - listitem [ref=f32e5487]:
                        - code [ref=f32e5488]: way_types
                        - text: (
                        - emphasis [ref=f32e5489]: list(str)
                        - text: ) - The list of road types.
            - separator [ref=f32e5490]
            - heading "carla.RadarDetection" [level=2] [ref=f32e5491]
            - paragraph [ref=f32e5492]:
              - text: Data contained inside a
              - link "carla.RadarMeasurement" [ref=f32e5493] [cursor=pointer]:
                - /url: "#carla.RadarMeasurement"
              - text: . Each of these represents one of the points in the cloud that a sensor.other.radar registers and contains the distance, angle and velocity in relation to the radar.
            - heading "Instance Variables" [level=3] [ref=f32e5494]
            - list [ref=f32e5495]:
              - listitem [ref=f32e5496]:
                - strong [ref=f32e5497]: altitude
                - text: (
                - emphasis [ref=f32e5498]: float - radians
                - text: ) Altitude angle of the detection.
              - listitem [ref=f32e5499]:
                - strong [ref=f32e5500]: azimuth
                - text: (
                - emphasis [ref=f32e5501]: float - radians
                - text: ) Azimuth angle of the detection.
              - listitem [ref=f32e5502]:
                - strong [ref=f32e5503]: depth
                - text: (
                - emphasis [ref=f32e5504]: float - meters
                - text: ) Distance from the sensor to the detection position.
              - listitem [ref=f32e5505]:
                - strong [ref=f32e5506]: velocity
                - text: (
                - emphasis [ref=f32e5507]: float - m/s
                - text: ) The velocity of the detected object towards the sensor.
            - heading "Methods" [level=3] [ref=f32e5508]
            - heading "Dunder methods" [level=5] [ref=f32e5509]
            - list [ref=f32e5510]:
              - listitem [ref=f32e5511]:
                - strong [ref=f32e5512]: __str__
                - text: (
                - strong [ref=f32e5514]: self
                - text: )
            - separator [ref=f32e5515]
            - heading "carla.RadarMeasurement" [level=2] [ref=f32e5516]
            - paragraph [ref=f32e5517]:
              - generic [ref=f32e5518]:
                - text: Inherited from
                - emphasis [ref=f32e5519]:
                  - link "carla.SensorData" [ref=f32e5520] [cursor=pointer]:
                    - /url: "#carla.SensorData"
              - text: Class that defines and gathers the measures registered by a sensor.other.radar, representing a wall of points in front of the sensor with a distance, angle and velocity in relation to it. The data consists of a
              - link "carla.RadarDetection" [ref=f32e5521] [cursor=pointer]:
                - /url: "#carla.RadarDetection"
              - text: array. Learn more about this
              - link "here" [ref=f32e5522] [cursor=pointer]:
                - /url: ../ref_sensors/#radar-sensor
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e5523]
            - list [ref=f32e5524]:
              - listitem [ref=f32e5525]:
                - strong [ref=f32e5526]: raw_data
                - text: (
                - emphasis [ref=f32e5527]: bytes
                - text: ) The complete information of the
                - link "carla.RadarDetection" [ref=f32e5528] [cursor=pointer]:
                  - /url: "#carla.RadarDetection"
                - text: the radar has registered.
            - heading "Methods" [level=3] [ref=f32e5529]
            - heading "Getters" [level=5] [ref=f32e5530]
            - list [ref=f32e5531]:
              - listitem [ref=f32e5532]:
                - strong [ref=f32e5533]: get_detection_count
                - text: (
                - strong [ref=f32e5535]: self
                - text: ) Retrieves the number of entries generated, same as
                - strong [ref=f32e5536]: __str__()
                - text: .
            - heading "Dunder methods" [level=5] [ref=f32e5537]
            - list [ref=f32e5538]:
              - listitem [ref=f32e5539]:
                - strong [ref=f32e5540]: __getitem__
                - text: (
                - strong [ref=f32e5542]: self
                - text: ","
                - generic [ref=f32e5543]:
                  - strong [ref=f32e5544]: pos
                  - text: =int
                - text: )
              - listitem [ref=f32e5545]:
                - strong [ref=f32e5546]: __iter__
                - text: (
                - strong [ref=f32e5548]: self
                - text: ) Iterate over the
                - link "carla.RadarDetection" [ref=f32e5549] [cursor=pointer]:
                  - /url: "#carla.RadarDetection"
                - text: retrieved as data.
              - listitem [ref=f32e5550]:
