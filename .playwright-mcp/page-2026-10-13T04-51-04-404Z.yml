            - separator [ref=f32e3869]
            - heading "carla.LaneChange" [level=2] [ref=f32e3870]
            - paragraph [ref=f32e3871]:
              - text: Class that defines the permission to turn either left, right, both or none (meaning only going straight is allowed). This information is stored for every
              - link "carla.Waypoint" [ref=f32e3872] [cursor=pointer]:
                - /url: "#carla.Waypoint"
              - text: according to the OpenDRIVE file. The snipet in
              - link "carla.Map.get_waypoint" [ref=f32e3873] [cursor=pointer]:
                - /url: "#carla.Map.get_waypoint"
              - text: shows how a waypoint can be used to learn which turns are permitted.
            - heading "Instance Variables" [level=3] [ref=f32e3874]
            - list [ref=f32e3875]:
              - listitem [ref=f32e3876]:
                - strong [ref=f32e3877]: NONE
                - text: Traffic rules do not allow turning right or left, only going straight.
              - listitem [ref=f32e3878]:
                - strong [ref=f32e3879]: Right
                - text: Traffic rules allow turning right.
              - listitem [ref=f32e3880]:
                - strong [ref=f32e3881]: Left
                - text: Traffic rules allow turning left.
              - listitem [ref=f32e3882]:
                - strong [ref=f32e3883]: Both
                - text: Traffic rules allow turning either right or left.
            - separator [ref=f32e3884]
            - heading "carla.LaneInvasionEvent" [level=2] [ref=f32e3885]
            - paragraph [ref=f32e3886]:
              - generic [ref=f32e3887]:
                - text: Inherited from
                - emphasis [ref=f32e3888]:
                  - link "carla.SensorData" [ref=f32e3889] [cursor=pointer]:
                    - /url: "#carla.SensorData"
              - text: Class that defines lanes invasion for sensor.other.lane_invasion. It works only client-side and is dependant on OpenDRIVE to provide reliable information. The sensor creates one of this every time there is a lane invasion, which may be more than once per simulation step. Learn more about this
              - link "here" [ref=f32e3890] [cursor=pointer]:
                - /url: ../ref_sensors/#lane-invasion-detector
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e3891]
            - list [ref=f32e3892]:
              - listitem [ref=f32e3893]:
                - strong [ref=f32e3894]: actor
                - text: (
                - emphasis [ref=f32e3895]:
                  - link "carla.Actor" [ref=f32e3896] [cursor=pointer]:
                    - /url: "#carla.Actor"
                - text: ) Gets the actor the sensor is attached to, the one that invaded another lane.
              - listitem [ref=f32e3897]:
                - strong [ref=f32e3898]: crossed_lane_markings
                - text: (
                - emphasis [ref=f32e3899]:
                  - text: list(
                  - link "carla.LaneMarking" [ref=f32e3900] [cursor=pointer]:
                    - /url: "#carla.LaneMarking"
                  - text: )
                - text: ) List of lane markings that have been crossed and detected by the sensor.
            - heading "Methods" [level=3] [ref=f32e3901]
            - heading "Dunder methods" [level=5] [ref=f32e3902]
            - list [ref=f32e3903]:
              - listitem [ref=f32e3904]:
                - strong [ref=f32e3905]: __str__
                - text: (
                - strong [ref=f32e3907]: self
                - text: )
            - separator [ref=f32e3908]
            - heading "carla.LaneMarking" [level=2] [ref=f32e3909]
            - paragraph [ref=f32e3910]:
              - text: Class that gathers all the information regarding a lane marking according to
              - link "OpenDRIVE 1.4 standard" [ref=f32e3911] [cursor=pointer]:
                - /url: http://www.opendrive.org/docs/OpenDRIVEFormatSpecRev1.4H.pdf
              - text: standard.
            - heading "Instance Variables" [level=3] [ref=f32e3912]
            - list [ref=f32e3913]:
              - listitem [ref=f32e3914]:
                - strong [ref=f32e3915]: color
                - text: (
                - emphasis [ref=f32e3916]:
                  - link "carla.LaneMarkingColor" [ref=f32e3917] [cursor=pointer]:
                    - /url: "#carla.LaneMarkingColor"
                - text: ) Actual color of the marking.
              - listitem [ref=f32e3918]:
                - strong [ref=f32e3919]: lane_change
                - text: (
                - emphasis [ref=f32e3920]:
                  - link "carla.LaneChange" [ref=f32e3921] [cursor=pointer]:
                    - /url: "#carla.LaneChange"
                - text: ) Permissions for said lane marking to be crossed.
              - listitem [ref=f32e3922]:
                - strong [ref=f32e3923]: type
                - text: (
                - emphasis [ref=f32e3924]:
                  - link "carla.LaneMarkingType" [ref=f32e3925] [cursor=pointer]:
                    - /url: "#carla.LaneMarkingType"
                - text: ) Lane marking type.
              - listitem [ref=f32e3926]:
                - strong [ref=f32e3927]: width
                - text: (
                - emphasis [ref=f32e3928]: float
                - text: ) Horizontal lane marking thickness.
            - separator [ref=f32e3929]
            - heading "carla.LaneMarkingColor" [level=2] [ref=f32e3930]
            - paragraph [ref=f32e3931]: Class that defines the lane marking colors according to OpenDRIVE 1.4.
            - heading "Instance Variables" [level=3] [ref=f32e3932]
            - list [ref=f32e3933]:
