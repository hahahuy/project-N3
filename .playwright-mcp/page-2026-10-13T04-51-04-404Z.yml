            - heading "carla.VehicleDoor" [level=2] [ref=f32e8550]
            - paragraph [ref=f32e8551]: Possible index representing the possible doors that can be open. Notice that not all possible doors are able to open in some vehicles.
            - heading "Instance Variables" [level=3] [ref=f32e8552]
            - list [ref=f32e8553]:
              - listitem [ref=f32e8554]:
                - strong [ref=f32e8555]: FL
                - text: Front left door.
              - listitem [ref=f32e8556]:
                - strong [ref=f32e8557]: FR
                - text: Front right door.
              - listitem [ref=f32e8558]:
                - strong [ref=f32e8559]: RL
                - text: Back left door.
              - listitem [ref=f32e8560]:
                - strong [ref=f32e8561]: RR
                - text: Back right door.
              - listitem [ref=f32e8562]:
                - strong [ref=f32e8563]: All
                - text: Represents all doors.
            - separator [ref=f32e8564]
            - heading "carla.VehicleFailureState" [level=2] [ref=f32e8565]
            - paragraph [ref=f32e8566]:
              - text: Enum containing the different failure states of a vehicle, from which the it cannot recover. These are returned by
              - strong [ref=f32e8567]: get_failure_state()
              - text: and only Rollover is currently implemented.
            - heading "Instance Variables" [level=3] [ref=f32e8568]
            - list [ref=f32e8569]:
              - listitem [ref=f32e8570]:
                - strong [ref=f32e8571]: NONE
              - listitem [ref=f32e8572]:
                - strong [ref=f32e8573]: Rollover
              - listitem [ref=f32e8574]:
                - strong [ref=f32e8575]: Engine
              - listitem [ref=f32e8576]:
                - strong [ref=f32e8577]: TirePuncture
            - separator [ref=f32e8578]
            - heading "carla.VehicleLightState" [level=2] [ref=f32e8579]
            - paragraph [ref=f32e8580]:
              - text: "Class that recaps the state of the lights of a vehicle, these can be used as a flags. E.g:"
              - code [ref=f32e8581]: VehicleLightState.HighBeam & VehicleLightState.Brake
              - text: will return
              - code [ref=f32e8582]: "True"
              - text: when both are active. Lights are off by default in any situation and should be managed by the user via script. The blinkers blink automatically.
              - emphasis [ref=f32e8583]: "Warning: Right now, not all vehicles have been prepared to work with this functionality, this will be added to all of them in later updates"
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e8584]
            - list [ref=f32e8585]:
              - listitem [ref=f32e8586]:
                - strong [ref=f32e8587]: NONE
                - text: All lights off.
              - listitem [ref=f32e8588]:
                - strong [ref=f32e8589]: Position
              - listitem [ref=f32e8590]:
                - strong [ref=f32e8591]: LowBeam
              - listitem [ref=f32e8592]:
                - strong [ref=f32e8593]: HighBeam
              - listitem [ref=f32e8594]:
                - strong [ref=f32e8595]: Brake
              - listitem [ref=f32e8596]:
                - strong [ref=f32e8597]: RightBlinker
              - listitem [ref=f32e8598]:
                - strong [ref=f32e8599]: LeftBlinker
              - listitem [ref=f32e8600]:
                - strong [ref=f32e8601]: Reverse
              - listitem [ref=f32e8602]:
                - strong [ref=f32e8603]: Fog
              - listitem [ref=f32e8604]:
                - strong [ref=f32e8605]: Interior
              - listitem [ref=f32e8606]:
                - strong [ref=f32e8607]: Special1
                - text: This is reserved for certain vehicles that can have special lights, like a siren.
              - listitem [ref=f32e8608]:
                - strong [ref=f32e8609]: Special2
                - text: This is reserved for certain vehicles that can have special lights, like a siren.
              - listitem [ref=f32e8610]:
                - strong [ref=f32e8611]: All
                - text: All lights on.
            - separator [ref=f32e8612]
            - heading "carla.VehiclePhysicsControl" [level=2] [ref=f32e8613]
            - paragraph [ref=f32e8614]:
              - text: Summarizes the parameters that will be used to simulate a
              - link "carla.Vehicle" [ref=f32e8615] [cursor=pointer]:
                - /url: "#carla.Vehicle"
              - text: as a physical object. The specific settings for the wheels though are stipulated using
              - link "carla.WheelPhysicsControl" [ref=f32e8616] [cursor=pointer]:
                - /url: "#carla.WheelPhysicsControl"
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e8617]
            - list [ref=f32e8618]:
              - listitem [ref=f32e8619]:
                - strong [ref=f32e8620]: torque_curve
                - text: (
                - emphasis [ref=f32e8621]:
                  - text: list(
                  - link "carla.Vector2D" [ref=f32e8622] [cursor=pointer]:
                    - /url: "#carla.Vector2D"
                  - text: )
                - text: ) Curve that indicates the torque measured in Nm for a specific RPM of the vehicle's engine.
              - listitem [ref=f32e8623]:
                - strong [ref=f32e8624]: max_rpm
                - text: (
                - emphasis [ref=f32e8625]: float
                - text: ) The maximum RPM of the vehicle's engine.
              - listitem [ref=f32e8626]:
                - strong [ref=f32e8627]: moi
                - text: (
                - emphasis [ref=f32e8628]:
                  - text: float
                  - generic [ref=f32e8629]:
                    - text: "- kg*m"
                    - superscript [ref=f32e8630]: "2"
                - text: ) The moment of inertia of the vehicle's engine.
              - listitem [ref=f32e8631]:
                - strong [ref=f32e8632]: damping_rate_full_throttle
                - text: (
                - emphasis [ref=f32e8633]: float
                - text: ) Damping ratio when the throttle is maximum.
              - listitem [ref=f32e8634]:
                - strong [ref=f32e8635]: damping_rate_zero_throttle_clutch_engaged
                - text: (
                - emphasis [ref=f32e8636]: float
                - text: ) Damping ratio when the throttle is zero with clutch engaged.
              - listitem [ref=f32e8637]:
                - strong [ref=f32e8638]: damping_rate_zero_throttle_clutch_disengaged
                - text: (
                - emphasis [ref=f32e8639]: float
                - text: ) Damping ratio when the throttle is zero with clutch disengaged.
              - listitem [ref=f32e8640]:
                - strong [ref=f32e8641]: use_gear_autobox
                - text: (
                - emphasis [ref=f32e8642]: bool
                - text: ) If True, the vehicle will have an automatic transmission.
              - listitem [ref=f32e8643]:
                - strong [ref=f32e8644]: gear_switch_time
                - text: (
                - emphasis [ref=f32e8645]: float - seconds
                - text: ) Switching time between gears.
              - listitem [ref=f32e8646]:
                - strong [ref=f32e8647]: clutch_strength
                - text: (
                - emphasis [ref=f32e8648]:
                  - text: float
                  - generic [ref=f32e8649]:
                    - text: "- kg*m"
                    - superscript [ref=f32e8650]: "2"
                    - text: /s
                - text: ) Clutch strength of the vehicle.
              - listitem [ref=f32e8651]:
                - strong [ref=f32e8652]: final_ratio
                - text: (
                - emphasis [ref=f32e8653]: float
                - text: ) Fixed ratio from transmission to wheels.
              - listitem [ref=f32e8654]:
                - strong [ref=f32e8655]: forward_gears
                - text: (
                - emphasis [ref=f32e8656]:
                  - text: list(
                  - link "carla.GearPhysicsControl" [ref=f32e8657] [cursor=pointer]:
                    - /url: "#carla.GearPhysicsControl"
                  - text: )
                - text: ) List of objects defining the vehicle's gears.
              - listitem [ref=f32e8658]:
                - strong [ref=f32e8659]: mass
                - text: (
                - emphasis [ref=f32e8660]: float - kilograms
                - text: ) Mass of the vehicle.
              - listitem [ref=f32e8661]:
                - strong [ref=f32e8662]: drag_coefficient
                - text: (
                - emphasis [ref=f32e8663]: float
                - text: ) Drag coefficient of the vehicle's chassis.
              - listitem [ref=f32e8664]:
                - strong [ref=f32e8665]: center_of_mass
                - text: (
                - emphasis [ref=f32e8666]:
                  - link "carla.Vector3D" [ref=f32e8667] [cursor=pointer]:
                    - /url: "#carla.Vector3D"
                  - text: "- meters"
                - text: ) Center of mass of the vehicle.
              - listitem [ref=f32e8668]:
                - strong [ref=f32e8669]: steering_curve
                - text: (
                - emphasis [ref=f32e8670]:
                  - text: list(
                  - link "carla.Vector2D" [ref=f32e8671] [cursor=pointer]:
                    - /url: "#carla.Vector2D"
                  - text: )
                - text: ) Curve that indicates the maximum steering for a specific forward speed.
              - listitem [ref=f32e8672]:
                - strong [ref=f32e8673]: use_sweep_wheel_collision
                - text: (
                - emphasis [ref=f32e8674]: bool
                - text: ) Enable the use of sweep for wheel collision. By default, it is disabled and it uses a simple raycast from the axis to the floor for each wheel. This option provides a better collision model in which the full volume of the wheel is checked against collisions.
              - listitem [ref=f32e8675]:
                - strong [ref=f32e8676]: wheels
                - text: (
                - emphasis [ref=f32e8677]:
                  - text: list(
                  - link "carla.WheelPhysicsControl" [ref=f32e8678] [cursor=pointer]:
                    - /url: "#carla.WheelPhysicsControl"
                  - text: )
                - text: ) List of wheel physics objects. This list should have 4 elements, where index 0 corresponds to the front left wheel, index 1 corresponds to the front right wheel, index 2 corresponds to the back left wheel and index 3 corresponds to the back right wheel. For 2 wheeled vehicles, set the same values for both front and back wheels.
            - heading "Methods" [level=3] [ref=f32e8679]
            - list [ref=f32e8680]:
              - listitem [ref=f32e8681]:
                - strong [ref=f32e8682]: __init__
