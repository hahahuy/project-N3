            - heading "carla.ActorAttributeType" [level=2] [ref=f32e1072]
            - paragraph [ref=f32e1073]:
              - text: CARLA provides a library of blueprints for actors in
              - link "carla.BlueprintLibrary" [ref=f32e1074] [cursor=pointer]:
                - /url: "#carla.BlueprintLibrary"
              - text: with different attributes each. This class defines the types those at
              - link "carla.ActorAttribute" [ref=f32e1075] [cursor=pointer]:
                - /url: "#carla.ActorAttribute"
              - text: can be as a series of enum. All this information is managed internally and listed here for a better comprehension of how CARLA works.
