            - heading "carla.LightGroup" [level=2] [ref=f32e4230]
            - paragraph [ref=f32e4231]: This class categorizes the lights on scene into different groups. These groups available are provided as a enum values that can be used as flags.
            - paragraph [ref=f32e4232]:
              - strong [ref=f32e4233]: Note.
              - text: So far, though there is a
              - code [ref=f32e4234]: vehicle
              - text: group, vehicle lights are not available as
              - link "carla.Light" [ref=f32e4235] [cursor=pointer]:
                - /url: "#carla.Light"
              - text: objects. These have to be managed using
              - link "carla.Vehicle" [ref=f32e4236] [cursor=pointer]:
                - /url: "#carla.Vehicle"
              - text: and
              - link "carla.VehicleLightState" [ref=f32e4237] [cursor=pointer]:
