                - text: ","
                - generic [ref=f32e8705]:
                  - strong [ref=f32e8706]: forward_gears
                  - text: =list()
                - text: ","
                - generic [ref=f32e8707]:
                  - strong [ref=f32e8708]: drag_coefficient
                  - text: =0.3
                - text: ","
                - generic [ref=f32e8709]:
                  - strong [ref=f32e8710]: center_of_mass
                  - text: =[0.0, 0.0, 0.0]
                - text: ","
                - generic [ref=f32e8711]:
                  - strong [ref=f32e8712]: steering_curve
                  - text: =[[0.0, 1.0], [10.0, 0.5]]
                - text: ","
