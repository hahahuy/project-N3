            - heading "carla.SemanticLidarDetection" [level=2] [ref=f32e6072]
            - paragraph [ref=f32e6073]:
              - text: Data contained inside a
              - link "carla.SemanticLidarMeasurement" [ref=f32e6074] [cursor=pointer]:
                - /url: "#carla.SemanticLidarMeasurement"
              - text: . Each of these represents one of the points in the cloud with its location, the cosine of the incident angle, index of the object hit, and its semantic tag.
            - heading "Instance Variables" [level=3] [ref=f32e6075]
            - list [ref=f32e6076]:
              - listitem [ref=f32e6077]:
                - strong [ref=f32e6078]: point
                - text: (
                - emphasis [ref=f32e6079]:
                  - link "carla.Location" [ref=f32e6080] [cursor=pointer]:
                    - /url: "#carla.Location"
                  - text: "- meters"
                - text: ) [x,y,z] coordinates of the point.
              - listitem [ref=f32e6081]:
                - strong [ref=f32e6082]: cos_inc_angle
                - text: (
                - emphasis [ref=f32e6083]: float
                - text: ) Cosine of the incident angle between the ray, and the normal of the hit object.
              - listitem [ref=f32e6084]:
                - strong [ref=f32e6085]: object_idx
                - text: (
                - emphasis [ref=f32e6086]: uint
                - text: ) ID of the actor hit by the ray.
              - listitem [ref=f32e6087]:
                - strong [ref=f32e6088]: object_tag
                - text: (
                - emphasis [ref=f32e6089]: uint
                - text: )
                - link "Semantic tag" [ref=f32e6090] [cursor=pointer]:
                  - /url: ../ref_sensors/#semantic-segmentation-camera
                - text: of the component hit by the ray.
            - heading "Methods" [level=3] [ref=f32e6091]
            - heading "Dunder methods" [level=5] [ref=f32e6092]
            - list [ref=f32e6093]:
              - listitem [ref=f32e6094]:
                - strong [ref=f32e6095]: __str__
                - text: (
                - strong [ref=f32e6097]: self
                - text: )
            - separator [ref=f32e6098]
            - heading "carla.SemanticLidarMeasurement" [level=2] [ref=f32e6099]
            - paragraph [ref=f32e6100]:
              - generic [ref=f32e6101]:
                - text: Inherited from
                - emphasis [ref=f32e6102]:
                  - link "carla.SensorData" [ref=f32e6103] [cursor=pointer]:
                    - /url: "#carla.SensorData"
              - text: Class that defines the semantic LIDAR data retrieved by a sensor.lidar.ray_cast_semantic. This essentially simulates a rotating LIDAR using ray-casting. Learn more about this
              - link "here" [ref=f32e6104] [cursor=pointer]:
                - /url: ../ref_sensors/#semanticlidar-raycast-sensor
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e6105]
            - list [ref=f32e6106]:
              - listitem [ref=f32e6107]:
                - strong [ref=f32e6108]: channels
                - text: (
                - emphasis [ref=f32e6109]: int
                - text: ) Number of lasers shot.
              - listitem [ref=f32e6110]:
                - strong [ref=f32e6111]: horizontal_angle
                - text: (
                - emphasis [ref=f32e6112]: float - radians
                - text: ) Horizontal angle the LIDAR is rotated at the time of the measurement.
              - listitem [ref=f32e6113]:
                - strong [ref=f32e6114]: raw_data
                - text: (
                - emphasis [ref=f32e6115]: bytes
                - text: ) Received list of raw detection points. Each point consists of [x,y,z] coordinates plus the cosine of the incident angle, the index of the hit actor, and its semantic tag.
            - heading "Methods" [level=3] [ref=f32e6116]
            - list [ref=f32e6117]:
              - listitem [ref=f32e6118]:
                - strong [ref=f32e6119]: save_to_disk
                - text: (
                - strong [ref=f32e6121]: self
                - text: ","
                - strong [ref=f32e6123]: path
                - text: ) Saves the point cloud to disk as a .ply file describing data from 3D scanners. The files generated are ready to be used within
                - link "MeshLab" [ref=f32e6124] [cursor=pointer]:
                  - /url: http://www.meshlab.net/
                - text: ", an open-source system for processing said files. Just take into account that axis may differ from Unreal Engine and so, need to be reallocated."
                - list [ref=f32e6125]:
                  - listitem [ref=f32e6126]:
                    - strong [ref=f32e6127]: "Parameters:"
                    - list [ref=f32e6128]:
                      - listitem [ref=f32e6129]:
                        - code [ref=f32e6130]: path
                        - text: (
                        - emphasis [ref=f32e6131]: str
                        - text: )
            - heading "Getters" [level=5] [ref=f32e6132]
            - list [ref=f32e6133]:
              - listitem [ref=f32e6134]:
                - strong [ref=f32e6135]: get_point_count
                - text: (
                - strong [ref=f32e6137]: self
                - text: ","
                - strong [ref=f32e6139]: channel
                - text: ) Retrieves the number of points sorted by channel that are generated by this measure. Sorting by channel allows to identify the original channel for every point.
                - list [ref=f32e6140]:
                  - listitem [ref=f32e6141]:
                    - strong [ref=f32e6142]: "Parameters:"
                    - list [ref=f32e6143]:
                      - listitem [ref=f32e6144]:
                        - code [ref=f32e6145]: channel
