                - text: (
                - strong [ref=f32e883]: self
                - text: ","
                - strong [ref=f32e885]: enabled
                - text: ) Enables or disables gravity for the actor.
                - strong [ref=f32e886]: Default
                - text: is True.
                - list [ref=f32e887]:
