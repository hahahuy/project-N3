            - heading "carla.GBufferTextureID" [level=2] [ref=f32e3082]
            - paragraph [ref=f32e3083]:
              - text: Defines the of each GBuffer texture (See the method
              - code [ref=f32e3084]: "[carla.Sensor.listen_to_gbuffer](#carla.Sensor.listen_to_gbuffer)"
              - text: ).
            - heading "Instance Variables" [level=3] [ref=f32e3085]
            - list [ref=f32e3086]:
              - listitem [ref=f32e3087]:
                - strong [ref=f32e3088]: SceneColor
                - text: The texture "SceneColor" contains the final color of the image.
              - listitem [ref=f32e3089]:
                - strong [ref=f32e3090]: SceneDepth
                - text: The texture "SceneDepth" contains the depth buffer - linear in world units.
              - listitem [ref=f32e3091]:
                - strong [ref=f32e3092]: SceneStencil
                - text: The texture "SceneStencil" contains the stencil buffer.
              - listitem [ref=f32e3093]:
                - strong [ref=f32e3094]: GBufferA
                - text: The texture "GBufferA" contains the world-space normal vectors in the RGB channels. The alpha channel contains "per-object data".
              - listitem [ref=f32e3095]:
                - strong [ref=f32e3096]: GBufferB
                - text: The texture "GBufferB" contains the metallic, specular and roughness in the RGB channels, respectively. The alpha channel contains a mask where the lower 4 bits indicate the shading model and the upper 4 bits contain the selective output mask.
              - listitem [ref=f32e3097]:
                - strong [ref=f32e3098]: GBufferC
                - text: The texture "GBufferC" contains the diffuse color in the RGB channels, with the indirect irradiance in the alpha channel. If static lightning is not allowed, the alpha channel will contain the ambient occlusion instead.
              - listitem [ref=f32e3099]:
                - strong [ref=f32e3100]: GBufferD
                - text: "The contents of the \"GBufferD\" varies depending on the rendered object's material shading model (GBufferB):"
              - listitem [ref=f32e3101]: "MSM_Subsurface (2), MSM_PreintegratedSkin (3), MSM_TwoSidedFoliage (6): RGB: Subsurface color. A: Opacity."
              - listitem [ref=f32e3102]: "MSM_ClearCoat (4): R: Clear coat. G: Roughness."
              - listitem [ref=f32e3103]: "MSM_SubsurfaceProfile (5): RGB: Subsurface profile."
              - listitem [ref=f32e3104]: "MSM_Hair (7): RG: World normal. B: Backlit value."
              - listitem [ref=f32e3105]: "MSM_Cloth (8): RGB: Subsurface color. A: Cloth value."
              - listitem [ref=f32e3106]: "MSM_Eye (9): RG: Eye tangent. B: Iris mask. A: Iris distance."
              - listitem [ref=f32e3107]:
                - strong [ref=f32e3108]: GBufferE
                - text: The texture "GBufferE" contains the precomputed shadow factors in the RGBA channels. This texture is unavailable if the selective output mask (GBufferB) does not have its 4th bit set.
              - listitem [ref=f32e3109]:
                - strong [ref=f32e3110]: GBufferF
                - text: The texture "GBufferF" contains the world-space tangent in the RGB channels and the anisotropy in the alpha channel. This texture is unavailable if the selective output mask (GBufferB) does not have its 5th bit set.
              - listitem [ref=f32e3111]:
                - strong [ref=f32e3112]: Velocity
                - text: The texture "Velocity" contains the screen-space velocity of the scene objects.
              - listitem [ref=f32e3113]:
                - strong [ref=f32e3114]: SSAO
                - text: The texture "SSAO" contains the screen-space ambient occlusion texture.
              - listitem [ref=f32e3115]:
                - strong [ref=f32e3116]: CustomDepth
                - text: The texture "CustomDepth" contains the Unreal Engine custom depth data.
              - listitem [ref=f32e3117]:
                - strong [ref=f32e3118]: CustomStencil
                - text: The texture "CustomStencil" contains the Unreal Engine custom stencil data.
            - separator [ref=f32e3119]
            - heading "carla.GearPhysicsControl" [level=2] [ref=f32e3120]
            - paragraph [ref=f32e3121]:
              - text: Class that provides access to vehicle transmission details by defining a gear and when to run on it. This will be later used by
              - link "carla.VehiclePhysicsControl" [ref=f32e3122] [cursor=pointer]:
                - /url: "#carla.VehiclePhysicsControl"
              - text: to help simulate physics.
