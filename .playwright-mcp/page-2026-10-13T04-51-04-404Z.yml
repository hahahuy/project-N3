            - heading "carla.LidarMeasurement" [level=2] [ref=f32e4048]
            - paragraph [ref=f32e4049]:
              - generic [ref=f32e4050]:
                - text: Inherited from
                - emphasis [ref=f32e4051]:
                  - link "carla.SensorData" [ref=f32e4052] [cursor=pointer]:
                    - /url: "#carla.SensorData"
              - text: Class that defines the LIDAR data retrieved by a sensor.lidar.ray_cast. This essentially simulates a rotating LIDAR using ray-casting. Learn more about this
              - link "here" [ref=f32e4053] [cursor=pointer]:
                - /url: ../ref_sensors/#lidar-raycast-sensor
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e4054]
            - list [ref=f32e4055]:
              - listitem [ref=f32e4056]:
                - strong [ref=f32e4057]: channels
                - text: (
                - emphasis [ref=f32e4058]: int
                - text: ) Number of lasers shot.
              - listitem [ref=f32e4059]:
                - strong [ref=f32e4060]: horizontal_angle
                - text: (
                - emphasis [ref=f32e4061]: float - radians
                - text: ) Horizontal angle the LIDAR is rotated at the time of the measurement.
              - listitem [ref=f32e4062]:
                - strong [ref=f32e4063]: raw_data
                - text: (
                - emphasis [ref=f32e4064]: bytes
                - text: ) Received list of 4D points. Each point consists of [x,y,z] coordinates plus the intensity computed for that point.
            - heading "Methods" [level=3] [ref=f32e4065]
            - list [ref=f32e4066]:
              - listitem [ref=f32e4067]:
