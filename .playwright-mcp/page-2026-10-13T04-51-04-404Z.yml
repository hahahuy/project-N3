            - heading "Instance Variables" [level=3] [ref=f32e5713]
            - list [ref=f32e5714]:
              - listitem [ref=f32e5715]:
                - strong [ref=f32e5716]: rss_calculation_mode
                - text: (
                - emphasis [ref=f32e5717]:
                  - link "ad.rss.map.RssMode" [ref=f32e5718] [cursor=pointer]:
                    - /url: https://intel.github.io/ad-rss-lib/doxygen/ad_rss_map_integration/namespacead_1_1rss_1_1map.html#adcb01232986ed83a0c540cd5d03ef495
                - text: ) The calculation mode to be applied with the actor.
              - listitem [ref=f32e5719]:
                - strong [ref=f32e5720]: restrict_speed_limit_mode
                - text: (
