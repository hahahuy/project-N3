                        - text: )
                  - listitem [ref=f32e2453]:
                    - strong [ref=f32e2454]: "Getter:"
                    - emphasis [ref=f32e2455]:
                      - link "carla.CustomV2XBytes.get_string" [ref=f32e2456] [cursor=pointer]:
                        - /url: "#carla.CustomV2XBytes.get_string"
