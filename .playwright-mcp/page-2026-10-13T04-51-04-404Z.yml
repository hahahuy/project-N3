            - heading "carla.Light" [level=2] [ref=f32e4127]
            - paragraph [ref=f32e4128]: This class exposes the lights that exist in the scene, except for vehicle lights. The properties of a light can be queried and changed at will. Lights are automatically turned on when the simulator enters night mode (sun altitude is below zero).
            - heading "Instance Variables" [level=3] [ref=f32e4129]
            - list [ref=f32e4130]:
              - listitem [ref=f32e4131]:
                - strong [ref=f32e4132]: color
                - text: (
                - emphasis [ref=f32e4133]:
                  - link "carla.Color" [ref=f32e4134] [cursor=pointer]:
                    - /url: "#carla.Color"
                - text: ) Color of the light.
              - listitem [ref=f32e4135]:
                - strong [ref=f32e4136]: id
                - text: (
                - emphasis [ref=f32e4137]: int
                - text: ) Identifier of the light.
              - listitem [ref=f32e4138]:
                - strong [ref=f32e4139]: intensity
                - text: (
                - emphasis [ref=f32e4140]: float - lumens
                - text: ) Intensity of the light.
              - listitem [ref=f32e4141]:
                - strong [ref=f32e4142]: is_on
                - text: (
                - emphasis [ref=f32e4143]: bool
                - text: ) Switch of the light. It is
                - strong [ref=f32e4144]: "True"
                - text: when the light is on. When the night mode starts, this is set to
                - strong [ref=f32e4145]: "True"
                - text: .
              - listitem [ref=f32e4146]:
                - strong [ref=f32e4147]: location
                - text: (
                - emphasis [ref=f32e4148]:
                  - link "carla.Location" [ref=f32e4149] [cursor=pointer]:
                    - /url: "#carla.Location"
                  - text: "- meters"
                - text: ) Position of the light.
              - listitem [ref=f32e4150]:
                - strong [ref=f32e4151]: light_group
                - text: (
                - emphasis [ref=f32e4152]:
                  - link "carla.LightGroup" [ref=f32e4153] [cursor=pointer]:
                    - /url: "#carla.LightGroup"
                - text: ) Group the light belongs to.
              - listitem [ref=f32e4154]:
                - strong [ref=f32e4155]: light_state
                - text: (
                - emphasis [ref=f32e4156]:
                  - link "carla.LightState" [ref=f32e4157] [cursor=pointer]:
                    - /url: "#carla.LightState"
                - text: ) State of the light. Summarizes its attributes, group, and if it is on/off.
            - heading "Methods" [level=3] [ref=f32e4158]
            - list [ref=f32e4159]:
              - listitem [ref=f32e4160]:
                - strong [ref=f32e4161]: turn_off
                - text: (
                - strong [ref=f32e4163]: self
                - text: ) Switches off the light.
              - listitem [ref=f32e4164]:
                - strong [ref=f32e4165]: turn_on
                - text: (
                - strong [ref=f32e4167]: self
                - text: ) Switches on the light.
