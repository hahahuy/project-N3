                        - code [ref=f32e9791]: normal_texture
                        - text: (
                        - emphasis [ref=f32e9792]: TextureFloatColor
                        - text: )
                      - listitem [ref=f32e9793]:
                        - code [ref=f32e9794]: ao_roughness_metallic_emissive_texture
                        - text: (
                        - emphasis [ref=f32e9795]: TextureFloatColor
                        - text: )
              - listitem [ref=f32e9796]:
                - strong [ref=f32e9797]: cast_ray
                - text: (
                - strong [ref=f32e9799]: self
                - text: ","
                - strong [ref=f32e9801]: initial_location
                - text: ","
                - strong [ref=f32e9803]: final_location
                - text: ) Casts a ray from the specified initial_location to final_location. The function then detects all geometries intersecting the ray and returns a list of
                - link "carla.LabelledPoint" [ref=f32e9804] [cursor=pointer]:
                  - /url: "#carla.LabelledPoint"
                - text: in order.
                - list [ref=f32e9805]:
                  - listitem [ref=f32e9806]:
                    - strong [ref=f32e9807]: "Parameters:"
                    - list [ref=f32e9808]:
                      - listitem [ref=f32e9809]:
                        - code [ref=f32e9810]: initial_location
                        - text: (
                        - emphasis [ref=f32e9811]:
                          - link "carla.Location" [ref=f32e9812] [cursor=pointer]:
                            - /url: "#carla.Location"
                        - text: ) - The initial position of the ray.
                      - listitem [ref=f32e9813]:
                        - code [ref=f32e9814]: final_location
                        - text: (
                        - emphasis [ref=f32e9815]:
                          - link "carla.Location" [ref=f32e9816] [cursor=pointer]:
                            - /url: "#carla.Location"
                        - text: ) - The final position of the ray.
                  - listitem [ref=f32e9817]:
                    - strong [ref=f32e9818]: "Return:"
                    - emphasis [ref=f32e9819]:
                      - text: list(
                      - link "carla.LabelledPoint" [ref=f32e9820] [cursor=pointer]:
                        - /url: "#carla.LabelledPoint"
                      - text: )
              - listitem [ref=f32e9821]:
                - strong [ref=f32e9822]: enable_environment_objects
                - text: (
                - strong [ref=f32e9824]: self
                - text: ","
                - strong [ref=f32e9826]: env_objects_ids
                - text: ","
                - strong [ref=f32e9828]: enable
                - text: )
                - button "snippet →" [ref=f32e9829] [cursor=pointer]
                - text: Enable or disable a set of EnvironmentObject identified by their id. These objects will appear or disappear from the level.
                - list [ref=f32e9830]:
                  - listitem [ref=f32e9831]:
                    - strong [ref=f32e9832]: "Parameters:"
                    - list [ref=f32e9833]:
                      - listitem [ref=f32e9834]:
                        - code [ref=f32e9835]: env_objects_ids
                        - text: (
                        - emphasis [ref=f32e9836]: set(int)
                        - text: ) - Set of EnvironmentObject ids to change.
                      - listitem [ref=f32e9837]:
                        - code [ref=f32e9838]: enable
                        - text: (
                        - emphasis [ref=f32e9839]: bool
                        - text: ) - State to be applied to all the EnvironmentObject of the set.
              - listitem [ref=f32e9840]:
                - strong [ref=f32e9841]: freeze_all_traffic_lights
                - text: (
                - strong [ref=f32e9843]: self
                - text: ","
                - strong [ref=f32e9845]: frozen
                - text: ) Freezes or unfreezes all traffic lights in the scene. Frozen traffic lights can be modified by the user but the time will not update them until unfrozen.
                - list [ref=f32e9846]:
                  - listitem [ref=f32e9847]:
                    - strong [ref=f32e9848]: "Parameters:"
                    - list [ref=f32e9849]:
                      - listitem [ref=f32e9850]:
                        - code [ref=f32e9851]: frozen
                        - text: (
                        - emphasis [ref=f32e9852]: bool
                        - text: )
              - listitem [ref=f32e9853]:
                - strong [ref=f32e9854]: ground_projection
                - text: (
                - strong [ref=f32e9856]: self
                - text: ","
                - strong [ref=f32e9858]: location
                - text: ","
                - strong [ref=f32e9860]: search_distance
                - text: ) Projects the specified point downwards in the scene. The functions casts a ray from location in the direction (0,0,-1) (downwards) and returns a
                - link "carla.LabelledPoint" [ref=f32e9861] [cursor=pointer]:
                  - /url: "#carla.LabelledPoint"
                - text: object with the first geometry this ray intersects (usually the ground). If no geometry is found in the search_distance range the function returns
                - code [ref=f32e9862]: None
                - text: .
                - list [ref=f32e9863]:
                  - listitem [ref=f32e9864]:
                    - strong [ref=f32e9865]: "Parameters:"
                    - list [ref=f32e9866]:
                      - listitem [ref=f32e9867]:
                        - code [ref=f32e9868]: location
                        - text: (
                        - emphasis [ref=f32e9869]:
                          - link "carla.Location" [ref=f32e9870] [cursor=pointer]:
                            - /url: "#carla.Location"
                        - text: ) - The point to be projected.
                      - listitem [ref=f32e9871]:
                        - code [ref=f32e9872]: search_distance
                        - text: (
                        - emphasis [ref=f32e9873]: float
                        - text: ) - The maximum distance to perform the projection.
                  - listitem [ref=f32e9874]:
                    - strong [ref=f32e9875]: "Return:"
                    - emphasis [ref=f32e9876]:
                      - link "carla.LabelledPoint" [ref=f32e9877] [cursor=pointer]:
                        - /url: "#carla.LabelledPoint"
              - listitem [ref=f32e9878]:
                - strong [ref=f32e9879]: load_map_layer
                - text: (
                - strong [ref=f32e9881]: self
                - text: ","
                - strong [ref=f32e9883]: map_layers
                - text: )
                - button "snippet →" [ref=f32e9884] [cursor=pointer]
                - text: Loads the selected layers to the level. If the layer is already loaded the call has no effect.
                - list [ref=f32e9885]:
                  - listitem [ref=f32e9886]:
                    - strong [ref=f32e9887]: "Parameters:"
                    - list [ref=f32e9888]:
                      - listitem [ref=f32e9889]:
                        - code [ref=f32e9890]: map_layers
                        - text: (
                        - emphasis [ref=f32e9891]:
                          - link "carla.MapLayer" [ref=f32e9892] [cursor=pointer]:
                            - /url: "#carla.MapLayer"
                        - text: ) - Mask of level layers to be loaded.
                  - listitem [ref=f32e9893]:
                    - strong [ref=f32e9894]: "Warning:"
                    - emphasis [ref=f32e9896]: This only affects "Opt" maps. The minimum layout includes roads, sidewalks, traffic lights and traffic signs.
              - listitem [ref=f32e9897]:
                - strong [ref=f32e9898]: on_tick
                - text: (
                - strong [ref=f32e9900]: self
                - text: ","
                - strong [ref=f32e9902]: callback
                - text: ) This method is used in
                - link [ref=f32e9903] [cursor=pointer]:
                  - /url: ../adv_synchrony_timestep/
                  - strong [ref=f32e9904]: asynchronous
                  - text: mode
                - text: . It starts callbacks from the client for the function defined as
                - code [ref=f32e9905]: callback
                - text: ", and returns the ID of the callback. The function will be called everytime the server ticks. It requires a"
                - link "carla.WorldSnapshot" [ref=f32e9906] [cursor=pointer]:
                  - /url: "#carla.WorldSnapshot"
                - text: as argument, which can be retrieved from
                - strong [ref=f32e9907]: wait_for_tick()
                - text: . Use
                - strong [ref=f32e9908]: remove_on_tick()
                - text: to stop the callbacks.
                - list [ref=f32e9909]:
                  - listitem [ref=f32e9910]:
                    - strong [ref=f32e9911]: "Parameters:"
                    - list [ref=f32e9912]:
                      - listitem [ref=f32e9913]:
                        - code [ref=f32e9914]: callback
                        - text: (
                        - emphasis [ref=f32e9915]:
                          - link "carla.WorldSnapshot" [ref=f32e9916] [cursor=pointer]:
                            - /url: "#carla.WorldSnapshot"
                        - text: ) - Function with a snapshot as compulsory parameter that will be called when the client receives a tick.
                  - listitem [ref=f32e9917]:
                    - strong [ref=f32e9918]: "Return:"
                    - emphasis [ref=f32e9919]: int
              - listitem [ref=f32e9920]:
                - strong [ref=f32e9921]: project_point
                - text: (
                - strong [ref=f32e9923]: self
                - text: ","
                - strong [ref=f32e9925]: location
                - text: ","
                - strong [ref=f32e9927]: direction
                - text: ","
                - strong [ref=f32e9929]: search_distance
                - text: ) Projects the specified point to the desired direction in the scene. The functions casts a ray from location in a direction and returns a
                - link "carla.Labelled" [ref=f32e9930] [cursor=pointer]:
                  - /url: "#carla.Labelled"
                - text: object with the first geometry this ray intersects. If no geometry is found in the search_distance range the function returns
                - code [ref=f32e9931]: None
                - text: .
                - list [ref=f32e9932]:
                  - listitem [ref=f32e9933]:
                    - strong [ref=f32e9934]: "Parameters:"
                    - list [ref=f32e9935]:
                      - listitem [ref=f32e9936]:
                        - code [ref=f32e9937]: location
                        - text: (
                        - emphasis [ref=f32e9938]:
                          - link "carla.Location" [ref=f32e9939] [cursor=pointer]:
                            - /url: "#carla.Location"
                        - text: ) - The point to be projected.
                      - listitem [ref=f32e9940]:
                        - code [ref=f32e9941]: direction
                        - text: (
                        - emphasis [ref=f32e9942]:
                          - link "carla.Vector3D" [ref=f32e9943] [cursor=pointer]:
                            - /url: "#carla.Vector3D"
                        - text: ) - The direction of projection.
                      - listitem [ref=f32e9944]:
                        - code [ref=f32e9945]: search_distance
                        - text: (
                        - emphasis [ref=f32e9946]: float
                        - text: ) - The maximum distance to perform the projection.
                  - listitem [ref=f32e9947]:
                    - strong [ref=f32e9948]: "Return:"
                    - emphasis [ref=f32e9949]:
                      - link "carla.LabelledPoint" [ref=f32e9950] [cursor=pointer]:
                        - /url: "#carla.LabelledPoint"
              - listitem [ref=f32e9951]:
                - strong [ref=f32e9952]: remove_on_tick
                - text: (
                - strong [ref=f32e9954]: self
                - text: ","
                - strong [ref=f32e9956]: callback_id
                - text: ) Stops the callback for
                - code [ref=f32e9957]: callback_id
                - text: started with
                - strong [ref=f32e9958]: on_tick()
                - text: .
                - list [ref=f32e9959]:
                  - listitem [ref=f32e9960]:
                    - strong [ref=f32e9961]: "Parameters:"
                    - list [ref=f32e9962]:
                      - listitem [ref=f32e9963]:
                        - code [ref=f32e9964]: callback_id
                        - text: (
                        - emphasis [ref=f32e9965]: callback
                        - text: ) - The callback to be removed. The ID is returned when creating the callback.
              - listitem [ref=f32e9966]:
                - strong [ref=f32e9967]: reset_all_traffic_lights
                - text: (
                - strong [ref=f32e9969]: self
                - text: ) Resets the cycle of all traffic lights in the map to the initial state.
              - listitem [ref=f32e9970]:
                - strong [ref=f32e9971]: spawn_actor
                - text: (
                - strong [ref=f32e9973]: self
                - text: ","
                - strong [ref=f32e9975]: blueprint
                - text: ","
                - strong [ref=f32e9977]: transform
                - text: ","
                - generic [ref=f32e9978]:
                  - strong [ref=f32e9979]: attach_to
                  - text: =None
                - text: ","
                - generic [ref=f32e9980]:
                  - strong [ref=f32e9981]: attachment
                  - text: =Rigid
                - text: )
                - button "snippet →" [ref=f32e9982] [cursor=pointer]
                - text: The method will create, return and spawn an actor into the world. The actor will need an available blueprint to be created and a transform (location and rotation). It can also be attached to a parent with a certain attachment type.
                - list [ref=f32e9983]:
                  - listitem [ref=f32e9984]:
                    - strong [ref=f32e9985]: "Parameters:"
                    - list [ref=f32e9986]:
                      - listitem [ref=f32e9987]:
                        - code [ref=f32e9988]: blueprint
                        - text: (
                        - emphasis [ref=f32e9989]:
                          - link "carla.ActorBlueprint" [ref=f32e9990] [cursor=pointer]:
                            - /url: "#carla.ActorBlueprint"
                        - text: ) - The reference from which the actor will be created.
                      - listitem [ref=f32e9991]:
                        - code [ref=f32e9992]: transform
                        - text: (
                        - emphasis [ref=f32e9993]:
                          - link "carla.Transform" [ref=f32e9994] [cursor=pointer]:
                            - /url: "#carla.Transform"
                        - text: ) - Contains the location and orientation the actor will be spawned with.
                      - listitem [ref=f32e9995]:
                        - code [ref=f32e9996]: attach_to
                        - text: (
                        - emphasis [ref=f32e9997]:
                          - link "carla.Actor" [ref=f32e9998] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - The parent object that the spawned actor will follow around.
                      - listitem [ref=f32e9999]:
                        - code [ref=f32e10000]: attachment
                        - text: (
                        - emphasis [ref=f32e10001]:
                          - link "carla.AttachmentType" [ref=f32e10002] [cursor=pointer]:
                            - /url: "#carla.AttachmentType"
                        - text: ) - Determines how fixed and rigorous should be the changes in position according to its parent object.
                  - listitem [ref=f32e10003]:
                    - strong [ref=f32e10004]: "Return:"
                    - emphasis [ref=f32e10005]:
                      - link "carla.Actor" [ref=f32e10006] [cursor=pointer]:
                        - /url: "#carla.Actor"
              - listitem [ref=f32e10007]:
                - strong [ref=f32e10008]: tick
                - text: (
                - strong [ref=f32e10010]: self
                - text: ","
                - generic [ref=f32e10011]:
                  - strong [ref=f32e10012]: seconds
                  - text: =10.0
                - text: ) This method is used in
                - link [ref=f32e10013] [cursor=pointer]:
                  - /url: ../adv_synchrony_timestep/
                  - strong [ref=f32e10014]: synchronous
                  - text: mode
                - text: ", when the server waits for a client tick before computing the next frame. This method will send the tick, and give way to the server. It returns the ID of the new frame computed by the server."
                - list [ref=f32e10015]:
                  - listitem [ref=f32e10016]:
                    - strong [ref=f32e10017]: "Parameters:"
                    - list [ref=f32e10018]:
                      - listitem [ref=f32e10019]:
                        - code [ref=f32e10020]: seconds
                        - text: (
                        - emphasis [ref=f32e10021]: float - seconds
                        - text: ) - Maximum time the server should wait for a tick. It is set to
                        - code [ref=f32e10022]: "10.0"
                        - text: by default.
                  - listitem [ref=f32e10023]:
                    - strong [ref=f32e10024]: "Return:"
                    - emphasis [ref=f32e10025]: int
                  - listitem [ref=f32e10026]:
                    - strong [ref=f32e10027]: "Note:"
                    - emphasis [ref=f32e10029]:
                      - text: If no tick is received in synchronous mode, the simulation will freeze. Also, if many ticks are received from different clients, there may be synchronization issues. Please read the docs about
                      - link "synchronous mode" [ref=f32e10030] [cursor=pointer]:
                        - /url: ../adv_synchrony_timestep/
                      - text: to learn more.
              - listitem [ref=f32e10031]:
                - strong [ref=f32e10032]: try_spawn_actor
                - text: (
                - strong [ref=f32e10034]: self
                - text: ","
                - strong [ref=f32e10036]: blueprint
                - text: ","
                - strong [ref=f32e10038]: transform
                - text: ","
                - generic [ref=f32e10039]:
                  - strong [ref=f32e10040]: attach_to
                  - text: =None
                - text: ","
                - generic [ref=f32e10041]:
                  - strong [ref=f32e10042]: attachment
                  - text: =Rigid
                - text: ) Same as
                - strong [ref=f32e10043]: spawn_actor()
                - text: but returns None on failure instead of throwing an exception.
                - list [ref=f32e10044]:
                  - listitem [ref=f32e10045]:
                    - strong [ref=f32e10046]: "Parameters:"
                    - list [ref=f32e10047]:
                      - listitem [ref=f32e10048]:
                        - code [ref=f32e10049]: blueprint
                        - text: (
                        - emphasis [ref=f32e10050]:
                          - link "carla.ActorBlueprint" [ref=f32e10051] [cursor=pointer]:
                            - /url: "#carla.ActorBlueprint"
                        - text: ) - The reference from which the actor will be created.
                      - listitem [ref=f32e10052]:
                        - code [ref=f32e10053]: transform
                        - text: (
                        - emphasis [ref=f32e10054]:
                          - link "carla.Transform" [ref=f32e10055] [cursor=pointer]:
                            - /url: "#carla.Transform"
                        - text: ) - Contains the location and orientation the actor will be spawned with.
                      - listitem [ref=f32e10056]:
                        - code [ref=f32e10057]: attach_to
                        - text: (
                        - emphasis [ref=f32e10058]:
                          - link "carla.Actor" [ref=f32e10059] [cursor=pointer]:
                            - /url: "#carla.Actor"
                        - text: ) - The parent object that the spawned actor will follow around.
                      - listitem [ref=f32e10060]:
                        - code [ref=f32e10061]: attachment
                        - text: (
                        - emphasis [ref=f32e10062]:
                          - link "carla.AttachmentType" [ref=f32e10063] [cursor=pointer]:
                            - /url: "#carla.AttachmentType"
                        - text: ) - Determines how fixed and rigorous should be the changes in position according to its parent object.
                  - listitem [ref=f32e10064]:
                    - strong [ref=f32e10065]: "Return:"
                    - emphasis [ref=f32e10066]:
                      - link "carla.Actor" [ref=f32e10067] [cursor=pointer]:
                        - /url: "#carla.Actor"
              - listitem [ref=f32e10068]:
                - strong [ref=f32e10069]: unload_map_layer
                - text: (
                - strong [ref=f32e10071]: self
                - text: ","
                - strong [ref=f32e10073]: map_layers
                - text: )
                - button "snippet →" [ref=f32e10074] [cursor=pointer]
                - text: Unloads the selected layers to the level. If the layer is already unloaded the call has no effect.
                - list [ref=f32e10075]:
                  - listitem [ref=f32e10076]:
                    - strong [ref=f32e10077]: "Parameters:"
                    - list [ref=f32e10078]:
                      - listitem [ref=f32e10079]:
                        - code [ref=f32e10080]: map_layers
                        - text: (
                        - emphasis [ref=f32e10081]:
                          - link "carla.MapLayer" [ref=f32e10082] [cursor=pointer]:
                            - /url: "#carla.MapLayer"
                        - text: ) - Mask of level layers to be unloaded.
                  - listitem [ref=f32e10083]:
                    - strong [ref=f32e10084]: "Warning:"
                    - emphasis [ref=f32e10086]: This only affects "Opt" maps. The minimum layout includes roads, sidewalks, traffic lights and traffic signs.
              - listitem [ref=f32e10087]:
                - strong [ref=f32e10088]: wait_for_tick
                - text: (
                - strong [ref=f32e10090]: self
                - text: ","
                - generic [ref=f32e10091]:
                  - strong [ref=f32e10092]: seconds
                  - text: =10.0
                - text: ) This method is used in
                - link [ref=f32e10093] [cursor=pointer]:
                  - /url: ../adv_synchrony_timestep/
                  - strong [ref=f32e10094]: asynchronous
                  - text: mode
                - text: . It makes the client wait for a server tick. When the next frame is computed, the server will tick and return a snapshot describing the new state of the world.
                - list [ref=f32e10095]:
                  - listitem [ref=f32e10096]:
                    - strong [ref=f32e10097]: "Parameters:"
                    - list [ref=f32e10098]:
                      - listitem [ref=f32e10099]:
                        - code [ref=f32e10100]: seconds
                        - text: (
                        - emphasis [ref=f32e10101]: float - seconds
                        - text: ) - Maximum time the server should wait for a tick. It is set to
                        - code [ref=f32e10102]: "10.0"
                        - text: by default.
                  - listitem [ref=f32e10103]:
                    - strong [ref=f32e10104]: "Return:"
                    - emphasis [ref=f32e10105]:
                      - link "carla.WorldSnapshot" [ref=f32e10106] [cursor=pointer]:
                        - /url: "#carla.WorldSnapshot"
            - heading "Getters" [level=5] [ref=f32e10107]
            - list [ref=f32e10108]:
              - listitem [ref=f32e10109]:
                - strong [ref=f32e10110]: get_actor
                - text: (
                - strong [ref=f32e10112]: self
                - text: ","
                - strong [ref=f32e10114]: actor_id
                - text: ) Looks up for an actor by ID and returns None if not found.
                - list [ref=f32e10115]:
                  - listitem [ref=f32e10116]:
                    - strong [ref=f32e10117]: "Parameters:"
                    - list [ref=f32e10118]:
                      - listitem [ref=f32e10119]:
                        - code [ref=f32e10120]: actor_id
                        - text: (
                        - emphasis [ref=f32e10121]: int
                        - text: )
                  - listitem [ref=f32e10122]:
                    - strong [ref=f32e10123]: "Return:"
                    - emphasis [ref=f32e10124]:
                      - link "carla.Actor" [ref=f32e10125] [cursor=pointer]:
                        - /url: "#carla.Actor"
              - listitem [ref=f32e10126]:
                - strong [ref=f32e10127]: get_actors
                - text: (
                - strong [ref=f32e10129]: self
                - text: ","
                - generic [ref=f32e10130]:
                  - strong [ref=f32e10131]: actor_ids
                  - text: =None
                - text: ) Retrieves a list of
                - link "carla.Actor" [ref=f32e10132] [cursor=pointer]:
                  - /url: "#carla.Actor"
                - text: elements, either using a list of IDs provided or just listing everyone on stage. If an ID does not correspond with any actor, it will be excluded from the list returned, meaning that both the list of IDs and the list of actors may have different lengths.
                - list [ref=f32e10133]:
                  - listitem [ref=f32e10134]:
                    - strong [ref=f32e10135]: "Parameters:"
                    - list [ref=f32e10136]:
                      - listitem [ref=f32e10137]:
                        - code [ref=f32e10138]: actor_ids
                        - text: (
                        - emphasis [ref=f32e10139]: list
                        - text: ) - The IDs of the actors being searched. By default it is set to None and returns every actor on scene.
                  - listitem [ref=f32e10140]:
                    - strong [ref=f32e10141]: "Return:"
                    - emphasis [ref=f32e10142]:
                      - link "carla.ActorList" [ref=f32e10143] [cursor=pointer]:
                        - /url: "#carla.ActorList"
              - listitem [ref=f32e10144]:
                - strong [ref=f32e10145]: get_blueprint_library
                - text: (
                - strong [ref=f32e10147]: self
                - text: ) Returns a list of actor blueprints available to ease the spawn of these into the world.
                - list [ref=f32e10148]:
                  - listitem [ref=f32e10149]:
                    - strong [ref=f32e10150]: "Return:"
                    - emphasis [ref=f32e10151]:
                      - link "carla.BlueprintLibrary" [ref=f32e10152] [cursor=pointer]:
                        - /url: "#carla.BlueprintLibrary"
              - listitem [ref=f32e10153]:
                - strong [ref=f32e10154]: get_environment_objects
                - text: (
                - strong [ref=f32e10156]: self
                - text: ","
                - generic [ref=f32e10157]:
                  - strong [ref=f32e10158]: object_type
                  - text: =Any
                - text: ) Returns a list of EnvironmentObject with the requested semantic tag. The method returns all the EnvironmentObjects in the level by default, but the query can be filtered by semantic tags with the argument
                - code [ref=f32e10159]: object_type
                - text: .
                - list [ref=f32e10160]:
                  - listitem [ref=f32e10161]:
                    - strong [ref=f32e10162]: "Parameters:"
                    - list [ref=f32e10163]:
                      - listitem [ref=f32e10164]:
                        - code [ref=f32e10165]: object_type
                        - text: (
                        - emphasis [ref=f32e10166]:
                          - link "carla.CityObjectLabel" [ref=f32e10167] [cursor=pointer]:
                            - /url: "#carla.CityObjectLabel"
                        - text: ) - Semantic tag of the EnvironmentObjects that are returned.
                  - listitem [ref=f32e10168]:
                    - strong [ref=f32e10169]: "Return:"
                    - emphasis [ref=f32e10170]:
                      - text: array(
                      - link "carla.EnvironmentObject" [ref=f32e10171] [cursor=pointer]:
                        - /url: "#carla.EnvironmentObject"
                      - text: )
              - listitem [ref=f32e10172]:
                - strong [ref=f32e10173]: get_level_bbs
                - text: (
                - strong [ref=f32e10175]: self
                - text: ","
                - generic [ref=f32e10176]:
                  - strong [ref=f32e10177]: actor_type
                  - text: =Any
                - text: ) Returns an array of bounding boxes with location and rotation in world space. The method returns all the bounding boxes in the level by default, but the query can be filtered by semantic tags with the argument
                - code [ref=f32e10178]: actor_type
                - text: .
                - list [ref=f32e10179]:
                  - listitem [ref=f32e10180]:
                    - strong [ref=f32e10181]: "Parameters:"
                    - list [ref=f32e10182]:
                      - listitem [ref=f32e10183]:
                        - code [ref=f32e10184]: actor_type
                        - text: (
                        - emphasis [ref=f32e10185]:
                          - link "carla.CityObjectLabel" [ref=f32e10186] [cursor=pointer]:
                            - /url: "#carla.CityObjectLabel"
                        - text: ) - Semantic tag of the elements contained in the bounding boxes that are returned.
                  - listitem [ref=f32e10187]:
                    - strong [ref=f32e10188]: "Return:"
                    - emphasis [ref=f32e10189]:
                      - text: array(
                      - link "carla.BoundingBox" [ref=f32e10190] [cursor=pointer]:
                        - /url: "#carla.BoundingBox"
                      - text: )
              - listitem [ref=f32e10191]:
                - strong [ref=f32e10192]: get_lightmanager
                - text: (
                - strong [ref=f32e10194]: self
                - text: ) Returns an instance of
                - link "carla.LightManager" [ref=f32e10195] [cursor=pointer]:
                  - /url: "#carla.LightManager"
                - text: that can be used to handle the lights in the scene.
                - list [ref=f32e10196]:
                  - listitem [ref=f32e10197]:
                    - strong [ref=f32e10198]: "Return:"
                    - emphasis [ref=f32e10199]:
                      - link "carla.LightManager" [ref=f32e10200] [cursor=pointer]:
                        - /url: "#carla.LightManager"
              - listitem [ref=f32e10201]:
                - strong [ref=f32e10202]: get_map
                - text: (
                - strong [ref=f32e10204]: self
                - text: ) Asks the server for the XODR containing the map file, and returns this parsed as a
                - link "carla.Map" [ref=f32e10205] [cursor=pointer]:
                  - /url: "#carla.Map"
                - text: .
                - list [ref=f32e10206]:
                  - listitem [ref=f32e10207]:
                    - strong [ref=f32e10208]: "Return:"
                    - emphasis [ref=f32e10209]:
                      - link "carla.Map" [ref=f32e10210] [cursor=pointer]:
                        - /url: "#carla.Map"
                  - listitem [ref=f32e10211]:
                    - strong [ref=f32e10212]: "Warning:"
                    - emphasis [ref=f32e10214]: This method does call the simulation. It is expensive, and should only be called once.
              - listitem [ref=f32e10215]:
                - strong [ref=f32e10216]: get_names_of_all_objects
                - text: (
                - strong [ref=f32e10218]: self
                - text: ) Returns a list of the names of all objects in the scene that can be painted with the apply texture functions.
                - list [ref=f32e10219]:
                  - listitem [ref=f32e10220]:
                    - strong [ref=f32e10221]: "Return:"
                    - emphasis [ref=f32e10222]: list(str)
              - listitem [ref=f32e10223]:
                - strong [ref=f32e10224]: get_random_location_from_navigation
                - text: (
                - strong [ref=f32e10226]: self
                - text: ) This can only be used with walkers. It retrieves a random location to be used as a destination using the
                - strong [ref=f32e10227]: go_to_location()
                - text: method in
                - link "carla.WalkerAIController" [ref=f32e10228] [cursor=pointer]:
                  - /url: "#carla.WalkerAIController"
                - text: . This location will be part of a sidewalk. Roads, crosswalks and grass zones are excluded. The method does not take into consideration locations of existing actors so if a collision happens when trying to spawn an actor, it will return an error. Take a look at
                - link [ref=f32e10229] [cursor=pointer]:
                  - /url: https://github.com/carla-simulator/carla/blob/master/PythonAPI/examples/generate_traffic.py
                  - code [ref=f32e10230]: generate_traffic.py
                - text: for an example.
                - list [ref=f32e10231]:
                  - listitem [ref=f32e10232]:
                    - strong [ref=f32e10233]: "Return:"
                    - emphasis [ref=f32e10234]:
                      - link "carla.Location" [ref=f32e10235] [cursor=pointer]:
                        - /url: "#carla.Location"
              - listitem [ref=f32e10236]:
                - strong [ref=f32e10237]: get_settings
                - text: (
                - strong [ref=f32e10239]: self
                - text: ) Returns an object containing some data about the simulation such as synchrony between client and server or rendering mode.
                - list [ref=f32e10240]:
                  - listitem [ref=f32e10241]:
                    - strong [ref=f32e10242]: "Return:"
                    - emphasis [ref=f32e10243]:
                      - link "carla.WorldSettings" [ref=f32e10244] [cursor=pointer]:
                        - /url: "#carla.WorldSettings"
              - listitem [ref=f32e10245]:
                - strong [ref=f32e10246]: get_snapshot
                - text: (
                - strong [ref=f32e10248]: self
                - text: ) Returns a snapshot of the world at a certain moment comprising all the information about the actors.
                - list [ref=f32e10249]:
                  - listitem [ref=f32e10250]:
                    - strong [ref=f32e10251]: "Return:"
                    - emphasis [ref=f32e10252]:
                      - link "carla.WorldSnapshot" [ref=f32e10253] [cursor=pointer]:
                        - /url: "#carla.WorldSnapshot"
              - listitem [ref=f32e10254]:
                - strong [ref=f32e10255]: get_spectator
                - text: (
                - strong [ref=f32e10257]: self
                - text: )
                - button "snippet →" [ref=f32e10258] [cursor=pointer]
                - text: Returns the spectator actor. The spectator is a special type of actor created by Unreal Engine, usually with ID=0, that acts as a camera and controls the view in the simulator window.
                - list [ref=f32e10259]:
                  - listitem [ref=f32e10260]:
                    - strong [ref=f32e10261]: "Return:"
                    - emphasis [ref=f32e10262]:
                      - link "carla.Actor" [ref=f32e10263] [cursor=pointer]:
                        - /url: "#carla.Actor"
              - listitem [ref=f32e10264]:
                - strong [ref=f32e10265]: get_traffic_light
                - text: (
                - strong [ref=f32e10267]: self
                - text: ","
                - strong [ref=f32e10269]: landmark
                - text: ) Provided a landmark, returns the traffic light object it describes.
                - list [ref=f32e10270]:
                  - listitem [ref=f32e10271]:
                    - strong [ref=f32e10272]: "Parameters:"
                    - list [ref=f32e10273]:
                      - listitem [ref=f32e10274]:
                        - code [ref=f32e10275]: landmark
                        - text: (
                        - emphasis [ref=f32e10276]:
                          - link "carla.Landmark" [ref=f32e10277] [cursor=pointer]:
                            - /url: "#carla.Landmark"
                        - text: ) - The landmark object describing a traffic light.
                  - listitem [ref=f32e10278]:
                    - strong [ref=f32e10279]: "Return:"
                    - emphasis [ref=f32e10280]:
                      - link "carla.TrafficLight" [ref=f32e10281] [cursor=pointer]:
                        - /url: "#carla.TrafficLight"
              - listitem [ref=f32e10282]:
                - strong [ref=f32e10283]: get_traffic_light_from_opendrive_id
                - text: (
                - strong [ref=f32e10285]: self
                - text: ","
                - strong [ref=f32e10287]: traffic_light_id
                - text: ) Returns the traffic light actor corresponding to the indicated OpenDRIVE id.
                - list [ref=f32e10288]:
                  - listitem [ref=f32e10289]:
                    - strong [ref=f32e10290]: "Parameters:"
                    - list [ref=f32e10291]:
                      - listitem [ref=f32e10292]:
                        - code [ref=f32e10293]: traffic_light_id
                        - text: (
                        - emphasis [ref=f32e10294]: str
                        - text: ) - The OpenDRIVE id.
                  - listitem [ref=f32e10295]:
                    - strong [ref=f32e10296]: "Return:"
                    - emphasis [ref=f32e10297]:
                      - link "carla.TrafficLight" [ref=f32e10298] [cursor=pointer]:
                        - /url: "#carla.TrafficLight"
              - listitem [ref=f32e10299]:
                - strong [ref=f32e10300]: get_traffic_lights_from_waypoint
                - text: (
                - strong [ref=f32e10302]: self
                - text: ","
                - strong [ref=f32e10304]: waypoint
                - text: ","
                - strong [ref=f32e10306]: distance
                - text: ) This function performs a search along the road in front of the specified waypoint and returns a list of traffic light actors found in the specified search distance.
                - list [ref=f32e10307]:
                  - listitem [ref=f32e10308]:
                    - strong [ref=f32e10309]: "Parameters:"
                    - list [ref=f32e10310]:
                      - listitem [ref=f32e10311]:
                        - code [ref=f32e10312]: waypoint
                        - text: (
                        - emphasis [ref=f32e10313]:
                          - link "carla.Waypoint" [ref=f32e10314] [cursor=pointer]:
                            - /url: "#carla.Waypoint"
                        - text: ) - The input waypoint.
                      - listitem [ref=f32e10315]:
                        - code [ref=f32e10316]: distance
                        - text: (
                        - emphasis [ref=f32e10317]: float
                        - text: ) - Search distance.
                  - listitem [ref=f32e10318]:
                    - strong [ref=f32e10319]: "Return:"
                    - emphasis [ref=f32e10320]:
                      - text: list(
                      - link "carla.TrafficLight" [ref=f32e10321] [cursor=pointer]:
                        - /url: "#carla.TrafficLight"
                      - text: )
              - listitem [ref=f32e10322]:
                - strong [ref=f32e10323]: get_traffic_lights_in_junction
                - text: (
                - strong [ref=f32e10325]: self
                - text: ","
                - strong [ref=f32e10327]: junction_id
                - text: ) Returns the list of traffic light actors affecting the junction indicated in
                - code [ref=f32e10328]: junction_id
                - text: .
                - list [ref=f32e10329]:
                  - listitem [ref=f32e10330]:
                    - strong [ref=f32e10331]: "Parameters:"
                    - list [ref=f32e10332]:
                      - listitem [ref=f32e10333]:
                        - code [ref=f32e10334]: junction_id
                        - text: (
                        - emphasis [ref=f32e10335]: int
                        - text: ) - The id of the junction.
                  - listitem [ref=f32e10336]:
                    - strong [ref=f32e10337]: "Return:"
                    - emphasis [ref=f32e10338]:
                      - text: list(
                      - link "carla.TrafficLight" [ref=f32e10339] [cursor=pointer]:
                        - /url: "#carla.TrafficLight"
                      - text: )
              - listitem [ref=f32e10340]:
                - strong [ref=f32e10341]: get_traffic_sign
                - text: (
                - strong [ref=f32e10343]: self
                - text: ","
                - strong [ref=f32e10345]: landmark
                - text: ) Provided a landmark, returns the traffic sign object it describes.
                - list [ref=f32e10346]:
                  - listitem [ref=f32e10347]:
                    - strong [ref=f32e10348]: "Parameters:"
                    - list [ref=f32e10349]:
                      - listitem [ref=f32e10350]:
                        - code [ref=f32e10351]: landmark
                        - text: (
                        - emphasis [ref=f32e10352]:
                          - link "carla.Landmark" [ref=f32e10353] [cursor=pointer]:
                            - /url: "#carla.Landmark"
                        - text: ) - The landmark object describing a traffic sign.
                  - listitem [ref=f32e10354]:
                    - strong [ref=f32e10355]: "Return:"
                    - emphasis [ref=f32e10356]:
                      - link "carla.TrafficSign" [ref=f32e10357] [cursor=pointer]:
                        - /url: "#carla.TrafficSign"
              - listitem [ref=f32e10358]:
                - strong [ref=f32e10359]: get_vehicles_light_states
                - text: (
                - strong [ref=f32e10361]: self
                - text: ) Returns a dict where the keys are
                - link "carla.Actor" [ref=f32e10362] [cursor=pointer]:
                  - /url: "#carla.Actor"
                - text: IDs and the values are
                - link "carla.VehicleLightState" [ref=f32e10363] [cursor=pointer]:
                  - /url: "#carla.VehicleLightState"
                - text: of that vehicle.
                - list [ref=f32e10364]:
                  - listitem [ref=f32e10365]:
                    - strong [ref=f32e10366]: "Return:"
                    - emphasis [ref=f32e10367]: dict
              - listitem [ref=f32e10368]:
                - strong [ref=f32e10369]: get_weather
                - text: (
                - strong [ref=f32e10371]: self
                - text: ) Retrieves an object containing weather parameters currently active in the simulation, mainly cloudiness, precipitation, wind and sun position.
                - list [ref=f32e10372]:
                  - listitem [ref=f32e10373]:
                    - strong [ref=f32e10374]: "Return:"
                    - emphasis [ref=f32e10375]:
                      - link "carla.WeatherParameters" [ref=f32e10376] [cursor=pointer]:
                        - /url: "#carla.WeatherParameters"
                  - listitem [ref=f32e10377]:
                    - strong [ref=f32e10378]: "Setter:"
                    - emphasis [ref=f32e10379]:
                      - link "carla.World.set_weather" [ref=f32e10380] [cursor=pointer]:
                        - /url: "#carla.World.set_weather"
            - heading "Setters" [level=5] [ref=f32e10381]
            - list [ref=f32e10382]:
              - listitem [ref=f32e10383]:
                - strong [ref=f32e10384]: set_annotations_traverse_translucency
                - text: (
                - strong [ref=f32e10386]: self
                - text: ","
                - strong [ref=f32e10388]: enable
                - text: ) Sets CARLA's behavior whether the semantic + instance segmentation and depth annotations traverse translucent materials or not. To find the closest obstacle, this should be set to false (default). If you are interested in annotations that detect objects behind windows, this should be enabled.
                - list [ref=f32e10389]:
                  - listitem [ref=f32e10390]:
                    - strong [ref=f32e10391]: "Parameters:"
                    - list [ref=f32e10392]:
                      - listitem [ref=f32e10393]:
                        - code [ref=f32e10394]: enable
                        - text: (
                        - emphasis [ref=f32e10395]: bool
                        - text: ) - Enables or disables the traversal of translucent materials in semantic, instance and depth annotations.
                        - strong [ref=f32e10396]:
                          - text: Default is
                          - code [ref=f32e10397]: "False"
                        - text: .
              - listitem [ref=f32e10398]:
                - strong [ref=f32e10399]: set_pedestrians_cross_factor
                - text: (
                - strong [ref=f32e10401]: self
                - text: ","
                - strong [ref=f32e10403]: percentage
                - text: )
                - list [ref=f32e10404]:
                  - listitem [ref=f32e10405]:
                    - strong [ref=f32e10406]: "Parameters:"
                    - list [ref=f32e10407]:
                      - listitem [ref=f32e10408]:
                        - code [ref=f32e10409]: percentage
                        - text: (
                        - emphasis [ref=f32e10410]: float
                        - text: ) - Sets the percentage of pedestrians that can walk on the road or cross at any point on the road. Value should be between
                        - code [ref=f32e10411]: "0.0"
                        - text: and
                        - code [ref=f32e10412]: "1.0"
                        - text: . For example, a value of
                        - code [ref=f32e10413]: "0.1"
                        - text: would allow 10% of pedestrians to walk on the road.
                        - strong [ref=f32e10414]:
                          - text: Default is
                          - code [ref=f32e10415]: "0.0"
                        - text: .
                  - listitem [ref=f32e10416]:
                    - strong [ref=f32e10417]: "Note:"
                    - emphasis [ref=f32e10419]: Should be set before pedestrians are spawned.
              - listitem [ref=f32e10420]:
                - strong [ref=f32e10421]: set_pedestrians_seed
                - text: (
                - strong [ref=f32e10423]: self
                - text: ","
                - strong [ref=f32e10425]: seed
                - text: )
                - list [ref=f32e10426]:
                  - listitem [ref=f32e10427]:
                    - strong [ref=f32e10428]: "Parameters:"
                    - list [ref=f32e10429]:
                      - listitem [ref=f32e10430]:
                        - code [ref=f32e10431]: seed
                        - text: (
                        - emphasis [ref=f32e10432]: int
                        - text: ) - Sets the seed to use for any random number generated in relation to pedestrians.
                  - listitem [ref=f32e10433]:
                    - strong [ref=f32e10434]: "Note:"
                    - emphasis [ref=f32e10436]: Should be set before pedestrians are spawned. If you want to repeat the same exact bodies (blueprint) for each pedestrian, then use the same seed in the Python code (where the blueprint is choosen randomly) and here, otherwise the pedestrians will repeat the same paths but the bodies will be different.
              - listitem [ref=f32e10437]:
                - strong [ref=f32e10438]: set_weather
                - text: (
                - strong [ref=f32e10440]: self
                - text: ","
                - strong [ref=f32e10442]: weather
                - text: ) Changes the weather parameteres ruling the simulation to another ones defined in an object.
                - list [ref=f32e10443]:
                  - listitem [ref=f32e10444]:
                    - strong [ref=f32e10445]: "Parameters:"
                    - list [ref=f32e10446]:
                      - listitem [ref=f32e10447]:
                        - code [ref=f32e10448]: weather
                        - text: (
                        - emphasis [ref=f32e10449]:
                          - link "carla.WeatherParameters" [ref=f32e10450] [cursor=pointer]:
                            - /url: "#carla.WeatherParameters"
                        - text: ) - New conditions to be applied.
                  - listitem [ref=f32e10451]:
                    - strong [ref=f32e10452]: "Getter:"
                    - emphasis [ref=f32e10453]:
                      - link "carla.World.get_weather" [ref=f32e10454] [cursor=pointer]:
                        - /url: "#carla.World.get_weather"
            - heading "Dunder methods" [level=5] [ref=f32e10455]
            - list [ref=f32e10456]:
              - listitem [ref=f32e10457]:
                - strong [ref=f32e10458]: __str__
                - text: (
                - strong [ref=f32e10460]: self
                - text: ) The content of the world is parsed and printed as a brief report of its current state.
                - list [ref=f32e10461]:
                  - listitem [ref=f32e10462]:
                    - strong [ref=f32e10463]: "Return:"
                    - emphasis [ref=f32e10464]: string
            - separator [ref=f32e10465]
            - heading "carla.WorldSettings" [level=2] [ref=f32e10466]
            - paragraph [ref=f32e10467]:
              - text: The simulation has some advanced configuration options that are contained in this class and can be managed using
              - link "carla.World" [ref=f32e10468] [cursor=pointer]:
                - /url: "#carla.World"
              - text: and its methods. These allow the user to choose between client-server synchrony/asynchrony, activation of "no rendering mode" and either if the simulation should run with a fixed or variable time-step. Check
              - link "this" [ref=f32e10469] [cursor=pointer]:
                - /url: ../adv_synchrony_timestep/
              - text: out if you want to learn about it.
            - heading "Instance Variables" [level=3] [ref=f32e10470]
            - list [ref=f32e10471]:
              - listitem [ref=f32e10472]:
                - strong [ref=f32e10473]: synchronous_mode
                - text: (
                - emphasis [ref=f32e10474]: bool
                - text: ) States the synchrony between client and server. When set to true, the server will wait for a client tick in order to move forward. It is false by default.
              - listitem [ref=f32e10475]:
                - strong [ref=f32e10476]: no_rendering_mode
                - text: (
                - emphasis [ref=f32e10477]: bool
                - text: ) When enabled, the simulation will run no rendering at all. This is mainly used to avoid overhead during heavy traffic simulations. It is false by default.
              - listitem [ref=f32e10478]:
                - strong [ref=f32e10479]: fixed_delta_seconds
                - text: (
                - emphasis [ref=f32e10480]: float
                - text: ) Ensures that the time elapsed between two steps of the simulation is fixed. Set this to 0.0 to work with a variable time-step, as happens by default.
              - listitem [ref=f32e10481]:
                - strong [ref=f32e10482]: substepping
                - text: (
                - emphasis [ref=f32e10483]: bool
                - text: ) Enable the physics substepping. This option allows computing some physics substeps between two render frames. If synchronous mode is set, the number of substeps and its time interval are fixed and computed are so they fulfilled the requirements of
                - link "carla.WorldSettings.max_substeps" [ref=f32e10484] [cursor=pointer]:
                  - /url: "#carla.WorldSettings.max_substeps"
                - text: and
                - link "carla.WorldSettings.max_substep_delta_time" [ref=f32e10485] [cursor=pointer]:
                  - /url: "#carla.WorldSettings.max_substep_delta_time"
                - text: . These last two parameters need to be compatible with
                - link "carla.WorldSettings.fixed_delta_seconds" [ref=f32e10486] [cursor=pointer]:
                  - /url: "#carla.WorldSettings.fixed_delta_seconds"
                - text: . Enabled by default.
              - listitem [ref=f32e10487]:
                - strong [ref=f32e10488]: max_substep_delta_time
                - text: (
                - emphasis [ref=f32e10489]: float
                - text: ) Maximum delta time of the substeps. If the
                - link "carla.WorldSettings.max_substeps" [ref=f32e10490] [cursor=pointer]:
                  - /url: "#carla.WorldSettings.max_substeps"
                - text: is high enough, the substep delta time would be always below or equal to this value. By default, the value is set to 0.01.
              - listitem [ref=f32e10491]:
                - strong [ref=f32e10492]: max_substeps
                - text: (
                - emphasis [ref=f32e10493]: int
                - text: ) The maximum number of physics substepping that are allowed. By default, the value is set to 10.
              - listitem [ref=f32e10494]:
                - strong [ref=f32e10495]: max_culling_distance
                - text: (
                - emphasis [ref=f32e10496]: float
                - text: ) Configure the max draw distance for each mesh of the level.
              - listitem [ref=f32e10497]:
                - strong [ref=f32e10498]: deterministic_ragdolls
                - text: (
                - emphasis [ref=f32e10499]: bool
                - text: ) Defines wether to use deterministic physics for pedestrian death animations or physical ragdoll simulation. When enabled, pedestrians have less realistic death animation but ensures determinism. When disabled, pedestrians are simulated as ragdolls with more realistic simulation and collision but no determinsm can be ensured.
              - listitem [ref=f32e10500]:
                - strong [ref=f32e10501]: tile_stream_distance
                - text: (
                - emphasis [ref=f32e10502]: float
                - text: ) Used for large maps only. Configures the maximum distance from the hero vehicle to stream tiled maps. Regions of the map within this range will be visible (and capable of simulating physics). Regions outside this region will not be loaded.
              - listitem [ref=f32e10503]:
                - strong [ref=f32e10504]: actor_active_distance
                - text: (
                - emphasis [ref=f32e10505]: float
                - text: ) Used for large maps only. Configures the distance from the hero vehicle to convert actors to dormant. Actors within this range will be active, and actors outside will become dormant.
              - listitem [ref=f32e10506]:
                - strong [ref=f32e10507]: spectator_as_ego
                - text: (
                - emphasis [ref=f32e10508]: bool
                - text: ) Used for large maps only. Defines the influence of the spectator on tile loading in Large Maps. By default, the spectator will provoke loading of neighboring tiles in the absence of an ego actor. This might be inconvenient for applications that immediately spawn an ego actor.
            - heading "Methods" [level=3] [ref=f32e10509]
            - list [ref=f32e10510]:
              - listitem [ref=f32e10511]:
                - strong [ref=f32e10512]: __init__
                - text: (
                - strong [ref=f32e10514]: self
                - text: ","
                - generic [ref=f32e10515]:
                  - strong [ref=f32e10516]: synchronous_mode
                  - text: =False
                - text: ","
