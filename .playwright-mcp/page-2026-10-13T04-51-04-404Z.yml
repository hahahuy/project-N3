                - text: (
                - strong [ref=f32e9707]: self
                - text: ","
                - strong [ref=f32e9709]: world_settings
                - text: ) This method applies settings contained in an object to the simulation running and returns the ID of the frame they were implemented.
                - list [ref=f32e9710]:
                  - listitem [ref=f32e9711]:
                    - strong [ref=f32e9712]: "Parameters:"
                    - list [ref=f32e9713]:
                      - listitem [ref=f32e9714]:
