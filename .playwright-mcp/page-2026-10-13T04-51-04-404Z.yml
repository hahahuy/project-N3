            - heading "carla.TrafficLight" [level=2] [ref=f32e6607]
            - paragraph [ref=f32e6608]:
              - generic [ref=f32e6609]:
                - text: Inherited from
                - emphasis [ref=f32e6610]:
                  - link "carla.TrafficSign" [ref=f32e6611] [cursor=pointer]:
                    - /url: "#carla.TrafficSign"
              - text: A traffic light actor, considered a specific type of traffic sign. As traffic lights will mostly appear at junctions, they belong to a group which contains the different traffic lights in it. Inside the group, traffic lights are differenciated by their pole index.
            - paragraph [ref=f32e6612]: "Within a group the state of traffic lights is changed in a cyclic pattern: one index is chosen and it spends a few seconds in green, yellow and eventually red. The rest of the traffic lights remain frozen in red this whole time, meaning that there is a gap in the last seconds of the cycle where all the traffic lights are red. However, the state of a traffic light can be changed manually."
            - heading "Instance Variables" [level=3] [ref=f32e6613]
            - list [ref=f32e6614]:
              - listitem [ref=f32e6615]:
                - strong [ref=f32e6616]: state
                - text: (
                - emphasis [ref=f32e6617]:
                  - link "carla.TrafficLightState" [ref=f32e6618] [cursor=pointer]:
                    - /url: "#carla.TrafficLightState"
                - text: ) Current state of the traffic light.
            - heading "Methods" [level=3] [ref=f32e6619]
            - list [ref=f32e6620]:
              - listitem [ref=f32e6621]:
                - strong [ref=f32e6622]: freeze
                - text: (
                - strong [ref=f32e6624]: self
                - text: ","
                - strong [ref=f32e6626]: freeze
                - text: ) Stops all the traffic lights in the scene at their current state.
                - list [ref=f32e6627]:
                  - listitem [ref=f32e6628]:
                    - strong [ref=f32e6629]: "Parameters:"
                    - list [ref=f32e6630]:
                      - listitem [ref=f32e6631]:
                        - code [ref=f32e6632]: freeze
                        - text: (
                        - emphasis [ref=f32e6633]: bool
                        - text: )
              - listitem [ref=f32e6634]:
                - strong [ref=f32e6635]: is_frozen
                - text: (
                - strong [ref=f32e6637]: self
                - text: ) The client returns True if a traffic light is frozen according to last tick. The method does not call the simulator.
                - list [ref=f32e6638]:
                  - listitem [ref=f32e6639]:
                    - strong [ref=f32e6640]: "Return:"
                    - emphasis [ref=f32e6641]: bool
              - listitem [ref=f32e6642]:
                - strong [ref=f32e6643]: reset_group
                - text: (
                - strong [ref=f32e6645]: self
                - text: ) Resets the state of the traffic lights of the group to the initial state at the start of the simulation.
                - list [ref=f32e6646]:
                  - listitem [ref=f32e6647]:
                    - strong [ref=f32e6648]: "Note:"
                    - emphasis [ref=f32e6650]: This method calls the simulator.
            - heading "Getters" [level=5] [ref=f32e6651]
            - list [ref=f32e6652]:
              - listitem [ref=f32e6653]:
                - strong [ref=f32e6654]: get_affected_lane_waypoints
                - text: (
                - strong [ref=f32e6656]: self
                - text: ) Returns a list of waypoints indicating the positions and lanes where the traffic light is having an effect.
                - list [ref=f32e6657]:
                  - listitem [ref=f32e6658]:
                    - strong [ref=f32e6659]: "Return:"
                    - emphasis [ref=f32e6660]:
                      - text: list(
                      - link "carla.Waypoint" [ref=f32e6661] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
                      - text: )
              - listitem [ref=f32e6662]:
                - strong [ref=f32e6663]: get_elapsed_time
                - text: (
                - strong [ref=f32e6665]: self
                - text: ) The client returns the time in seconds since current light state started according to last tick. The method does not call the simulator.
                - list [ref=f32e6666]:
                  - listitem [ref=f32e6667]:
                    - strong [ref=f32e6668]: "Return:"
                    - emphasis [ref=f32e6669]: float - seconds
              - listitem [ref=f32e6670]:
                - strong [ref=f32e6671]: get_green_time
                - text: (
                - strong [ref=f32e6673]: self
                - text: ) The client returns the time set for the traffic light to be green, according to last tick. The method does not call the simulator.
                - list [ref=f32e6674]:
                  - listitem [ref=f32e6675]:
                    - strong [ref=f32e6676]: "Return:"
                    - emphasis [ref=f32e6677]: float - seconds
                  - listitem [ref=f32e6678]:
                    - strong [ref=f32e6679]: "Setter:"
                    - emphasis [ref=f32e6680]:
                      - link "carla.TrafficLight.set_green_time" [ref=f32e6681] [cursor=pointer]:
                        - /url: "#carla.TrafficLight.set_green_time"
              - listitem [ref=f32e6682]:
                - strong [ref=f32e6683]: get_group_traffic_lights
                - text: (
                - strong [ref=f32e6685]: self
                - text: ) Returns all traffic lights in the group this one belongs to.
                - list [ref=f32e6686]:
                  - listitem [ref=f32e6687]:
                    - strong [ref=f32e6688]: "Return:"
                    - emphasis [ref=f32e6689]:
                      - text: list(
                      - link "carla.TrafficLight" [ref=f32e6690] [cursor=pointer]:
                        - /url: "#carla.TrafficLight"
                      - text: )
                  - listitem [ref=f32e6691]:
                    - strong [ref=f32e6692]: "Note:"
                    - emphasis [ref=f32e6694]: This method calls the simulator.
              - listitem [ref=f32e6695]:
                - strong [ref=f32e6696]: get_light_boxes
                - text: (
                - strong [ref=f32e6698]: self
                - text: ) Returns a list of the bounding boxes encapsulating each light box of the traffic light.
                - list [ref=f32e6699]:
                  - listitem [ref=f32e6700]:
                    - strong [ref=f32e6701]: "Return:"
                    - emphasis [ref=f32e6702]:
                      - text: list(
                      - link "carla.BoundingBox" [ref=f32e6703] [cursor=pointer]:
                        - /url: "#carla.BoundingBox"
                      - text: )
              - listitem [ref=f32e6704]:
                - strong [ref=f32e6705]: get_opendrive_id
                - text: (
                - strong [ref=f32e6707]: self
                - text: ) Returns the OpenDRIVE id of this traffic light.
                - list [ref=f32e6708]:
                  - listitem [ref=f32e6709]:
                    - strong [ref=f32e6710]: "Return:"
                    - emphasis [ref=f32e6711]: str
              - listitem [ref=f32e6712]:
                - strong [ref=f32e6713]: get_pole_index
                - text: (
                - strong [ref=f32e6715]: self
                - text: ) Returns the index of the pole that identifies it as part of the traffic light group of a junction.
                - list [ref=f32e6716]:
                  - listitem [ref=f32e6717]:
                    - strong [ref=f32e6718]: "Return:"
                    - emphasis [ref=f32e6719]: int
              - listitem [ref=f32e6720]:
                - strong [ref=f32e6721]: get_red_time
                - text: (
                - strong [ref=f32e6723]: self
                - text: ) The client returns the time set for the traffic light to be red, according to last tick. The method does not call the simulator.
                - list [ref=f32e6724]:
                  - listitem [ref=f32e6725]:
                    - strong [ref=f32e6726]: "Return:"
                    - emphasis [ref=f32e6727]: float - seconds
                  - listitem [ref=f32e6728]:
                    - strong [ref=f32e6729]: "Setter:"
                    - emphasis [ref=f32e6730]:
                      - link "carla.TrafficLight.set_red_time" [ref=f32e6731] [cursor=pointer]:
                        - /url: "#carla.TrafficLight.set_red_time"
              - listitem [ref=f32e6732]:
                - strong [ref=f32e6733]: get_state
                - text: (
                - strong [ref=f32e6735]: self
                - text: ) The client returns the state of the traffic light according to last tick. The method does not call the simulator.
                - list [ref=f32e6736]:
                  - listitem [ref=f32e6737]:
                    - strong [ref=f32e6738]: "Return:"
                    - emphasis [ref=f32e6739]:
                      - link "carla.TrafficLightState" [ref=f32e6740] [cursor=pointer]:
                        - /url: "#carla.TrafficLightState"
                  - listitem [ref=f32e6741]:
                    - strong [ref=f32e6742]: "Setter:"
                    - emphasis [ref=f32e6743]:
                      - link "carla.TrafficLight.set_state" [ref=f32e6744] [cursor=pointer]:
                        - /url: "#carla.TrafficLight.set_state"
              - listitem [ref=f32e6745]:
                - strong [ref=f32e6746]: get_stop_waypoints
                - text: (
                - strong [ref=f32e6748]: self
                - text: ) Returns a list of waypoints indicating the stop position for the traffic light. These waypoints are computed from the trigger boxes of the traffic light that indicate where a vehicle should stop.
                - list [ref=f32e6749]:
                  - listitem [ref=f32e6750]:
                    - strong [ref=f32e6751]: "Return:"
                    - emphasis [ref=f32e6752]:
                      - text: list(
                      - link "carla.Waypoint" [ref=f32e6753] [cursor=pointer]:
                        - /url: "#carla.Waypoint"
                      - text: )
              - listitem [ref=f32e6754]:
                - strong [ref=f32e6755]: get_yellow_time
                - text: (
                - strong [ref=f32e6757]: self
                - text: ) The client returns the time set for the traffic light to be yellow, according to last tick. The method does not call the simulator.
                - list [ref=f32e6758]:
                  - listitem [ref=f32e6759]:
                    - strong [ref=f32e6760]: "Return:"
                    - emphasis [ref=f32e6761]: float - seconds
                  - listitem [ref=f32e6762]:
                    - strong [ref=f32e6763]: "Setter:"
                    - emphasis [ref=f32e6764]:
                      - link "carla.TrafficLight.set_yellow_time" [ref=f32e6765] [cursor=pointer]:
                        - /url: "#carla.TrafficLight.set_yellow_time"
            - heading "Setters" [level=5] [ref=f32e6766]
            - list [ref=f32e6767]:
              - listitem [ref=f32e6768]:
                - strong [ref=f32e6769]: set_green_time
                - text: (
                - strong [ref=f32e6771]: self
                - text: ","
                - strong [ref=f32e6773]: green_time
                - text: )
                - list [ref=f32e6774]:
                  - listitem [ref=f32e6775]:
                    - strong [ref=f32e6776]: "Parameters:"
                    - list [ref=f32e6777]:
                      - listitem [ref=f32e6778]:
                        - code [ref=f32e6779]: green_time
                        - text: (
                        - emphasis [ref=f32e6780]: float - seconds
                        - text: ) - Sets a given time for the green light to be active.
                  - listitem [ref=f32e6781]:
