                    - /url: "#carla.Vector3D"
                  - text: "- meters"
                - text: ) Vector from the center of the box to one vertex. The value in each axis equals half the size of the box for that axis.
                - code [ref=f32e1496]: extent.x * 2
                - text: would return the size of the box in the X-axis.
              - listitem [ref=f32e1497]:
