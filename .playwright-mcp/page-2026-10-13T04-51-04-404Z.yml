            - heading "carla.BoundingBox" [level=2] [ref=f32e1485]
            - paragraph [ref=f32e1486]:
              - text: Bounding boxes contain the geometry of an actor or an element in the scene. They can be used by
              - link "carla.DebugHelper" [ref=f32e1487] [cursor=pointer]:
                - /url: "#carla.DebugHelper"
              - text: or a
              - link "carla.Client" [ref=f32e1488] [cursor=pointer]:
                - /url: "#carla.Client"
              - text: to draw their shapes for debugging. Check out the snipet in
              - link "carla.DebugHelper.draw_box" [ref=f32e1489] [cursor=pointer]:
                - /url: "#carla.DebugHelper.draw_box"
              - text: where a snapshot of the world is used to draw bounding boxes for traffic lights.
