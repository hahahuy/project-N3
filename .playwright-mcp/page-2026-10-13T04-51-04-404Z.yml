            - heading "carla.LaneMarkingType" [level=2] [ref=f32e3949]
            - paragraph [ref=f32e3950]:
              - text: Class that defines the lane marking types accepted by OpenDRIVE 1.4. The snipet in
              - link "carla.Map.get_waypoint" [ref=f32e3951] [cursor=pointer]:
                - /url: "#carla.Map.get_waypoint"
              - text: shows how a waypoint can be used to retrieve the information about adjacent lane markings.
              - strong [ref=f32e3952]: "Note on double types:"
              - text: Lane markings are defined under the OpenDRIVE standard that determines whereas a line will be considered "BrokenSolid" or "SolidBroken". For each road there is a center lane marking, defined from left to right regarding the lane's directions. The rest of the lane markings are defined in order from the center lane to the closest outside of the road.
