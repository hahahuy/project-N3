                - text: (
                - strong [ref=f32e4070]: self
                - text: ","
                - strong [ref=f32e4072]: path
                - text: ) Saves the point cloud to disk as a .ply file describing data from 3D scanners. The files generated are ready to be used within
                - link "MeshLab" [ref=f32e4073] [cursor=pointer]:
                  - /url: http://www.meshlab.net/
                - text: ", an open source system for processing said files. Just take into account that axis may differ from Unreal Engine and so, need to be reallocated."
                - list [ref=f32e4074]:
                  - listitem [ref=f32e4075]:
