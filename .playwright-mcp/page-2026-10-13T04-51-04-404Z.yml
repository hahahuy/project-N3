            - heading "carla.ActorBlueprint" [level=2] [ref=f32e1089]
            - paragraph [ref=f32e1090]:
              - text: CARLA provides a blueprint library for actors that can be consulted through
              - link "carla.BlueprintLibrary" [ref=f32e1091] [cursor=pointer]:
                - /url: "#carla.BlueprintLibrary"
              - text: . Each of these consists of an identifier for the blueprint and a series of attributes that may be modifiable or not. This class is the intermediate step between the library and the actor creation. Actors need an actor blueprint to be spawned. These store the information for said blueprint in an object with its attributes and some tags to categorize them. The user can then customize some attributes and eventually spawn the actors through
              - link "carla.World" [ref=f32e1092] [cursor=pointer]:
                - /url: "#carla.World"
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e1093]
