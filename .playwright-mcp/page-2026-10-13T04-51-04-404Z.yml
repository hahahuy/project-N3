                - text: (
                - strong [ref=f32e863]: self
                - text: ) Returns the actor's velocity vector the client recieved during last tick. The method does not call the simulator.
                - list [ref=f32e864]:
                  - listitem [ref=f32e865]:
                    - strong [ref=f32e866]: "Return:"
                    - emphasis [ref=f32e867]:
                      - link "carla.Vector3D" [ref=f32e868] [cursor=pointer]:
