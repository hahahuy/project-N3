            - separator [ref=f32e9478]
            - heading "carla.WheelPhysicsControl" [level=2] [ref=f32e9479]
            - paragraph [ref=f32e9480]:
              - text: Class that defines specific physical parameters for wheel objects that will be part of a
              - link "carla.VehiclePhysicsControl" [ref=f32e9481] [cursor=pointer]:
                - /url: "#carla.VehiclePhysicsControl"
              - text: to simulate vehicle it as a material object.
            - heading "Instance Variables" [level=3] [ref=f32e9482]
            - list [ref=f32e9483]:
              - listitem [ref=f32e9484]:
                - strong [ref=f32e9485]: tire_friction
                - text: (
                - emphasis [ref=f32e9486]: float
                - text: ) A scalar value that indicates the friction of the wheel.
              - listitem [ref=f32e9487]:
                - strong [ref=f32e9488]: damping_rate
                - text: (
                - emphasis [ref=f32e9489]: float
                - text: ) Damping rate of the wheel.
              - listitem [ref=f32e9490]:
                - strong [ref=f32e9491]: max_steer_angle
                - text: (
                - emphasis [ref=f32e9492]: float - degrees
                - text: ) Maximum angle that the wheel can steer.
              - listitem [ref=f32e9493]:
                - strong [ref=f32e9494]: radius
                - text: (
                - emphasis [ref=f32e9495]: float - centimeters
                - text: ) Radius of the wheel.
              - listitem [ref=f32e9496]:
                - strong [ref=f32e9497]: max_brake_torque
                - text: (
                - emphasis [ref=f32e9498]: float - N*m
                - text: ) Maximum brake torque.
              - listitem [ref=f32e9499]:
                - strong [ref=f32e9500]: max_handbrake_torque
                - text: (
                - emphasis [ref=f32e9501]: float - N*m
                - text: ) Maximum handbrake torque.
              - listitem [ref=f32e9502]:
                - strong [ref=f32e9503]: position
                - text: (
                - emphasis [ref=f32e9504]:
                  - link "carla.Vector3D" [ref=f32e9505] [cursor=pointer]:
                    - /url: "#carla.Vector3D"
                - text: ) World position of the wheel. This is a read-only parameter.
              - listitem [ref=f32e9506]:
                - strong [ref=f32e9507]: long_stiff_value
                - text: (
                - emphasis [ref=f32e9508]: float - kg per radian
                - text: ) Tire longitudinal stiffness per unit gravitational acceleration. Each vehicle has a custom value.
              - listitem [ref=f32e9509]:
                - strong [ref=f32e9510]: lat_stiff_max_load
                - text: (
                - emphasis [ref=f32e9511]: float
                - text: ) Maximum normalized tire load at which the tire can deliver no more lateral stiffness no matter how much extra load is applied to the tire. Each vehicle has a custom value.
              - listitem [ref=f32e9512]:
                - strong [ref=f32e9513]: lat_stiff_value
                - text: (
                - emphasis [ref=f32e9514]: float
                - text: ) Maximum stiffness per unit of lateral slip. Each vehicle has a custom value.
