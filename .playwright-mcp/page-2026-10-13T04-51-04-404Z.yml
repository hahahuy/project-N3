                - text: )
            - separator [ref=f32e6177]
            - heading "carla.Sensor" [level=2] [ref=f32e6178]
            - paragraph [ref=f32e6179]:
              - generic [ref=f32e6180]:
                - text: Inherited from
                - emphasis [ref=f32e6181]:
                  - link "carla.Actor" [ref=f32e6182] [cursor=pointer]:
                    - /url: "#carla.Actor"
              - text: Sensors compound a specific family of actors quite diverse and unique. They are normally spawned as attachment/sons of a vehicle (take a look at
              - link "carla.World" [ref=f32e6183] [cursor=pointer]:
                - /url: "#carla.World"
              - text: to learn about actor spawning). Sensors are thoroughly designed to retrieve different types of data that they are listening to. The data they receive is shaped as different subclasses inherited from
              - link "carla.SensorData" [ref=f32e6184] [cursor=pointer]:
                - /url: "#carla.SensorData"
              - text: (depending on the sensor).
            - paragraph [ref=f32e6185]:
              - text: "Most sensors can be divided in two groups: those receiving data on every tick (cameras, point clouds and some specific sensors) and those who only receive under certain circumstances (trigger detectors). CARLA provides a specific set of sensors and their blueprint can be found in"
              - link "carla.BlueprintLibrary" [ref=f32e6186] [cursor=pointer]:
                - /url: "#carla.BlueprintLibrary"
              - text: . All the information on their preferences and settlement can be found
              - link "here" [ref=f32e6187] [cursor=pointer]:
                - /url: ../ref_sensors/
              - text: ", but the list of those available in CARLA so far goes as follows: Receive data on every tick -"
              - link "Depth camera" [ref=f32e6188] [cursor=pointer]:
                - /url: ../ref_sensors/#depth-camera
              - text: "-"
              - link "Gnss sensor" [ref=f32e6189] [cursor=pointer]:
                - /url: ../ref_sensors/#gnss-sensor
              - text: "-"
              - link "IMU sensor" [ref=f32e6190] [cursor=pointer]:
                - /url: ../ref_sensors/#imu-sensor
              - text: "-"
              - link "Lidar raycast" [ref=f32e6191] [cursor=pointer]:
                - /url: ../ref_sensors/#lidar-raycast-sensor
              - text: "-"
              - link "SemanticLidar raycast" [ref=f32e6192] [cursor=pointer]:
                - /url: ../ref_sensors/#semanticlidar-raycast-sensor
              - text: "-"
              - link "Radar" [ref=f32e6193] [cursor=pointer]:
                - /url: ../ref_sensors/#radar-sensor
              - text: "-"
              - link "RGB camera" [ref=f32e6194] [cursor=pointer]:
                - /url: ../ref_sensors/#rgb-camera
              - text: "-"
              - link "RSS sensor" [ref=f32e6195] [cursor=pointer]:
                - /url: ../ref_sensors/#rss-sensor
              - text: "-"
              - link "Semantic Segmentation camera" [ref=f32e6196] [cursor=pointer]:
                - /url: ../ref_sensors/#semantic-segmentation-camera
              - text: Only receive data when triggered. -
              - link "Collision detector" [ref=f32e6197] [cursor=pointer]:
                - /url: ../ref_sensors/#collision-detector
              - text: "-"
              - link "Lane invasion detector" [ref=f32e6198] [cursor=pointer]:
                - /url: ../ref_sensors/#lane-invasion-detector
              - text: "-"
              - link "Obstacle detector" [ref=f32e6199] [cursor=pointer]:
                - /url: ../ref_sensors/#obstacle-detector
              - text: "-"
              - link "V2X sensor" [ref=f32e6200] [cursor=pointer]:
                - /url: ../ref_sensors/#v2x-sensor
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e6201]
            - list [ref=f32e6202]:
              - listitem [ref=f32e6203]:
                - strong [ref=f32e6204]: is_listening
                - text: (
                - emphasis [ref=f32e6205]: boolean
                - text: ) When
                - strong [ref=f32e6206]: "True"
                - text: the sensor will be waiting for data.
            - heading "Methods" [level=3] [ref=f32e6207]
            - list [ref=f32e6208]:
              - listitem [ref=f32e6209]:
                - strong [ref=f32e6210]: is_listening
                - text: (
                - strong [ref=f32e6212]: self
                - text: ) Returns whether the sensor is in a listening state.
                - list [ref=f32e6213]:
                  - listitem [ref=f32e6214]:
                    - strong [ref=f32e6215]: "Return:"
                    - emphasis [ref=f32e6216]: bool
              - listitem [ref=f32e6217]:
                - strong [ref=f32e6218]: is_listening_gbuffer
                - text: (
                - strong [ref=f32e6220]: self
                - text: ","
                - strong [ref=f32e6222]: gbuffer_id
                - text: ) Returns whether the sensor is in a listening state for a specific GBuffer texture.
                - list [ref=f32e6223]:
                  - listitem [ref=f32e6224]:
                    - strong [ref=f32e6225]: "Parameters:"
                    - list [ref=f32e6226]:
                      - listitem [ref=f32e6227]:
                        - code [ref=f32e6228]: gbuffer_id
                        - text: (
                        - emphasis [ref=f32e6229]:
                          - link "carla.GBufferTextureID" [ref=f32e6230] [cursor=pointer]:
                            - /url: "#carla.GBufferTextureID"
                        - text: ) - The ID of the target Unreal Engine GBuffer texture.
                  - listitem [ref=f32e6231]:
                    - strong [ref=f32e6232]: "Return:"
                    - emphasis [ref=f32e6233]: bool
              - listitem [ref=f32e6234]:
                - strong [ref=f32e6235]: listen
                - text: (
                - strong [ref=f32e6237]: self
                - text: ","
                - strong [ref=f32e6239]: callback
                - text: )
                - button "snippet →" [ref=f32e6240] [cursor=pointer]
                - text: The function the sensor will be calling to every time a new measurement is received. This function needs for an argument containing an object type
                - link "carla.SensorData" [ref=f32e6241] [cursor=pointer]:
                  - /url: "#carla.SensorData"
                - text: to work with.
                - list [ref=f32e6242]:
                  - listitem [ref=f32e6243]:
                    - strong [ref=f32e6244]: "Parameters:"
                    - list [ref=f32e6245]:
                      - listitem [ref=f32e6246]:
                        - code [ref=f32e6247]: callback
                        - text: (
                        - emphasis [ref=f32e6248]: function
                        - text: ) - The called function with one argument containing the sensor data.
              - listitem [ref=f32e6249]:
                - strong [ref=f32e6250]: listen_to_gbuffer
                - text: (
                - strong [ref=f32e6252]: self
                - text: ","
                - strong [ref=f32e6254]: gbuffer_id
                - text: ","
                - strong [ref=f32e6256]: callback
                - text: ) The function the sensor will be calling to every time the desired GBuffer texture is received. This function needs for an argument containing an object type
                - link "carla.SensorData" [ref=f32e6257] [cursor=pointer]:
                  - /url: "#carla.SensorData"
                - text: to work with.
                - list [ref=f32e6258]:
                  - listitem [ref=f32e6259]:
                    - strong [ref=f32e6260]: "Parameters:"
                    - list [ref=f32e6261]:
                      - listitem [ref=f32e6262]:
                        - code [ref=f32e6263]: gbuffer_id
                        - text: (
                        - emphasis [ref=f32e6264]:
                          - link "carla.GBufferTextureID" [ref=f32e6265] [cursor=pointer]:
                            - /url: "#carla.GBufferTextureID"
                        - text: ) - The ID of the target Unreal Engine GBuffer texture.
                      - listitem [ref=f32e6266]:
                        - code [ref=f32e6267]: callback
                        - text: (
                        - emphasis [ref=f32e6268]: function
                        - text: ) - The called function with one argument containing the received GBuffer texture.
              - listitem [ref=f32e6269]:
                - strong [ref=f32e6270]: send
                - text: (
                - strong [ref=f32e6272]: self
                - text: ","
                - strong [ref=f32e6274]: message
                - text: ) Instructs the sensor to send the bytes given by
                - code [ref=f32e6275]: message
                - text: to all other CustomV2XSensors on the next tick.
                - list [ref=f32e6276]:
                  - listitem [ref=f32e6277]:
                    - strong [ref=f32e6278]: "Parameters:"
                    - list [ref=f32e6279]:
                      - listitem [ref=f32e6280]:
                        - code [ref=f32e6281]: message
                        - text: (
                        - emphasis [ref=f32e6282]:
                          - link "carla.CustomV2XBytes" [ref=f32e6283] [cursor=pointer]:
                            - /url: "#carla.CustomV2XBytes"
                        - text: ") - The data to send. Note: There is a maximum data size for a single message see"
                        - link "carla.CustomV2XBytes" [ref=f32e6284] [cursor=pointer]:
                          - /url: "#carla.CustomV2XBytes"
                        - text: for more information.
              - listitem [ref=f32e6285]:
                - strong [ref=f32e6286]: stop
                - text: (
                - strong [ref=f32e6288]: self
                - text: ) Commands the sensor to stop listening for data.
              - listitem [ref=f32e6289]:
                - strong [ref=f32e6290]: stop_gbuffer
                - text: (
                - strong [ref=f32e6292]: self
                - text: ","
                - strong [ref=f32e6294]: gbuffer_id
                - text: ) Commands the sensor to stop listening for the specified GBuffer texture.
                - list [ref=f32e6295]:
                  - listitem [ref=f32e6296]:
                    - strong [ref=f32e6297]: "Parameters:"
                    - list [ref=f32e6298]:
                      - listitem [ref=f32e6299]:
                        - code [ref=f32e6300]: gbuffer_id
                        - text: (
                        - emphasis [ref=f32e6301]:
                          - link "carla.GBufferTextureID" [ref=f32e6302] [cursor=pointer]:
                            - /url: "#carla.GBufferTextureID"
                        - text: ) - The ID of the Unreal Engine GBuffer texture.
            - heading "Dunder methods" [level=5] [ref=f32e6303]
            - list [ref=f32e6304]:
              - listitem [ref=f32e6305]:
                - strong [ref=f32e6306]: __str__
                - text: (
                - strong [ref=f32e6308]: self
                - text: )
            - separator [ref=f32e6309]
            - heading "carla.SensorData" [level=2] [ref=f32e6310]
            - paragraph [ref=f32e6311]:
              - text: Base class for all the objects containing data generated by a
              - link "carla.Sensor" [ref=f32e6312] [cursor=pointer]:
                - /url: "#carla.Sensor"
              - text: ". This objects should be the argument of the function said sensor is listening to, in order to work with them. Each of these sensors needs for a specific type of sensor data. Hereunder is a list of the sensors and their corresponding data. - Cameras (RGB, depth and semantic segmentation):"
              - link "carla.Image" [ref=f32e6313] [cursor=pointer]:
                - /url: "#carla.Image"
              - text: ". - Collision detector:"
              - link "carla.CollisionEvent" [ref=f32e6314] [cursor=pointer]:
                - /url: "#carla.CollisionEvent"
              - text: ". - GNSS sensor:"
              - link "carla.GnssMeasurement" [ref=f32e6315] [cursor=pointer]:
                - /url: "#carla.GnssMeasurement"
              - text: ". - IMU sensor:"
              - link "carla.IMUMeasurement" [ref=f32e6316] [cursor=pointer]:
                - /url: "#carla.IMUMeasurement"
              - text: ". - Lane invasion detector:"
              - link "carla.LaneInvasionEvent" [ref=f32e6317] [cursor=pointer]:
                - /url: "#carla.LaneInvasionEvent"
              - text: ". - LIDAR sensor:"
              - link "carla.LidarMeasurement" [ref=f32e6318] [cursor=pointer]:
                - /url: "#carla.LidarMeasurement"
              - text: ". - Obstacle detector:"
              - link "carla.ObstacleDetectionEvent" [ref=f32e6319] [cursor=pointer]:
                - /url: "#carla.ObstacleDetectionEvent"
              - text: ". - Radar sensor:"
              - link "carla.RadarMeasurement" [ref=f32e6320] [cursor=pointer]:
                - /url: "#carla.RadarMeasurement"
              - text: ". - RSS sensor:"
              - link "carla.RssResponse" [ref=f32e6321] [cursor=pointer]:
                - /url: "#carla.RssResponse"
              - text: ". - Semantic LIDAR sensor:"
              - link "carla.SemanticLidarMeasurement" [ref=f32e6322] [cursor=pointer]:
                - /url: "#carla.SemanticLidarMeasurement"
              - text: ". - Cooperative awareness messages V2X sensor:"
              - link "carla.CAMEvent" [ref=f32e6323] [cursor=pointer]:
                - /url: "#carla.CAMEvent"
              - text: ". - Custom V2X messages V2X sensor:"
              - link "carla.CustomV2XEvent" [ref=f32e6324] [cursor=pointer]:
                - /url: "#carla.CustomV2XEvent"
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e6325]
            - list [ref=f32e6326]:
              - listitem [ref=f32e6327]:
                - strong [ref=f32e6328]: frame
                - text: (
                - emphasis [ref=f32e6329]: int
                - text: ) Frame count when the data was generated.
              - listitem [ref=f32e6330]:
                - strong [ref=f32e6331]: timestamp
                - text: (
                - emphasis [ref=f32e6332]: float - seconds
                - text: ) Simulation-time when the data was generated.
              - listitem [ref=f32e6333]:
                - strong [ref=f32e6334]: transform
                - text: (
                - emphasis [ref=f32e6335]:
                  - link "carla.Transform" [ref=f32e6336] [cursor=pointer]:
                    - /url: "#carla.Transform"
                - text: ) Sensor's transform when the data was generated.
            - separator [ref=f32e6337]
            - heading "carla.TextureColor" [level=2] [ref=f32e6338]
            - paragraph [ref=f32e6339]: Class representing a texture object to be uploaded to the server. Pixel format is RGBA, uint8 per channel.
            - heading "Instance Variables" [level=3] [ref=f32e6340]
            - list [ref=f32e6341]:
              - listitem [ref=f32e6342]:
                - strong [ref=f32e6343]: width
                - text: (
                - emphasis [ref=f32e6344]: int
                - text: ) X-coordinate size of the texture.
              - listitem [ref=f32e6345]:
                - strong [ref=f32e6346]: height
                - text: (
                - emphasis [ref=f32e6347]: int
                - text: ) Y-coordinate size of the texture.
            - heading "Methods" [level=3] [ref=f32e6348]
            - list [ref=f32e6349]:
              - listitem [ref=f32e6350]:
                - strong [ref=f32e6351]: __init__
                - text: (
                - strong [ref=f32e6353]: self
                - text: ","
                - strong [ref=f32e6355]: width
                - text: ","
                - strong [ref=f32e6357]: height
                - text: ) Initializes a the texture with a (
