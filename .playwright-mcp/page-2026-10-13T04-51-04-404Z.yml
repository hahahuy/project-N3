                  - strong [ref=f32e5559]: pos
                  - text: =int
                - text: ","
                - generic [ref=f32e5560]:
                  - strong [ref=f32e5561]: detection
                  - text: =
                  - link "carla.RadarDetection" [ref=f32e5562] [cursor=pointer]:
                    - /url: "#carla.RadarDetection"
                - text: )
              - listitem [ref=f32e5563]:
                - strong [ref=f32e5564]: __str__
                - text: (
                - strong [ref=f32e5566]: self
                - text: )
            - separator [ref=f32e5567]
            - heading "carla.Rotation" [level=2] [ref=f32e5568]
            - paragraph [ref=f32e5569]:
              - text: "Class that represents a 3D rotation and therefore, an orientation in space. CARLA uses the Unreal Engine coordinates system. This is a Z-up left-handed system. The constructor method follows a specific order of declaration:"
              - code [ref=f32e5570]: (pitch, yaw, roll)
              - text: ", which corresponds to"
              - code [ref=f32e5571]: (Y-rotation,Z-rotation,X-rotation)
              - text: .
              - emphasis [ref=f32e5573]: Unreal Engine's left handed coordinate system with rotations
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e5574]
            - list [ref=f32e5575]:
              - listitem [ref=f32e5576]:
                - strong [ref=f32e5577]: pitch
                - text: (
                - emphasis [ref=f32e5578]: float - degrees
                - text: ) Y-axis rotation angle.
              - listitem [ref=f32e5579]:
                - strong [ref=f32e5580]: yaw
                - text: (
                - emphasis [ref=f32e5581]: float - degrees
                - text: ) Z-axis rotation angle.
              - listitem [ref=f32e5582]:
                - strong [ref=f32e5583]: roll
                - text: (
                - emphasis [ref=f32e5584]: float - degrees
                - text: ) X-axis rotation angle.
            - heading "Methods" [level=3] [ref=f32e5585]
            - list [ref=f32e5586]:
              - listitem [ref=f32e5587]:
                - strong [ref=f32e5588]: __init__
                - text: (
                - strong [ref=f32e5590]: self
                - text: ","
                - generic [ref=f32e5591]:
                  - strong [ref=f32e5592]: pitch
                  - text: =0.0
                - text: ","
                - generic [ref=f32e5593]:
                  - strong [ref=f32e5594]: yaw
                  - text: =0.0
                - text: ","
                - generic [ref=f32e5595]:
                  - strong [ref=f32e5596]: roll
                  - text: =0.0
                - text: )
                - list [ref=f32e5597]:
                  - listitem [ref=f32e5598]:
                    - strong [ref=f32e5599]: "Parameters:"
                    - list [ref=f32e5600]:
                      - listitem [ref=f32e5601]:
                        - code [ref=f32e5602]: pitch
                        - text: (
                        - emphasis [ref=f32e5603]: float - degrees
                        - text: ) - Y-axis rotation angle.
                      - listitem [ref=f32e5604]:
                        - code [ref=f32e5605]: yaw
                        - text: (
                        - emphasis [ref=f32e5606]: float - degrees
                        - text: ) - Z-axis rotation angle.
                      - listitem [ref=f32e5607]:
                        - code [ref=f32e5608]: roll
                        - text: (
                        - emphasis [ref=f32e5609]: float - degrees
                        - text: ) - X-axis rotation angle.
                  - listitem [ref=f32e5610]:
                    - strong [ref=f32e5611]: "Warning:"
                    - emphasis [ref=f32e5613]:
                      - text: The declaration order is different in CARLA
                      - code [ref=f32e5614]: (pitch,yaw,roll)
                      - text: ", and in the Unreal Engine Editor"
                      - code [ref=f32e5615]: (roll,pitch,yaw)
                      - text: . When working in a build from source, don't mix up the axes' rotations.
            - heading "Getters" [level=5] [ref=f32e5616]
            - list [ref=f32e5617]:
              - listitem [ref=f32e5618]:
                - strong [ref=f32e5619]: get_forward_vector
                - text: (
                - strong [ref=f32e5621]: self
                - text: ) Computes the vector pointing forward according to the rotation of the object.
                - list [ref=f32e5622]:
                  - listitem [ref=f32e5623]:
                    - strong [ref=f32e5624]: "Return:"
                    - emphasis [ref=f32e5625]:
                      - link "carla.Vector3D" [ref=f32e5626] [cursor=pointer]:
                        - /url: "#carla.Vector3D"
              - listitem [ref=f32e5627]:
                - strong [ref=f32e5628]: get_right_vector
                - text: (
                - strong [ref=f32e5630]: self
                - text: ) Computes the vector pointing to the right according to the rotation of the object.
                - list [ref=f32e5631]:
                  - listitem [ref=f32e5632]:
                    - strong [ref=f32e5633]: "Return:"
                    - emphasis [ref=f32e5634]:
                      - link "carla.Vector3D" [ref=f32e5635] [cursor=pointer]:
                        - /url: "#carla.Vector3D"
              - listitem [ref=f32e5636]:
                - strong [ref=f32e5637]: get_up_vector
                - text: (
                - strong [ref=f32e5639]: self
                - text: ) Computes the vector pointing upwards according to the rotation of the object.
                - list [ref=f32e5640]:
                  - listitem [ref=f32e5641]:
                    - strong [ref=f32e5642]: "Return:"
                    - emphasis [ref=f32e5643]:
                      - link "carla.Vector3D" [ref=f32e5644] [cursor=pointer]:
                        - /url: "#carla.Vector3D"
            - heading "Dunder methods" [level=5] [ref=f32e5645]
            - list [ref=f32e5646]:
              - listitem [ref=f32e5647]:
                - strong [ref=f32e5648]: __eq__
                - text: (
                - strong [ref=f32e5650]: self
                - text: ","
                - generic [ref=f32e5651]:
                  - strong [ref=f32e5652]: other
                  - text: =
                  - link "carla.Rotation" [ref=f32e5653] [cursor=pointer]:
                    - /url: "#carla.Rotation"
                - text: ) Returns
                - strong [ref=f32e5654]: "True"
                - text: if both rotations represent the same orientation for every axis.
                - list [ref=f32e5655]:
                  - listitem [ref=f32e5656]:
                    - strong [ref=f32e5657]: "Return:"
                    - emphasis [ref=f32e5658]: bool
              - listitem [ref=f32e5659]:
                - strong [ref=f32e5660]: __ne__
                - text: (
                - strong [ref=f32e5662]: self
                - text: ","
                - generic [ref=f32e5663]:
                  - strong [ref=f32e5664]: other
                  - text: =
                  - link "carla.Rotation" [ref=f32e5665] [cursor=pointer]:
                    - /url: "#carla.Rotation"
                - text: ) Returns
                - strong [ref=f32e5666]: "True"
                - text: if both rotations represent the same orientation for every axis.
                - list [ref=f32e5667]:
                  - listitem [ref=f32e5668]:
                    - strong [ref=f32e5669]: "Return:"
                    - emphasis [ref=f32e5670]: bool
              - listitem [ref=f32e5671]:
                - strong [ref=f32e5672]: __str__
                - text: (
                - strong [ref=f32e5674]: self
                - text: ) Parses the axis' orientations to string.
            - separator [ref=f32e5675]
            - heading "carla.RssActorConstellationData" [level=2] [ref=f32e5676]
            - paragraph [ref=f32e5677]: Data structure that is provided within the callback registered by RssSensor.register_actor_constellation_callback().
            - heading "Instance Variables" [level=3] [ref=f32e5678]
            - list [ref=f32e5679]:
              - listitem [ref=f32e5680]:
                - strong [ref=f32e5681]: ego_match_object
                - text: (
                - emphasis [ref=f32e5682]:
                  - link "ad.map.match.Object" [ref=f32e5683] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_map_access/apidoc/html/structad_1_1map_1_1match_1_1Object.html
                - text: ) The ego map matched information.
              - listitem [ref=f32e5684]:
                - strong [ref=f32e5685]: ego_route
                - text: (
                - emphasis [ref=f32e5686]:
                  - link "ad.map.route.FullRoute" [ref=f32e5687] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_map_access/apidoc/html/structad_1_1map_1_1route_1_1FullRoute.html
                - text: ) The ego route.
              - listitem [ref=f32e5688]:
                - strong [ref=f32e5689]: ego_dynamics_on_route
                - text: (
                - emphasis [ref=f32e5690]:
                  - link "carla.RssEgoDynamicsOnRoute" [ref=f32e5691] [cursor=pointer]:
                    - /url: "#carla.RssEgoDynamicsOnRoute"
                - text: ) Current ego vehicle dynamics regarding the route.
              - listitem [ref=f32e5692]:
                - strong [ref=f32e5693]: other_match_object
                - text: (
                - emphasis [ref=f32e5694]:
                  - link "ad.map.match.Object" [ref=f32e5695] [cursor=pointer]:
                    - /url: https://ad-map-access.readthedocs.io/en/latest/ad_map_access/apidoc/html/structad_1_1map_1_1match_1_1Object.html
                - text: ) The other object's map matched information. This is only valid if 'other_actor' is not 'None'.
              - listitem [ref=f32e5696]:
                - strong [ref=f32e5697]: other_actor
                - text: (
                - emphasis [ref=f32e5698]:
                  - link "carla.Actor" [ref=f32e5699] [cursor=pointer]:
                    - /url: "#carla.Actor"
                - text: ) The other actor. This is 'None' in case of query of default parameters or articial objects of kind
                - link "ad.rss.world.ObjectType.ArtificialObject" [ref=f32e5700] [cursor=pointer]:
                  - /url: https://intel.github.io/ad-rss-lib/doxygen/ad_rss/namespacead_1_1rss_1_1world.html#a6432f1ef8d0657b4f21ed5966aca1625
                - text: with no dedicated '
                - link "carla.Actor" [ref=f32e5701] [cursor=pointer]:
                  - /url: "#carla.Actor"
                - text: "' (as e.g. for the"
                - link "road boundaries" [ref=f32e5702] [cursor=pointer]:
                  - /url: ../ref_sensors/#rss-sensor
                - text: at the moment).
            - heading "Methods" [level=3] [ref=f32e5703]
