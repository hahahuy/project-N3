            - heading "carla.Vehicle" [level=2] [ref=f32e7992]
            - paragraph [ref=f32e7993]:
              - generic [ref=f32e7994]:
                - text: Inherited from
                - emphasis [ref=f32e7995]:
                  - link "carla.Actor" [ref=f32e7996] [cursor=pointer]:
                    - /url: "#carla.Actor"
              - text: One of the most important groups of actors in CARLA. These include any type of vehicle from cars to trucks, motorbikes, vans, bycicles and also official vehicles such as police cars. A wide set of these actors is provided in
              - link "carla.BlueprintLibrary" [ref=f32e7997] [cursor=pointer]:
                - /url: "#carla.BlueprintLibrary"
              - text: to facilitate differente requirements. Vehicles can be either manually controlled or set to an autopilot mode that will be conducted client-side by the traffic manager.
            - heading "Instance Variables" [level=3] [ref=f32e7998]
            - list [ref=f32e7999]:
              - listitem [ref=f32e8000]:
                - strong [ref=f32e8001]: bounding_box
                - text: (
                - emphasis [ref=f32e8002]:
                  - link "carla.BoundingBox" [ref=f32e8003] [cursor=pointer]:
                    - /url: "#carla.BoundingBox"
                - text: ) Bounding box containing the geometry of the vehicle. Its location and rotation are relative to the vehicle it is attached to.
            - heading "Methods" [level=3] [ref=f32e8004]
            - list [ref=f32e8005]:
              - listitem [ref=f32e8006]:
                - strong [ref=f32e8007]: apply_ackermann_control
                - text: (
                - strong [ref=f32e8009]: self
                - text: ","
                - strong [ref=f32e8011]: control
                - text: ) Applies an Ackermann control object on the next tick.
                - list [ref=f32e8012]:
                  - listitem [ref=f32e8013]:
                    - strong [ref=f32e8014]: "Parameters:"
                    - list [ref=f32e8015]:
                      - listitem [ref=f32e8016]:
                        - code [ref=f32e8017]: control
                        - text: (
                        - emphasis [ref=f32e8018]:
                          - link "carla.VehicleAckermannControl" [ref=f32e8019] [cursor=pointer]:
                            - /url: "#carla.VehicleAckermannControl"
                        - text: )
              - listitem [ref=f32e8020]:
                - strong [ref=f32e8021]: apply_ackermann_controller_settings
                - text: (
                - strong [ref=f32e8023]: self
                - text: ","
                - strong [ref=f32e8025]: settings
                - text: ) Applies a new Ackermann control settings to this vehicle in the next tick.
                - list [ref=f32e8026]:
                  - listitem [ref=f32e8027]:
                    - strong [ref=f32e8028]: "Parameters:"
                    - list [ref=f32e8029]:
                      - listitem [ref=f32e8030]:
                        - code [ref=f32e8031]: settings
                        - text: (
                        - emphasis [ref=f32e8032]:
                          - link "carla.AckermannControllerSettings" [ref=f32e8033] [cursor=pointer]:
                            - /url: "#carla.AckermannControllerSettings"
                        - text: )
                  - listitem [ref=f32e8034]:
                    - strong [ref=f32e8035]: "Warning:"
                    - emphasis [ref=f32e8037]: This method does call the simulator.
              - listitem [ref=f32e8038]:
                - strong [ref=f32e8039]: apply_control
                - text: (
                - strong [ref=f32e8041]: self
                - text: ","
                - strong [ref=f32e8043]: control
                - text: ) Applies a control object on the next tick, containing driving parameters such as throttle, steering or gear shifting.
                - list [ref=f32e8044]:
                  - listitem [ref=f32e8045]:
                    - strong [ref=f32e8046]: "Parameters:"
                    - list [ref=f32e8047]:
                      - listitem [ref=f32e8048]:
                        - code [ref=f32e8049]: control
                        - text: (
                        - emphasis [ref=f32e8050]:
                          - link "carla.VehicleControl" [ref=f32e8051] [cursor=pointer]:
                            - /url: "#carla.VehicleControl"
                        - text: )
              - listitem [ref=f32e8052]:
                - strong [ref=f32e8053]: apply_physics_control
                - text: (
                - strong [ref=f32e8055]: self
                - text: ","
                - strong [ref=f32e8057]: physics_control
                - text: ") Applies a physics control object in the next tick containing the parameters that define the vehicle as a corporeal body. E.g.: moment of inertia, mass, drag coefficient and many more."
                - list [ref=f32e8058]:
                  - listitem [ref=f32e8059]:
                    - strong [ref=f32e8060]: "Parameters:"
                    - list [ref=f32e8061]:
                      - listitem [ref=f32e8062]:
                        - code [ref=f32e8063]: physics_control
                        - text: (
                        - emphasis [ref=f32e8064]:
                          - link "carla.VehiclePhysicsControl" [ref=f32e8065] [cursor=pointer]:
                            - /url: "#carla.VehiclePhysicsControl"
                        - text: )
              - listitem [ref=f32e8066]:
                - strong [ref=f32e8067]: close_door
                - text: (
                - strong [ref=f32e8069]: self
                - text: ","
                - strong [ref=f32e8071]: door_idx
                - text: ) Close the door
                - code [ref=f32e8072]: door_idx
                - text: if the vehicle has it. Use
                - link "carla.VehicleDoor.All" [ref=f32e8073] [cursor=pointer]:
                  - /url: "#carla.VehicleDoor.All"
                - text: to close all available doors.
                - list [ref=f32e8074]:
                  - listitem [ref=f32e8075]:
                    - strong [ref=f32e8076]: "Parameters:"
                    - list [ref=f32e8077]:
                      - listitem [ref=f32e8078]:
                        - code [ref=f32e8079]: door_idx
                        - text: (
                        - emphasis [ref=f32e8080]:
                          - link "carla.VehicleDoor" [ref=f32e8081] [cursor=pointer]:
                            - /url: "#carla.VehicleDoor"
                        - text: ) - door index.
              - listitem [ref=f32e8082]:
                - strong [ref=f32e8083]: enable_carsim
                - text: (
                - strong [ref=f32e8085]: self
                - text: ","
                - strong [ref=f32e8087]: simfile_path
                - text: ) Enables the CarSim physics solver for this particular vehicle. In order for this function to work, there needs to be a valid license manager running on the server side. The control inputs are redirected to CarSim which will provide the position and orientation of the vehicle for every frame.
                - list [ref=f32e8088]:
                  - listitem [ref=f32e8089]:
                    - strong [ref=f32e8090]: "Parameters:"
                    - list [ref=f32e8091]:
                      - listitem [ref=f32e8092]:
                        - code [ref=f32e8093]: simfile_path
                        - text: (
                        - emphasis [ref=f32e8094]: str
                        - text: ) - Path to the
                        - code [ref=f32e8095]: .simfile
                        - text: file with the parameters of the simulation.
              - listitem [ref=f32e8096]:
                - strong [ref=f32e8097]: enable_chrono_physics
                - text: (
                - strong [ref=f32e8099]: self
                - text: ","
                - strong [ref=f32e8101]: max_substeps
                - text: ","
                - strong [ref=f32e8103]: max_substep_delta_time
                - text: ","
                - strong [ref=f32e8105]: vehicle_json
                - text: ","
                - strong [ref=f32e8107]: powertrain_json
                - text: ","
                - strong [ref=f32e8109]: tire_json
                - text: ","
                - strong [ref=f32e8111]: base_json_path
                - text: ) Enables Chrono physics on a spawned vehicle.
                - list [ref=f32e8112]:
                  - listitem [ref=f32e8113]:
                    - strong [ref=f32e8114]: "Parameters:"
                    - list [ref=f32e8115]:
                      - listitem [ref=f32e8116]:
                        - code [ref=f32e8117]: max_substeps
                        - text: (
                        - emphasis [ref=f32e8118]: int
                        - text: ) - Max number of Chrono substeps.
                      - listitem [ref=f32e8119]:
                        - code [ref=f32e8120]: max_substep_delta_time
                        - text: (
                        - emphasis [ref=f32e8121]: int
                        - text: ) - Max size of substep.
                      - listitem [ref=f32e8122]:
                        - code [ref=f32e8123]: vehicle_json
                        - text: (
                        - emphasis [ref=f32e8124]: str
                        - text: ) - Path to vehicle json file relative to
                        - code [ref=f32e8125]: base_json_path
                        - text: .
                      - listitem [ref=f32e8126]:
                        - code [ref=f32e8127]: powertrain_json
                        - text: (
                        - emphasis [ref=f32e8128]: str
                        - text: ) - Path to powertrain json file relative to
                        - code [ref=f32e8129]: base_json_path
                        - text: .
                      - listitem [ref=f32e8130]:
                        - code [ref=f32e8131]: tire_json
                        - text: (
                        - emphasis [ref=f32e8132]: str
                        - text: ) - Path to tire json file relative to
                        - code [ref=f32e8133]: base_json_path
                        - text: .
                      - listitem [ref=f32e8134]:
                        - code [ref=f32e8135]: base_json_path
                        - text: (
                        - emphasis [ref=f32e8136]: str
                        - text: ) - Path to
                        - code [ref=f32e8137]: chrono/data/vehicle
                        - text: folder. E.g.,
                        - code [ref=f32e8138]: /home/user/carla/Co-Simulation/Chrono/Vehicles/
                        - text: (the final
                        - code [ref=f32e8139]: /
                        - text: character is required).
                  - listitem [ref=f32e8140]:
                    - strong [ref=f32e8141]: "Note:"
                    - emphasis [ref=f32e8143]:
                      - text: Ensure that you have started the CARLA server with the
                      - code [ref=f32e8144]: ARGS="--chrono"
                      - text: flag. You will not be able to use Chrono physics without this flag set.
                  - listitem [ref=f32e8145]:
                    - strong [ref=f32e8146]: "Warning:"
                    - emphasis [ref=f32e8148]: Collisions are not supported. When a collision is detected, physics will revert to the default CARLA physics.
              - listitem [ref=f32e8149]:
                - strong [ref=f32e8150]: is_at_traffic_light
                - text: (
                - strong [ref=f32e8152]: self
                - text: ) Vehicles will be affected by a traffic light when the light is red and the vehicle is inside its bounding box. The client returns whether a traffic light is affecting this vehicle according to last tick (it does not call the simulator).
                - list [ref=f32e8153]:
                  - listitem [ref=f32e8154]:
                    - strong [ref=f32e8155]: "Return:"
                    - emphasis [ref=f32e8156]: bool
              - listitem [ref=f32e8157]:
                - strong [ref=f32e8158]: open_door
                - text: (
                - strong [ref=f32e8160]: self
                - text: ","
                - strong [ref=f32e8162]: door_idx
                - text: ) Open the door
                - code [ref=f32e8163]: door_idx
                - text: if the vehicle has it. Use
                - link "carla.VehicleDoor.All" [ref=f32e8164] [cursor=pointer]:
                  - /url: "#carla.VehicleDoor.All"
                - text: to open all available doors.
                - list [ref=f32e8165]:
                  - listitem [ref=f32e8166]:
                    - strong [ref=f32e8167]: "Parameters:"
                    - list [ref=f32e8168]:
                      - listitem [ref=f32e8169]:
                        - code [ref=f32e8170]: door_idx
                        - text: (
                        - emphasis [ref=f32e8171]:
                          - link "carla.VehicleDoor" [ref=f32e8172] [cursor=pointer]:
                            - /url: "#carla.VehicleDoor"
                        - text: ) - door index.
              - listitem [ref=f32e8173]:
                - strong [ref=f32e8174]: show_debug_telemetry
                - text: (
                - strong [ref=f32e8176]: self
                - text: ","
                - generic [ref=f32e8177]:
                  - strong [ref=f32e8178]: enabled
                  - text: =True
                - text: ) Enables or disables the telemetry on this vehicle. This shows information about the vehicles current state and forces applied to it in the spectator window. Only information for one vehicle can be shown so that, if you enable a second one, the previous will be automatically disabled.
                - list [ref=f32e8179]:
                  - listitem [ref=f32e8180]:
                    - strong [ref=f32e8181]: "Parameters:"
                    - list [ref=f32e8182]:
                      - listitem [ref=f32e8183]:
                        - code [ref=f32e8184]: enabled
                        - text: (
                        - emphasis [ref=f32e8185]: bool
                        - text: )
              - listitem [ref=f32e8186]:
                - strong [ref=f32e8187]: use_carsim_road
                - text: (
                - strong [ref=f32e8189]: self
                - text: ","
                - strong [ref=f32e8191]: enabled
                - text: ) Enables or disables the usage of CarSim vs terrain file specified in the
                - code [ref=f32e8192]: .simfile
                - text: . By default this option is disabled and CarSim uses unreal engine methods to process the geometry of the scene.
                - list [ref=f32e8193]:
                  - listitem [ref=f32e8194]:
                    - strong [ref=f32e8195]: "Parameters:"
                    - list [ref=f32e8196]:
                      - listitem [ref=f32e8197]:
                        - code [ref=f32e8198]: enabled
                        - text: (
                        - emphasis [ref=f32e8199]: bool
                        - text: )
            - heading "Getters" [level=5] [ref=f32e8200]
            - list [ref=f32e8201]:
              - listitem [ref=f32e8202]:
                - strong [ref=f32e8203]: get_ackermann_controller_settings
                - text: (
                - strong [ref=f32e8205]: self
                - text: ) Returns the last Ackermann control settings applied to this vehicle.
                - list [ref=f32e8206]:
                  - listitem [ref=f32e8207]:
                    - strong [ref=f32e8208]: "Return:"
                    - emphasis [ref=f32e8209]:
                      - link "carla.AckermannControllerSettings" [ref=f32e8210] [cursor=pointer]:
                        - /url: "#carla.AckermannControllerSettings"
                  - listitem [ref=f32e8211]:
                    - strong [ref=f32e8212]: "Warning:"
                    - emphasis [ref=f32e8214]: This method does call the simulator to retrieve the value.
              - listitem [ref=f32e8215]:
                - strong [ref=f32e8216]: get_control
                - text: (
                - strong [ref=f32e8218]: self
                - text: ) The client returns the control applied in the last tick. The method does not call the simulator.
                - list [ref=f32e8219]:
                  - listitem [ref=f32e8220]:
                    - strong [ref=f32e8221]: "Return:"
                    - emphasis [ref=f32e8222]:
                      - link "carla.VehicleControl" [ref=f32e8223] [cursor=pointer]:
                        - /url: "#carla.VehicleControl"
              - listitem [ref=f32e8224]:
                - strong [ref=f32e8225]: get_failure_state
                - text: (
                - strong [ref=f32e8227]: self
                - text: ) Vehicle have failure states, to indicate that it is incapable of continuing its route. This function returns the vehicle's specific failure state, or in other words, the cause that resulted in it.
                - list [ref=f32e8228]:
                  - listitem [ref=f32e8229]:
                    - strong [ref=f32e8230]: "Return:"
                    - emphasis [ref=f32e8231]:
                      - link "carla.VehicleFailureState" [ref=f32e8232] [cursor=pointer]:
                        - /url: "#carla.VehicleFailureState"
              - listitem [ref=f32e8233]:
                - strong [ref=f32e8234]: get_light_state
                - text: (
                - strong [ref=f32e8236]: self
                - text: ) Returns a flag representing the vehicle light state, this represents which lights are active or not.
                - list [ref=f32e8237]:
                  - listitem [ref=f32e8238]:
                    - strong [ref=f32e8239]: "Return:"
                    - emphasis [ref=f32e8240]:
                      - link "carla.VehicleLightState" [ref=f32e8241] [cursor=pointer]:
                        - /url: "#carla.VehicleLightState"
                  - listitem [ref=f32e8242]:
                    - strong [ref=f32e8243]: "Setter:"
                    - emphasis [ref=f32e8244]:
                      - link "carla.Vehicle.set_light_state" [ref=f32e8245] [cursor=pointer]:
                        - /url: "#carla.Vehicle.set_light_state"
              - listitem [ref=f32e8246]:
                - strong [ref=f32e8247]: get_physics_control
                - text: (
                - strong [ref=f32e8249]: self
                - text: ) The simulator returns the last physics control applied to this vehicle.
                - list [ref=f32e8250]:
                  - listitem [ref=f32e8251]:
                    - strong [ref=f32e8252]: "Return:"
                    - emphasis [ref=f32e8253]:
                      - link "carla.VehiclePhysicsControl" [ref=f32e8254] [cursor=pointer]:
                        - /url: "#carla.VehiclePhysicsControl"
                  - listitem [ref=f32e8255]:
                    - strong [ref=f32e8256]: "Warning:"
                    - emphasis [ref=f32e8258]: This method does call the simulator to retrieve the value.
              - listitem [ref=f32e8259]:
                - strong [ref=f32e8260]: get_speed_limit
                - text: (
                - strong [ref=f32e8262]: self
                - text: ) The client returns the speed limit affecting this vehicle according to last tick (it does not call the simulator). The speed limit is updated when passing by a speed limit signal, so a vehicle might have none right after spawning.
                - list [ref=f32e8263]:
                  - listitem [ref=f32e8264]:
                    - strong [ref=f32e8265]: "Return:"
                    - emphasis [ref=f32e8266]: float - km/h
              - listitem [ref=f32e8267]:
                - strong [ref=f32e8268]: get_traffic_light
                - text: (
                - strong [ref=f32e8270]: self
                - text: ) Retrieves the traffic light actor affecting this vehicle (if any) according to last tick. The method does not call the simulator.
                - list [ref=f32e8271]:
                  - listitem [ref=f32e8272]:
                    - strong [ref=f32e8273]: "Return:"
                    - emphasis [ref=f32e8274]:
                      - link "carla.TrafficLight" [ref=f32e8275] [cursor=pointer]:
                        - /url: "#carla.TrafficLight"
              - listitem [ref=f32e8276]:
                - strong [ref=f32e8277]: get_traffic_light_state
                - text: (
                - strong [ref=f32e8279]: self
                - text: ) The client returns the state of the traffic light affecting this vehicle according to last tick. The method does not call the simulator. If no traffic light is currently affecting the vehicle, returns green.
                - list [ref=f32e8280]:
                  - listitem [ref=f32e8281]:
                    - strong [ref=f32e8282]: "Return:"
                    - emphasis [ref=f32e8283]:
                      - link "carla.TrafficLightState" [ref=f32e8284] [cursor=pointer]:
                        - /url: "#carla.TrafficLightState"
              - listitem [ref=f32e8285]:
                - strong [ref=f32e8286]: get_wheel_steer_angle
                - text: (
                - strong [ref=f32e8288]: self
                - text: ","
                - strong [ref=f32e8290]: wheel_location
                - text: ) Returns the physics angle in degrees of a vehicle's wheel.
                - list [ref=f32e8291]:
                  - listitem [ref=f32e8292]:
                    - strong [ref=f32e8293]: "Parameters:"
                    - list [ref=f32e8294]:
                      - listitem [ref=f32e8295]:
                        - code [ref=f32e8296]: wheel_location
                        - text: (
                        - emphasis [ref=f32e8297]:
                          - link "carla.VehicleWheelLocation" [ref=f32e8298] [cursor=pointer]:
                            - /url: "#carla.VehicleWheelLocation"
                        - text: )
                  - listitem [ref=f32e8299]:
                    - strong [ref=f32e8300]: "Return:"
                    - emphasis [ref=f32e8301]: float
                  - listitem [ref=f32e8302]:
                    - strong [ref=f32e8303]: "Note:"
                    - emphasis [ref=f32e8305]: Returns the angle based on the physics of the wheel, not the visual angle.
            - heading "Setters" [level=5] [ref=f32e8306]
            - list [ref=f32e8307]:
              - listitem [ref=f32e8308]:
                - strong [ref=f32e8309]: set_autopilot
                - text: (
                - strong [ref=f32e8311]: self
                - text: ","
                - generic [ref=f32e8312]:
                  - strong [ref=f32e8313]: enabled
                  - text: =True
                - text: ","
                - generic [ref=f32e8314]:
                  - strong [ref=f32e8315]: port
                  - text: =8000
                - text: ) Registers or deletes the vehicle from a Traffic Manager's list. When
                - strong [ref=f32e8316]: "True"
                - text: ", the Traffic Manager passed as parameter will move the vehicle around. The autopilot takes place client-side."
                - list [ref=f32e8317]:
                  - listitem [ref=f32e8318]:
                    - strong [ref=f32e8319]: "Parameters:"
                    - list [ref=f32e8320]:
                      - listitem [ref=f32e8321]:
                        - code [ref=f32e8322]: enabled
                        - text: (
                        - emphasis [ref=f32e8323]: bool
                        - text: )
                      - listitem [ref=f32e8324]:
                        - code [ref=f32e8325]: port
                        - text: (
                        - emphasis [ref=f32e8326]: uint16
                        - text: ) - The port of the TM-Server where the vehicle is to be registered or unlisted. If
                        - strong [ref=f32e8327]: None
                        - text: is passed, it will consider a TM at default port
                        - code [ref=f32e8328]: "8000"
                        - text: .
              - listitem [ref=f32e8329]:
                - strong [ref=f32e8330]: set_light_state
                - text: (
                - strong [ref=f32e8332]: self
                - text: ","
                - strong [ref=f32e8334]: light_state
                - text: ) Sets the light state of a vehicle using a flag that represents the lights that are on and off.
                - list [ref=f32e8335]:
                  - listitem [ref=f32e8336]:
                    - strong [ref=f32e8337]: "Parameters:"
                    - list [ref=f32e8338]:
                      - listitem [ref=f32e8339]:
                        - code [ref=f32e8340]: light_state
                        - text: (
                        - emphasis [ref=f32e8341]:
                          - link "carla.VehicleLightState" [ref=f32e8342] [cursor=pointer]:
                            - /url: "#carla.VehicleLightState"
                        - text: )
                  - listitem [ref=f32e8343]:
                    - strong [ref=f32e8344]: "Getter:"
                    - emphasis [ref=f32e8345]:
                      - link "carla.Vehicle.get_light_state" [ref=f32e8346] [cursor=pointer]:
                        - /url: "#carla.Vehicle.get_light_state"
              - listitem [ref=f32e8347]:
                - strong [ref=f32e8348]: set_wheel_steer_direction
                - text: (
                - strong [ref=f32e8350]: self
                - text: ","
                - strong [ref=f32e8352]: wheel_location
                - text: ","
                - strong [ref=f32e8354]: angle_in_deg
                - text: )
                - button "snippet →" [ref=f32e8355] [cursor=pointer]
                - text: Sets the angle of a vehicle's wheel visually.
                - list [ref=f32e8356]:
                  - listitem [ref=f32e8357]:
                    - strong [ref=f32e8358]: "Parameters:"
                    - list [ref=f32e8359]:
                      - listitem [ref=f32e8360]:
                        - code [ref=f32e8361]: wheel_location
                        - text: (
                        - emphasis [ref=f32e8362]:
                          - link "carla.VehicleWheelLocation" [ref=f32e8363] [cursor=pointer]:
                            - /url: "#carla.VehicleWheelLocation"
                        - text: )
                      - listitem [ref=f32e8364]:
                        - code [ref=f32e8365]: angle_in_deg
                        - text: (
                        - emphasis [ref=f32e8366]: float
                        - text: )
                  - listitem [ref=f32e8367]:
                    - strong [ref=f32e8368]: "Warning:"
                    - emphasis [ref=f32e8370]: Does not affect the physics of the vehicle.
            - heading "Dunder methods" [level=5] [ref=f32e8371]
            - list [ref=f32e8372]:
              - listitem [ref=f32e8373]:
                - strong [ref=f32e8374]: __str__
                - text: (
                - strong [ref=f32e8376]: self
                - text: )
            - separator [ref=f32e8377]
            - heading "carla.VehicleAckermannControl" [level=2] [ref=f32e8378]
            - paragraph [ref=f32e8379]: Manages the basic movement of a vehicle using Ackermann driving controls.
            - heading "Instance Variables" [level=3] [ref=f32e8380]
            - list [ref=f32e8381]:
              - listitem [ref=f32e8382]:
                - strong [ref=f32e8383]: steer
                - text: (
                - emphasis [ref=f32e8384]: float
                - text: ) Desired steer (rad). Positive value is to the right. Default is 0.0.
              - listitem [ref=f32e8385]:
                - strong [ref=f32e8386]: steer_speed
                - text: (
                - emphasis [ref=f32e8387]: float
                - text: ) Steering velocity (rad/s). Zero steering angle velocity means change the steering angle as quickly as possible. Default is 0.0.
              - listitem [ref=f32e8388]:
                - strong [ref=f32e8389]: speed
                - text: (
                - emphasis [ref=f32e8390]: float
