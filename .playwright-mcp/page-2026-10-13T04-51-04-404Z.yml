                      - listitem [ref=f32e891]:
                        - code [ref=f32e892]: enabled
                        - text: (
                        - emphasis [ref=f32e893]: bool
                        - text: )
              - listitem [ref=f32e894]:
                - strong [ref=f32e895]: set_location
                - text: (
                - strong [ref=f32e897]: self
                - text: ","
                - strong [ref=f32e899]: location
