            - heading "carla.DVSEventArray" [level=2] [ref=f32e2561]
            - paragraph [ref=f32e2562]:
              - text: Class that defines a stream of events in
              - link "carla.DVSEvent" [ref=f32e2563] [cursor=pointer]:
                - /url: "#carla.DVSEvent"
              - text: . Such stream is an array of arbitrary size depending on the number of events. This class also stores the field of view, the height and width of the image and the timestamp from convenience. Learn more about them
              - link "here" [ref=f32e2564] [cursor=pointer]:
                - /url: ../ref_sensors/
              - text: .
            - heading "Instance Variables" [level=3] [ref=f32e2565]
            - list [ref=f32e2566]:
              - listitem [ref=f32e2567]:
                - strong [ref=f32e2568]: fov
                - text: (
                - emphasis [ref=f32e2569]: float - degrees
                - text: ) Horizontal field of view of the image.
              - listitem [ref=f32e2570]:
                - strong [ref=f32e2571]: height
                - text: (
                - emphasis [ref=f32e2572]: int
                - text: ) Image height in pixels.
              - listitem [ref=f32e2573]:
                - strong [ref=f32e2574]: width
                - text: (
                - emphasis [ref=f32e2575]: int
                - text: ) Image width in pixels.
              - listitem [ref=f32e2576]:
                - strong [ref=f32e2577]: raw_data
                - text: (
                - emphasis [ref=f32e2578]: bytes
                - text: )
            - heading "Methods" [level=3] [ref=f32e2579]
            - list [ref=f32e2580]:
              - listitem [ref=f32e2581]:
                - strong [ref=f32e2582]: to_array
                - text: (
                - strong [ref=f32e2584]: self
                - text: ) Converts the stream of events to an array of int values in the following order
                - code [ref=f32e2585]: "[x, y, t, pol]"
                - text: .
              - listitem [ref=f32e2586]:
                - strong [ref=f32e2587]: to_array_pol
                - text: (
                - strong [ref=f32e2589]: self
                - text: ) Returns an array with the polarity of all the events in the stream.
              - listitem [ref=f32e2590]:
                - strong [ref=f32e2591]: to_array_t
                - text: (
                - strong [ref=f32e2593]: self
                - text: ) Returns an array with the timestamp of all the events in the stream.
              - listitem [ref=f32e2594]:
                - strong [ref=f32e2595]: to_array_x
                - text: (
                - strong [ref=f32e2597]: self
                - text: ) Returns an array with X pixel coordinate of all the events in the stream.
              - listitem [ref=f32e2598]:
                - strong [ref=f32e2599]: to_array_y
                - text: (
                - strong [ref=f32e2601]: self
                - text: ) Returns an array with Y pixel coordinate of all the events in the stream.
              - listitem [ref=f32e2602]:
                - strong [ref=f32e2603]: to_image
                - text: (
                - strong [ref=f32e2605]: self
                - text: ") Converts the image following this pattern: blue indicates positive events, red indicates negative events."
