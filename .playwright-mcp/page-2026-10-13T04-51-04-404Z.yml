                - text: )
            - separator [ref=f32e977]
            - heading "carla.ActorAttribute" [level=2] [ref=f32e978]
            - paragraph [ref=f32e979]:
              - text: CARLA provides a library of blueprints for actors that can be accessed as
              - link "carla.BlueprintLibrary" [ref=f32e980] [cursor=pointer]:
                - /url: "#carla.BlueprintLibrary"
              - text: . Each of these blueprints has a series of attributes defined internally. Some of these are modifiable, others are not. A list of recommended values is provided for those that can be set.
            - heading "Instance Variables" [level=3] [ref=f32e981]
            - list [ref=f32e982]:
              - listitem [ref=f32e983]:
                - strong [ref=f32e984]: id
                - text: (
                - emphasis [ref=f32e985]: str
                - text: ) The attribute's name and identifier in the library.
              - listitem [ref=f32e986]:
                - strong [ref=f32e987]: is_modifiable
                - text: (
                - emphasis [ref=f32e988]: bool
                - text: ) It is True if the attribute's value can be modified.
              - listitem [ref=f32e989]:
                - strong [ref=f32e990]: recommended_values
                - text: (
                - emphasis [ref=f32e991]: list(str)
                - text: ) A list of values suggested by those who designed the blueprint.
              - listitem [ref=f32e992]:
                - strong [ref=f32e993]: type
                - text: (
                - emphasis [ref=f32e994]:
                  - link "carla.ActorAttributeType" [ref=f32e995] [cursor=pointer]:
                    - /url: "#carla.ActorAttributeType"
                - text: ) The attribute's parameter type.
            - heading "Methods" [level=3] [ref=f32e996]
            - list [ref=f32e997]:
              - listitem [ref=f32e998]:
                - strong [ref=f32e999]: as_bool
                - text: (
                - strong [ref=f32e1001]: self
                - text: ) Reads the attribute as boolean value.
              - listitem [ref=f32e1002]:
                - strong [ref=f32e1003]: as_color
                - text: (
                - strong [ref=f32e1005]: self
                - text: ) Reads the attribute as
                - link "carla.Color" [ref=f32e1006] [cursor=pointer]:
                  - /url: "#carla.Color"
                - text: .
              - listitem [ref=f32e1007]:
                - strong [ref=f32e1008]: as_float
                - text: (
                - strong [ref=f32e1010]: self
                - text: ) Reads the attribute as float.
              - listitem [ref=f32e1011]:
                - strong [ref=f32e1012]: as_int
                - text: (
                - strong [ref=f32e1014]: self
                - text: ) Reads the attribute as int.
              - listitem [ref=f32e1015]:
                - strong [ref=f32e1016]: as_str
                - text: (
                - strong [ref=f32e1018]: self
                - text: ) Reads the attribute as string.
            - heading "Dunder methods" [level=5] [ref=f32e1019]
            - list [ref=f32e1020]:
              - listitem [ref=f32e1021]:
                - strong [ref=f32e1022]: __bool__
                - text: (
                - strong [ref=f32e1024]: self
                - text: )
              - listitem [ref=f32e1025]:
                - strong [ref=f32e1026]: __eq__
                - text: (
                - strong [ref=f32e1028]: self
                - text: ","
                - generic [ref=f32e1029]:
                  - strong [ref=f32e1030]: other
                  - text: =bool / int / float / str /
                  - link "carla.Color" [ref=f32e1031] [cursor=pointer]:
                    - /url: "#carla.Color"
                  - text: /
                  - link "carla.ActorAttribute" [ref=f32e1032] [cursor=pointer]:
                    - /url: "#carla.ActorAttribute"
                - text: ) Returns true if this actor's attribute and
