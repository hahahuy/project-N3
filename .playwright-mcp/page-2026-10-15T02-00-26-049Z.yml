        - generic [ref=f28e266]:
          - heading "Debug with Linux and VSCode" [level=3] [ref=f28e267]
          - paragraph [ref=f28e269]: Here follows a brief step-by-step guide for building, running and debugging esmini with Visual Studio Code on Linux (tested on Ubuntu).
          - paragraph [ref=f28e271]:
            - text: "Prerequisites: Visual Studio Code (VSCode) and the"
            - code [ref=f28e272]: CMake Tools
            - text: extension.
          - generic [ref=f28e273]:
            - heading "Build and install all targets" [level=4] [ref=f28e274]
            - paragraph [ref=f28e276]: "Note: Install means just copy binaries to local esmini bin folder, not install system wide. Root rights not needed."
            - paragraph [ref=f28e278]: Before building esmini the configuration needs to be established, e.g. what build framework to use and what variant (debug/release) to build.
            - list [ref=f28e280]:
              - listitem [ref=f28e281]:
                - paragraph [ref=f28e282]:
                  - text: "From esmini root folder:"
                  - code [ref=f28e283]: code .
              - listitem [ref=f28e284]:
                - paragraph [ref=f28e285]:
                  - text: Select a "Kit". Usually by Open the Command Palette (Ctrl+Shift+P) and write
                  - code [ref=f28e286]: "CMake: Select a Kit"
                  - text: . Select the compiler you want to use. For example GCC 11.3.0. Generator will be selected automatically, typically
                  - code [ref=f28e287]: Ninja
                  - text: ", if installed, over"
                  - code [ref=f28e288]: Make
                  - text: .
              - listitem [ref=f28e289]:
                - paragraph [ref=f28e290]:
                  - text: Ctrl+Shift+P →
                  - code [ref=f28e291]: "CMake: Select Variant"
                  - text: command. Select
                  - code [ref=f28e292]: Release
              - listitem [ref=f28e293]:
                - paragraph [ref=f28e294]:
                  - text: Ctrl+Shift+P →
                  - code [ref=f28e295]: "CMake: Set Build Target"
                  - text: . Select
                  - code [ref=f28e296]: install
              - listitem [ref=f28e297]:
                - paragraph [ref=f28e298]: Click the Build button from the Status bar*
            - paragraph [ref=f28e300]:
              - text: "* If not all cmake commands are visible in status bar, check global settings: Ctrl + \",\" then write \"cmake status bar\" to find"
              - code [ref=f28e301]: Status Bar Visibility
              - text: setting. Set to
              - code [ref=f28e302]: visible
              - text: .
          - generic [ref=f28e303]:
            - heading "Build and Debug specific target" [level=4] [ref=f28e304]
            - paragraph [ref=f28e306]: "First we need to prepare a launch configuration:"
            - list [ref=f28e308]:
              - listitem [ref=f28e309]:
                - paragraph [ref=f28e310]:
                  - text: In esmini root folder, create a subfolder named
                  - code [ref=f28e311]: .vscode
              - listitem [ref=f28e312]:
                - paragraph [ref=f28e313]:
                  - text: In
                  - code [ref=f28e314]: .vscode
                  - text: folder, create a file named
                  - code [ref=f28e315]: settings.json
                  - text: ", and add the following:"
            - code [ref=f28e319]: "{ \"cmake.debugConfig\": { \"args\": [\"${workspaceFolder}/resources/xosc/cut-in.xosc\", \"--config_file_path\", \"${workspaceFolder}/config.yml\"] } }"
            - paragraph [ref=f28e321]:
              - text: The above arguments assumes esmini being the debug target. It can easily be modified for another target, e.g.
              - code [ref=f28e322]: odrviewer
              - text: or
              - code [ref=f28e323]: replayer
              - text: . Just change the arguments accordingly. Further, by refering to
              - code [ref=f28e324]: config.yml
              - text: you can easily change options and arguments in there.
            - paragraph [ref=f28e326]: "Now we can select and debug target:"
            - list [ref=f28e328]:
              - listitem [ref=f28e329]:
                - paragraph [ref=f28e330]:
                  - text: Ctrl+Shift+P →
                  - code [ref=f28e331]: "CMake: Select Variant"
                  - text: command. Select
