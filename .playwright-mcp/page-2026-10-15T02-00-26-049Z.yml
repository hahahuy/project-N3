    - generic [ref=f28e38]:
      - heading "Build guide" [level=2] [ref=f28e39]
      - generic [ref=f28e40]:
        - paragraph [ref=f28e42]: "esmini is primarily utilizing cmake for build configuration. The simplest way to get going, in a terminal from esmini root folder:"
        - generic [ref=f28e43]: git clone https://github.com/esmini/esmini cd esmini mkdir build cd build cmake .. cmake --build . --config Release --target install
        - paragraph [ref=f28e47]: This will first fetch the esmini code from github, then configure and then build the complete esmini tool suite. And it should work on any supported platform (Win, Mac, Ubuntu).
        - paragraph [ref=f28e49]: "You can specify further details, like compiler version. For example: On windows to select MSVC 2017 toolset, indpendent of Visual Studio IDE version, just add directive to the generator as follows:"
        - paragraph [ref=f28e51]:
          - code [ref=f28e52]: cmake .. -G "Visual Studio 16 2019" -T v141
        - paragraph [ref=f28e54]:
          - text: A complete list of supported toolsets are available
          - link "here" [ref=f28e55] [cursor=pointer]:
            - /url: https://cmake.org/cmake/help/v3.17/variable/MSVC_TOOLSET_VERSION.html
          - text: .
        - paragraph [ref=f28e57]:
          - text: Provided 3rd party lib binaries are only provided for Windows x64 architecture. To make sure you build for x64 add
          - code [ref=f28e58]: "-A x64"
          - text: ", For example:"
        - paragraph [ref=f28e60]:
          - code [ref=f28e61]: cmake .. -G "Visual Studio 17 2022" -T v142 -A x64
        - paragraph [ref=f28e63]: To build esmini for MSVC 2019 with Visual Studio 2022.
        - generic [ref=f28e65]:
          - paragraph [ref=f28e67]:
            - strong [ref=f28e68]: "Note:"
          - paragraph [ref=f28e70]: Provided 3rd party libs only available for x64 builds. If you need to build full esmini for Win32 (32bit), you need to compile the 3rd party libraries yourself. Perhaps the "scripts/generate_*_libs.sh" scripts can be a starting point for such an endeavor.
          - paragraph [ref=f28e72]:
            - text: Another possibility for Win32 is to build a slim esmini with a minimum of dependencies. See
            - link "Slim esmini - customize configration" [ref=f28e73] [cursor=pointer]:
              - /url: "#_slim_esmini_customize_configration"
            - text: .
        - paragraph [ref=f28e75]:
          - text: Of course, building with a specific toolset requires it to be installed. Use
          - link "Visual Studio Installer" [ref=f28e76] [cursor=pointer]:
            - /url: https://docs.microsoft.com/en-us/visualstudio/install/install-visual-studio?view=vs-2019
          - text: ". Steps:"
        - list [ref=f28e78]:
          - listitem [ref=f28e79]:
            - paragraph [ref=f28e80]: choose "Modify"
          - listitem [ref=f28e81]:
            - paragraph [ref=f28e82]: make sure Desktop Development with C++ is checked
          - listitem [ref=f28e83]:
            - paragraph [ref=f28e84]: go to tab "Individual components"
          - listitem [ref=f28e85]:
            - paragraph [ref=f28e86]: scroll down to "Compilers, build tools, and runtimes"
          - listitem [ref=f28e87]:
            - paragraph [ref=f28e88]: check the MSVC versions you need, e.g. "MSVC v140 - VS 2015 C++ build tools (v14.00)" and "MSVC v141 - VS 2017 C++ x64/x86 build tools (v14.16)"
        - paragraph [ref=f28e90]: All configurations defines an "Install" build target that compiles (if needed) and copies relevant binaries into a common "esmini/bin" folder recognized by the example scripts under the "esmini/run" folder.
        - paragraph [ref=f28e92]:
          - strong [ref=f28e93]: "Note:"
        - list [ref=f28e95]:
          - listitem [ref=f28e96]:
            - paragraph [ref=f28e97]: For automatic downloading of external dependencies (OSG binaries) and 3D models, CMake version 3.11.4 or above is required (FetchContent_MakeAvailable was introduced).
          - listitem [ref=f28e98]:
            - paragraph [ref=f28e99]: In Windows, if you get an error like "the c compiler identification is unknown", then please make sure to install "Windows Universal CRT SDK" from the Visual Studio Installer tool.
        - generic [ref=f28e100]:
          - heading "External dependencies" [level=3] [ref=f28e101]
          - paragraph [ref=f28e103]: esmini is designed to link all dependencies statically. Main reason is to have a all-inclusive library for easy integration either as a shared library/DLL (e.g. plugin in Unity, or S-function in Simulink) or statically linked into a native application.
          - paragraph [ref=f28e105]:
            - strong [ref=f28e106]: "Note:"
            - text: Nothing stops you from going with all dynamic linking, it’s just that provided build scripts are not prepared for it.
          - paragraph [ref=f28e108]: Building the dependencies from scratch would, in some cases, be both complicated and time consuming. Instead they are, by default, provided in compressed packages including needed headerfiles and prebuilt libraries. The packages are available for Win, Mac and Linux. For Windows and Linux they include Debug mode binaries, in addition to the Release variant. CMake scripts will download several pre-compiled 3rd party packages and 3D model resource files.
          - paragraph [ref=f28e110]:
            - text: Default location for some of these resources is Google drive, and others Github as released packages. If there is an issue with Google drive packages, try switch to the backup location at Dropbox by changing the following line in
            - link "EnvironmentSimulator/CMakeLists.txt" [ref=f28e111] [cursor=pointer]:
              - /url: https://github.com/esmini/esmini/blob/master/EnvironmentSimulator/CMakeLists.txt
            - text: ":"
          - paragraph [ref=f28e113]:
            - code [ref=f28e114]: set ( FILE_STORAGE "google" )
            - text: to
            - code [ref=f28e115]: set ( FILE_STORAGE "dropbox" )
          - paragraph [ref=f28e117]:
            - text: Links to all packages can be found in
            - link "EnvironmentSimulator/CMakeLists.txt" [ref=f28e118] [cursor=pointer]:
              - /url: https://github.com/esmini/esmini/blob/master/EnvironmentSimulator/CMakeLists.txt
            - text: .
          - paragraph [ref=f28e120]: "If you need to (re)build a 3rd party lib for some reason, e.g. for an yet unsupported system or need for a specific version, these build scripts might be a starting point:"
          - list [ref=f28e122]:
            - listitem [ref=f28e123]:
              - paragraph [ref=f28e124]:
                - link "esmini/scripts/generate_osg_libs.sh" [ref=f28e125] [cursor=pointer]:
                  - /url: https://github.com/esmini/esmini/blob/master/scripts/generate_osg_libs.sh
            - listitem [ref=f28e126]:
              - paragraph [ref=f28e127]:
                - link "esmini/scripts/generate_sumo_libs.sh" [ref=f28e128] [cursor=pointer]:
                  - /url: https://github.com/esmini/esmini/blob/master/scripts/generate_sumo_libs.sh
            - listitem [ref=f28e129]:
              - paragraph [ref=f28e130]:
                - link "esmini-dependencies/osi/generate_osi_3_5_libs.sh" [ref=f28e131] [cursor=pointer]:
                  - /url: https://github.com/esmini/esmini-dependencies/blob/main/osi/generate_osi_3_5_libs.sh
            - listitem [ref=f28e132]:
              - paragraph [ref=f28e133]:
                - link "esmini-dependencies/osi/generate_osi_3_8_libs.sh" [ref=f28e134] [cursor=pointer]:
                  - /url: https://github.com/esmini/esmini-dependencies/blob/main/osi/generate_osi_3_8_libs.sh
          - paragraph [ref=f28e136]:
            - text: or this script that builds all
            - code [ref=f28e137]: sumo
            - text: and
            - code [ref=f28e138]: osg
            - text: "libs, combining a selection of the above ones:"
          - paragraph [ref=f28e140]:
            - link "scripts/generate_sumo_osg_libs.sh" [ref=f28e141] [cursor=pointer]:
              - /url: https://github.com/esmini/esmini/blob/master/scripts/generate_osi_sumo_osg_libs.sh
          - generic [ref=f28e142]:
            - heading "External dependency details" [level=4] [ref=f28e143]
            - paragraph [ref=f28e145]: The provided 3rd party packages includes needed headerfiles and prebuilt libraries. The packages are available for Win, Mac and Linux. For Windows and Linux they include Debug mode binaries, in addition to the Release variant.
            - paragraph [ref=f28e147]:
              - text: The cmake script checks for the availability of these libraries by looking for the expected folders under
              - code [ref=f28e148]: externals
              - text: . From esmini v3.1.1, some packages (
              - code [ref=f28e149]: osi
              - text: and
              - code [ref=f28e150]: implot
              - text: ) are built, released and version controlled via tags on
              - link "github" [ref=f28e151] [cursor=pointer]:
                - /url: https://github.com/esmini/esmini-dependencies
              - text: ", so the library handling is slightly different depending on the package."
            - paragraph [ref=f28e153]:
              - text: For example,
              - code [ref=f28e154]: osg
              - text: and
              - code [ref=f28e155]: sumo
              - text: are checked through their corresponding folder names, while for
              - code [ref=f28e156]: osi
              - text: and
              - code [ref=f28e157]: implot
              - text: ", cmake maps the selected version (specified via"
              - code [ref=f28e158]: "-D OSI_VERSION"
              - text: and
              - code [ref=f28e159]: "-D IMPLOT_VERSION"
              - text: ) to a release tag and looks for the matching package locally under
              - code [ref=f28e160]: externals/osi
              - text: and
              - code [ref=f28e161]: externals/implot
              - text: .
            - paragraph [ref=f28e163]: If a required package is missing, cmake automatically downloads and extracts it alongside any other packages in that folder.
            - paragraph [ref=f28e165]:
              - text: When one of these prebuilt libraries needs to be updated, it is typically enough to remove the corresponding package folder and run cmake again. For
              - code [ref=f28e166]: osi
              - text: and
              - code [ref=f28e167]: implot
              - text: ", the update should happen automatically. The simplest way to enforce re-download of all downloadable packages is:"
            - paragraph [ref=f28e169]:
              - code [ref=f28e170]: cmake .. -D FORCE_DOWNLOAD_BINARIES=TRUE
            - paragraph [ref=f28e172]: The FORCE_DOWNLOAD_BINARIES flag will be checked by the cmake script for enforced download of all packages. Upon successful download, the libraries will be replaced, one by one.
            - paragraph [ref=f28e174]: Library updates are not detected by the esmini build dependencies, why a clean rebuild of esmini should be performed manually afterwards.
            - paragraph [ref=f28e176]: "A few additional notes:"
            - list [ref=f28e178]:
              - listitem [ref=f28e179]:
                - paragraph [ref=f28e180]: Although dependent libraries are provided, nothing stops you from building them yourself, e.g. for an unsupported system or need for a specific version or customized build.
              - listitem [ref=f28e181]:
                - paragraph [ref=f28e182]:
                  - text: The dependencies are built using as old compiler and toolset as possible to maximize compatibility with systems. Baseline is oldest
                  - link "image" [ref=f28e183] [cursor=pointer]:
                    - /url: https://github.com/actions/runner-images
                  - text: supported by GitHub actions. The assumption being that a binary built on an older generation will run on a newer generation of a platform, but not vice versa. E.g. a binary built with on ubuntu 22.04 (e.g. with g++ v9) will run fine on Ubuntu 24.04.
