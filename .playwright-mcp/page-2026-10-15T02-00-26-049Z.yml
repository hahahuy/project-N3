        - generic [ref=f28e343]:
          - heading "Dynamic protobuf linking" [level=3] [ref=f28e344]
          - paragraph [ref=f28e346]: "When linking esmini with software already dependent on Google protobuf there might be need for dynamic linking of shared protobuf library. This can be achieved by defining cmake symbol DYN_PROTOBUF as following example:"
          - paragraph [ref=f28e348]:
            - code [ref=f28e349]: cmake .. -D DYN_PROTOBUF=True
          - paragraph [ref=f28e351]: Then build as usual. It will link with protobuf shared library instead of linking with a static library.
          - paragraph [ref=f28e353]: "When running esmini, the protobuf shared library needs to be found. Set dynamic library path environment variable to the folder where the library is. Example:"
          - paragraph [ref=f28e355]:
            - text: "Linux:"
            - code [ref=f28e356]: export LD_LIBRARY_PATH=./externals/osi/v3.5.0_2/linux/lib-dyn
          - paragraph [ref=f28e358]:
            - text: "macOS:"
            - code [ref=f28e359]: export DYLD_LIBRARY_PATH=./externals/osi/v3.5.0_2/linux/lib-dyn
          - paragraph [ref=f28e361]:
            - strong [ref=f28e362]: "Note:"
            - text: In above example,
            - code [ref=f28e363]: v3.5.0_2
            - text: reflects a tag that might change, use the one available in your system by checking the supported tags for your release in
            - code [ref=f28e364]: ./support/cmake/common/version_mapping.cmake
            - text: .
        - generic [ref=f28e365]:
          - heading "Slim esmini - customize configration" [level=3] [ref=f28e366]
          - paragraph [ref=f28e368]: "The external dependencies OSG, OSI, SUMO, implot and PROJ are optional. Also the unit test suite is optional, in effect making the dependecy to googletest framework optional as well. All these options are simply controlled by the following cmake options:"
          - list [ref=f28e370]:
            - listitem [ref=f28e371]:
              - paragraph [ref=f28e372]: USE_OSG
            - listitem [ref=f28e373]:
              - paragraph [ref=f28e374]: USE_OSI
            - listitem [ref=f28e375]:
              - paragraph [ref=f28e376]: USE_SUMO
            - listitem [ref=f28e377]:
              - paragraph [ref=f28e378]: USE_GTEST
            - listitem [ref=f28e379]:
              - paragraph [ref=f28e380]: USE_IMPLOT
            - listitem [ref=f28e381]:
              - paragraph [ref=f28e382]: USE_PROJ
          - paragraph [ref=f28e384]:
            - text: "So, for example, to cut dependency to OSG and SUMO, run:"
            - code [ref=f28e385]: cmake .. -D USE_OSG=False -D USE_SUMO=False
          - paragraph [ref=f28e387]:
            - text: "To disable all run:"
            - code [ref=f28e388]: cmake .. -D USE_OSG=False -D USE_SUMO=False -D USE_OSI=False -D USE_GTEST=False -D USE_IMPLOT=False -D USE_PROJ=False
          - paragraph [ref=f28e390]: All options are enabled/True as default.
          - paragraph [ref=f28e392]:
            - strong [ref=f28e393]: "Note:"
            - text: Disabling an external dependency will disable corresponding functionality. So, for example, disabling OSI means that no OSI data can be created by esmini. Disabling OSG means that esmini can’t visualize the scenario. However it can still run the scenario and create a .dat file, which can be played and visualized later in another esmini build in which OSG is enabled (even on another platform).
        - generic [ref=f28e394]:
          - heading "MSYS2 / MinGW-w64 support" [level=3] [ref=f28e395]
          - paragraph [ref=f28e397]: "esmini slim can be compiled and executed in the MSYS2 environment. Try following steps:"
          - list [ref=f28e399]:
            - listitem [ref=f28e400]:
              - paragraph [ref=f28e401]:
                - text: "Download MSYS2 from:"
                - link "https://www.msys2.org" [ref=f28e402] [cursor=pointer]:
                  - /url: https://www.msys2.org
            - listitem [ref=f28e403]:
              - paragraph [ref=f28e404]: Install with default options
            - listitem [ref=f28e405]:
              - paragraph [ref=f28e406]: Start MSYS2 MinGW x64 (e.g. from start menu)
            - listitem [ref=f28e407]:
              - paragraph [ref=f28e408]:
                - text: "Update MSYS2 packages, run:"
                - code [ref=f28e409]: pacman -Syu --disable-download-timeout --noconfirm
                - text: (MSYS2 should close automatically)
            - listitem [ref=f28e410]:
              - paragraph [ref=f28e411]: Restart MSYS2
            - listitem [ref=f28e412]:
              - paragraph [ref=f28e413]: "Finalize update and install needed packages, run:"
          - code [ref=f28e417]: pacman -Su --disable-download-timeout --noconfirm pacman -S --needed base-devel mingw-w64-x86_64-toolchain --disable-download-timeout --noconfirm pacman -S mingw-w64-x86_64-cmake --disable-download-timeout --noconfirm
          - list [ref=f28e419]:
            - listitem [ref=f28e420]:
              - paragraph [ref=f28e421]:
                - text: "Optional (not needed to compile or run esmini):"
                - code [ref=f28e422]: pacman -S git --disable-download-timeout --noconfirm
            - listitem [ref=f28e423]:
              - paragraph [ref=f28e424]: "Build esmini (from MSYS2 MinGW x64 command line):"
          - code [ref=f28e428]: cmake -G "MSYS Makefiles" -D USE_OSG=False -D USE_SUMO=False -D USE_OSI=False -D USE_GTEST=False .. cmake --build . --config Release --target install
        - generic [ref=f28e429]:
          - heading "Build esmini project" [level=3] [ref=f28e430]
          - paragraph [ref=f28e432]: First generate build configuration (see above)
          - paragraph [ref=f28e434]:
            - text: "Then it should work on all platform to build using cmake as follows:"
            - code [ref=f28e435]: cmake --build . --config Release --target install
          - paragraph [ref=f28e437]: "Or you can go with platform specific ways of building:"
          - paragraph [ref=f28e439]:
            - strong [ref=f28e440]: Windows/Visual Studio
          - list [ref=f28e442]:
            - listitem [ref=f28e443]:
              - paragraph [ref=f28e444]: Open generated solution, build*/EnvironmentSimulator.sln
            - listitem [ref=f28e445]:
              - paragraph [ref=f28e446]: Select configuration, Debug or Release
            - listitem [ref=f28e447]:
              - paragraph [ref=f28e448]: Build CMakePredefinedTargets/INSTALL (right-click and select build)
          - paragraph [ref=f28e450]:
            - strong [ref=f28e451]: macOS
          - paragraph [ref=f28e453]:
            - text: "To generate a Xcode project file, run the initial cmake command as follows:"
            - code [ref=f28e454]: cmake -G Xcode ..
          - paragraph [ref=f28e456]:
            - text: "Then build as usual:"
            - code [ref=f28e457]: cmake --build . --config Release --target install
          - paragraph [ref=f28e459]:
            - text: "or using Xcode directly:"
            - code [ref=f28e460]: xcodebuild -scheme install -configuration Release build
          - paragraph [ref=f28e462]: or open the generated project file in Xcode, and build from there.
          - paragraph [ref=f28e464]: "To create bundles (shared library container), do from esmini root folder:"
          - code [ref=f28e468]: lipo -create bin/libesminiRMLib.dylib -output bin/esminiRMLib.bundle lipo -create bin/libesminiLib.dylib -output bin/esminiLib.bundle
          - paragraph [ref=f28e470]:
            - strong [ref=f28e471]: Linux
          - paragraph [ref=f28e473]:
            - text: Once
            - code [ref=f28e474]: cmake ..
            - text: has created the build configuration, of course you can build by calling the gnu
            - code [ref=f28e475]: make
            - text: applciation directly instead of going via
            - code [ref=f28e476]: cmake --build
            - text: as described above.
          - code [ref=f28e480]: cd build make -j4 install
          - paragraph [ref=f28e482]: This will build all projects, in four parallel jobs, and copy the binaries into a dedicated folder found by the demo batch scripts.
        - generic [ref=f28e483]:
          - heading "CentOS 7 (Linux)" [level=3] [ref=f28e484]
          - paragraph [ref=f28e486]: CentOS 7 has some limitations, e.g. old versions of C/C++ compiler toolkits and runtimes. So it’s not possible to link with provided 3rd party binary libraries targeting Ubuntu 18++. However, by disabling some featuers in esmini, e.g. OSI and SUMO, it can still be used for previewing scenarios.
          - paragraph [ref=f28e488]:
            - text: "VirtualBox image for Windows host here:"
            - link "https://www.linuxvmimages.com/images/centos-7/" [ref=f28e489] [cursor=pointer]:
              - /url: https://www.linuxvmimages.com/images/centos-7/
          - paragraph [ref=f28e491]: Follow steps below to build and run esmini on CentOS 7.
          - code [ref=f28e495]: sudo yum install git sudo yum install cmake sudo yum install gcc-c++ sudo yum install freeglut-devel sudo yum install fontconfig-devel sudo yum install libXrandr-devel sudo yum install libXinerama-devel sudo yum install epel-release sudo yum install p7zip git clone https://github.com/esmini/esmini cd esmini cd externals mkdir OpenSceneGraph cd OpenSceneGraph curl -L "https://www.dropbox.com/s/mxztf6zbgojyntp/osg_centos.7z?dl=1" -o osg_centos.7z 7za x osg_centos.7z rm osg_centos.7z cd ../.. mkdir build cd build cmake -D USE_OSG=True -D USE_SUMO=False -D USE_OSI=False -D USE_GTEST=False .. cmake --build . --target install --config Release cd .. ./bin/esmini.exe --headless --fixed_timestep 0.01 --record sim.dat --osc ./resources/xosc/cut-in.xosc
