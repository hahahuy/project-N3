                  - text: Ctrl+Shift+P →
                  - code [ref=f28e335]: "CMake: Set Launch/Debug Target `. Select `esmini"
                  - text: (or another target of choice)
              - listitem [ref=f28e336]:
                - paragraph [ref=f28e337]: Click the Debug (bug) button from the Status bar
            - paragraph [ref=f28e339]: "Run without debug (e.g. skipping breakpoints): Click the Play button from the Status bar"
