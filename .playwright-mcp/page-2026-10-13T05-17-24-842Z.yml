      - generic [ref=f52e108]:
        - generic [ref=f52e109]:
          - heading "ASAM OpenDRIVE®" [level=2] [ref=f52e110]
          - text: • • • • • • •
          - generic [ref=f52e113]:
            - paragraph [ref=f52e114]:
              - strong [ref=f52e115]:
                - emphasis [ref=f52e116]: (The download of the standard ASAM OpenDRIVE is free of charge)
            - paragraph [ref=f52e117]: The ASAM OpenDRIVE format provides a common base for describing road networks with extensible markup language (XML) syntax, using the file extension xodr. The data that is stored in an ASAM OpenDRIVE file describes the geometry of roads, lanes and objects, such as roadmarks on the road, as well as features along the roads, like signals. The road networks that are described in the ASAM OpenDRIVE file can either be synthetic or based on real data.
            - paragraph [ref=f52e118]: The main purpose of ASAM OpenDRIVE is to provide a road network description that can be fed into simulations to develop and validate ADAS and AD features. With the help of ASAM OpenDRIVE, these road network descriptions can be exchanged between different simulators. Providing a standardized format for road descriptions also enables the industry to reduce the cost of creating and converting these files for their development and testing purposes. Road data may be manually created from road network editors, conversion of map data, or originate from converted scans of real-world roads.
            - heading "Nodes" [level=3] [ref=f52e119]
            - paragraph [ref=f52e120]: The format is organized in nodes that can be extended with user defined data. This facilitates a high degree of specialization for individual applications (usually simulations) while maintaining the interoperability that is required for the exchange of data between different applications.
            - heading "Reference Line" [level=3] [ref=f52e121]
            - paragraph [ref=f52e122]: The ASAM OpenDRIVE road network is modelled along the reference line, which is the core piece of every road. Roads, lanes, incl. their elevation profiles are all attached to the reference line.
          - generic [ref=f52e124]:
            - figure "Elements of ASAM OpenDRIVE" [ref=f52e125]:
              - link:
                - /url: https://www.asam.net/index.php?eID=tx_cms_showpic&file=4137&md5=fa301027c82e80ef49a2bb3869c6458a964a9aec&parameters%5B0%5D=eyJ3aWR0aCI6IjgwMG0iLCJoZWlnaHQiOiI2MDBtIiwiYm9keVRhZyI6Ijxib2R5&parameters%5B1%5D=IHN0eWxlPVwibWFyZ2luOjA7IGJhY2tncm91bmQ6I2ZmZjtcIj4iLCJ3cmFwIjoi&parameters%5B2%5D=PGEgaHJlZj1cImphdmFzY3JpcHQ6Y2xvc2UoKTtcIj4gfCA8XC9hPiIsImNyb3Ai&parameters%5B3%5D=OiJ7XCJkZWZhdWx0XCI6e1wiY3JvcEFyZWFcIjp7XCJ4XCI6MCxcInlcIjowLFwi&parameters%5B4%5D=d2lkdGhcIjoxLFwiaGVpZ2h0XCI6MX0sXCJzZWxlY3RlZFJhdGlvXCI6XCJOYU5c&parameters%5B5%5D=IixcImZvY3VzQXJlYVwiOm51bGx9fSJ9
            - generic [ref=f52e127]:
              - paragraph [ref=f52e128]: Objects representing features, such as signals, can be placed by using either the reference line or the global coordinate system, the road network is placed in. This can be seen in the above image. The reference line (blue line in the middle) is in the center of the road, the lanes (blue and light green) are attached to this reference line. The signs next to the road are placed in the s/t-coordinate system.
              - paragraph [ref=f52e129]: In ASAM OpenDRIVE several roads form a road network and can be connected. ASAM OpenDRIVE can be seen as a construction kit of different road sections. The overall road network is composed of individual sections interconnected with each other.
          - generic [ref=f52e131]:
            - figure "Individual road segments are interconnected." [ref=f52e132]
            - paragraph [ref=f52e135]: The image on the right shows how individual road segments interconnect e.g. with a junction. The shown XML snippet gives a short overview on how the linking of road segments can be used in ASAM OpenDRIVE. These links can support the driving logic of simulated traffic, especially for routing purposes, leaving more resources for the actual work of validating and developing AD driving features. In junctions, each possible connection between entry roads is connected via “connecting-roads”. Due to this mechanism connecting roads are the only roads within ASAM OpenDRIVE with overlapping surfaces.
          - generic [ref=f52e137]:
            - figure "Example of a junction" [ref=f52e138]
            - paragraph [ref=f52e141]: In ASAM OpenDRIVE not only roads are linked but also the lanes between roads. These lane links can again support simulated traffic. They are also important for the visualization of the road network when the reference line of connecting roads and roads that enter the junction are not necessarily aligned (this is the case e.g. in junctions).
          - generic [ref=f52e144]:
            - heading "Relation to Other Standards" [level=3] [ref=f52e145]
            - paragraph [ref=f52e146]: The ASAM OpenDRIVE description format contains all static objects of a road network that allow realistic simulation of vehicles driving on roads. In order to render the complete environment, additional description formats for static 3D roadside objects, such as trees and buildings, are needed. Road surface profiles are included from the ASAM OpenCRG file format. The dynamic content of driving simulations, such as vehicle maneuvers, can be described with ASAM OpenSCENARIO. The three standards complement each other and cover the static and dynamic content of in-the-loop vehicle simulation applications.
            - heading "Market Relevance" [level=3] [ref=f52e147]
            - paragraph [ref=f52e148]: ASAM OpenDRIVE is a well established standard for the description of road networks. It is already in use by many well-known manufacturers and companies developing ADAS and AD functions or performing high-accuracy kinematic surveying worldwide. It is being used for road and rail networks.
          - generic [ref=f52e149]:
            - heading "ASAM OpenX further development" [level=3] [ref=f52e151]
            - generic [ref=f52e153]:
              - paragraph [ref=f52e154]: ASAM OpenDRIVE is part of the ASAM OpenX suite of standards. The ASAM OpenX standards are currently in maintenance mode. We are constantly collecting change requests. Participation in the further development of the ASAM OpenX standards is possible at all times!
              - paragraph [ref=f52e155]
