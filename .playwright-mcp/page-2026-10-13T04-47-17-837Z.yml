              - article [ref=f12e398]:
                - paragraph [ref=f12e399]: The main goal of the CARLA Autonomous Driving Leaderboard is to evaluate the driving proficiency of autonomous agents in realistic traffic situations. The leaderboard serves as an open platform for the community to perform fair and reproducible evaluations, simplifying the comparison between different approaches.
                - paragraph [ref=f12e400]: Autonomous agents have to drive through a set of predefined routes. For each route, agents are initialized at a starting point and have to drive to a destination point. The agents will be provided with a description of the route. Routes will happen in a variety of areas, including freeways, urban scenes, and residential districts.
                - paragraph [ref=f12e401]: "Agents will face multiple traffic situations based in the NHTSA typology, such as:"
                - list [ref=f12e402]:
                  - listitem [ref=f12e403]: Lane merging
                  - listitem [ref=f12e404]: Lane changing
                  - listitem [ref=f12e405]: Negotiations at traffic intersections
                  - listitem [ref=f12e406]: Negotiations at roundabouts
                  - listitem [ref=f12e407]: Handling traffic lights and traffic signs
                  - listitem [ref=f12e408]: Coping with pedestrians, cyclists and other elements
                - paragraph [ref=f12e409]: The user can change the weather of the simulation, allowing the evaluation of the agent in a variety of weather conditions, including daylight scenes, sunset, rain, fog, and night, among others.
                - paragraph [ref=f12e410]:
                  - text: More information can be found
                  - link "here" [ref=f12e411] [cursor=pointer]:
                    - /url: https://leaderboard.carla.org/
