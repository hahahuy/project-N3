                    - heading "Building CARLA with Unreal Engine 5.5" [level=2] [ref=f27e912]
                    - 'link "Permalink: Building CARLA with Unreal Engine 5.5" [ref=f27e913] [cursor=pointer]':
                      - /url: "#building-carla-with-unreal-engine-55"
                  - separator [ref=f27e916]
                  - paragraph [ref=f27e917]:
                    - text: Clone this repository locally from GitHub, specifying the
                    - emphasis [ref=f27e918]: ue5-dev
                    - text: "branch:"
                  - generic [ref=f27e919]:
                    - generic [ref=f27e920]: git clone -b ue5-dev https://github.com/carla-simulator/carla.git CarlaUE5
                    - button "Copy code to clipboard" [ref=f27e922] [cursor=pointer]
                  - paragraph [ref=f27e926]:
                    - text: In order to build CARLA, you need access to the CARLA fork of Unreal Engine 5.5. In order to access this repository, you must first link your GitHub account to Epic Games by following
                    - link "this guide" [ref=f27e927] [cursor=pointer]:
                      - /url: https://www.unrealengine.com/en-US/ue-on-github
                    - text: . You then also need to use your git credentials to authorise the download of the Unreal Engine 5.5 repository.
                  - paragraph [ref=f27e928]:
                    - strong [ref=f27e929]: Building in Linux
                    - text: ":"
                  - paragraph [ref=f27e930]: "Run the setup script from a terminal open in the CARLA root directory:"
                  - generic [ref=f27e931]:
                    - generic [ref=f27e932]: cd CarlaUE5 ./CarlaSetup.sh --interactive
                    - button "Copy code to clipboard" [ref=f27e934] [cursor=pointer]
                  - paragraph [ref=f27e938]: The setup script will prompt you for your sudo password, in order to install the prerequisites. It will then prompt you for your GitHub credentials in order to authorise the download of the Unreal Engine repository.
                  - paragraph [ref=f27e939]:
                    - text: The setup script will install by default Python 3 using apt. If you want to target an existing Python installation, you should use the
                    - code [ref=f27e940]: "--python-root=PATH_TO_PYTHON"
                    - text: argument with the relevant Python installation path. You can use whereis python3 in your chosen environment and strip the
                    - code [ref=f27e941]: /python3
                    - text: suffix from the path.
                  - paragraph [ref=f27e942]:
                    - strong [ref=f27e943]: Building in Linux unattended
                    - text: ":"
                  - paragraph [ref=f27e944]:
                    - text: If you want to run the setup script unattended, your git credentials need to be stored in an environment variable. Add your github credentials to your
                    - code [ref=f27e945]: .bashrc
                    - text: "file:"
                  - generic [ref=f27e946]:
                    - generic [ref=f27e947]: export GIT_LOCAL_CREDENTIALS=username@github_token
                    - button "Copy code to clipboard" [ref=f27e949] [cursor=pointer]
                  - paragraph [ref=f27e953]: "Then run the setup script using the following command:"
                  - generic [ref=f27e954]:
                    - generic [ref=f27e955]: cd CarlaUE5 sudo -E ./CarlaSetup.sh
                    - button "Copy code to clipboard" [ref=f27e957] [cursor=pointer]
                  - paragraph [ref=f27e961]: This will download and install Unreal Engine 5.5, install the prerequisites and build CARLA. It may take some time to complete and use a significant amount of disk space.
                  - paragraph [ref=f27e962]: "If you prefer to add the git credentials in the terminal, use the following command:"
                  - generic [ref=f27e963]:
                    - generic [ref=f27e964]: cd CarlaUE5 sudo -E env GIT_LOCAL_CREDENTIALS=github_username@github_token ./CarlaSetup.sh
                    - button "Copy code to clipboard" [ref=f27e966] [cursor=pointer]
                  - paragraph [ref=f27e970]:
                    - strong [ref=f27e971]: Building in Windows
                    - text: ":"
                  - paragraph [ref=f27e972]: "To build in Windows, run the batch script:"
                  - generic [ref=f27e973]:
                    - generic [ref=f27e974]: cd CarlaUE5 CarlaSetup.bat
                    - button "Copy code to clipboard" [ref=f27e976] [cursor=pointer]
                  - paragraph [ref=f27e980]: Unattended mode is currently unavailable in Windows, you will need to enter GitHub credentials or administrator privileges when prompted.
                  - generic [ref=f27e981]:
                    - heading "Rebuilding CARLA" [level=2] [ref=f27e982]
                    - 'link "Permalink: Rebuilding CARLA" [ref=f27e983] [cursor=pointer]':
                      - /url: "#rebuilding-carla"
                  - paragraph [ref=f27e986]: Once the setup is complete, you can execute subsequent builds with the following commands in a terminal open in the CARLA root directory. In Linux, run these commands in a standard terminal. In Windows, open the x64 Native Tools Command Prompt for Visual Studio 2022.
                  - paragraph [ref=f27e987]:
                    - strong [ref=f27e988]: Configure
                    - text: ":"
                  - paragraph [ref=f27e989]: "Linux:"
                  - generic [ref=f27e990]:
                    - generic [ref=f27e991]: cmake -G Ninja -S . -B Build --toolchain=$PWD/CMake/Toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_ROS2=ON
                    - button "Copy code to clipboard" [ref=f27e993] [cursor=pointer]
                  - paragraph [ref=f27e997]: "Windows:"
                  - generic [ref=f27e998]:
                    - generic [ref=f27e999]: cmake -G Ninja -S . -B Build --toolchain=$PWD/CMake/Toolchain.cmake -DCMAKE_BUILD_TYPE=Release
                    - button "Copy code to clipboard" [ref=f27e1001] [cursor=pointer]
                  - generic [ref=f27e1005]:
                    - paragraph [ref=f27e1006]: Note
                    - paragraph [ref=f27e1009]:
                      - text: "If you intend to target a specific Python installation, you should add both these arguments to the above cmake command:"
                      - code [ref=f27e1010]: "-DPython_ROOT_DIR=PATH"
                      - text: and
                      - code [ref=f27e1011]: "-DPython3_ROOT_DIR=PATH"
                      - text: .
                  - paragraph [ref=f27e1012]:
                    - strong [ref=f27e1013]: Build
                    - text: ":"
                  - paragraph [ref=f27e1014]: "Linux and Windows:"
                  - generic [ref=f27e1015]:
                    - generic [ref=f27e1016]: cmake --build Build
                    - button "Copy code to clipboard" [ref=f27e1018] [cursor=pointer]
                  - paragraph [ref=f27e1022]:
                    - strong [ref=f27e1023]: Build and install the Python API
                    - text: ":"
                  - paragraph [ref=f27e1024]: "Linux and Windows:"
                  - generic [ref=f27e1025]:
