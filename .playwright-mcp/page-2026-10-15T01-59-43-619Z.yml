                  - text: .
                - generic [ref=f25e743]:
                  - text: "##"
                  - generic [ref=f25e744]: Related work
                - generic [ref=f25e748]:
                  - text: "###"
                  - generic [ref=f25e749]: scenariogeneration
                - generic [ref=f25e752]:
                  - generic [ref=f25e753]: "["
                  - text: scenariogeneration
                  - generic [ref=f25e754]: "]"
                  - generic [ref=f25e755]: (
                  - generic [ref=f25e756]: https://github.com/pyoscx/scenariogeneration
                  - generic [ref=f25e757]: )
                  - text: is a Python based scenario creation framework. The idea is to write scenarios in a high-level script format and automatically generate and run linked OpenDRIVE and OpenSCENARIO XML counterparts. It supports parameter sweeps to create multiple variants of a parameterized scenario.
                - generic [ref=f25e764]:
                  - text: "###"
                  - generic [ref=f25e765]: ALKS scenarios
                - generic [ref=f25e768]:
                  - generic [ref=f25e769]: "["
                  - text: OSC-ALKS-scenarios
                  - generic [ref=f25e770]: "]"
                  - generic [ref=f25e771]: (
                  - generic [ref=f25e772]: https://github.com/arauschert/OSC-ALKS-scenarios
                  - generic [ref=f25e773]: )
                  - text: is a collection of scenarios for Automated Lane Keeping System testing. "BMW has taken on the task of implementing the test scenarios from the ALKS regulation using OpenSCENARIO and OpenDRIVE resulting in a bundle of XML files executable with standard compliant simulators."
                - generic [ref=f25e780]:
                  - text: "###"
                  - generic [ref=f25e781]: NCAP scenarios
                - generic [ref=f25e784]:
                  - generic [ref=f25e785]: "["
                  - text: OSC-NCAP-scenarios
                  - generic [ref=f25e786]: "]"
                  - generic [ref=f25e787]: (
                  - generic [ref=f25e788]: https://github.com/vectorgrp/OSC-NCAP-scenarios
                  - generic [ref=f25e789]: )
                  - text: is a collection of scenarios based on Euro NCAP Test Protocols. "As the Euro NCAP scenarios are widely used, Vector decided to contribute the implementation of these scenarios using the ASAM standards."
                - generic [ref=f25e796]:
                  - text: "###"
                  - generic [ref=f25e797]: OpenDRIVE plugin for Unreal Engine
                - generic [ref=f25e800]:
                  - generic [ref=f25e801]: "["
                  - text: brifsttar/OpenDRIVE
                  - generic [ref=f25e802]: "]"
                  - generic [ref=f25e803]: (
                  - generic [ref=f25e804]: https://github.com/brifsttar/OpenDRIVE
                  - generic [ref=f25e805]: )
                  - text: plugin allows you to manipulate OpenDRIVE road networks in Unreal Engine. It's based on esmini RoadManager (esminiRMLib).
                - generic [ref=f25e812]:
                  - text: "###"
                  - generic [ref=f25e813]: Online OpenDRIVE viewer
                - generic [ref=f25e816]:
                  - generic [ref=f25e817]: "["
                  - text: odrviewer.io
                  - generic [ref=f25e818]: "]"
                  - generic [ref=f25e819]: (
                  - generic [ref=f25e820]: https://odrviewer.io/
                  - generic [ref=f25e821]: )
                  - text: is an excellent interactive online OpenDRIVE viewer. Move around, zoom and inspect elements of the road network like roadID, laneID, successor and predecessor.
                - generic [ref=f25e828]:
                  - text: "###"
                  - generic [ref=f25e829]: Editors
                - generic [ref=f25e835]:
                  - generic [ref=f25e836]: "["
                  - text: Blender Driving Scenario Creator add-on
                  - generic [ref=f25e837]: "]"
                  - generic [ref=f25e838]: (
                  - generic [ref=f25e839]: https://github.com/johschmitz/blender-driving-scenario-creator
                  - generic [ref=f25e840]: )
                  - text: lets you create OpenDRIVE and OpenSCENARIO based scenarios.
                - generic [ref=f25e846]:
                  - generic [ref=f25e847]: "["
                  - text: Truevision Designer
                  - generic [ref=f25e848]: "]"
                  - generic [ref=f25e849]: (
                  - generic [ref=f25e850]: https://github.com/truevisionai/designer
                  - generic [ref=f25e851]: )
                  - text: Fully featured editor for xodr files, you can create/edit/export OpenDRIVE maps. Free and commercial versions available.
                - generic [ref=f25e858]:
                  - text: "###"
                  - generic [ref=f25e859]: Carla Simulator
                - generic [ref=f25e862]:
                  - generic [ref=f25e863]: "["
                  - text: Carla
                  - generic [ref=f25e864]: "]"
                  - generic [ref=f25e865]: (
                  - generic [ref=f25e866]: http://carla.org/
                  - generic [ref=f25e867]: )
                  - text: is an
                  - generic [ref=f25e868]: "["
                  - text: Unreal
                  - generic [ref=f25e869]: "]"
                  - generic [ref=f25e870]: (
                  - generic [ref=f25e871]: https://www.unrealengine.com/
                  - generic [ref=f25e872]: )
                  - text: based open source simulator worth to check out.
                - generic [ref=f25e879]:
                  - text: "###"
                  - generic [ref=f25e880]: OpenMSL
                - generic [ref=f25e883]:
                  - generic [ref=f25e884]: "["
                  - text: Open Source Model & Simulation Library
                  - generic [ref=f25e885]: "]"
                  - generic [ref=f25e886]: (
                  - generic [ref=f25e887]: https://github.com/openmsl
                  - generic [ref=f25e888]: )
                  - text: is a central hub for simulation entities for virtual ADAS testing. It runs a co-simulation with esmini in a GitHub action for sensor model testing and therefore demonstrates its application with other simulation models.
                - generic [ref=f25e895]:
                  - text: "##"
                  - generic [ref=f25e896]: Data formats
                - generic [ref=f25e902]:
                  - generic [ref=f25e903]: "["
                  - text: OpenDRIVE
                  - generic [ref=f25e904]: "]"
                  - generic [ref=f25e905]: (
                  - generic [ref=f25e906]: https://www.asam.net/standards/detail/opendrive/
                  - generic [ref=f25e907]: )
                - generic [ref=f25e908]: describes the road network, the static part of a scenario.
                - generic [ref=f25e916]:
                  - generic [ref=f25e917]: "["
                  - text: OpenSCENARIO XML
                  - generic [ref=f25e918]: "]"
                  - generic [ref=f25e919]: (
                  - generic [ref=f25e920]: https://www.asam.net/standards/detail/openscenario-xml/
                  - generic [ref=f25e921]: )
                - generic [ref=f25e922]: describes the dynamic content on top of a road network, e.g. traffic maneuvers and weather conditions.
