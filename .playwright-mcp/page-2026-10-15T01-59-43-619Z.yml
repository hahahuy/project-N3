                  - generic [ref=f25e433]: "\")"
                - generic [ref=f25e437]: "It contains the following main libraries:"
                - generic [ref=f25e445]:
                  - generic [ref=f25e446]: "-"
                  - text: RoadManager (esminiRMLib). A library providing an interface to road networks described in the OpenDRIVE format.
                - generic [ref=f25e449]:
                  - generic [ref=f25e450]: "-"
                  - text: ScenarioEngine (esminiLib). The main library providing a viewer and API interface to traffic scenarios described in the OpenSCENARIO XML format. This library includes RoadManager.
                - generic [ref=f25e454]: "and a few applications that can be used as is or provide ideas for customized solutions:"
                - generic [ref=f25e462]:
                  - generic [ref=f25e463]: "-"
                  - text: esmini. A scenario player application linking esmini modules statically.
                - generic [ref=f25e466]:
                  - generic [ref=f25e467]: "-"
                  - text: esmini-dyn. A minimalistic example using the esminiLib to play OpenSCENARIO XML files.
                - generic [ref=f25e470]:
                  - generic [ref=f25e471]: "-"
                  - text: odrplot. Produces a data file from OpenDRIVE for plotting the road network in Python.
                - generic [ref=f25e474]:
                  - generic [ref=f25e475]: "-"
                  - text: odrviewer. Visualize OpenDRIVE road network with populated dummy traffic.
                - generic [ref=f25e478]:
                  - generic [ref=f25e479]: "-"
                  - text: replayer. Re-play previously executed scenarios.
                - generic [ref=f25e482]:
                  - generic [ref=f25e483]: "-"
                  - text: osireceiver. A simple application receiving OSI messages from esmini over UDP.
