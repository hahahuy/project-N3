                - generic [ref=f25e561]:
                  - text: "##"
                  - generic [ref=f25e562]: Background
                - generic [ref=f25e568]:
                  - text: The purpose of this implementation (started 2018) was initially to explore and get familiar with the emerging
                  - generic [ref=f25e569]: "["
                  - text: OpenSCENARIO XML
                  - generic [ref=f25e570]: "]"
                  - generic [ref=f25e571]: (
                  - generic [ref=f25e572]: https://www.asam.net/standards/detail/openscenario-xml/
                  - generic [ref=f25e573]: )
                  - text: data format. The development aimed at supporting various platforms such as Windows, Mac, Linux, and Android. Tool integration and portability were high priorities. It should be easy to use for native C++ applications as well as other frameworks like Unity3D (C#) and MATLAB/Simulink, among many others. Initially, focus was more on features than quality.
                - generic [ref=f25e577]: Since then the purpose has grown, contributing to the spread and harmonization of OpenSCENARIO XML. esmini is also being used in other applications and test platforms. It grows slowly but steady, both in terms of functionality and quality, e.g. documentation, code refactorizations, continuous integration including static code analysis, and test coverage on both unit and application levels.
                - generic [ref=f25e586]:
                  - text: "##"
                  - generic [ref=f25e587]: Binaries and demos
                - generic [ref=f25e588]: Windows, Linux and Mac supported
                - generic [ref=f25e596]:
