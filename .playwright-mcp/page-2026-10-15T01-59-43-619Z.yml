                  - generic [ref=f25e674]: )
                  - text: . This structure can be 1. stored in an OSI trace-file, 2. retrieved via UDP and/or 3. retrieved directly via API.
                - generic [ref=f25e680]:
                  - text: Hello World tutorial includes an
                  - generic [ref=f25e681]: "["
