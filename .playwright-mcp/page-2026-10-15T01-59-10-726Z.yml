                - code [ref=f14e336]: icegatheringstatechange
            - definition [ref=f14e337]:
              - paragraph [ref=f14e338]:
                - text: Sent to an
                - link [ref=f14e339] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection
                  - code [ref=f14e340]: RTCPeerConnection
                - text: when its ICE gathering state—found in the
                - link [ref=f14e341] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection/iceGatheringState
                  - code [ref=f14e342]: iceGatheringState
                - text: property—changes.
            - term [ref=f14e343]:
              - link [ref=f14e344] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCDataChannel/message_event
                - code [ref=f14e345]: message
            - definition [ref=f14e346]:
              - paragraph [ref=f14e347]:
                - text: A message has been received on the data channel. The event is of type
                - link [ref=f14e348] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/MessageEvent
                  - code [ref=f14e349]: MessageEvent
                - text: .
            - term [ref=f14e350]:
              - link [ref=f14e351] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCPeerConnection/negotiationneeded_event
                - code [ref=f14e352]: negotiationneeded
            - definition [ref=f14e353]:
              - paragraph [ref=f14e354]:
                - text: Informs the
                - code [ref=f14e355]: RTCPeerConnection
