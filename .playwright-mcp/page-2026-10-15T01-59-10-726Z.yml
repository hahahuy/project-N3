  - generic [ref=f14e78]:
    - main [ref=f14e79]:
      - generic [ref=f14e80]:
        - heading "WebRTC API" [level=1] [ref=f14e81]
        - generic [ref=f14e82]:
          - paragraph [ref=f14e83]:
            - strong [ref=f14e84]: WebRTC
            - text: (Web Real-Time Communication) is a technology that enables Web applications and sites to capture and optionally stream audio and/or video media, as well as to exchange arbitrary data between browsers without requiring an intermediary. The set of standards that comprise WebRTC makes it possible to share data and perform teleconferencing peer-to-peer, without requiring that the user install plug-ins or any other third-party software.
          - paragraph [ref=f14e85]: WebRTC consists of several interrelated APIs and protocols which work together to achieve this. The documentation you'll find here will help you understand the fundamentals of WebRTC, how to set up and use both data and media connections, and more.
      - complementary [ref=f14e86]:
        - navigation [ref=f14e87]:
          - heading "In this article" [level=2] [ref=f14e88]
          - list [ref=f14e89]:
            - listitem [ref=f14e90]:
              - link "WebRTC concepts and usage" [ref=f14e91] [cursor=pointer]:
                - /url: "#webrtc_concepts_and_usage"
            - listitem [ref=f14e92]:
              - link "WebRTC reference" [ref=f14e93] [cursor=pointer]:
                - /url: "#webrtc_reference"
            - listitem [ref=f14e94]:
              - link "Guides" [ref=f14e95] [cursor=pointer]:
                - /url: "#guides"
            - listitem [ref=f14e96]:
              - link "Tutorials" [ref=f14e97] [cursor=pointer]:
                - /url: "#tutorials"
            - listitem [ref=f14e98]:
              - link "Specifications" [ref=f14e99] [cursor=pointer]:
                - /url: "#specifications"
            - listitem [ref=f14e100]:
              - link "See also" [ref=f14e101] [cursor=pointer]:
                - /url: "#see_also"
      - generic [ref=f14e102]:
        - region [ref=f14e103]:
          - heading [level=2] [ref=f14e104]:
            - link "WebRTC concepts and usage" [ref=f14e105] [cursor=pointer]:
              - /url: "#webrtc_concepts_and_usage"
          - paragraph [ref=f14e106]:
            - text: WebRTC serves multiple purposes; together with the
            - link "Media Capture and Streams API" [ref=f14e107] [cursor=pointer]:
              - /url: /en-US/docs/Web/API/Media_Capture_and_Streams_API
            - text: ", they provide powerful multimedia capabilities to the Web, including support for audio and video conferencing, file exchange, screen sharing, identity management, and interfacing with legacy telephone systems including support for sending"
            - link "DTMF" [ref=f14e108] [cursor=pointer]:
              - /url: /en-US/docs/Glossary/DTMF
            - text: (touch-tone dialing) signals. Connections between peers can be made without requiring any special drivers or plug-ins, and can often be made without any intermediary servers.
          - paragraph [ref=f14e109]:
            - text: Connections between two peers are represented by the
            - link [ref=f14e110] [cursor=pointer]:
              - /url: /en-US/docs/Web/API/RTCPeerConnection
              - code [ref=f14e111]: RTCPeerConnection
            - text: interface. Once a connection has been established and opened using
            - code [ref=f14e112]: RTCPeerConnection
            - text: ", media streams ("
            - link [ref=f14e113] [cursor=pointer]:
              - /url: /en-US/docs/Web/API/MediaStream
              - code [ref=f14e114]: MediaStream
            - text: s) and/or data channels (
            - link [ref=f14e115] [cursor=pointer]:
              - /url: /en-US/docs/Web/API/RTCDataChannel
              - code [ref=f14e116]: RTCDataChannel
            - text: s) can be added to the connection.
          - paragraph [ref=f14e117]:
            - text: Media streams can consist of any number of tracks of media information; tracks, which are represented by objects based on the
            - link [ref=f14e118] [cursor=pointer]:
              - /url: /en-US/docs/Web/API/MediaStreamTrack
              - code [ref=f14e119]: MediaStreamTrack
            - text: interface, may contain one of a number of types of media data, including audio, video, and text (such as subtitles or even chapter names). Most streams consist of at least one audio track and likely also a video track, and can be used to send and receive both live media or stored media information (such as a streamed movie).
          - paragraph [ref=f14e120]:
            - text: You can also use the connection between two peers to exchange arbitrary binary data using the
            - link [ref=f14e121] [cursor=pointer]:
              - /url: /en-US/docs/Web/API/RTCDataChannel
              - code [ref=f14e122]: RTCDataChannel
            - text: interface. This can be used for back-channel information, metadata exchange, game status packets, file transfers, or even as a primary channel for data transfer.
        - region [ref=f14e123]:
          - heading [level=3] [ref=f14e124]:
            - link "Interoperability" [ref=f14e125] [cursor=pointer]:
              - /url: "#interoperability"
          - paragraph [ref=f14e126]:
            - text: WebRTC is in general well supported in modern browsers, but some incompatibilities remain. The
            - link "adapter.js (external)" [ref=f14e127] [cursor=pointer]:
              - /url: https://github.com/webrtcHacks/adapter
            - text: library is a shim to insulate apps from these incompatibilities.
        - region [ref=f14e128]:
          - heading [level=2] [ref=f14e129]:
            - link "WebRTC reference" [ref=f14e130] [cursor=pointer]:
              - /url: "#webrtc_reference"
          - paragraph [ref=f14e131]: Because WebRTC provides interfaces that work together to accomplish a variety of tasks, we have divided up the reference by category. Please see the sidebar for an alphabetical list.
        - region [ref=f14e132]:
          - heading [level=3] [ref=f14e133]:
            - link "Connection setup and management" [ref=f14e134] [cursor=pointer]:
              - /url: "#connection_setup_and_management"
          - paragraph [ref=f14e135]: These interfaces, dictionaries, and types are used to set up, open, and manage WebRTC connections. Included are interfaces representing peer media connections, data channels, and interfaces used when exchanging information on the capabilities of each peer in order to select the best possible configuration for a two-way media connection.
          - heading "Interfaces" [level=4] [ref=f14e136]
          - generic [ref=f14e137]:
            - term [ref=f14e138]:
              - link [ref=f14e139] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCPeerConnection
                - code [ref=f14e140]: RTCPeerConnection
            - definition [ref=f14e141]:
              - paragraph [ref=f14e142]: Represents a WebRTC connection between the local computer and a remote peer. It is used to handle efficient streaming of data between the two peers.
            - term [ref=f14e143]:
              - link [ref=f14e144] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCDataChannel
                - code [ref=f14e145]: RTCDataChannel
            - definition [ref=f14e146]:
              - paragraph [ref=f14e147]: Represents a bi-directional data channel between two peers of a connection.
            - term [ref=f14e148]:
              - link [ref=f14e149] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCDataChannelEvent
                - code [ref=f14e150]: RTCDataChannelEvent
            - definition [ref=f14e151]:
              - paragraph [ref=f14e152]:
                - text: Represents events that occur while attaching a
                - link [ref=f14e153] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCDataChannel
                  - code [ref=f14e154]: RTCDataChannel
                - text: to a
                - link [ref=f14e155] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection
                  - code [ref=f14e156]: RTCPeerConnection
                - text: . The only event sent with this interface is
                - link [ref=f14e157] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection/datachannel_event
                  - code [ref=f14e158]: datachannel
                - text: .
            - term [ref=f14e159]:
              - link [ref=f14e160] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCSessionDescription
                - code [ref=f14e161]: RTCSessionDescription
            - definition [ref=f14e162]:
              - paragraph [ref=f14e163]:
                - text: Represents the parameters of a session. Each
                - code [ref=f14e164]: RTCSessionDescription
                - text: consists of a description
                - link [ref=f14e165] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCSessionDescription/type
                  - code [ref=f14e166]: type
                - text: indicating which part of the offer/answer negotiation process it describes and of the
                - link "SDP" [ref=f14e167] [cursor=pointer]:
                  - /url: /en-US/docs/Glossary/SDP
                - text: descriptor of the session.
            - term [ref=f14e168]:
              - link [ref=f14e169] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCStatsReport
                - code [ref=f14e170]: RTCStatsReport
            - definition [ref=f14e171]:
              - paragraph [ref=f14e172]:
                - text: Provides information detailing statistics for a connection or for an individual track on the connection; the report can be obtained by calling
                - link [ref=f14e173] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection/getStats
                  - code [ref=f14e174]: RTCPeerConnection.getStats()
                - text: .
            - term [ref=f14e175]:
              - link [ref=f14e176] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCIceCandidate
                - code [ref=f14e177]: RTCIceCandidate
            - definition [ref=f14e178]:
              - paragraph [ref=f14e179]:
                - text: Represents a candidate Interactive Connectivity Establishment (
                - link "ICE" [ref=f14e180] [cursor=pointer]:
                  - /url: /en-US/docs/Glossary/ICE
                - text: ) configuration for establishing an
                - link [ref=f14e181] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection
                  - code [ref=f14e182]: RTCPeerConnection
                - text: .
            - term [ref=f14e183]:
              - link [ref=f14e184] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCIceTransport
                - code [ref=f14e185]: RTCIceTransport
            - definition [ref=f14e186]:
              - paragraph [ref=f14e187]:
                - text: Represents information about an
                - link "ICE" [ref=f14e188] [cursor=pointer]:
                  - /url: /en-US/docs/Glossary/ICE
                - text: transport.
            - term [ref=f14e189]:
              - link [ref=f14e190] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCPeerConnectionIceEvent
                - code [ref=f14e191]: RTCPeerConnectionIceEvent
            - definition [ref=f14e192]:
              - paragraph [ref=f14e193]:
                - text: Represents events that occur in relation to ICE candidates with the target, usually an
                - link [ref=f14e194] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection
                  - code [ref=f14e195]: RTCPeerConnection
                - text: ". Only one event is of this type:"
                - link [ref=f14e196] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection/icecandidate_event
                  - code [ref=f14e197]: icecandidate
                - text: .
            - term [ref=f14e198]:
              - link [ref=f14e199] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCRtpSender
                - code [ref=f14e200]: RTCRtpSender
            - definition [ref=f14e201]:
              - paragraph [ref=f14e202]:
                - text: Manages the encoding and transmission of data for a
                - link [ref=f14e203] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/MediaStreamTrack
                  - code [ref=f14e204]: MediaStreamTrack
                - text: on an
                - link [ref=f14e205] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection
                  - code [ref=f14e206]: RTCPeerConnection
                - text: .
            - term [ref=f14e207]:
              - link [ref=f14e208] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCRtpReceiver
                - code [ref=f14e209]: RTCRtpReceiver
            - definition [ref=f14e210]:
              - paragraph [ref=f14e211]:
                - text: Manages the reception and decoding of data for a
                - link [ref=f14e212] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/MediaStreamTrack
                  - code [ref=f14e213]: MediaStreamTrack
                - text: on an
                - link [ref=f14e214] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection
                  - code [ref=f14e215]: RTCPeerConnection
                - text: .
            - term [ref=f14e216]:
              - link [ref=f14e217] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCTrackEvent
                - code [ref=f14e218]: RTCTrackEvent
            - definition [ref=f14e219]:
              - paragraph [ref=f14e220]:
                - text: The interface used to represent a
                - link [ref=f14e221] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection/track_event
                  - code [ref=f14e222]: track
                - text: event, which indicates that an
                - link [ref=f14e223] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCRtpReceiver
                  - code [ref=f14e224]: RTCRtpReceiver
                - text: object was added to the
                - link [ref=f14e225] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection
                  - code [ref=f14e226]: RTCPeerConnection
                - text: object, indicating that a new incoming
                - link [ref=f14e227] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/MediaStreamTrack
                  - code [ref=f14e228]: MediaStreamTrack
                - text: was created and added to the
                - code [ref=f14e229]: RTCPeerConnection
                - text: .
            - term [ref=f14e230]:
              - link [ref=f14e231] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCSctpTransport
                - code [ref=f14e232]: RTCSctpTransport
            - definition [ref=f14e233]:
              - paragraph [ref=f14e234]:
                - text: Provides information which describes a Stream Control Transmission Protocol (
                - strong [ref=f14e235]:
                  - link "SCTP" [ref=f14e236] [cursor=pointer]:
                    - /url: /en-US/docs/Glossary/SCTP
                - text: ) transport and also provides a way to access the underlying Datagram Transport Layer Security (
                - strong [ref=f14e237]:
                  - link "DTLS" [ref=f14e238] [cursor=pointer]:
                    - /url: /en-US/docs/Glossary/DTLS
                - text: ) transport over which SCTP packets for all of an
                - link [ref=f14e239] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection
                  - code [ref=f14e240]: RTCPeerConnection
                - text: "'s data channels are sent and received."
          - heading "Events" [level=4] [ref=f14e241]
          - generic [ref=f14e242]:
            - term [ref=f14e243]:
              - link [ref=f14e244] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCDataChannel/bufferedamountlow_event
                - code [ref=f14e245]: bufferedamountlow
            - definition [ref=f14e246]:
              - paragraph [ref=f14e247]:
                - text: The amount of data currently buffered by the data channel—as indicated by its
                - link [ref=f14e248] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCDataChannel/bufferedAmount
                  - code [ref=f14e249]: bufferedAmount
                - text: property—has decreased to be at or below the channel's minimum buffered data size, as specified by
                - link [ref=f14e250] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCDataChannel/bufferedAmountLowThreshold
                  - code [ref=f14e251]: bufferedAmountLowThreshold
                - text: .
            - term [ref=f14e252]:
              - link [ref=f14e253] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCDataChannel/close_event
                - code [ref=f14e254]: close
            - definition [ref=f14e255]:
              - paragraph [ref=f14e256]:
                - text: The data channel has completed the closing process and is now in the
                - code [ref=f14e257]: closed
                - text: state. Its underlying data transport is completely closed at this point. You can be notified
                - emphasis [ref=f14e258]: before
                - text: closing completes by watching for the
                - code [ref=f14e259]: closing
                - text: event instead.
            - term [ref=f14e260]:
              - link [ref=f14e261] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCDataChannel/closing_event
                - code [ref=f14e262]: closing
            - definition [ref=f14e263]:
              - paragraph [ref=f14e264]:
                - text: The
                - code [ref=f14e265]: RTCDataChannel
                - text: has transitioned to the
                - code [ref=f14e266]: closing
                - text: state, indicating that it will be closed soon. You can detect the completion of the closing process by watching for the
                - code [ref=f14e267]: close
                - text: event.
            - term [ref=f14e268]:
              - link [ref=f14e269] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCPeerConnection/connectionstatechange_event
                - code [ref=f14e270]: connectionstatechange
            - definition [ref=f14e271]:
              - paragraph [ref=f14e272]:
                - text: The connection's state, which can be accessed in
                - link [ref=f14e273] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection/connectionState
                  - code [ref=f14e274]: connectionState
                - text: ", has changed."
            - term [ref=f14e275]:
              - link [ref=f14e276] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCPeerConnection/datachannel_event
                - code [ref=f14e277]: datachannel
            - definition [ref=f14e278]:
              - paragraph [ref=f14e279]:
                - text: A new
                - link [ref=f14e280] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCDataChannel
                  - code [ref=f14e281]: RTCDataChannel
                - text: is available following the remote peer opening a new data channel. This event's type is
                - link [ref=f14e282] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCDataChannelEvent
                  - code [ref=f14e283]: RTCDataChannelEvent
                - text: .
            - term [ref=f14e284]:
              - link [ref=f14e285] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCDataChannel/error_event
                - code [ref=f14e286]: error
            - definition [ref=f14e287]:
              - paragraph [ref=f14e288]:
                - text: An
                - link [ref=f14e289] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCErrorEvent
                  - code [ref=f14e290]: RTCErrorEvent
                - text: indicating that an error occurred on the data channel.
            - term [ref=f14e291]:
              - link [ref=f14e292] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCDtlsTransport/error_event
                - code [ref=f14e293]: error
            - definition [ref=f14e294]:
              - paragraph [ref=f14e295]:
                - text: An
                - link [ref=f14e296] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCErrorEvent
                  - code [ref=f14e297]: RTCErrorEvent
                - text: indicating that an error occurred on the
                - link [ref=f14e298] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCDtlsTransport
                  - code [ref=f14e299]: RTCDtlsTransport
                - text: . This error will be either
                - code [ref=f14e300]: dtls-failure
                - text: or
                - code [ref=f14e301]: fingerprint-failure
                - text: .
            - term [ref=f14e302]:
