                - text: The currently-selected pair of ICE candidates has changed for the
                - code [ref=f14e371]: RTCIceTransport
                - text: on which the event is fired.
            - term [ref=f14e372]:
              - link [ref=f14e373] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCPeerConnection/track_event
                - code [ref=f14e374]: track
            - definition [ref=f14e375]:
              - paragraph [ref=f14e376]:
                - text: The
                - code [ref=f14e377]: track
                - text: event, of type
                - link [ref=f14e378] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCTrackEvent
                  - code [ref=f14e379]: RTCTrackEvent
                - text: is sent to an
                - link [ref=f14e380] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection
                  - code [ref=f14e381]: RTCPeerConnection
                - text: when a new track is added to the connection following the successful negotiation of the media's streaming.
            - term [ref=f14e382]:
              - link [ref=f14e383] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCPeerConnection/signalingstatechange_event
                - code [ref=f14e384]: signalingstatechange
            - definition [ref=f14e385]:
              - paragraph [ref=f14e386]:
                - text: Sent to the peer connection when its
                - link [ref=f14e387] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection/signalingState
