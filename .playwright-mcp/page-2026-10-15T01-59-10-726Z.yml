                - text: has changed. This happens as a result of a call to either
                - link [ref=f14e389] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection/setLocalDescription
                  - code [ref=f14e390]: setLocalDescription()
                - text: or
                - link [ref=f14e391] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection/setRemoteDescription
