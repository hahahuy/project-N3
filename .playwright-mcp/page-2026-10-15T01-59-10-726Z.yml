                - text: .
            - term [ref=f14e360]:
              - link [ref=f14e361] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCDataChannel/open_event
                - code [ref=f14e362]: open
            - definition [ref=f14e363]:
              - paragraph [ref=f14e364]:
                - text: The underlying data transport for the
                - code [ref=f14e365]: RTCDataChannel
                - text: has been successfully opened or re-opened.
            - term [ref=f14e366]:
              - link [ref=f14e367] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCIceTransport/selectedcandidatepairchange_event
                - code [ref=f14e368]: selectedcandidatepairchange
            - definition [ref=f14e369]:
