                - text: .
            - term [ref=f14e393]:
              - link [ref=f14e394] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCDtlsTransport/statechange_event
                - code [ref=f14e395]: statechange
            - definition [ref=f14e396]:
              - paragraph [ref=f14e397]:
                - text: The state of the
                - code [ref=f14e398]: RTCDtlsTransport
                - text: has changed.
            - term [ref=f14e399]:
              - link [ref=f14e400] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCIceTransport/statechange_event
                - code [ref=f14e401]: statechange
            - definition [ref=f14e402]:
              - paragraph [ref=f14e403]:
                - text: The state of the
                - code [ref=f14e404]: RTCIceTransport
                - text: has changed.
            - term [ref=f14e405]:
              - link [ref=f14e406] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCSctpTransport/statechange_event
                - code [ref=f14e407]: statechange
            - definition [ref=f14e408]:
              - paragraph [ref=f14e409]:
                - text: The state of the
                - code [ref=f14e410]: RTCSctpTransport
                - text: has changed.
            - term [ref=f14e411]:
              - link [ref=f14e412] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/DedicatedWorkerGlobalScope/rtctransform_event
                - code [ref=f14e413]: rtctransform
            - definition [ref=f14e414]:
              - paragraph [ref=f14e415]: An encoded video or audio frame is ready to process using a transform stream in a worker.
          - heading "Types" [level=4] [ref=f14e416]
          - generic [ref=f14e417]:
            - term [ref=f14e418]:
              - link [ref=f14e419] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCSctpTransport/state
                - code [ref=f14e420]: RTCSctpTransport.state
            - definition [ref=f14e421]:
              - paragraph [ref=f14e422]:
                - text: Indicates the state of an
                - link [ref=f14e423] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCSctpTransport
                  - code [ref=f14e424]: RTCSctpTransport
                - text: instance.
        - region [ref=f14e425]:
          - heading [level=3] [ref=f14e426]:
            - link "Identity and security" [ref=f14e427] [cursor=pointer]:
              - /url: "#identity_and_security"
          - paragraph [ref=f14e428]: These APIs are used to manage user identity and security, in order to authenticate the user for a connection.
          - generic [ref=f14e429]:
            - term [ref=f14e430]:
              - generic "The documentation about this has not yet been written; please consider contributing!" [ref=f14e431]:
                - code [ref=f14e432]: RTCIdentityProvider
            - definition [ref=f14e433]:
              - paragraph [ref=f14e434]: Enables a user agent is able to request that an identity assertion be generated or validated.
            - term [ref=f14e435]:
              - link [ref=f14e436] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCIdentityAssertion
                - code [ref=f14e437]: RTCIdentityAssertion
            - definition [ref=f14e438]:
              - paragraph [ref=f14e439]:
                - text: Represents the identity of the remote peer of the current connection. If no peer has yet been set and verified this interface returns
                - code [ref=f14e440]: "null"
                - text: . Once set it can't be changed.
            - term [ref=f14e441]:
              - generic "The documentation about this has not yet been written; please consider contributing!" [ref=f14e442]:
                - code [ref=f14e443]: RTCIdentityProviderRegistrar
            - definition [ref=f14e444]:
              - paragraph [ref=f14e445]: Registers an identity provider (idP).
            - term [ref=f14e446]:
              - link [ref=f14e447] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCCertificate
                - code [ref=f14e448]: RTCCertificate
            - definition [ref=f14e449]:
              - paragraph [ref=f14e450]:
                - text: Represents a certificate that an
                - link [ref=f14e451] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection
                  - code [ref=f14e452]: RTCPeerConnection
                - text: uses to authenticate.
        - region [ref=f14e453]:
          - heading [level=3] [ref=f14e454]:
            - link "Telephony" [ref=f14e455] [cursor=pointer]:
              - /url: "#telephony"
          - paragraph [ref=f14e456]: These interfaces and events are related to interactivity with Public-Switched Telephone Networks (PSTNs). They're primarily used to send tone dialing sounds—or packets representing those tones—across the network to the remote peer.
          - heading "Interfaces" [level=4] [ref=f14e457]
          - generic [ref=f14e458]:
            - term [ref=f14e459]:
              - link [ref=f14e460] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCDTMFSender
                - code [ref=f14e461]: RTCDTMFSender
            - definition [ref=f14e462]:
              - paragraph [ref=f14e463]:
                - text: Manages the encoding and transmission of Dual-Tone Multi-Frequency (
                - link "DTMF" [ref=f14e464] [cursor=pointer]:
                  - /url: /en-US/docs/Glossary/DTMF
                - text: ) signaling for an
                - link [ref=f14e465] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCPeerConnection
                  - code [ref=f14e466]: RTCPeerConnection
                - text: .
            - term [ref=f14e467]:
              - link [ref=f14e468] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCDTMFToneChangeEvent
                - code [ref=f14e469]: RTCDTMFToneChangeEvent
            - definition [ref=f14e470]:
              - paragraph [ref=f14e471]:
                - text: Used by the
                - link [ref=f14e472] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCDTMFSender/tonechange_event
                  - code [ref=f14e473]: tonechange
                - text: event to indicate that a DTMF tone has either begun or ended. This event does not bubble (except where otherwise stated) and is not cancelable (except where otherwise stated).
          - heading "Events" [level=4] [ref=f14e474]
          - generic [ref=f14e475]:
            - term [ref=f14e476]:
              - link [ref=f14e477] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCDTMFSender/tonechange_event
                - code [ref=f14e478]: tonechange
            - definition [ref=f14e479]:
              - paragraph [ref=f14e480]:
                - text: Either a new
                - link "DTMF" [ref=f14e481] [cursor=pointer]:
                  - /url: /en-US/docs/Glossary/DTMF
                - text: tone has begun to play over the connection, or the last tone in the
                - code [ref=f14e482]: RTCDTMFSender
                - text: "'s"
                - link [ref=f14e483] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCDTMFSender/toneBuffer
                  - code [ref=f14e484]: toneBuffer
                - text: has been sent and the buffer is now empty. The event's type is
                - link [ref=f14e485] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCDTMFToneChangeEvent
                  - code [ref=f14e486]: RTCDTMFToneChangeEvent
                - text: .
        - region [ref=f14e487]:
          - heading [level=3] [ref=f14e488]:
            - link "Encoded Transforms" [ref=f14e489] [cursor=pointer]:
              - /url: "#encoded_transforms"
          - paragraph [ref=f14e490]: These interfaces and events are used to process incoming and outgoing encoded video and audio frames using a transform stream running in a worker.
          - heading "Interfaces" [level=4] [ref=f14e491]
          - generic [ref=f14e492]:
            - term [ref=f14e493]:
              - link [ref=f14e494] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCRtpScriptTransform
                - code [ref=f14e495]: RTCRtpScriptTransform
            - definition [ref=f14e496]:
              - paragraph [ref=f14e497]: An interface for inserting transform stream(s) running in a worker into the RTC pipeline.
            - term [ref=f14e498]:
              - link [ref=f14e499] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCRtpScriptTransformer
                - code [ref=f14e500]: RTCRtpScriptTransformer
            - definition [ref=f14e501]:
              - paragraph [ref=f14e502]:
                - text: The worker-side counterpart of an
                - code [ref=f14e503]: RTCRtpScriptTransform
                - text: that passes options from the main thread, along with a readable stream and writeable stream that can be used to pipe encoded frames through a
                - link [ref=f14e504] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/TransformStream
                  - code [ref=f14e505]: TransformStream
                - text: .
            - term [ref=f14e506]:
              - link [ref=f14e507] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCEncodedVideoFrame
                - code [ref=f14e508]: RTCEncodedVideoFrame
            - definition [ref=f14e509]:
              - paragraph [ref=f14e510]: Represents an encoded video frame to be transformed in the RTC pipeline.
            - term [ref=f14e511]:
              - link [ref=f14e512] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCEncodedAudioFrame
                - code [ref=f14e513]: RTCEncodedAudioFrame
            - definition [ref=f14e514]:
              - paragraph [ref=f14e515]: Represents an encoded audio frame to be transformed in the RTC pipeline.
          - heading "Properties" [level=4] [ref=f14e516]
          - generic [ref=f14e517]:
            - term [ref=f14e518]:
              - link [ref=f14e519] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCRtpReceiver/transform
                - code [ref=f14e520]: RTCRtpReceiver.transform
            - definition [ref=f14e521]:
              - paragraph [ref=f14e522]: A property used to insert a transform stream into the receiver pipeline for incoming encoded video and audio frames.
            - term [ref=f14e523]:
              - link [ref=f14e524] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/RTCRtpSender/transform
                - code [ref=f14e525]: RTCRtpSender.transform
            - definition [ref=f14e526]:
              - paragraph [ref=f14e527]: A property used to insert a transform stream into the sender pipeline for outgoing encoded video and audio frames.
          - heading "Events" [level=4] [ref=f14e528]
          - generic [ref=f14e529]:
            - term [ref=f14e530]:
              - link [ref=f14e531] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/DedicatedWorkerGlobalScope/rtctransform_event
                - code [ref=f14e532]: rtctransform
            - definition [ref=f14e533]:
              - paragraph [ref=f14e534]: An RTC transform is ready to run in the worker, or an encoded video or audio frame is ready to process.
        - region [ref=f14e535]:
          - heading [level=2] [ref=f14e536]:
            - link "Guides" [ref=f14e537] [cursor=pointer]:
              - /url: "#guides"
          - generic [ref=f14e538]:
            - term [ref=f14e539]:
              - link "Introduction to the Real-time Transport Protocol (RTP)" [ref=f14e540] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/WebRTC_API/Intro_to_RTP
            - definition [ref=f14e541]:
              - paragraph [ref=f14e542]:
                - text: The Real-time Transport Protocol (RTP), defined in
                - link "RFC 3550 (external)" [ref=f14e543] [cursor=pointer]:
                  - /url: https://datatracker.ietf.org/doc/html/rfc3550
                - text: ", is an IETF standard protocol to enable real-time connectivity for exchanging data that needs real-time priority. This article provides an overview of what RTP is and how it functions in the context of WebRTC."
            - term [ref=f14e544]:
              - link "Introduction to WebRTC protocols" [ref=f14e545] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/WebRTC_API/Protocols
            - definition [ref=f14e546]:
              - paragraph [ref=f14e547]: This article introduces the protocols on top of which the WebRTC API is built.
            - term [ref=f14e548]:
              - link "WebRTC connectivity" [ref=f14e549] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/WebRTC_API/Connectivity
            - definition [ref=f14e550]:
              - paragraph [ref=f14e551]: A guide to how WebRTC connections work and how the various protocols and interfaces can be used together to build powerful communication apps.
            - term [ref=f14e552]:
              - link "Lifetime of a WebRTC session" [ref=f14e553] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/WebRTC_API/Session_lifetime
            - definition [ref=f14e554]:
              - paragraph [ref=f14e555]: WebRTC lets you build peer-to-peer communication of arbitrary data, audio, or video—or any combination thereof—into a browser application. In this article, we'll look at the lifetime of a WebRTC session, from establishing the connection all the way through closing the connection when it's no longer needed.
            - term [ref=f14e556]:
              - 'link "Establishing a connection: The perfect negotiation pattern" [ref=f14e557] [cursor=pointer]':
                - /url: /en-US/docs/Web/API/WebRTC_API/Perfect_negotiation
            - definition [ref=f14e558]:
              - paragraph [ref=f14e559]:
                - strong [ref=f14e560]: Perfect negotiation
                - text: is a design pattern which is recommended for your signaling process to follow, which provides transparency in negotiation while allowing both sides to be either the offerer or the answerer, without significant coding needed to differentiate the two.
            - term [ref=f14e561]:
              - link "Signaling and two-way video calling" [ref=f14e562] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/WebRTC_API/Signaling_and_video_calling
            - definition [ref=f14e563]:
              - paragraph [ref=f14e564]: A tutorial and example which turns a WebSocket-based chat system created for a previous example and adds support for opening video calls among participants. The chat server's WebSocket connection is used for WebRTC signaling.
            - term [ref=f14e565]:
              - link "Codecs used by WebRTC" [ref=f14e566] [cursor=pointer]:
                - /url: /en-US/docs/Web/Media/Guides/Formats/WebRTC_codecs
            - definition [ref=f14e567]:
              - paragraph [ref=f14e568]: A guide to the codecs which WebRTC requires browsers to support as well as the optional ones supported by various popular browsers. Included is a guide to help you choose the best codecs for your needs.
            - term [ref=f14e569]:
              - link "Using WebRTC data channels" [ref=f14e570] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/WebRTC_API/Using_data_channels
            - definition [ref=f14e571]:
              - paragraph [ref=f14e572]:
                - text: This guide covers how you can use a peer connection and an associated
                - link [ref=f14e573] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCDataChannel
                  - code [ref=f14e574]: RTCDataChannel
                - text: to exchange arbitrary data between two peers.
            - term [ref=f14e575]:
              - link "Using DTMF with WebRTC" [ref=f14e576] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/WebRTC_API/Using_DTMF
            - definition [ref=f14e577]:
              - paragraph [ref=f14e578]:
                - text: WebRTC's support for interacting with gateways that link to old-school telephone systems includes support for sending DTMF tones using the
                - link [ref=f14e579] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCDTMFSender
                  - code [ref=f14e580]: RTCDTMFSender
                - text: interface. This guide shows how to do so.
            - term [ref=f14e581]:
              - link "Using WebRTC Encoded Transforms" [ref=f14e582] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/WebRTC_API/Using_Encoded_Transforms
            - definition [ref=f14e583]:
              - paragraph [ref=f14e584]:
                - text: This guide shows how a web application can modify incoming and outgoing WebRTC encoded video and audio frames, using a
                - link [ref=f14e585] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/TransformStream
                  - code [ref=f14e586]: TransformStream
                - text: running into a worker.
        - region [ref=f14e587]:
          - heading [level=2] [ref=f14e588]:
            - link "Tutorials" [ref=f14e589] [cursor=pointer]:
              - /url: "#tutorials"
          - generic [ref=f14e590]:
            - term [ref=f14e591]:
              - link "Improving compatibility using WebRTC adapter.js" [ref=f14e592] [cursor=pointer]:
                - /url: "#interoperability"
            - definition [ref=f14e593]:
              - paragraph [ref=f14e594]:
                - text: The WebRTC organization
                - link "provides on GitHub the WebRTC adapter (external)" [ref=f14e595] [cursor=pointer]:
                  - /url: https://github.com/webrtc/adapter/
                - text: to work around compatibility issues in different browsers' WebRTC implementations. The adapter is a JavaScript shim which lets your code to be written to the specification so that it will "just work" in all browsers with WebRTC support.
            - term [ref=f14e596]:
              - link "A simple RTCDataChannel sample" [ref=f14e597] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/WebRTC_API/Simple_RTCDataChannel_sample
            - definition [ref=f14e598]:
              - paragraph [ref=f14e599]:
                - text: The
                - link [ref=f14e600] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/RTCDataChannel
                  - code [ref=f14e601]: RTCDataChannel
                - text: interface is a feature which lets you open a channel between two peers over which you may send and receive arbitrary data. The API is intentionally similar to the
                - link "WebSocket API" [ref=f14e602] [cursor=pointer]:
                  - /url: /en-US/docs/Web/API/WebSockets_API
                - text: ", so that the same programming model can be used for each."
            - term [ref=f14e603]:
              - link "Building an internet connected phone with Peer.js" [ref=f14e604] [cursor=pointer]:
                - /url: /en-US/docs/Web/API/WebRTC_API/Build_a_phone_with_peerjs
            - definition [ref=f14e605]:
              - paragraph [ref=f14e606]: This tutorial is a step-by-step guide on how to build a phone using Peer.js
        - region [ref=f14e607]:
          - heading [level=2] [ref=f14e608]:
            - link "Specifications" [ref=f14e609] [cursor=pointer]:
              - /url: "#specifications"
          - table [ref=f14e610]:
