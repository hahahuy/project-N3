                - article [ref=f28e398]:
                  - paragraph [ref=f28e399]: The main goal of the CARLA Autonomous Driving Leaderboard is to evaluate the driving proficiency of autonomous agents in realistic traffic situations. The leaderboard serves as an open platform for the community to perform fair and reproducible evaluations, simplifying the comparison between different approaches.
                  - paragraph [ref=f28e400]: Autonomous agents have to drive through a set of predefined routes. For each route, agents are initialized at a starting point and have to drive to a destination point. The agents will be provided with a description of the route. Routes will happen in a variety of areas, including freeways, urban scenes, and residential districts.
                  - paragraph [ref=f28e401]: "Agents will face multiple traffic situations based in the NHTSA typology, such as:"
                  - list [ref=f28e402]:
                    - listitem [ref=f28e403]: Lane merging
                    - listitem [ref=f28e404]: Lane changing
                    - listitem [ref=f28e405]: Negotiations at traffic intersections
                    - listitem [ref=f28e406]: Negotiations at roundabouts
                    - listitem [ref=f28e407]: Handling traffic lights and traffic signs
                    - listitem [ref=f28e408]: Coping with pedestrians, cyclists and other elements
                  - paragraph [ref=f28e409]: The user can change the weather of the simulation, allowing the evaluation of the agent in a variety of weather conditions, including daylight scenes, sunset, rain, fog, and night, among others.
                  - paragraph [ref=f28e410]:
                    - text: More information can be found
                    - link "here" [ref=f28e411] [cursor=pointer]:
                      - /url: https://leaderboard.carla.org/
