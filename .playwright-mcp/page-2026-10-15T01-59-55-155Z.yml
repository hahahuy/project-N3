                  - strong [ref=f26e644]: "Note:"
                - paragraph [ref=f26e646]: OSI groundtruth always contains all dynamics objects. Static objects, by default, will be reported only the very frame they are created. OpenDRIVE objects are always created during initialization. OpenSCENARIO MiscObjects are also normally created during initialization. However, they can be added by AddEntityAction or AddObject() API function, hence, from esmini v2.57.0, MiscObjects can be added at any time to groundtruth.
                - paragraph [ref=f26e648]: To summarize the default behavior, first frame will include all dynamic and static objects created during the initialization of the scenario. Subsequent frames will include all dynamics objects available at that time plus any static MiscObjects created that very frame.
                - paragraph [ref=f26e650]: The same data is also stored in the OSI log file, given that the log file is enabled.
