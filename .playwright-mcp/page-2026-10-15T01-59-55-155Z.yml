        - generic [ref=f26e450]:
          - heading "Functionality" [level=3] [ref=f26e451]
          - paragraph [ref=f26e453]:
            - text: No systematic documentation available. See header files
            - link "esminiLib.hpp" [ref=f26e454] [cursor=pointer]:
              - /url: https://github.com/esmini/esmini/blob/master/EnvironmentSimulator/Libraries/esminiLib/esminiLib.hpp
            - text: and
            - link "esminiRMLib.hpp" [ref=f26e455] [cursor=pointer]:
              - /url: https://github.com/esmini/esmini/blob/master/EnvironmentSimulator/Libraries/esminiRMLib/esminiRMLib.hpp
            - text: for API details.
          - paragraph [ref=f26e457]: The following section covers some specific use cases of the library.
          - generic [ref=f26e458]:
            - heading "Save or grab images" [level=4] [ref=f26e459]
            - paragraph [ref=f26e461]: "Screenshots can be controlled via the API:"
            - code [ref=f26e465]: int SE_SaveImagesToFile(int nrOfFrames);
            - paragraph [ref=f26e467]: "nrOfFrames: -1 ⇒ continuously, 0 ⇒ stop, > 0 ⇒ number of frames, e.g. 1=next frame only, 2=next two frames"
            - paragraph [ref=f26e469]:
              - text: Images will be stored in current folder with name
              - code [ref=f26e470]: screen_shot_*.tga
              - text: (* = counter) for post processing.
            - paragraph [ref=f26e472]: "Images can also be saved to memory for instant processing. Control the feature with:"
            - code [ref=f26e476]: int SE_SaveImagesToRAM(bool state);
            - paragraph [ref=f26e478]: "state: true ⇒ capture images, false ⇒ don’t capture (default, might improve performance on some systems)"
            - paragraph [ref=f26e480]: "Grab image with:"
            - code [ref=f26e484]: int SE_FetchImage(SE_Image *image);
            - paragraph [ref=f26e486]: image is a reference to a SE_Image struct which will contain the image meta and image data
            - paragraph [ref=f26e488]:
              - text: See
              - link "image-capture" [ref=f26e489] [cursor=pointer]:
                - /url: https://github.com/esmini/esmini/tree/master/EnvironmentSimulator/code-examples/image-capture
              - text: code example.
            - generic [ref=f26e491]:
              - paragraph [ref=f26e493]:
                - strong [ref=f26e494]: "Note:"
                - text: In order to grab a rendered frame image, it must have been saved to RAM during the post rendering phase. First frame will be saved to RAM by default. The SE_SaveImagesToRAM() function must be used to enable the feature for frames > 0.
              - paragraph [ref=f26e496]: The reason for not enable always by default is performance savings. On some system the operation to read back rendered pixels from graphics frame buffer to application RAM memory is not neglectable (depending on whether color coding or byte order transformation is needed). So a compromize is to have the feature enabled for the first init frame, and then activate by user when needed.
            - paragraph [ref=f26e498]: "Finally, to disable esmini image handling altogether and revert to OSG default handling, make the following call before SE_Init():"
            - paragraph [ref=f26e500]:
              - code [ref=f26e501]: SE_SetOffScreenRendering(false);
            - paragraph [ref=f26e503]: Note that disabling the this will permanently disable the callback mechanism for the complete esmini session (overriding any SE_SaveImagesToRAM() call).
          - generic [ref=f26e504]:
            - heading "Custom camera positions" [level=4] [ref=f26e505]
            - paragraph [ref=f26e507]:
              - text: Similarly as with camera related launch arguments,
              - link "camera positioning" [ref=f26e508] [cursor=pointer]:
                - /url: use-cases.html#_camera_control
              - text: can be controlled via esmini lib API.
            - list [ref=f26e510]:
              - listitem [ref=f26e511]:
                - paragraph [ref=f26e512]:
                  - code [ref=f26e513]: SE_AddCustomCamera()
                  - text: Add a camera with relative position and orientation (heading and pitch)
              - listitem [ref=f26e514]:
                - paragraph [ref=f26e515]:
                  - code [ref=f26e516]: SE_AddCustomFixedCamera()
                  - text: Add a fixed camera at custom global position and orientation (heading and pitch)
              - listitem [ref=f26e517]:
                - paragraph [ref=f26e518]:
                  - code [ref=f26e519]: SE_AddCustomAimingCamera()
                  - text: Add a camera with relative position looking at current entity
              - listitem [ref=f26e520]:
                - paragraph [ref=f26e521]:
                  - code [ref=f26e522]: SE_AddCustomFixedAimingCamera()
                  - text: Add a camera at fixed location but always looking at current entity
              - listitem [ref=f26e523]:
                - paragraph [ref=f26e524]:
                  - code [ref=f26e525]: SE_AddCustomFixedTopCamera()
                  - text: Add a top view camera with fixed position and rotation
              - listitem [ref=f26e526]:
                - paragraph [ref=f26e527]:
                  - code [ref=f26e528]: SE_SetCameraObjectFocus
                  - text: Set/change object to focus on
            - paragraph [ref=f26e530]:
              - text: More info, see
              - link "headerfile" [ref=f26e531] [cursor=pointer]:
                - /url: https://github.com/esmini/esmini/blob/91c82fb78deb4355f736f87510069f52cc0e6be5/EnvironmentSimulator/Libraries/esminiLib/esminiLib.hpp#L1519C1-L1582C59
              - text: .
            - paragraph [ref=f26e533]:
              - text: "Any number of cameras can be defined. These cameras can then be activated via function:"
              - code [ref=f26e534]: SE_SetCameraMode()
              - text: .
            - paragraph [ref=f26e536]:
