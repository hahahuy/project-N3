          - generic [ref=f26e670]:
            - heading "Program Options" [level=4] [ref=f26e671]
            - paragraph [ref=f26e673]: "On top of setting options from command line, esmini (from v2.41.0) supports setting options from esminiLib and esminiRMLib as well. This new functionality is added to set and unset options during runtime. This is useful, for example, to enable or disable logging to console, or to change log level etc between scenario runs via API. In addition, it is now possible to make option settings persistent over multiple runs of scenarios. There are two variants of the API functions i.e. one to set option value with persistence and one without. The API functions are:"
            - paragraph [ref=f26e675]:
              - code [ref=f26e676]: SE_DLL_API int SE_SetOption(const char *name);
            - paragraph [ref=f26e678]:
              - code [ref=f26e679]: SE_DLL_API int SE_SetOptionPersistent(const char *name);
            - paragraph [ref=f26e681]:
              - code [ref=f26e682]: SE_DLL_API int SE_SetOptionValue(const char *name, const char *value);
            - paragraph [ref=f26e684]:
              - code [ref=f26e685]: SE_DLL_API int SE_SetOptionValuePersistent(const char *name, const char *value);
            - paragraph [ref=f26e687]:
              - code [ref=f26e688]: SE_DLL_API int SE_UnsetOption(const char *name);
            - paragraph [ref=f26e690]:
              - code [ref=f26e691]: SE_DLL_API const char *SE_GetOptionValue(const char *name);
            - paragraph [ref=f26e693]:
              - code [ref=f26e694]: SE_DLL_API const char *SE_GetOptionValueByEnum(unsigned int);
              - text: (see
              - link "Using options (in code)" [ref=f26e695] [cursor=pointer]:
                - /url: developers-contributors.html#_using_options_in_code
              - text: )
            - paragraph [ref=f26e697]: Any setting done in between runs, i.e. after any SE_Close() and before SE_Init(), will apply to the next run, at least. The persistent variant will apply for all future runs until unset or other setting overrides it. The effect of settings done during a scenario run will depend on the option itself. For example, anti-aliasing mode for the rendering will not change during a scenario, while logfile path can change during a scenario run (which will close current and open a new file with specified path and name). So, to be sure, set options before SE_Init() and after any SE_Close().
          - generic [ref=f26e698]:
            - heading "Simple ideal sensors" [level=4] [ref=f26e699]
            - paragraph [ref=f26e701]:
              - text: "OSI provides information needed for sensor models at bounding box level for both moving and stationary objects, including ones defined in OpenDRIVE. Sensor models can then detect overlap, occlusion and collisions between those bounding boxes. Although sensor models are not within scope of esmini, there is a code example on how to retrieve and extract OSI data. It can perhaps be a starting point:"
              - link "osi-groundtruth.cpp" [ref=f26e702] [cursor=pointer]:
                - /url: https://github.com/esmini/esmini/blob/dev/EnvironmentSimulator/code-examples/osi-groundtruth/osi-groundtruth.cpp
            - paragraph [ref=f26e704]: For even simpler use cases esmini provides a sensor mechanism, basically collecting scenario objects which reference point is within a sensor view frustum. This is too rough for collision detection, but can be useful for low-pass features like adaptive cruse control (ACC) or just optimizing CPU load by filtering objects for some processing.
            - paragraph [ref=f26e706]:
              - text: The view frustum is defined by a horizontal
              - code [ref=f26e707]: field of view
              - text: combined with
              - code [ref=f26e708]: near
              - text: and
              - code [ref=f26e709]: far
              - text: "limits. Basically an object is detected by a ideal sensor if the object reference point is within the view frustum, i.e:"
            - list [ref=f26e711]:
              - listitem [ref=f26e712]:
                - paragraph [ref=f26e713]:
                  - text: angle from sensor mounting point is within the
                  - code [ref=f26e714]: field of view
              - listitem [ref=f26e715]:
                - paragraph [ref=f26e716]:
                  - text: distance from sensor mounting point is larger than
                  - code [ref=f26e717]: near
                  - text: and less than
                  - code [ref=f26e718]: far
            - generic [ref=f26e719]:
              - img "ideal sensors" [ref=f26e721]
              - generic [ref=f26e722]: A few ideal sensors mounted at various positions and orientations
            - paragraph [ref=f26e724]:
              - text: The sensors are added from the code, see the
              - link "esmini-dyn" [ref=f26e725] [cursor=pointer]:
                - /url: https://github.com/esmini/esmini/blob/dev/EnvironmentSimulator/Applications/esmini-dyn
              - text: code example. API is found
              - link "here" [ref=f26e726] [cursor=pointer]:
                - /url: https://github.com/esmini/esmini/blob/dev/EnvironmentSimulator/Libraries/esminiLib/esminiLib.hpp#L1082-L1095
              - text: .
            - paragraph [ref=f26e728]: "Limitations:"
            - list [ref=f26e730]:
              - listitem [ref=f26e731]:
