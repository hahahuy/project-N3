# Contest demo gateway: shared-key access in front of the Real2Scenario app.
# See docs/guides/security-deployment.md section 5.1.

# Resolve the upstream at request time rather than at configuration load time.
# nginx aborts at startup if a literal upstream host cannot be resolved, and the
# frontend container may not be attached yet. Using a variable also lets nginx
# survive a frontend recreation without being reloaded.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Shared contest key. Served by nginx, never by the frontend bundle.
    auth_basic           "Real2Scenario Contest Demo";
    auth_basic_user_file /etc/nginx/secrets/htpasswd;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # Bound a single judge view from consuming the host.
    client_max_body_size 2m;

    access_log /var/log/nginx/demo_access.log;
    error_log  /var/log/nginx/demo_error.log warn;

    location / {
        # Serves the built SPA from frontend/dist as well as /api/*.
        # The product environment deliberately does not run a Vite dev server:
        # that would expose source, HMR and dev tooling to judges.
        # See docs/current/environment-environments.md.
        set $demo_upstream "api:8000";
        proxy_pass http://$demo_upstream;
        proxy_http_version 1.1;

        # Vite HMR websocket. Harmless when HMR is not in use.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Scenario generation and replay are synchronous server-side; do not
        # cut them off early. See docs/current/demo-hardening-backlog.md S-6.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}

# Plain HTTP exists only to redirect. Serving the demo over plain HTTP would
# expose the Basic credential, which is base64 encoding and not encryption.
server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    return 301 https://$host$request_uri;
}
