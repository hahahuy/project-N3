services:
  api-permissions:
    image: alpine:3.22
    user: "0:0"
    # The metadata cache volume holds the persistent nuScenes SQLite index and
    # the versioned map artifacts. It ships root-owned, so without this chown
    # the api (uid 1000) can read the existing index but can never rebuild it,
    # and map-cache writes fail outright. See docs/guides/datastreaming.md D-1.
    command: ["sh", "-c", "chown -R ${PROJECT_N3_UID:-1000}:${PROJECT_N3_GID:-1000} /reports /metadata-cache && chmod -R u+rwX /reports /metadata-cache"]
    volumes:
      - project-n3-dev-reports:/reports
      - project-n3-metadata-cache:/metadata-cache

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Run as the host owner so the bind-mounted project tree stays writable
    # for HMR and imported scenarios. The image still defaults to a non-root
    # user; this only avoids running as root. See docs/guides/datastreaming.md D-4.
    user: "${PROJECT_N3_UID:-1000}:${PROJECT_N3_GID:-1000}"
    # Survive host reboots. Observed 2026-10-15: an unplanned reboot left the dev
    # stack down while the product stack recovered on `unless-stopped`.
    restart: unless-stopped
    depends_on:
      api-permissions:
        condition: service_completed_successfully
    environment:
      PROJECT_N3_ROOT: /app
      PROJECT_N3_ARTIFACT_ROOT: scenarios
      PROJECT_N3_OUTPUT_ROOT: reports
      # Explicit cache path. Without this the index lands in $HOME inside the
      # container and is destroyed on every recreate, forcing a re-read of the
      # full nuScenes metadata tables. See docs/guides/datastreaming.md D-1.
      PROJECT_N3_METADATA_CACHE: /var/cache/real2scenario
      # Operator-declared external roots the local UI may select. The nuScenes
      # metadata release lives outside the project tree, so it must be listed
      # here for the LOCAL PATHS flow to accept it.
      PROJECT_N3_EXTRA_DATA_ROOTS: ${PROJECT_N3_EXTRA_DATA_ROOTS:-/mnt/backup/nuscenes}
      NUSCENES_ROOT: ${NUSCENES_ROOT:-/mnt/backup/nuscenes}
      NUSCENES_VERSION: v1.0-trainval
      ESMINI_BIN: ${ESMINI_BIN:-/opt/esmini/bin/esmini}
      ESMINI_DAT2CSV: ${ESMINI_DAT2CSV:-/opt/esmini/bin/dat2csv}
      ESMINILIB_PATH: ${ESMINILIB_PATH:-/opt/esmini/bin/libesminiLib.so}
      ESMINILIB_VERSION: ${ESMINILIB_VERSION:-configured-esminiLib}
      ESMINI_CAPTURE_IMAGES: ${ESMINI_CAPTURE_IMAGES:-0}
      MPLCONFIGDIR: /tmp/matplotlib
    ports:
      - "${PROJECT_N3_WEB_API_PORT:-8001}:8000"
    volumes:
      - .:/app
      - project-n3-dev-reports:/app/reports
      # Persist the metadata index across container recreation.
      - project-n3-metadata-cache:/var/cache/real2scenario
      # Read-only dataset mount. It must expose can_bus/ and samples/, not just
      # the metadata tables: Phase 1 reads can_bus/ for CAN ego speed, and the
      # U6 recorded-LiDAR POV in docs/current/ui-mvp-flow-spec.md reads
      # samples/LIDAR_TOP/. Trimming this mount silently degrades CAN to the
      # finite-difference fallback, so it is mounted whole.
      - /mnt/backup/nuscenes:/mnt/backup/nuscenes:ro
      - ${HOME}/esmini:/opt/esmini:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_PROXY: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PROJECT_N3_WEB_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules

volumes:
  frontend-node-modules:
    name: project-n3-dev-node-modules
  project-n3-dev-reports:
    name: project-n3-dev-reports
  # Shared with compose.demo.yml by explicit name so the dev and product
  # environments reuse one metadata index instead of each rebuilding it from
  # 2.6 GB of nuScenes tables. See docs/current/environment-environments.md.
  project-n3-metadata-cache:
    name: project-n3-metadata-cache
